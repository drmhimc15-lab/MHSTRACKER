function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Ledger list grouped into per-category folders (tap header to expand/collapse) */
function txFoldersHtml(list){
  const groups = {};
  list.forEach((t, idx)=>{
    const key = t.type==='transfer' ? 'Transfer' : (t.category||'Other');
    if(!groups[key]) groups[key] = {type:t.type, items:[]};
    groups[key].items.push({t, idx});
  });
  const chronoKey = t => t.date+'T'+(t.time||'00:00'); // date+time combined so same-day entries sort by actual time, not just insertion order
  // Folders ordered by the most recent date+time among their own entries (latest first).
  const keys = Object.keys(groups).sort((a,b)=>{
    const maxA = groups[a].items.reduce((m,x)=> chronoKey(x.t)>m? chronoKey(x.t):m, '');
    const maxB = groups[b].items.reduce((m,x)=> chronoKey(x.t)>m? chronoKey(x.t):m, '');
    return maxB.localeCompare(maxA);
  });
  return keys.map(key=>{
    const g = groups[key];
    // Inside each folder: latest date+time first; exact ties fall back to the one entered most recently.
    const items = g.items.slice().sort((a,b)=> chronoKey(b.t).localeCompare(chronoKey(a.t)) || a.idx-b.idx).map(x=>x.t);
    const total = items.reduce((s,t)=>s+Number(t.amount),0);
    const icon = g.type==='transfer' ? '⇄' : catIcon(key);
    const open = !!txCatPanelOpen[key];
    const totColor = g.type==='income' ? 'var(--ledger)' : g.type==='expense' ? 'var(--rust)' : 'var(--ink-soft)';
    return `
    <div class="cat-acc-item">
      <button class="cat-acc-hd" data-txcataccordion="${escapeHtml(key)}">
        <span>${icon} ${escapeHtml(key)} <span style="font-weight:400;color:var(--ink-soft);">(${items.length})</span></span>
        <span style="display:flex;align-items:center;gap:8px;">
          <span class="mono" style="font-size:0.85rem;font-weight:600;color:${totColor};">${fmt(total)}</span>
          <span class="chev">${open?'▾':'▸'}</span>
        </span>
      </button>
      ${open? `<div class="cat-acc-body">${items.map(txRow).join("")}</div>` : ''}
    </div>`;
  }).join("");
}

/* Canvas charts (no external deps) */
let barSel = null;   // {i, k:'income'|'expense'} — bar tapped on the Home chart
function drawBarChart(){
  const cv = document.getElementById('barChart'); if(!cv) return;
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const w = cv.clientWidth, h = 140, top = 20;
  cv.width = w*dpr; cv.height = h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const data = last6MonthsData();
  const max = Math.max(1,...data.map(d=>Math.max(d.income,d.expense)));
  const bw = w/data.length;
  const pos = getComputedStyle(document.documentElement).getPropertyValue('--pos').trim() || "#1F5C4A";
  const soft = getComputedStyle(document.documentElement).getPropertyValue('--ink-soft').trim() || "#5B6B62";
  const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || "#222";
  ctx.clearRect(0,0,w,h);
  ctx.font = "10px sans-serif";
  data.forEach((d,i)=>{
    const x = i*bw;
    const ih = (d.income/max)*(h-24-top);
    const eh = (d.expense/max)*(h-24-top);
    const dim = barSel && barSel.i!==i;
    ctx.globalAlpha = dim ? 0.35 : 1;
    ctx.fillStyle = pos;       ctx.fillRect(x+bw*0.22, h-20-ih, bw*0.22, ih);
    ctx.fillStyle = "#B84C36"; ctx.fillRect(x+bw*0.52, h-20-eh, bw*0.22, eh);
    ctx.globalAlpha = 1;
    if(barSel && barSel.i===i){
      ctx.strokeStyle = ink; ctx.lineWidth = 1.5;
      const bx = barSel.k==='income' ? x+bw*0.22 : x+bw*0.52, bh = barSel.k==='income' ? ih : eh;
      ctx.strokeRect(bx-0.75, h-20-bh-0.75, bw*0.22+1.5, bh+1.5);
    }
    ctx.fillStyle = soft; ctx.textAlign="center";
    ctx.fillText(d.label, x+bw/2, h-6);
  });
  if(barSel){
    const d = data[barSel.i], v = d[barSel.k];
    const txt = d.label+' · '+(barSel.k==='income'?'Income ':'Expense ')+(hideBalance?'৳••••':fmt(v));
    ctx.font = "bold 12px sans-serif"; ctx.textAlign="center";
    ctx.fillStyle = barSel.k==='income' ? pos : "#B84C36";
    ctx.fillText(txt, w/2, 13);
  } else {
    ctx.font = "10px sans-serif"; ctx.fillStyle = soft; ctx.textAlign="center";
    ctx.fillText("Tap a bar to see the amount", w/2, 12);
  }
  cv.style.cursor = 'pointer';
  cv.onclick = (e)=>{
    const r = cv.getBoundingClientRect();
    const x = e.clientX - r.left;
    const i = Math.min(data.length-1, Math.max(0, Math.floor(x/bw)));
    const rel = (x - i*bw)/bw;                 // 0..1 inside the month slot
    const k = rel < 0.48 ? 'income' : 'expense';
    barSel = (barSel && barSel.i===i && barSel.k===k) ? null : {i,k};
    drawBarChart();
  };
}
function drawPieChart(){
  const cv = document.getElementById('pieChart'); if(!cv) return;
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const w = cv.clientWidth, h = 150;
  cv.width = w*dpr; cv.height = h*dpr; ctx.scale(dpr,dpr);
  const data = expenseByCategory();
  const total = data.reduce((s,d)=>s+d[1],0) || 1;
  let start = -Math.PI/2;
  const cx = w/2, cy = h/2, r = Math.min(w,h)/2 - 6;
  data.forEach((d,i)=>{
    const slice = (d[1]/total)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,start+slice);
    ctx.closePath(); ctx.fillStyle = pieColor(i); ctx.fill();
    start += slice;
  });
  ctx.beginPath(); ctx.arc(cx,cy,r*0.55,0,Math.PI*2); ctx.fillStyle="#fff"; ctx.fill();
}

/* ===================== TRANSACTIONS / LEDGER ===================== */
let txFilter = {q:"", cat:"", from:"", to:"", type:"all"};
let txViewMode = "list"; // 'list' | 'summary'
let txCatPanelOpen = {};
let ledgerCatPanelOpen = {}; // per date+category accordion state, e.g. all same-day "Transport" entries collapsed together
let ledgerDatePanelOpen = {}; // per date accordion state — each date collapses to a header, tap to reveal that day's transactions
let ledgerShowAllDates = false; // when false (default, no search/filter active) only the most recent date is shown; older dates stay hidden until requested
let ledgerCalendarOpen = false;
let ledgerCalendarMonth = null; // 'YYYY-MM' — month currently shown in the ledger's mini calendar
let summaryMode = "day"; // 'day' | 'week' | 'month' | 'year'
let summaryAnchor = todayStr();
let summaryExpanded = new Set();

function summaryRange(mode, anchor){
  const d = new Date(anchor+'T00:00:00');
  if(mode==="week"){
    const dow = (d.getDay()+1)%7; // week runs Saturday → Friday (Saturday = 0)
    const sat = new Date(d); sat.setDate(d.getDate()-dow);
    const fri = new Date(sat); fri.setDate(sat.getDate()+6);
    const s = ymdLocal(sat), e = ymdLocal(fri);
    return {start:s, end:e, label: fmtDateShort(s)+" – "+fmtDateShort(e)};
  }
  if(mode==="month"){
    const y=d.getFullYear(), m=d.getMonth();
    const s = ymdLocal(new Date(y,m,1));
    const e = ymdLocal(new Date(y,m+1,0));
    return {start:s, end:e, label: d.toLocaleDateString('en',{month:'long',year:'numeric'})};
  }
  if(mode==="year"){
    const y=d.getFullYear();
    return {start:`${y}-01-01`, end:`${y}-12-31`, label:String(y)};
  }
  return {start:anchor, end:anchor, label: d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}; // day
}
function shiftSummaryAnchor(mode, anchor, dir){
  const d = new Date(anchor+'T00:00:00');
  if(mode==="day") d.setDate(d.getDate()+dir);
  else if(mode==="week") d.setDate(d.getDate()+dir*7);
  else if(mode==="month") d.setMonth(d.getMonth()+dir);
  else if(mode==="year") d.setFullYear(d.getFullYear()+dir);
  return ymdLocal(d);
}
function summaryGroups(){
  const r = summaryRange(summaryMode, summaryAnchor);
  const list = DB.transactions.filter(t=> notFuture(t) && (t.type==="income"||t.type==="expense") && t.date>=r.start && t.date<=r.end);
  const map = {};
  list.forEach((t, idx)=>{
    const key = t.type+"|"+t.category;
    if(!map[key]) map[key] = {type:t.type, category:t.category, total:0, items:[]};
    map[key].total += Number(t.amount);
    map[key].items.push({t, idx});
  });
  return Object.values(map).sort((a,b)=> b.total-a.total);
}
function viewTransactionsSummary(){
  const r = summaryRange(summaryMode, summaryAnchor);
  const groups = summaryGroups();
  const income = groups.filter(g=>g.type==="income").reduce((s,g)=>s+g.total,0);
  const expense = groups.filter(g=>g.type==="expense").reduce((s,g)=>s+g.total,0);
  const trList = DB.transactions.filter(t=> notFuture(t) && t.type==="transfer" && t.date>=r.start && t.date<=r.end);
  const transferTotal = trList.reduce((s,t)=>s+Number(t.amount),0);
  return `
    <div class="seg-tabs">
      ${["day","week","month","year"].map(m=>`<button class="seg-tab ${summaryMode===m?'on':''}" data-summode="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join("")}
    </div>
    <div class="period-nav">
      <button data-sumnav="-1">‹</button>
      <div class="lbl">${r.label}</div>
      <button data-sumnav="1">›</button>
    </div>
    <div class="summary-balance-card">
      <div class="lbl">Net</div>
      <div class="val mono">${hideBalance? "৳••••••" : fmt(income-expense)}</div>
      <div class="sub"><span>Income <b class="mono">${hideBalance? "••••" : fmt(income)}</b></span><span>Expense <b class="mono">${hideBalance? "••••" : fmt(expense)}</b></span><span>Transfer <b class="mono">${hideBalance? "••••" : fmt(transferTotal)}</b></span></div>
    </div>
    <div class="card">
      ${groups.length? groups.map(g=>{
        const key = g.type+"|"+g.category;
        const open = summaryExpanded.has(key);
        return `<div class="cat-group">
          <div class="cat-group-hd" data-sumgroup="${key}">
            <div class="ic">${catIcon(g.category)}</div>
            <div class="nm">${g.category}<span class="count">${g.items.length}</span></div>
            <div class="tot ${g.type} mono">${g.type==="income"?"+":"−"}${fmt(g.total)}</div>
          </div>
          <div class="cat-group-items ${open?'open':''}">
            ${g.items.slice().sort((a,b)=> (b.t.date+'T'+(b.t.time||'00:00')).localeCompare(a.t.date+'T'+(a.t.time||'00:00')) || a.idx-b.idx).map(x=>x.t).map(t=>`
              <div class="cat-group-item"><span>${fmtDateShort(t.date)}${t.time? " · "+fmtTime(t.time):""}${t.note? " — "+escapeHtml(t.note):""}</span><span class="mono">${fmt(t.amount)}</span></div>
            `).join("")}
          </div>
        </div>`;
      }).join("") : `<div class="empty"><div class="big">🗂️</div>No transactions in this period.</div>`}
    </div>
  `;
}
/* Within one day's transactions, fold same-category entries together (e.g.
   three separate "Transport" expenses on the same day collapse into one row
   showing the count + total; tap it to reveal the individual entries).
   Categories with just one entry that day still show as a normal row. */
function ledgerDayGroupHtml(date, items){
  const byKey = {}; const order = [];
  items.forEach(t=>{
    const key = t.type==='transfer' ? 'transfer|Transfer' : t.type+'|'+(t.category||'Uncategorized');
    if(!byKey[key]){ byKey[key]=[]; order.push(key); }
    byKey[key].push(t);
  });
  return order.map(key=>{
    const group = byKey[key];
    if(group.length===1) return txRow(group[0]);
    const label = key.split('|')[1];
    const icon = key.startsWith('transfer|') ? '⇄' : catIcon(label);
    const totColor = group[0].type==='income'?'var(--ledger)':group[0].type==='expense'?'var(--rust)':'var(--ink-soft)';
    const total = group.reduce((s,t)=>s+Number(t.amount),0);
    const sign = group[0].type==='income'?'+':group[0].type==='expense'?'−':'';
    const panelKey = date+'|'+key;
    const open = !!ledgerCatPanelOpen[panelKey];
    return `<div class="cat-acc-item">
      <button class="cat-acc-hd" data-ledgercatpanel="${escapeHtml(panelKey)}">
        <span>${icon} ${escapeHtml(label)} <span style="font-weight:400;color:var(--ink-soft);">(${group.length})</span></span>
        <span style="display:flex;align-items:center;gap:8px;">
          <span class="mono" style="font-size:0.85rem;font-weight:600;color:${totColor};">${sign}${fmt(total)}</span>
          <span class="chev">${open?'▾':'▸'}</span>
        </span>
      </button>
      ${open? `<div class="cat-acc-body">${group.map(txRow).join("")}</div>` : ''}
    </div>`;
  }).join('');
}

/* Small month-grid date picker for the ledger — lets you jump straight to
   any day instead of scrolling through the whole list. Days that have at
   least one transaction get a dot; the selected day (if any) is highlighted. */
function ledgerCalendarHtml(){
  const month = ledgerCalendarMonth || monthStr();
  const [y,mo] = month.split('-').map(Number);
  const first = new Date(y, mo-1, 1);
  const startOffset = first.getDay(); // 0=Sun
  const daysInMonth = new Date(y, mo, 0).getDate();
  const daysWithTx = new Set(DB.transactions.filter(t=>notFuture(t) && t.date && t.date.slice(0,7)===month).map(t=>t.date));
  const selected = (txFilter.from && txFilter.from===txFilter.to) ? txFilter.from : null;
  const today = todayStr();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(`<div class="ledgercal-cell empty"></div>`);
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = ['ledgercal-cell'];
    if(ds===selected) cls.push('sel');
    if(ds===today) cls.push('today');
    cells.push(`<button class="${cls.join(' ')}" data-ledgercalday="${ds}">${d}${daysWithTx.has(ds)?'<span class="dot"></span>':''}</button>`);
  }
  return `<div class="ledgercal">
    <div class="ledgercal-hd">
      <button data-ledgercalnav="-1">‹</button>
      <span>${new Date(y,mo-1).toLocaleString('en',{month:'long',year:'numeric'})}</span>
      <button data-ledgercalnav="1">›</button>
    </div>
    <div class="ledgercal-dow">${['S','M','T','W','T','F','S'].map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="ledgercal-grid">${cells.join('')}</div>
    ${selected?`<button class="ledgercal-clear" id="ledgerCalClear">✕ Clear day filter</button>`:''}
  </div>`;
}

function viewTransactions(){
  const type=txFilter.type||"all";
  let list = DB.transactions.filter(t=>{
    if(isFutureTx(t)) return false;
    if(type!=="all" && t.type!==type) return false;
    if(txFilter.q && ![t.category,t.note,t.date,t.time,t.type,t.merchant,(DB.accounts.find(a=>a.id===t.accountId)||{}).name,(DB.accounts.find(a=>a.id===t.toAccountId)||{}).name].filter(Boolean).join(" ").toLowerCase().includes(txFilter.q.toLowerCase())) return false;
    if(txFilter.cat && t.category!==txFilter.cat) return false;
    if(txFilter.from && t.date<txFilter.from) return false;
    if(txFilter.to && t.date>txFilter.to) return false;
    return true;
  }).sort((a,b)=>(b.date+'T'+(b.time||'00:00')).localeCompare(a.date+'T'+(a.time||'00:00')));
  const groups={}; list.forEach(t=>(groups[t.date] ||= []).push(t));
  // inside each day: highest amount → lowest (ties: latest time first)
  Object.values(groups).forEach(g=>g.sort((a,b)=> (Number(b.amount)||0)-(Number(a.amount)||0) || (b.time||'').localeCompare(a.time||'')));
  const dates=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  const activeFilters=[txFilter.cat,txFilter.from,txFilter.to].filter(Boolean).length;
  const daySelected = txFilter.from && txFilter.from===txFilter.to ? txFilter.from : null;
  // Default browsing view: only the most recent date is shown, older dates stay
  // hidden behind a "Show earlier dates" link. Any active search/filter (or an
  // explicit calendar day pick) shows its own matching dates instead — hiding
  // results the user just searched/filtered for would be confusing.
  const noActiveFilters = !txFilter.q.trim() && !txFilter.cat && !txFilter.from && !txFilter.to;
  const restrictToRecent = noActiveFilters && !ledgerShowAllDates;
  // Anchor the default single-date view on today, not just "the latest date in
  // the data" — a stray future-dated entry (bad manual entry, typo'd year, etc.)
  // would otherwise eclipse today's real transactions and hide them behind
  // "show earlier days". Prefer today's date if it has entries; otherwise the
  // most recent date that isn't in the future; only fall back to the actual
  // latest date if every entry on record is future-dated.
  const todayKey = todayStr();
  const anchorDate = dates.includes(todayKey) ? todayKey
    : (dates.find(d=>d<=todayKey) || dates[0]);
  const visibleDates = restrictToRecent ? (anchorDate?[anchorDate]:[]) : dates;
  // Income / Expense / Net cards are DAILY figures: the day picked on the
  // calendar, otherwise today (or the latest day that has entries).
  const kpiDate = daySelected || anchorDate || todayKey;
  const kpiList = groups[kpiDate] || [];
  const inc=kpiList.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
  const exp=kpiList.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const kpiLabel = kpiDate===todayKey ? 'Today' : fmtDateShort(kpiDate);
  const hiddenCount = dates.length - visibleDates.length;
  return `
    <div class="section-title" style="margin-top:2px;"><span>Ledger</span><span>${list.length} record${list.length===1?'':'s'}</span></div>
    <div class="search-bar">
      <input id="txSearch" placeholder="Search category, note, date…" value="${escapeHtml(txFilter.q)}">
      <button class="filter-btn" id="btnLedgerCal" style="${ledgerCalendarOpen?'background:var(--ledger);color:#fff;border-color:var(--ledger);':''}">📅</button>
      <button class="filter-btn" id="btnFilter">${activeFilters?'⚙ '+activeFilters:'⚙'}</button>
    </div>
    ${ledgerCalendarOpen? ledgerCalendarHtml() : ''}
    ${(!ledgerCalendarOpen && daySelected)?`<div class="home-small" style="margin:6px 2px 0;">Showing <b>${fmtDateShort(daySelected)}</b> only · <a href="#" id="ledgerDayClear" style="color:var(--rust);font-weight:600;text-decoration:none;">clear ✕</a></div>`:''}
    <div class="ledger-types">
      ${[['all','All'],['expense','Expense'],['income','Income'],['transfer','Transfer'],['opening','Opening']].map(x=>`<button class="ledger-type ${type===x[0]?'on':''}" data-ledgertype="${x[0]}">${x[1]}</button>`).join('')}
    </div>
    <div class="home-small" style="margin:8px 2px 4px;">Daily · <b>${kpiLabel}</b></div>
    <div class="ledger-kpis">
      <div class="ledger-kpi in"><div class="k">Income</div><div class="v mono">${fmt(inc)}</div></div>
      <div class="ledger-kpi out"><div class="k">Expense</div><div class="v mono">${fmt(exp)}</div></div>
      <div class="ledger-kpi"><div class="k">Net</div><div class="v mono" style="color:${inc-exp>=0?'var(--pos)':'var(--rust)'}">${fmt(inc-exp)}</div></div>
    </div>
    ${visibleDates.length ? visibleDates.map((date,idx)=>{
      const dayTotal=groups[date].filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0)-groups[date].filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
      const open = (date in ledgerDatePanelOpen) ? ledgerDatePanelOpen[date] : (ledgerDatePanelOpen[date]=idx===0);
      return `<button class="ledger-day" data-ledgerdatepanel="${date}">
        <span class="ld-left"><span class="chev">${open?'▾':'▸'}</span>${fmtDateShort(date)} <span class="ld-count">(${groups[date].length})</span></span>
        <span class="ledger-day-total" style="color:${dayTotal>=0?'var(--pos)':'var(--rust)'}">${dayTotal>=0?'+':'−'}${fmt(Math.abs(dayTotal))}</span>
      </button>${open?`<div class="card">${ledgerDayGroupHtml(date, groups[date])}</div>`:''}`;
    }).join('') : `<div class="card empty"><div class="big">🔎</div>No matching transactions.<br><span style="font-size:.72rem">Try another search or filter.</span></div>`}
    ${restrictToRecent && hiddenCount>0 ? `<div class="home-small" id="ledgerShowMore" style="text-align:center;margin:10px 0 4px;cursor:pointer;">Show ${hiddenCount} earlier day${hiddenCount===1?'':'s'} <a href="#">▾</a></div>` : ''}
    ${(ledgerShowAllDates && noActiveFilters && dates.length>1) ? `<div class="home-small" id="ledgerShowLess" style="text-align:center;margin:10px 0 4px;cursor:pointer;">Show recent day only <a href="#">▴</a></div>` : ''}
  `;
}

// Edit form for an existing transaction. Handles income/expense (category +
// single account) and transfer (two accounts, no category) shapes.
function openEditTransactionSheet(id){
  const t = DB.transactions.find(x=>x.id===id); if(!t) return;
  if(t.type==='opening'){ toast('Opening-balance entries can’t be edited here'); return; }
  const isTransfer = t.type==='transfer';
  openSheet(`
    <h3>Edit ${isTransfer?'Transfer':(t.type==='income'?'Income':'Expense')}</h3>
    <div class="field"><label>Amount (৳)</label><input id="eAmount" type="number" inputmode="decimal" value="${t.amount}"></div>
    <div class="row2">
      <div class="field"><label>Date</label><input id="eDate" type="date" value="${t.date}" max="${todayStr()}"></div>
      <div class="field"><label>Time</label><input id="eTime" type="time" value="${t.time||''}"></div>
    </div>
    ${isTransfer ? `
      <div class="field"><label>From Account</label><select id="eAccount">${accOptions()}</select></div>
      <div class="field"><label>To Account</label><select id="eToAccount">${accOptions()}</select></div>
    ` : `
      <div class="field"><label>Account</label><select id="eAccount">${accOptions()}</select></div>
      <div class="field"><label>Category</label><select id="eCategory">${catOptions(getCatsRanked(t.type), t.category)}</select></div>
    `}
    <div class="field"><label>Note (optional)</label><input id="eNote" value="${escapeHtml(t.note||'')}"></div>
    <button class="btn" id="saveEditTx">Save Changes</button>
  `);
  document.getElementById('eAccount').value = t.accountId;
  if(isTransfer) document.getElementById('eToAccount').value = t.toAccountId;
  else document.getElementById('eCategory').value = t.category;
  document.getElementById('saveEditTx').onclick = ()=>{
    const amount = parseFloat(document.getElementById('eAmount').value);
    if(!amount || (amount<0 && t.type!=='expense')){ toast("Enter a valid amount"); return; }   // negative expense = refund, allowed
    const date = document.getElementById('eDate').value || t.date;
    if(date > todayStr()){ toast("Future dates aren't allowed"); return; }
    const time = document.getElementById('eTime').value || t.time;
    const accountId = document.getElementById('eAccount').value;
    const note = document.getElementById('eNote').value;
    const updates = {amount, date, time, accountId, note};
    if(isTransfer){
      const toAccountId = document.getElementById('eToAccount').value;
      if(toAccountId===accountId){ toast("Pick two different accounts"); return; }
      updates.toAccountId = toAccountId;
    } else {
      updates.category = document.getElementById('eCategory').value;
    }
    editTransaction(id, updates);
    closeSheet(); render();
    toast("Transaction updated");
  };
}

function investDurationDays(num,unit){ return unit==='days'? num : unit==='months'? num*30 : num*365; }
function investMaturityDate(dateStr,num,unit){
  if(unit==='days') return addDays(dateStr,num);
  if(unit==='months') return addMonths(dateStr,num);
  return addMonths(dateStr,num*12);
}
// Projected profit/total based on rate type & profit type. capital is base principal only.
function calcProjection(capital, rateType, rateValue, profitType, num, unit, bonusType, bonusValue){
  const base = calcProjectionBase(capital, rateType, rateValue, profitType, num, unit);
  const bv = Number(bonusValue)||0;
  const bonus = bv>0 ? (bonusType==='percent' ? (Number(capital)||0)*bv/100 : bv) : 0;
  if(!bonus) return Object.assign(base,{bonus:0});
  const profit = base.profit + bonus;                       // bonus is added on top of the rate-of-profit amount
  return { profit, total:(Number(capital)||0)+profit, na:false, bonus, rateProfit:base.profit };
}
function calcProjectionBase(capital, rateType, rateValue, profitType, num, unit){
  capital = Number(capital)||0; rateValue = Number(rateValue)||0;
  if(rateType==='fixed') return { profit: rateValue, total: capital+rateValue, na:false };
  if(rateType==='none' || rateType==='variable') return { profit:0, total:capital, na:true };
  const years = unit==='days'? num/365 : unit==='months'? num/12 : num;
  const months = unit==='days'? num/30 : unit==='months'? num : num*12;
  const r = rateValue/100;
  let profit;
  if(rateType==='monthly'){
    profit = profitType==='compound' ? capital*Math.pow(1+r, months) - capital : capital*r*months;
  } else { // annual
    profit = profitType==='compound' ? capital*Math.pow(1+r, years) - capital : capital*r*years;
  }
  return { profit, total: capital+profit, na:false };
}
function investNetCapital(inv){
  let c = Number(inv.capital)||0;
  (inv.additionalCapital||[]).forEach(x=> c += Number(x.amount));
  (inv.partialWithdrawals||[]).forEach(x=> c -= Number(x.amount));
  return c;
}
function investProjection(inv){ return calcProjection(investNetCapital(inv), inv.rateType, inv.rateValue, inv.profitType, inv.durationNum, inv.durationUnit, inv.bonusType, inv.bonusValue); }
function investCurrentValue(inv){
  const proj = investProjection(inv);
  if(inv.actualProfit!=null && inv.actualProfit!=='') return investNetCapital(inv) + Number(inv.actualProfit);
  if(proj.na) return investNetCapital(inv);
  const maturity = investMaturityDate(inv.date, inv.durationNum, inv.durationUnit);
  const totalDays = Math.max(1, investDurationDays(inv.durationNum, inv.durationUnit));
  const elapsedDays = Math.min(totalDays, Math.max(0, (new Date(todayStr())-new Date(inv.date))/86400000));
  const ratio = inv.status==='active' ? elapsedDays/totalDays : 1;
  return investNetCapital(inv) + proj.profit*ratio;
}
function investReturnPct(inv){
  const cap = investNetCapital(inv); if(!cap) return 0;
  const val = investCurrentValue(inv);
  return ((val-cap)/cap)*100;
}
function investAgg(){
  const list = DB.investments;
  const totalCapital = list.reduce((s,i)=>s+investNetCapital(i),0);
  const totalCurrent = list.reduce((s,i)=>s+investCurrentValue(i),0);
  const totalExpectedProfit = list.reduce((s,i)=>{ const p=investProjection(i); return s+(p.na?0:p.profit); },0);
  const totalReturnPct = totalCapital>0 ? ((totalCurrent-totalCapital)/totalCapital)*100 : 0;
  const active = list.filter(i=>i.status==='active').length;
  const matured = list.filter(i=>i.status==='matured').length;
  const m = monthStr(), y = m.slice(0,4);
  const thisMonth = list.filter(i=>i.date.slice(0,7)===m).reduce((s,i)=>s+investNetCapital(i),0);
  const thisYear = list.filter(i=>i.date.slice(0,4)===y).reduce((s,i)=>s+investNetCapital(i),0);
  const upcoming = list.filter(i=>{
    if(i.status!=='active') return false;
    const md = investMaturityDate(i.date,i.durationNum,i.durationUnit);
    const days = (new Date(md)-new Date(todayStr()))/86400000;
    return days>=0 && days<=30;
  }).sort((a,b)=> investMaturityDate(a.date,a.durationNum,a.durationUnit).localeCompare(investMaturityDate(b.date,b.durationNum,b.durationUnit)));
  const ranked = [...list].sort((a,b)=> investReturnPct(b)-investReturnPct(a));
  return {totalCapital, totalCurrent, totalExpectedProfit, totalReturnPct, active, matured, thisMonth, thisYear, upcoming,
    highest: ranked[0], lowest: ranked.length>1? ranked[ranked.length-1] : null};
}
function byCategoryAgg(){
  const map={};
  DB.investments.forEach(i=> map[i.category] = (map[i.category]||0) + investNetCapital(i));
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function bySubCategoryAgg(){
  const map={};
  DB.investments.forEach(i=> map[i.subcategory||'—'] = (map[i.subcategory||'—']||0) + investNetCapital(i));
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6);
}
function investMonthly(){
  const arr=[];
  for(let k=5;k>=0;k--){
    const d = new Date(); d.setMonth(d.getMonth()-k);
    const m = ymdLocal(d).slice(0,7); // BUGFIX: was toISOString() (UTC), same mismatch as last6MonthsData
    const amt = DB.investments.filter(i=>i.date.slice(0,7)===m).reduce((s,i)=>s+investNetCapital(i),0);
    arr.push({label:d.toLocaleString('en',{month:'short'}), amt});
  }
  return arr;
}

/* ---- Upcoming maturity buckets (Dashboard card) ---- */
function maturityBuckets(){
  const buckets = {today:0, d7:0, d30:0, d90:0};
  DB.investments.forEach(inv=>{
    if(inv.status!=='active') return;
    const md = investMaturityDate(inv.date, inv.durationNum, inv.durationUnit);
    const days = Math.round((new Date(md)-new Date(todayStr()))/86400000);
    const val = investNetCapital(inv);
    if(days<0) return;
    if(days===0) buckets.today += val;
    if(days<=7) buckets.d7 += val;
    if(days<=30) buckets.d30 += val;
    if(days<=90) buckets.d90 += val;
  });
  return buckets;
}
function maturingThisMonth(){
  const m = monthStr();
  const list = DB.investments.filter(inv=>{
    if(inv.status!=='active') return false;
    return investMaturityDate(inv.date, inv.durationNum, inv.durationUnit).slice(0,7)===m;
  });
  const capital = list.reduce((s,i)=>s+investNetCapital(i),0);
  const profit = list.reduce((s,i)=>{ const p=investProjection(i); return s+(p.na?0:p.profit); },0);
  const maturityAmt = list.reduce((s,i)=>{ const p=investProjection(i); return s+(p.na?investNetCapital(i):p.total); },0);
  return {count:list.length, capital, profit, maturityAmt};
}

/* ===================== MATURITY NOTIFICATION ENGINE =====================
   Auto-maturity system: every load (and once persisted) each active investment's
   maturity date is checked against today. Configurable reminder offsets (days
   before/after maturity, default 30/7/1/0/-7) fire once each via in-app
   notification (bell), a browser push notification if permitted, and — if the
   person has set an email address + webhook — a best-effort email. A browser
   page can't send real email on its own, so every reminder also carries a
   ready-made mailto: link as a one-tap manual fallback. */
const REMINDER_LABELS = {30:'Investment approaching maturity',7:'Maturity in 7 days',1:'Matures tomorrow',0:'Investment matured today','-7':'Maturity follow-up'};
function reminderLabel(offset){
  if(REMINDER_LABELS[offset]!=null) return REMINDER_LABELS[offset];
  if(offset>0) return `Maturity in ${offset} days`;
  if(offset===0) return 'Investment matured today';
  return `Matured ${Math.abs(offset)} days ago — follow-up`;
}
function normalizeInvest(inv){
  if(inv.institution==null) inv.institution = '';
  if(!Array.isArray(inv.reminderDays)) inv.reminderDays = (DB.settings.reminderDaysDefault||[30,7,1,0,-7]).slice();
  if(!Array.isArray(inv.remindersSent)) inv.remindersSent = [];
  if(!Array.isArray(inv.additionalCapital)) inv.additionalCapital = [];
  if(!Array.isArray(inv.partialWithdrawals)) inv.partialWithdrawals = [];
  if(!Array.isArray(inv.reinvestments)) inv.reinvestments = [];
  return inv;
}
function addNotification(n){
  DB.notifications.unshift(Object.assign({id:uid(), date:new Date().toISOString(), read:false}, n));
  if(DB.notifications.length>200) DB.notifications.length = 200;
}
function unreadNotifCount(){ return DB.notifications.filter(n=>!n.read).length; }
function updateNotifBadge(){
  const b = document.getElementById('notifBadge'); if(!b) return;
  const n = unreadNotifCount();
  b.textContent = n>99? '99+' : String(n);
  b.style.display = n>0 ? 'flex' : 'none';
  const btn = document.getElementById('btnNotif'); if(btn) btn.classList.toggle('has-unread', n>0);
}
function pushBrowserNotification(title, body){
  try{
    if(!('Notification' in window)) return;
    if(Notification.permission==='granted') new Notification(title, {body});
  }catch(e){}
}
function requestPushPermission(){
  if(!('Notification' in window)){ toast('Push notifications are not supported on this browser'); return; }
  Notification.requestPermission().then(p=>{
    DB.settings.pushEnabled = (p==='granted');
    persist();
    toast(p==='granted' ? '🔔 Push notifications enabled' : 'Permission not granted');
    if(currentView==='more'){ document.getElementById('content').innerHTML = viewMore(); afterRender(); }
  });
}
// Best-effort email: posts to a user-configured webhook (Google Apps Script / EmailJS /
// Zapier — same pattern as Cloud Backup) if one is set. Browsers can't send email on
// their own, so every reminder also stores a mailto: link as a manual fallback.
async function sendEmailReminder(inv, subject, body){
  const url = (DB.settings.emailWebhookUrl||'').trim();
  const to = (DB.settings.notifyEmail||'').trim();
  if(!url || !to) return;
  try{
    await fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({to, subject, body}) });
  }catch(e){ /* silent — in-app + mailto fallback still cover the reminder */ }
}

/* ===================== ADD TO CALENDAR (.ics) ===================== */
function icsEsc(x){ return String(x||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsEvent(uid, date, title, desc){
  const d = date.replace(/-/g,''), e = addDays(date,1).replace(/-/g,'');
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  return ['BEGIN:VEVENT','UID:'+uid+'@mhs-tracker','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+e,'SUMMARY:'+icsEsc(title),'DESCRIPTION:'+icsEsc(desc),'TRANSP:TRANSPARENT',
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:-PT15H','END:VALARM',      // 9:00 AM the day before
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:PT9H','END:VALARM',       // 9:00 AM on the day
    'END:VEVENT'].join('\r\n');
}
function calendarEvents(kind){
  const ev = [], today = todayStr();
  if(kind==='cards' || kind==='all'){
    DB.accounts.filter(a=>a.type==='credit-card' && (ccm(a).status||'Active')==='Active').forEach(a=>{
      const st = ccStatement(a); let ref = st.last;
      for(let i=0;i<12;i++){
        const r = ccDueForDate(a, ref); ref = addDays(r.stmt,1);
        if(r.due < today) continue;
        const known = r.due===st.due && st.remaining>0 ? `\nStatement balance still unpaid: ${fmt(st.remaining)}` : '';
        ev.push(icsEvent('card-'+a.id+'-'+r.due, r.due, `💳 ${a.name} payment due`, `Statement date ${fmtDMY(r.stmt)} · Payment due ${fmtDMY(r.due)}${known}`));
      }
    });
  }
  if(kind==='invest' || kind==='all'){
    DB.investments.filter(i=>i.status==='active').forEach(inv=>{
      const md = investMaturityDate(inv.date, inv.durationNum, inv.durationUnit); if(!md || md < today) return;
      const proj = investProjection(inv), amt = proj.na ? investNetCapital(inv) : proj.total;
      ev.push(icsEvent('inv-'+inv.id+'-'+md, md, `📈 ${inv.name} matures`, `Capital ${fmt(investNetCapital(inv))} · Expected maturity amount ${fmt(amt)}\nRenew / Withdraw / Reinvest`));
    });
  }
  return ev;
}
function exportCalendar(kind){
  const ev = calendarEvents(kind);
  if(!ev.length){ toast('Nothing upcoming to add'); return; }
  const text = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MHS Tracker//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',...ev,'END:VCALENDAR'].join('\r\n');
  const blob = new Blob([text], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'mhs-'+kind+'-reminders.ics';
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast(ev.length+' reminder'+(ev.length>1?'s':'')+' ready — open the file to add to your calendar');
}
function fireMaturityReminder(inv, offset, md, daysUntil){
  const proj = investProjection(inv);
  const expectedAmt = proj.na ? investNetCapital(inv) : proj.total;
  const label = daysUntil>1 ? `Maturity in ${daysUntil} days` : daysUntil===1 ? 'Matures tomorrow' : daysUntil===0 ? 'Investment matured today' : `Matured ${Math.abs(daysUntil)} day${Math.abs(daysUntil)===1?'':'s'} ago`;
  const subject = `🔔 Investment Maturity Reminder — ${inv.name}`;
  const rateTxt = inv.rateType==='fixed' ? fmt(inv.rateValue)+' fixed'
    : (inv.rateType==='variable'||inv.rateType==='none') ? '—'
    : inv.rateValue+'% '+inv.rateType;
  const bodyLines = [
    `Investment: ${inv.name}`, `Institution: ${inv.institution || inv.category}`,
    `Original Capital: ${fmt(investNetCapital(inv))}`, `Investment Date: ${fmtDMY(inv.date)}`,
    `Interest/Profit Rate: ${rateTxt}`, `Maturity Date: ${fmtDMY(md)}`,
    `Expected Profit: ${proj.na?'N/A':fmt(proj.profit)}`, `Expected Maturity Amount: ${fmt(expectedAmt)}`,
    `Days Remaining: ${daysUntil}`, ``, `Action: Renew / Withdraw / Reinvest`
  ];
  const body = bodyLines.join('\n');
  const mailTo = (DB.settings.notifyEmail||'').trim();
  const mailto = `mailto:${encodeURIComponent(mailTo)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  addNotification({invId: inv.id, offset, title: label, body: `${inv.name} · Matures ${fmtDMY(md)} · ${fmt(expectedAmt)}`, mailto, kind:'maturity', nav:'invest'});
  pushBrowserNotification(subject, `${label} · ${inv.name} · ${fmt(expectedAmt)}`);
  sendEmailReminder(inv, subject, body);
}
function checkMaturityReminders(){
  let fired = 0;
  DB.investments.forEach(inv=>{
    normalizeInvest(inv);
    if(inv.status!=='active') return;
    const md = investMaturityDate(inv.date, inv.durationNum, inv.durationUnit);
    const daysUntil = Math.round((new Date(md)-new Date(todayStr()))/86400000);
    // every reminder step that is due and not yet sent
    const due = (inv.reminderDays||[]).filter(o=> daysUntil<=o && !inv.remindersSent.includes(o));
    if(!due.length) return;
    // mark all as sent, but notify only once (the closest step) so old/overdue items don't flood the bell
    due.forEach(o=> inv.remindersSent.push(o));
    fireMaturityReminder(inv, Math.min.apply(null,due), md, daysUntil);
    fired++;
  });
  return fired;
}

/* ===================== ALERT ENGINE (bell) =====================
   Everything that should show on the 🔔 goes through alertOnce(): a persistent
   dedupe key (kept in settings, so "Clear all" can't make it fire again) makes
   sure each event notifies exactly once.
   Sources: maturity reminders, recurring income/expense applied, recurring due
   soon, budget 80% / exceeded, credit card payment due / overdue, utilization 50-75-90%, EMI billed, points expiring. */
function alertPref(k){ const p = DB.settings.alertPrefs||{}; return p[k]!==false; }
function alertOnce(key, n){
  const keys = DB.settings.alertKeys || (DB.settings.alertKeys = {});
  if(keys[key]) return false;
  keys[key] = new Date().toISOString();
  const ks = Object.keys(keys);
  if(ks.length>600){ ks.sort((x,y)=>keys[x].localeCompare(keys[y])).slice(0, ks.length-400).forEach(k=> delete keys[k]); }
  addNotification(Object.assign({key}, n));
  pushBrowserNotification(n.title, n.body);
  return true;
}
function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
function notifyRecurringApplied(r, cnt, total, firstDate, lastDate){
  if(!alertPref('recurring')) return;
  const isInc = r.type==='income', isTr = r.type==='transfer';
  const what = isInc ? 'Recurring income received' : isTr ? 'Recurring transfer done' : 'Recurring expense paid';
  const name = r.category || (isInc?'Income':isTr?'Transfer':'Expense');
  const amtTxt = fmt(cnt>1 ? total : (Number(r.amount)||0));
  const body = cnt>1 ? `${name} · ${cnt} entries added (${fmtDMY(firstDate)} – ${fmtDMY(lastDate)}) · ${amtTxt}`
                     : `${name} · ${fmtDMY(lastDate)} · ${amtTxt}`;
  alertOnce(`rec-done:${r.id}:${lastDate}`, {title: what, body, kind:'recurring', nav:'transactions'});
}
function checkRecurringSoon(){
  if(!alertPref('recurring')) return 0;
  let n = 0; const today = todayStr();
  DB.recurring.forEach(r=>{
    if(!r.nextDate || recurEnded(r)) return;
    const rd = (r.remind===undefined || r.remind===null) ? 2 : Number(r.remind);   // legacy items: 1–2 days ahead
    if(rd < 0) return;                                                           // -1 = no reminder
    const d = daysBetween(today, r.nextDate);
    const lo = (r.remind===undefined || r.remind===null) ? 1 : 0;
    if(d>=lo && d<=rd){
      const isInc = r.type==='income';
      const base = isInc?'Recurring income':r.type==='transfer'?'Recurring transfer':'Recurring expense';
      const title = base + (d===0?' due today':d===1?' due tomorrow':` due in ${d} days`);
      if(alertOnce(`rec-soon:${r.id}:${r.nextDate}`, {title, body:`${r.category||'Recurring'} · ${fmtDMY(r.nextDate)}${r.time?' '+r.time:''} · ${fmt(Number(r.amount)||0)}`, kind:'recurring-soon', nav:'transactions'})) n++;
    }
  });
  return n;
}
function checkBudgetAlerts(){
  if(!alertPref('budget')) return 0;
  let n = 0; const m = monthStr();
  DB.budgets.filter(b=>b.month===m).forEach(b=>{
    const amt = Number(b.amount)||0; if(!amt) return;
    const spent = spentFor(b.category, m); const pct = spent/amt*100;
    const id = b.id || b.category;
    if(pct>=100){
      if(alertOnce(`bud-100:${id}:${m}`, {title:'Budget exceeded', body:`${b.category} · ${fmt(spent-amt)} over the ${fmt(amt)} limit`, kind:'budget', nav:'budget'})) n++;
    } else if(pct>=80){
      if(alertOnce(`bud-80:${id}:${m}`, {title:'Budget 80% used', body:`${b.category} · ${fmt(spent)} of ${fmt(amt)} (${Math.round(pct)}%)`, kind:'budget', nav:'budget'})) n++;
    }
  });
  return n;
}
let _alertTimer = null, _alertRunning = false;
function scheduleAlertCheck(){ clearTimeout(_alertTimer); _alertTimer = setTimeout(runAlertChecks, 80); }
function runAlertChecks(){
  if(_alertRunning) return; _alertRunning = true;
  try{
    DB.investments.forEach(normalizeInvest);
    const applied = processRecurring() + processEmis();
    let n = applied;
    n += checkMaturityReminders();
    n += checkRecurringSoon();
    n += checkBudgetAlerts();
    n += checkCardAlerts();
    if(n) persist();
    updateNotifBadge();
    const sheetOpen = document.getElementById('sheetBg').classList.contains('show');
    if(applied && !sheetOpen) render();   // newly auto-posted recurring entries should show up in the lists
  }catch(e){ console.error('alert check failed', e); }
  finally{ _alertRunning = false; }
}

function investFilteredList(){
  const q=(investFilter.q||"").trim().toLowerCase();
  return DB.investments.filter(i=>{
    if(investFilter.status!=="all" && i.status!==investFilter.status) return false;
    if(investFilter.category!=="all" && i.category!==investFilter.category) return false;
    if(!q) return true;
    const hay=[i.name,i.category,i.subcategory,i.institution,i.notes,i.status].filter(Boolean).join(" ").toLowerCase();
    return hay.includes(q);
  });
}
function investGain(inv){ return investCurrentValue(inv)-investNetCapital(inv); }
function investRiskLabel(){
  const cats=byCategoryAgg();
  if(!cats.length) return {label:"No portfolio yet", detail:"Add your first investment."};
  const total=cats.reduce((s,x)=>s+x[1],0)||1;
  const top=cats[0][1]/total;
  if(top>=.70) return {label:"Concentrated", detail:`${cats[0][0]} is ${Math.round(top*100)}% of capital.`};
  if(cats.length<=2) return {label:"Moderately concentrated", detail:"Consider diversifying across asset types."};
  return {label:"Diversified", detail:`${cats.length} investment categories in the portfolio.`};
}
function investNextMaturity(){
  const a=DB.investments.filter(i=>i.status==="active").map(i=>{
    const date=investMaturityDate(i.date,i.durationNum,i.durationUnit);
    return {i,date,days:Math.round((new Date(date)-new Date(todayStr()))/86400000)};
  }).filter(x=>x.days>=0).sort((a,b)=>a.days-b.days);
  return a[0]||null;
}
// Profit used in the category summary: the recorded actual profit when set,
// otherwise the full-term projected profit. Net = capital + profit.
function investTotalProfit(inv){
  if(inv.actualProfit!=null && inv.actualProfit!=='') return Number(inv.actualProfit)||0;
  const p = investProjection(inv);
  return p.na ? 0 : p.profit;
}
function investListHtml(list){

function drawInvestPie(){
  const cv = document.getElementById('investPie'); if(!cv) return;
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const w = cv.clientWidth, h=150;
  cv.width=w*dpr; cv.height=h*dpr; ctx.scale(dpr,dpr);
  const data = byCategoryAgg();
  const total = data.reduce((s,d)=>s+d[1],0)||1;
  let start=-Math.PI/2; const cx=w/2, cy=h/2, r=Math.min(w,h)/2-6;
  data.forEach((d,i)=>{
    const slice=(d[1]/total)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,start+slice); ctx.closePath();
    ctx.fillStyle=pieColor(i); ctx.fill(); start+=slice;
  });
  ctx.beginPath(); ctx.arc(cx,cy,r*0.55,0,Math.PI*2); ctx.fillStyle="#fff"; ctx.fill();
}
let investBarSel = -1;
function drawInvestBar(){
  const cv = document.getElementById('investBar'); if(!cv) return;
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const w = cv.clientWidth, h=140;
  cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const data = investMonthly();
  const max = Math.max(1,...data.map(d=>d.amt));
  const bw = w/data.length;
  const top = 26;                       // room above the tallest bar for the amount bubble
  ctx.clearRect(0,0,w,h);
  data.forEach((d,i)=>{
    const x=i*bw; const bh=(d.amt/max)*(h-20-top);
    const sel = i===investBarSel;
    if(sel){ ctx.fillStyle="rgba(200,155,74,.12)"; ctx.fillRect(x+2, 0, bw-4, h-16); }
    ctx.fillStyle = sel ? "#A87B2E" : "#C89B4A";
    ctx.fillRect(x+bw*0.3, h-20-bh, bw*0.4, Math.max(bh, d.amt>0?1:0));
    ctx.fillStyle=sel ? "#A87B2E" : "#5B6B62"; ctx.font=(sel?"bold ":"")+"10px sans-serif"; ctx.textAlign="center";
    ctx.fillText(d.label, x+bw/2, h-6);
  });
  if(investBarSel>=0 && data[investBarSel]){
    const d = data[investBarSel];
    const txt = fmt(d.amt);
    ctx.font = "bold 11px sans-serif";
    const tw = ctx.measureText(txt).width + 14, th = 20;
    const cx = investBarSel*bw + bw/2;
    const bh = (d.amt/max)*(h-20-top);
    let bx = Math.min(Math.max(2, cx - tw/2), w - tw - 2);
    let by = Math.max(2, h-20-bh - th - 6);
    ctx.fillStyle = "#1F2A24";
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(bx, by, tw, th, 6); else ctx.rect(bx, by, tw, th);
    ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx-4, by+th); ctx.lineTo(cx+4, by+th); ctx.lineTo(cx, by+th+4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(txt, bx+tw/2, by+th/2+0.5);
    ctx.textBaseline = "alphabetic";
  }
  if(!cv._barBound){
    cv._barBound = true;
    cv.style.cursor = 'pointer';
    cv.addEventListener('click', ev=>{
      const r = cv.getBoundingClientRect();
      const n = investMonthly().length;
      const i = Math.floor((ev.clientX - r.left) / (r.width/n));
      investBarSel = (i===investBarSel || i<0 || i>=n) ? -1 : i;
      drawInvestBar();
    });
  }
}

      </div>

    </div>
    <div class="card" style="background:var(--paper-dim);border:none;">
      <div class="hd" style="display:flex;justify-content:space-between;font-size:0.82rem;"><span>Projected Profit</span><b class="mono" id="iProjProfit">৳0</b></div>
      <div class="hd" style="display:flex;justify-content:space-between;font-size:0.82rem;margin-top:4px;"><span>Projected Maturity Total</span><b class="mono" id="iProjTotal">৳0</b></div>
      <div class="hd" style="display:flex;justify-content:space-between;font-size:0.78rem;margin-top:4px;color:var(--ink-soft);"><span>Maturity Date</span><span id="iProjDate">—</span></div>
    </div>

  const headExitBtn = document.getElementById('invHeadExitBtn');
  if(headExitBtn) headExitBtn.onclick = ()=> closeSheet();
  if(prefill.category) document.getElementById('iCat').value = prefill.category;
  if(prefill.rateType) document.getElementById('iRateType').value = prefill.rateType;
  if(prefill.bonusType) document.getElementById('iBonusType').value = prefill.bonusType;
  if(prefill.durationUnit) document.getElementById('iDurUnit').value = prefill.durationUnit;
  if(prefill.profitType) document.getElementById('iProfitType').value = prefill.profitType;
  document.querySelectorAll('.rem-pick').forEach(chip=>{
    chip.onclick = ()=> chip.classList.toggle('on');
  });
  const updateSubcats = ()=>{
    const cat = document.getElementById('iCat').value;
    document.getElementById('subcatList').innerHTML = (INVEST_SUBCATS[cat]||[]).map(s=>`<option value="${s}">`).join("");
  };
  const updateRateLabel = ()=>{
    const rt = document.getElementById('iRateType').value;
    document.getElementById('iRateLabel').textContent = rt==='fixed' ? 'Fixed Profit (৳)' : (rt==='variable'||rt==='none') ? 'Rate (n/a)' : 'Rate of Profit (%)';
    document.getElementById('iRate').disabled = (rt==='variable'||rt==='none');
    if(rt==='variable'||rt==='none') document.getElementById('iRate').value='';
  };
  const updateProjection = ()=>{
    const capital = parseFloat(document.getElementById('iCapital').value)||0;
    const rateType = document.getElementById('iRateType').value;
    const rateValue = parseFloat(document.getElementById('iRate').value)||0;
    const profitType = document.getElementById('iProfitType').value;
    const num = parseFloat(document.getElementById('iDurNum').value)||0;
    const unit = document.getElementById('iDurUnit').value;
    const bonusType = document.getElementById('iBonusType').value, bonusValue = parseFloat(document.getElementById('iBonus').value)||0;
    document.getElementById('iBonusLabel').textContent = bonusType==='percent' ? 'Bonus Profit (% of capital)' : 'Bonus Profit (৳, optional)';
    const proj = calcProjection(capital, rateType, rateValue, profitType, num, unit, bonusType, bonusValue);
    document.getElementById('iProjProfit').textContent = proj.na? 'N/A' : fmt(proj.profit) + (proj.bonus ? ' (incl. bonus '+fmt(proj.bonus)+')' : '');
    document.getElementById('iProjTotal').textContent = proj.na? fmt(capital) : fmt(proj.total);
    document.getElementById('iProjDate').textContent = num>0 ? fmtDMY(investMaturityDate(document.getElementById('iDate').value||todayStr(), num, unit)) : '—';
  };
  updateSubcats(); updateRateLabel(); updateProjection();
  document.getElementById('iCat').onchange = updateSubcats;
  document.getElementById('iRateType').onchange = ()=>{ updateRateLabel(); updateProjection(); };
  ['iCapital','iRate','iBonus','iDurNum','iDurUnit','iProfitType','iDate'].forEach(id=> document.getElementById(id).addEventListener('input', updateProjection));
  document.getElementById('iBonusType').addEventListener('change', updateProjection);
  document.getElementById('iDurUnit').addEventListener('change', updateProjection);
  document.getElementById('iProfitType').addEventListener('change', updateProjection);

  // Inline "add new investment category with icon" mini-form
  const catSelect = document.getElementById('iCat');

  document.getElementById('iNewCatToggle').onclick = (e)=>{
    e.preventDefault();
    newCatForm.style.display = newCatForm.style.display==='none' ? 'block' : 'none';

  });

      catSelect.innerHTML = getInvestCats().map(c=>`<option value="${escapeHtml(c)}">${investCatIcon(c)} ${c}</option>`).join("");
      catSelect.value = cleanName;
      updateSubcats();
      document.getElementById('iNewCatName').value = '';
      document.getElementById('iNewCatIcon').value = '';
      newCatForm.style.display = 'none';
      toast("Category added");
    }
  };

  document.getElementById('saveInvest').onclick = ()=>{
    const name = document.getElementById('iName').value.trim();
    const capital = parseFloat(document.getElementById('iCapital').value);
    if(!name){ toast("Enter an investment name"); return; }
    if(!capital || capital<=0){ toast("Enter a valid capital amount"); return; }
    const accId = document.getElementById('iAccount').value;
    const reminderDays = Array.from(document.querySelectorAll('.rem-pick.on')).map(c=>Number(c.dataset.v));
    if(prefill.editId){
      const inv = DB.investments.find(x=>x.id===prefill.editId);
      if(!inv){ closeSheet(); return; }
      inv.name = name;
      inv.date = document.getElementById('iDate').value||todayStr();
      inv.category = document.getElementById('iCat').value;
      inv.subcategory = document.getElementById('iSubcat').value.trim();
      inv.institution = document.getElementById('iInstitution').value.trim();
      inv.capital = capital;
      inv.rateType = document.getElementById('iRateType').value;
      inv.rateValue = parseFloat(document.getElementById('iRate').value)||0;
      inv.bonusType = document.getElementById('iBonusType').value; inv.bonusValue = parseFloat(document.getElementById('iBonus').value)||0;
      inv.durationNum = parseFloat(document.getElementById('iDurNum').value)||0;
      inv.durationUnit = document.getElementById('iDurUnit').value;
      inv.profitType = document.getElementById('iProfitType').value;
      inv.reminderDays = reminderDays;
      inv.notes = document.getElementById('iNotes').value;
      persist(); closeSheet(); render(); toast("Investment updated");
      return;
    }
    const inv = {
      id: uid(), name, date: document.getElementById('iDate').value||todayStr(),
      category: document.getElementById('iCat').value, subcategory: document.getElementById('iSubcat').value.trim(),
      institution: document.getElementById('iInstitution').value.trim(),
      capital, rateType: document.getElementById('iRateType').value, rateValue: parseFloat(document.getElementById('iRate').value)||0,
      bonusType: document.getElementById('iBonusType').value, bonusValue: parseFloat(document.getElementById('iBonus').value)||0,
      durationNum: parseFloat(document.getElementById('iDurNum').value)||0, durationUnit: document.getElementById('iDurUnit').value,
      profitType: document.getElementById('iProfitType').value, status:'active',
      additionalCapital:[], partialWithdrawals:[], reinvestments:[], actualProfit:null,
      reminderDays, remindersSent:[], linkedFromId: prefill.linkedFromId||null,
      notes: document.getElementById('iNotes').value, fundedAccountId: accId||null
    };
    DB.investments.push(inv);
    if(accId){
      applyTransaction({type:'transfer', amount:capital, accountId:accId, toAccountId:ensureInvestAccount().id, invId:inv.id, invKind:'fund', date:inv.date, time:nowTime(), note:'Invested in '+name}, true);   // money moves to the investment: neutral, never an expense
    }
    if(prefill.linkedFromId){
      const prev = DB.investments.find(x=>x.id===prefill.linkedFromId);
      if(prev){ prev.reinvestments.push({date:inv.date, amount:capital, newInvestmentId:inv.id}); prev.status='reinvested'; }
    }
    persist(); closeSheet(); render(); toast(prefill.linkedFromId? "Reinvested into new investment" : "Investment added");
  };
}

function openInvestDetailSheet(id){
  const inv = DB.investments.find(x=>x.id===id); if(!inv) return;
  const proj = investProjection(inv);
  const val = investCurrentValue(inv);
  const ret = investReturnPct(inv);
  const md = investMaturityDate(inv.date, inv.durationNum, inv.durationUnit);
  const diff = (inv.actualProfit!=null && inv.actualProfit!=='') ? (Number(inv.actualProfit) - (proj.na?0:proj.profit)) : null;
  const daysToMaturity = Math.round((new Date(md)-new Date(todayStr()))/86400000);
  const isMatured = inv.status==='active' && daysToMaturity<=0;

    <h3>${inv.name}</h3>

      <div class="hd" style="display:flex;justify-content:space-between;font-size:0.9rem;margin-top:4px;"><span>Current Value</span><b class="mono">${fmt(val)}</b></div>
      <div class="hd" style="display:flex;justify-content:space-between;font-size:0.9rem;margin-top:4px;"><span>Return</span><b class="mono ${ret>=0?'up':'down'}">${ret.toFixed(1)}%</b></div>
      <div class="hd" style="display:flex;justify-content:space-between;font-size:0.78rem;margin-top:8px;color:var(--ink-soft);"><span>Expected Profit</span><span class="mono">${proj.na?'N/A':fmt(proj.profit)}</span></div>
      <div class="hd" style="display:flex;justify-content:space-between;font-size:0.78rem;margin-top:2px;color:var(--ink-soft);"><span>Actual Profit</span><span class="mono">${inv.actualProfit!=null&&inv.actualProfit!==''?fmt(Number(inv.actualProfit)):'— not recorded —'}</span></div>
      ${diff!=null? `<div class="hd" style="display:flex;justify-content:space-between;font-size:0.78rem;margin-top:2px;color:var(--ink-soft);"><span>Expected vs Actual</span><span class="mono">${diff>=0?'+':''}${fmt(diff)}</span></div>`:''}
      <div class="hd" style="display:flex;justify-content:space-between;font-size:0.78rem;margin-top:8px;color:var(--ink-soft);"><span>Maturity Date</span><span>${fmtDMY(md)}${inv.status==='active'? ' · '+(daysToMaturity>0? 'in '+daysToMaturity+' day'+(daysToMaturity===1?'':'s') : daysToMaturity===0?'today':Math.abs(daysToMaturity)+' days ago') : ''}</span></div>
      <div class="hd" style="display:flex;justify-content:space-between;font-size:0.78rem;margin-top:2px;color:var(--ink-soft);"><span>Rate</span><span>${inv.rateType==='fixed'?fmt(inv.rateValue)+' fixed':inv.rateType==='variable'||inv.rateType==='none'?'—':inv.rateValue+'% '+inv.rateType}, ${inv.profitType}</span></div>
      ${Number(inv.bonusValue)>0?`<div class="hd" style="display:flex;justify-content:space-between;font-size:0.78rem;margin-top:2px;color:var(--ink-soft);"><span>Bonus profit</span><span>${inv.bonusType==='percent'?inv.bonusValue+'% of capital ('+fmt(investNetCapital(inv)*inv.bonusValue/100)+')':fmt(inv.bonusValue)}</span></div>`:''}
      ${(inv.reminderDays&&inv.reminderDays.length)? `<div class="hd" style="display:flex;justify-content:space-between;font-size:0.72rem;margin-top:6px;color:var(--ink-soft);"><span>Reminders</span><span>${inv.reminderDays.slice().sort((a,b)=>b-a).map(d=>d>0?d+'d before':d===0?'On maturity':Math.abs(d)+'d after').join(', ')}</span></div>`:''}
    </div>
    ${inv.notes? `<div style="font-size:0.8rem;color:var(--ink-soft);margin-top:10px;">${escapeHtml(inv.notes)}</div>`:''}

    <div class="row2" style="margin-top:8px;"><button class="btn secondary" data-act="status" style="margin:0;">Change Status</button><button class="btn" data-act="reinvest" style="margin:0;background:var(--gold-soft);">🔄 Reinvest</button></div>

      const act = b.dataset.act;
      if(act==='delete'){
        if(!confirm('Delete this investment record?')) return;
        const linked = DB.transactions.filter(t=>t.invId===id);
        if(linked.length && confirm(`Also remove its ${linked.length} ledger transfer${linked.length>1?'s':''} (funding / capital returned) and restore the account balance${linked.length>1?'s':''}?\n\nOK = remove and restore\nCancel = keep the ledger entries`)){
          linked.slice().forEach(t=>deleteTransaction(t.id));
        }
        DB.investments = DB.investments.filter(x=>x.id!==id); persist(); closeSheet(); render(); return; }
      if(act==='edit') openAddInvestmentSheet({
        editId: inv.id, name: inv.name, date: inv.date, capital: inv.capital,
        category: inv.category, subcategory: inv.subcategory, institution: inv.institution,
        rateType: inv.rateType, rateValue: inv.rateValue, bonusType: inv.bonusType, bonusValue: inv.bonusValue, durationNum: inv.durationNum,
        durationUnit: inv.durationUnit, profitType: inv.profitType, reminderDays: inv.reminderDays,
        notes: inv.notes
      });
      if(act==='addcap') openInvestFundSheet(id,'add');
      if(act==='withdraw') openInvestFundSheet(id,'withdraw');
      if(act==='actual') openInvestActualSheet(id);
      if(act==='status') openInvestStatusSheet(id);
      if(act==='reinvest') openReinvestSheet(id);
      if(act==='exit') openInvestExitSheet(id);
    };
  });
}

/* ---------- Investment export: CSV / PDF / JSON ---------- */
function investExportData(){
  const list = DB.investments.slice().sort((a,b)=> (a.category||'').localeCompare(b.category||'') || (a.date||'').localeCompare(b.date||''));
  const head = ['Name','Category','Subcategory','Institution','Date','Capital','RateType','RateValue','DurationNum','DurationUnit','ProfitType','Status','Notes','Maturity Date','Net Capital','Expected Profit','Current Value','Return %'];
  const rows = list.map(i=>{
    const proj = investProjection(i);
    return [i.name||'', i.category||'', i.subcategory||'', i.institution||'', i.date||'', Number(i.capital)||0, i.rateType||'', Number(i.rateValue)||0, Number(i.durationNum)||0, i.durationUnit||'', i.profitType||'', i.status||'', i.notes||'',
      investMaturityDate(i.date,i.durationNum,i.durationUnit), investNetCapital(i), Math.round((proj.na?0:proj.profit)*100)/100, Math.round(investCurrentValue(i)*100)/100, Math.round(investReturnPct(i)*100)/100];
  });
  return {list, head, rows};
}
function exportInvestCsv(){
  const {head, rows} = investExportData();
  const csv = '\uFEFF' + [head].concat(rows).map(r=> r.map(csvEscape).join(',')).join('\r\n');
  downloadBlob(csv, 'mhs-investments-'+todayStr()+'.csv', 'text/csv;charset=utf-8');
  toast('CSV exported ('+rows.length+' investments)');
}
function exportInvestJson(){
  const {list} = investExportData();
  const payload = {app:'MHS Tracker', type:'investments', exportedAt:new Date().toISOString(), count:list.length, investments:list};
  downloadBlob(JSON.stringify(payload,null,2), 'mhs-investments-'+todayStr()+'.json', 'application/json');
  toast('JSON exported ('+list.length+' investments)');
}
function exportInvestPdf(){
  const {list, rows} = investExportData();
  const e = escapeHtml, n = v=> Number(v).toLocaleString('en-US',{maximumFractionDigits:2});
  const totCap = list.reduce((s,i)=>s+investNetCapital(i),0);
  const totVal = list.reduce((s,i)=>s+investCurrentValue(i),0);
  const th = ['Name','Category','Institution','Date','Maturity','Status','Capital','Rate %','Duration','Exp. Profit','Current Value','Return %'];
  const body = list.map((i,k)=>{
    const r = rows[k];
    return `<tr><td>${e(i.name)}</td><td>${e(i.category)}${i.subcategory?' · '+e(i.subcategory):''}</td><td>${e(i.institution||'')}</td><td>${e(fmtDMY(i.date))}</td><td>${e(fmtDMY(r[13]))}</td><td>${e(i.status)}</td><td class="n">${n(r[14])}</td><td class="n">${n(i.rateValue)}</td><td>${e(i.durationNum+' '+i.durationUnit)}</td><td class="n">${n(r[15])}</td><td class="n">${n(r[16])}</td><td class="n">${n(r[17])}</td></tr>`;
  }).join('');
  const title = 'MHS Tracker — Investments';
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${e(title)}</title><style>@page{size:A4 landscape;margin:10mm}body{font:9px/1.3 "Noto Sans Bengali",Arial,sans-serif;color:#111}h1{font-size:14px;margin:0 0 4px}table{border-collapse:collapse;width:100%;margin-top:8px}th,td{border:1px solid #bbb;padding:2px 4px;text-align:left;vertical-align:top}th{background:#eee}thead{display:table-header-group}tr{page-break-inside:avoid}td.n{text-align:right;white-space:nowrap}tfoot td{font-weight:700;background:#f5f5f5}</style></head><body><h1>${e(title)}</h1><div>${list.length} investments · exported ${e(fmtDMY(todayStr()))} · Total capital ${n(totCap)} · Current value ${n(totVal)}</div><table><thead><tr>${th.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody><tfoot><tr><td colspan="6">Total</td><td class="n">${n(totCap)}</td><td colspan="3"></td><td class="n">${n(totVal)}</td><td class="n">${totCap?n((totVal-totCap)/totCap*100):'0'}</td></tr></tfoot></table></body></html>`;
  const fr = document.createElement('iframe'); fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;'; document.body.appendChild(fr);
  fr.srcdoc = html; fr.onload = ()=>{ try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(err){ toast('Printing is not available here'); } setTimeout(()=>fr.remove(),60000); };
}

/* ===================== CREDIT CARDS ===================== */
/* A credit card is an account of type "credit-card" (balance goes negative = amount owed).
   - Purchase  = expense on the card account        (counts once as an expense)
   - Bill pay  = transfer bank → card account        (liability settlement, NOT an expense)
   - Cash adv. = transfer card account → cash/bank   (borrowing, NOT an expense)
   - Refund    = negative expense on the card        (reduces expense, never counted as income)
   Total balance / net worth already sums every account, so the card liability is netted
   automatically without double counting. */
let ccTab='overview', ccSel='all', ccKindF='all', ccQ='', ccShowAll=false;
const CC_TABS=[['overview','Overview'],['cards','My Cards'],['txns','Transactions'],['billing','Billing'],['emi','EMI'],['rewards','Rewards'],['analytics','Analytics'],['settings','Settings']];
const CC_DEF={bank:'',network:'Visa',last4:'',limit:0,stmtDay:1,dueDay:15,annualFee:0,feeDate:'',rate:0,lateFee:0,minPct:5,minFixed:0,status:'Active',waiverSpend:0,waiverTxns:0};
const CC_NETS=['Visa','Mastercard','Amex','Other'];
const CC_KIND={purchase:['🛍','Purchase'],payment:['💸','Bill payment'],refund:['↩️','Refund'],fee:['🧾','Fee / interest'],emi:['📆','EMI'],cashadv:['🏧','Cash advance'],other:['🔹','Other']};
const CC_REWARD_KINDS=[['points','⭐ Points earned'],['cashback','💰 Cashback earned'],['redeem','🎁 Points redeemed'],['lounge','🛋 Airport lounge visit'],['insurance','🛡 Insurance benefit'],['promo','🏷 Promo discount']];

function ccH(n){ return hideBalance ? '••••' : fmt(n); }
function ccCards(){ return DB.accounts.filter(a=>a.type==='credit-card'); }
function ccIds(){ return new Set(ccCards().map(a=>a.id)); }
function ccm(a){ return Object.assign({}, CC_DEF, a.cc||{}); }
function ccOwed(a){ return Math.max(0, -(Number(a.balance)||0)); }
function ccLimit(a){ return Number(ccm(a).limit)||0; }
function ccAvail(a){ const l=ccLimit(a); return l ? Math.max(0, l+(Number(a.balance)||0)) : 0; }
function ccUtil(a){ const l=ccLimit(a); return l ? ccOwed(a)/l*100 : 0; }
function ccName(a){ const m=ccm(a); return a.name + (m.last4 ? ' ••'+m.last4 : ''); }
function r2(n){ return Math.round((Number(n)||0)*100)/100; }
function ccPct(n){ return (Math.round(n*10)/10).toFixed(1).replace(/\.0$/,''); }

/* ---------- billing cycle maths ---------- */
function ccDay(y,m,d){ const dim=new Date(y,m+1,0).getDate(); return ymdLocal(new Date(y,m,Math.min(d,dim))); }
function ccStmtDates(a, ref){
  ref = ref || todayStr();
  const m=ccm(a), sd=Math.min(31,Math.max(1,parseInt(m.stmtDay)||1)), dd=Math.min(31,Math.max(1,parseInt(m.dueDay)||15));
  const [y,mo]=ref.split('-').map(Number);
  let last=ccDay(y,mo-1,sd); if(last>ref) last=ccDay(y,mo-2,sd);
  const [ly,lm]=last.split('-').map(Number);
  const next=ccDay(ly,lm,sd), prev=ccDay(ly,lm-2,sd);
  let due=ccDay(ly,lm-1,dd); if(due<=last) due=ccDay(ly,lm,dd);
  return {last,next,prev,due};
}
// Which statement a charge lands on, and when it must be paid:
// a charge on/before the statement day goes on that month's statement; a charge AFTER the statement day rolls to the NEXT statement,
// and is due on the first payment-due day after that next statement date.
function ccDueForDate(a, date){
  const m=ccm(a), sd=Math.min(31,Math.max(1,parseInt(m.stmtDay)||1)), dd=Math.min(31,Math.max(1,parseInt(m.dueDay)||15));
  const [y,mo]=date.split('-').map(Number);
  let stmt=ccDay(y,mo-1,sd); if(stmt<date) stmt=ccDay(y,mo,sd);
  const [sy,sm]=stmt.split('-').map(Number);
  let due=ccDay(sy,sm-1,dd); if(due<=stmt) due=ccDay(sy,sm,dd);
  return {stmt,due};
}
function ccEffect(a,t){
  const amt=Number(t.amount)||0;
  if(t.type==='opening' && t.accountId===a.id) return (t.dir==='out'?-1:1)*amt;
  if(t.type==='income' && t.accountId===a.id) return amt;
  if(t.type==='expense' && t.accountId===a.id) return -amt;
  if(t.type==='transfer'){ let e=0; if(t.accountId===a.id) e-=amt; if(t.toAccountId===a.id) e+=amt; return e; }
  return 0;
}
function ccBalanceAt(a,date){
  let b=Number(a.balance)||0;
  DB.transactions.forEach(t=>{ if(t.date>date) b-=ccEffect(a,t); });
  return r2(b);
}
function ccStatement(a){
  const m=ccm(a), d=ccStmtDates(a), today=todayStr();
  const stmt=Math.max(0,-ccBalanceAt(a,d.last));
  const paid=DB.transactions.filter(t=>t.type==='transfer'&&t.toAccountId===a.id&&t.date>d.last&&t.date<=today).reduce((s,t)=>s+Number(t.amount),0);
  const remaining=Math.max(0,r2(stmt-paid));
  let minDue=0;
  if(stmt>0) minDue=Math.round(Math.min(stmt, Math.max(stmt*(Number(m.minPct)||0)/100, Number(m.minFixed)||0)));
  const remMin=Math.min(remaining, Math.max(0,minDue-paid));
  const daysLeft=daysBetween(today,d.due);
  const status = (stmt<=0||remaining<=0) ? 'paid' : daysLeft<0 ? 'overdue' : 'due';
  const cycleSpend=DB.transactions.filter(t=>t.type==='expense'&&t.accountId===a.id&&t.date>d.last&&t.date<=today).reduce((s,t)=>s+Number(t.amount),0);
  return Object.assign({},d,{stmt,paid,remaining,minDue,remMin,daysLeft,status,cycleSpend});
}
function ccDueText(s){
  if(s.status==='paid') return 'Paid ✓';
  if(s.daysLeft<0) return `Overdue by ${-s.daysLeft} day${s.daysLeft===-1?'':'s'}`;
  if(s.daysLeft===0) return 'Due today';
  return `Due in ${s.daysLeft} day${s.daysLeft===1?'':'s'}`;
}
function ccTotals(){
  const cs=ccCards(); const t={owed:0,avail:0,limit:0,stmt:0,minDue:0,next:null,count:cs.length};
  cs.forEach(a=>{
    t.owed+=ccOwed(a); t.avail+=ccAvail(a); t.limit+=ccLimit(a);
    const s=ccStatement(a); t.stmt+=s.stmt; t.minDue+=s.remMin;
    const cand={card:a,s,date:s.due,pending:s.remaining>0};
    if(!t.next || (cand.pending&&!t.next.pending) || (cand.pending===t.next.pending && cand.date<t.next.date)) t.next=cand;
  });
  return t;
}
function ccEmiMonthly(P,n,rate){ P=Number(P)||0; n=Number(n)||0; if(!P||!n) return 0; const r=(Number(rate)||0)/1200; return r ? P*r/(1-Math.pow(1+r,-n)) : P/n; }
function ccEmiOutstanding(p){
  const r=(Number(p.rate)||0)/1200; let b=Number(p.principal)||0;
  for(let i=0;i<(p.posted||0);i++){ b = r ? b*(1+r)-p.monthly : b-p.monthly; }
  return Math.max(0,Math.round(b));
}
function ccEmiRemainingAmt(p){ return Math.max(0,(p.months-(p.posted||0))*p.monthly); }
function ccEmiLiability(ids){
  return (DB.ccEmis||[]).filter(p=>p.status==='active' && (!ids || ids.includes(p.cardId))).reduce((s,p)=>s+ccEmiRemainingAmt(p),0);
}

/* ---------- transaction classification ---------- */
function ccKind(t,ids){
  if(t.type==='transfer'){ if(ids.has(t.accountId)&&!ids.has(t.toAccountId)) return 'cashadv'; return 'payment'; }
  if(t.type==='expense'){ if(t.ccFee) return 'fee'; if(t.emi) return 'emi'; if(Number(t.amount)<0) return 'refund'; return 'purchase'; }
  if(t.type==='income') return 'refund';
  return 'other';
}
function ccCardTx(){
  const ids=ccIds();
  return DB.transactions.filter(t=>notFuture(t)&&t.type!=='opening'&&(ids.has(t.accountId)||(t.type==='transfer'&&ids.has(t.toAccountId))));
}
function ccSpendTx(ids){   // net card spending (purchases + EMI installments, net of refunds; fees excluded)
  const set=new Set(ids);
  return DB.transactions.filter(t=>notFuture(t)&&t.type==='expense'&&set.has(t.accountId)&&!t.ccFee);
}
function ccTxRow(t){
  const ids=ccIds(), k=ccKind(t,ids), K=CC_KIND[k];
  const from=DB.accounts.find(a=>a.id===t.accountId), to=DB.accounts.find(a=>a.id===t.toAccountId);
  const card = (t.type==='transfer' && ids.has(t.toAccountId)) ? to : from;
  let icon=K[0], title=K[1], sub='', pos=false;
  if(k==='purchase'||k==='emi'||k==='refund'){
    icon = k==='purchase' ? catIcon(t.category) : K[0];
    title = (t.merchant||'').trim() || t.category || K[1];
    sub = (k==='purchase' ? '' : K[1]+' · ') + (t.category||'') + (card? ' · '+ccName(card):'');
    pos = k==='refund';
  } else if(k==='payment'){
    title='Bill payment'; sub = `${from?from.name:'—'} → ${to?ccName(to):'—'}`; pos=true;
  } else if(k==='cashadv'){
    title='Cash advance'; sub = `${from?ccName(from):'—'} → ${to?to.name:'—'}`;
  } else if(k==='fee'){
    title = ({annual:'Annual fee',interest:'Interest charge',late:'Late payment fee',other:'Card charge'})[t.ccFee]||'Card charge'; sub=card?ccName(card):'';
  }
  const amt=Math.abs(Number(t.amount)||0);
  const showNote = t.note && !t.note.startsWith(title) && !/^(Credit card bill payment|Refund|EMI \d|Cash advance)/.test(t.note) && !(t.merchant && t.note.indexOf(t.merchant)>=0 && k!=='fee');
  const note = showNote ? ' — '+escapeHtml(t.note) : '';
  const tag = t.ccPay ? ` · ${({full:'Full',min:'Minimum',partial:'Partial'})[t.ccPay]}` : '';
  const dueTag = (card && ['purchase','emi','fee','cashadv'].includes(k) && t.date) ? ` · Due ${fmtDMY(ccDueForDate(card,t.date).due)}` : '';
  return `<div class="tx" data-txid="${t.id}">
    <div class="ic">${icon}</div>
    <div class="mid"><div class="t1">${escapeHtml(title)}${note}</div><div class="t2">${fmtDMY(t.date)}${t.time?' · '+fmtTime(t.time):''} · ${escapeHtml(sub)}${tag}${dueTag}</div></div>
    ${(k==='payment'||k==='cashadv')?`<div class="amt transfer mono">${fmt(amt)}</div>`:`<div class="amt ${pos?'income':'expense'} mono">${pos?'+':'−'}${fmt(amt)}</div>`}
    <button class="tx-edit" aria-label="Edit" title="Edit" onclick="event.stopPropagation();openEditTransactionSheet('${t.id}')">✎</button>
  </div>`;
}

function ccOverview(){

    </div>
  </div>
  ${t.limit ? `<div class="card" style="padding:12px 14px;">
    <div style="display:flex;justify-content:space-between;font-size:.78rem;font-weight:700;"><span>Credit utilization</span><span style="color:${u>=75?'var(--rust)':'var(--ledger)'}">${ccPct(u)}% utilized</span></div>
    ${ccUtilBar(u)}
    <div class="home-small">${ccPct(Math.max(0,100-u))}% available${u>=30?' · keeping utilization under 30% is healthier for your credit profile':''}</div>
  </div>` : ''}
  <div class="cc-grid">

function ccNextAnniv(iso){
  if(!iso) return '';
  const today=todayStr(), [y,m,d]=iso.split('-').map(Number);
  let c=ccDay(+today.slice(0,4),m-1,d); if(c<today) c=ccDay(+today.slice(0,4)+1,m-1,d);
  return c;
}
function ccLastAnniv(iso){
  const today=todayStr();
  if(!iso) return today.slice(0,4)+'-01-01';
  const [y,m,d]=iso.split('-').map(Number);
  let c=ccDay(+today.slice(0,4),m-1,d); if(c>today) c=ccDay(+today.slice(0,4)-1,m-1,d);
  return c;
}

      ${numF('ccfLate','Late payment charge (৳)',m.lateFee)}
    </div>
    <div class="row2">
      ${numF('ccfMinPct','Minimum due (% of statement)',m.minPct,'5')}
      ${numF('ccfMinFix','Minimum due floor (৳)',m.minFixed)}
    </div>
    <div class="row2">
      ${numF('ccfWaiver','Fee-waiver spend target (৳/yr)',m.waiverSpend)}
      ${numF('ccfWaiverTx','Fee-waiver transactions target (per yr)',m.waiverTxns,'0','1')}
    </div>
    <div class="row2">
      <div class="field"><label>Status</label><select id="ccfStatus">${['Active','Blocked','Expired'].map(s=>`<option ${m.status===s?'selected':''}>${s}</option>`).join('')}</select></div>

      // so no fake income/expense is created and the ledger totals stay untouched.
      const newOut = Math.max(0,num('ccfOut')), oldBal = Number(a.balance)||0, newBal = -newOut;

    } else {

    DB.ccEmis=(DB.ccEmis||[]).filter(x=>x.cardId!==a.id);
    persist(); closeSheet(); render(); toast('Card deleted');
  };
}

/* ---------- Transactions ---------- */
function ccFilteredTx(){
  const ids=ccIds(), q=ccQ.trim().toLowerCase();
  return ccCardTx().filter(t=>{
    if(ccSel!=='all' && t.accountId!==ccSel && t.toAccountId!==ccSel) return false;
    if(ccKindF!=='all' && ccKind(t,ids)!==ccKindF) return false;
    if(q){
      const hay=[t.merchant,t.note,t.category,String(t.amount),t.date].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=> (b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
}
function ccTxListHtml(){
  const list=ccFilteredTx(), shown=ccShowAll?list:list.slice(0,60);
  if(!list.length) return `<div class="empty"><div class="big">🧾</div>No card transactions match.</div>`;
  const net=list.reduce((s,t)=>{ const k=ccKind(t,ccIds()); return (k==='purchase'||k==='emi'||k==='refund') && t.type==='expense' ? s+Number(t.amount) : s; },0);
  return `<div class="home-small" style="margin:0 2px 8px;">${list.length} transaction${list.length===1?'':'s'} · net card spending <b class="mono">${ccH(net)}</b></div>`
    + shown.map(ccTxRow).join('')
    + (list.length>shown.length ? `<div style="text-align:center;margin-top:8px;"><a href="#" data-cc="showall" style="color:var(--ledger);font-size:.8rem;font-weight:600;text-decoration:none;">Show all ${list.length} →</a></div>` : '');
}
