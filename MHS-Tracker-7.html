/* ===================== INVESTMENT CSV / EXCEL IMPORT =====================
   Bulk-import an existing portfolio (FDRs, stocks, bonds, etc.) from a .csv,
   .xlsx or .xls file. Uses SheetJS (loaded from CDN — needs an internet
   connection) for .xlsx/.xls; .csv files also work fully offline via a
   built-in fallback parser if SheetJS hasn't loaded. */
const INVEST_IMPORT_COLS = ["Name","Category","Subcategory","Institution","Date","Capital","RateType","RateValue","DurationNum","DurationUnit","ProfitType","Status","Notes"];
function downloadInvestTemplate(){
  const sample = ["City Bank FDR","FDR / Fixed Deposit","Bank FDR","City Bank Ltd.","2026-01-15","500000","annual","7.5","1","years","simple","active","Sample row — delete before importing"];
  const rows = [INVEST_IMPORT_COLS, sample];
  const csv = rows.map(r=> r.map(csvEscape).join(",")).join("\n");
  downloadBlob(csv, "mhs-investment-import-template.csv", "text/csv");
  toast("Template downloaded");
}
function csvEscape(v){
  v = String(v==null?'':v);
  return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
// Minimal RFC4180-ish CSV parser used as an offline fallback when SheetJS hasn't loaded.
function parseCsvText(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=> r.some(c=>String(c).trim()!==''));
}
function rowsToObjects(rows){
  if(!rows.length) return [];
  const headers = rows[0].map(h=> String(h||'').trim());
  return rows.slice(1).map(r=>{
    const o = {};
    headers.forEach((h,i)=> o[h] = r[i]!==undefined? r[i] : '');
    return o;
  });
}
function findCol(obj, names){
  const keys = Object.keys(obj);
  for(const name of names){
    const hit = keys.find(k=> k.toLowerCase().replace(/[^a-z0-9]/g,'') === name.toLowerCase().replace(/[^a-z0-9]/g,''));
    if(hit!==undefined) return obj[hit];
  }
  return '';
}
function normalizeImportDate(v){
  if(!v) return todayStr();
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v === 'number'){ // Excel serial date
    const d = new Date(Math.round((v-25569)*86400*1000));
    return d.toISOString().slice(0,10);
  }
  const s = String(v).trim();
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  const d = new Date(s);
  return isNaN(d) ? todayStr() : d.toISOString().slice(0,10);
}
function investRowToObject(raw){
  const name = String(findCol(raw,['Name','InvestmentName']) || '').trim();
  const capital = parseFloat(findCol(raw,['Capital','Amount','CapitalAmount']));
  if(!name || !capital || capital<=0) return null; // invalid row, skip
  let category = String(findCol(raw,['Category']) || '').trim();
  if(!INVEST_CATS.includes(category) && !DB.customCategories.investment.includes(category)) category = category || 'Other';
  let rateType = String(findCol(raw,['RateType','Rate Type']) || 'annual').trim().toLowerCase();
  if(!['annual','monthly','fixed','variable','none'].includes(rateType)) rateType = 'annual';
  let durationUnit = String(findCol(raw,['DurationUnit','Duration Unit','Unit']) || 'years').trim().toLowerCase();
  if(!['years','months','days'].includes(durationUnit)) durationUnit = 'years';
  let profitType = String(findCol(raw,['ProfitType','Profit Type']) || 'simple').trim().toLowerCase();
  if(!['simple','compound','dividend','interest','capital-gain'].includes(profitType)) profitType = 'simple';
  let status = String(findCol(raw,['Status']) || 'active').trim().toLowerCase();
  if(!['active','matured','withdrawn','reinvested'].includes(status)) status = 'active';
  return {
    id: uid(), name,
    date: normalizeImportDate(findCol(raw,['Date','InvestmentDate','Investment Date'])),
    category, subcategory: String(findCol(raw,['Subcategory','Sub-category']) || '').trim(),
    institution: String(findCol(raw,['Institution','Bank','BankName']) || '').trim(),
    capital, rateType, rateValue: parseFloat(findCol(raw,['RateValue','Rate','RateOfProfit'])) || 0,
    durationNum: parseFloat(findCol(raw,['DurationNum','Duration'])) || 1, durationUnit,
    profitType, status,
    additionalCapital:[], partialWithdrawals:[], reinvestments:[], actualProfit:null,
    reminderDays: (DB.settings.reminderDaysDefault||[30,7,1,0,-7]).slice(), remindersSent:[], linkedFromId:null,
    notes: String(findCol(raw,['Notes','Note']) || '').trim(), fundedAccountId: null
  };
}

/* ===================== RAW PORTFOLIO SHEET IMPORT =====================
   Handles messy, hand-kept portfolio spreadsheets like:
   Institution | Investment NAME | Date | Maturity Date | Duration Month | Capital | Rate Annual % | Profit | Total
   where the Institution column is only filled on the first row of each
   group (forward-filled downward), dates are sometimes partial
   ("28/1" = day/month, year assumed current), and Duration Month is
   sometimes text like "20 yrs" or "3/91 d". Auto-detected — no template
   required — and used instead of the strict-template importer above when
   a sheet's headers match this shape. */
function normHeader(h){ return String(h||'').trim().toLowerCase().replace(/[^a-z0-9]/g,''); }
function buildPortfolioColIndex(headerRow){
  const idx = {};
  (headerRow||[]).forEach((h,i)=>{ const n = normHeader(h); if(idx[n]===undefined) idx[n]=i; });
  function find(names){
    for(const nm of names){ const n = normHeader(nm); if(idx[n]!==undefined) return idx[n]; }
    return -1;
  }
  return {
    institution: find(['Institution']),
    name: find(['Investment NAME','InvestmentName','Name']),
    date: find(['Date']),
    maturityDate: find(['Maturity Date','MaturityDate']),
    durationMonth: find(['Duration Month','DurationMonth','Duration']),
    capital: find(['Capital']),
    rateAnnual: find(['Rate Annual %','RateAnnual','Rate']),
    profit: find(['Profit']),
    total: find(['Total'])
  };
}
function isPortfolioSheet(col){
  return col.name!==-1 && col.institution!==-1 && col.capital!==-1 && col.maturityDate!==-1;
}
// Flexible date parser for this sheet: full dates (Date objects, Excel
// serials, dd/mm/yyyy, dd/mm/yy) are used as-is; a bare "dd/mm" with no
// year is assumed to be the current year, since that's how these entries
// were consistently written relative to the sheet's other full dates.
function parseFlexInvestDate(v){
  if(v===null||v===undefined||v==='') return '';
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v === 'number'){ const d = new Date(Math.round((v-25569)*86400*1000)); return isNaN(d)?'':d.toISOString().slice(0,10); }
  const s = String(v).trim();
  if(!s) return '';
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); // dd/mm/yyyy
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/); // dd/mm/yy
  if(m) return `20${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})$/); // dd/mm, no year -> assume current year
  if(m) return `${new Date().getFullYear()}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  const d = new Date(s);
  return isNaN(d) ? '' : d.toISOString().slice(0,10);
}
// Duration Month column can be a plain number (months), or text like
// "20 yrs" or "3/91 d" (bank FDR terms). Falls back to the Date/Maturity
// Date gap, then to 1 month, if nothing usable is present.
function parsePortfolioDuration(raw, dateStr, maturityStr){
  if(raw!==null && raw!==undefined && raw!==''){
    if(typeof raw === 'number' && raw>0) return {durationNum:raw, durationUnit:'months'};
    const s = String(raw).trim();
    let unit = 'months';
    const unitMatch = s.match(/(yr|year|mo|month|day|d\b)/i);
    if(unitMatch){
      const u = unitMatch[1].toLowerCase();
      unit = u.startsWith('y') ? 'years' : u.startsWith('d') ? 'days' : 'months';
    }
    const nums = s.match(/\d+(\.\d+)?/g);
    if(nums && nums.length){
      const num = parseFloat(nums[nums.length-1]);
      if(!isNaN(num) && num>0) return {durationNum:num, durationUnit:unit};
    }
  }
  if(dateStr && maturityStr && maturityStr>dateStr){
    const months = Math.max(1, Math.round((new Date(maturityStr)-new Date(dateStr))/(1000*3600*24*30.44)));
    return {durationNum:months, durationUnit:'months'};
  }
  return {durationNum:1, durationUnit:'months'};
}
// Best-effort category guess from institution name; always one of the
// app's existing investment categories so nothing needs a new custom
// category. Import notes remind the user to double-check/edit these.
const PORTFOLIO_CAT_MAP = [
  [/ifarmer/i,'Crowdfunding'],[/growup/i,'Crowdfunding'],[/halal ?invest/i,'Crowdfunding'],
  [/bini/i,'Crowdfunding'],[/^capital\b/i,'Crowdfunding'],
  [/prime islamic/i,'FDR / Fixed Deposit'],[/\bmtb\b/i,'FDR / Fixed Deposit'],
  [/pacific/i,'Stock Market'],[/share market/i,'Stock Market'],
  [/sukuk/i,'Government Bond / Treasury Bill'],[/trs ?bond/i,'Government Bond / Treasury Bill'],
  [/crypto/i,'Crypto']
];
function guessPortfolioCategory(institution){
  for(const [re,cat] of PORTFOLIO_CAT_MAP){ if(re.test(institution)) return cat; }
  return 'Other';
}
function parsePortfolioRows(rows, col){
  let currentInst = '';
  const rawItems = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || !r.length) continue;
    const instCell = col.institution>=0 ? String(r[col.institution]||'').trim() : '';
    if(instCell) currentInst = instCell;
    const capVal = col.capital>=0 ? parseFloat(r[col.capital]) : NaN;
    if(isNaN(capVal) || capVal<=0) continue; // section header / blank separator row, skip
    rawItems.push({
      institution: currentInst || 'Other',
      name: col.name>=0 ? String(r[col.name]||'').trim() : '',
      date: col.date>=0 ? r[col.date] : '',
      maturityDate: col.maturityDate>=0 ? r[col.maturityDate] : '',
      durationRaw: col.durationMonth>=0 ? r[col.durationMonth] : '',
      capital: capVal,
      rateAnnual: col.rateAnnual>=0 ? parseFloat(r[col.rateAnnual]) : NaN,
      profit: col.profit>=0 ? r[col.profit] : '',
      total: col.total>=0 ? r[col.total] : ''
    });
  }
  // Auto-name rows that had a blank Investment NAME, grouped by institution.
  const blankGroups = {};
  rawItems.forEach(it=>{ if(!it.name){ (blankGroups[it.institution] = blankGroups[it.institution]||[]).push(it); } });
  Object.keys(blankGroups).forEach(inst=>{
    const list = blankGroups[inst];
    if(list.length===1) list[0].name = inst;
    else list.forEach((it,idx)=> it.name = `${inst} #${idx+1}`);
  });
  return rawItems.map(it=>{
    const date = parseFlexInvestDate(it.date) || todayStr();
    const maturityStr = parseFlexInvestDate(it.maturityDate);
    const dur = parsePortfolioDuration(it.durationRaw, date, maturityStr);
    const status = (maturityStr && maturityStr < todayStr()) ? 'matured' : 'active';
    let note = 'Imported from portfolio sheet.';
    if(it.profit!=='' && it.profit!=null) note += ` Recorded profit: ${it.profit}.`;
    if(it.total!=='' && it.total!=null) note += ` Recorded total: ${it.total}.`;
    return {
      id: uid(), name: it.name || it.institution,
      date, category: guessPortfolioCategory(it.institution), subcategory: '',
      institution: it.institution,
      capital: it.capital, rateType: 'annual', rateValue: isNaN(it.rateAnnual) ? 0 : it.rateAnnual,
      durationNum: dur.durationNum, durationUnit: dur.durationUnit,
      profitType: 'simple', status,
      additionalCapital:[], partialWithdrawals:[], reinvestments:[], actualProfit:null,
      reminderDays: (DB.settings.reminderDaysDefault||[30,7,1,0,-7]).slice(), remindersSent:[], linkedFromId:null,
      notes: note, fundedAccountId: null
    };
  });
}
function doImportInvestFile(e){
  const file = e.target.files[0]; if(!file) return;
  const isCsv = /\.csv$/i.test(file.name);
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      let rows; // array-of-arrays, rows[0] = header
      if(window.XLSX){
        const data = new Uint8Array(reader.result);
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      } else if(isCsv){
        const text = new TextDecoder('utf-8').decode(new Uint8Array(reader.result));
        rows = parseCsvText(text);
      } else {
        toast("Excel import needs an internet connection to load the parser. Try a .csv file, or reconnect and retry.");
        e.target.value = ''; return;
      }
      if(!rows || !rows.length){ toast("Empty file"); e.target.value=''; return; }
      let added = 0, skipped = 0;
      const col = buildPortfolioColIndex(rows[0]);
      if(isPortfolioSheet(col)){
        // Messy hand-kept portfolio sheet (Institution/Investment NAME/Date/Maturity Date/...) — no template needed.
        const items = parsePortfolioRows(rows, col);
        items.forEach(inv=>{ DB.investments.push(inv); added++; });
        if(added) toast(`Imported ${added} investment${added===1?'':'s'} — categories/durations were guessed from your sheet, please review each entry`);
      } else {
        const objects = rowsToObjects(rows);
        objects.forEach(raw=>{
          const inv = investRowToObject(raw);
          if(inv){ DB.investments.push(inv); added++; } else skipped++;
        });
        if(added || skipped) toast(added? `Imported ${added} investment${added===1?'':'s'}${skipped? ', '+skipped+' skipped':''}` : 'No valid rows found — check the template format');
      }
      if(added){ persist(); render(); }
      if(!added && !skipped) toast('No valid rows found — check the file format');
    }catch(err){
      toast("Could not read that file — check it matches the template format");
    }
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

/* ===================== MONEFY / GENERIC TRANSACTION CSV / EXCEL IMPORT =====================
   Bulk-import income/expense transactions from a Monefy export (columns:
   date, account, category, amount, Note — where "account" actually holds
   Income/Expense, not a real account name) or any CSV/Excel using those
   header names. All imported rows land in one MHS account the user picks
   before the import runs. Reuses the SheetJS/CSV parsing helpers already
   defined above for the Investment importer. */
let pendingMonefyRows = null;
let pendingMonefyFileName = "";
let pendingMonefyFutureCount = 0;

function monefyRowType(raw){
  const accRaw = String(findCol(raw,['account','Account','Type']) || '').trim().toLowerCase();
  if(accRaw.includes('income')) return 'income';
  if(accRaw.includes('expense')) return 'expense';
  const amt = parseFloat(findCol(raw,['amount','Amount']));
  return (amt<0) ? 'expense' : 'income';
}
function monefyDate(v){
  // Native Excel date cells in this export were auto-recognized using MM/DD
  // ordering, while the plain-text dates elsewhere in the same file are
  // DD/MM (Monefy's real default, handled below). Swap month/day back for
  // native date cells wherever that's unambiguous (day<=12), so both
  // agree — otherwise entries like Nov/Oct/Dec 2026 show up as "future"
  // when they're really March/January/June 2026 in the file's real format.
  if(v instanceof Date && !isNaN(v)){
    let mo = v.getUTCMonth()+1, day = v.getUTCDate(), yr = v.getUTCFullYear();
    if(day<=12){ const t=mo; mo=day; day=t; }
    return `${yr}-${String(mo).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }
  if(typeof v === 'number'){ // Excel serial date
    const d = new Date(Math.round((v-25569)*86400*1000));
    return isNaN(d) ? todayStr() : d.toISOString().slice(0,10);
  }
  const s = String(v||'').trim();
  if(!s) return todayStr();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); // yyyy-mm-dd
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); // dd/mm/yyyy (Monefy default)
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  const d = new Date(s);
  return isNaN(d) ? todayStr() : d.toISOString().slice(0,10);
}
// Adds a category to income/expense custom categories if it's not already
// known, without spamming a toast per row during a bulk import.
function ensureCategoryExists(type, name){
  if(!name) return;
  if(getCats(type).some(c=>c.toLowerCase()===name.toLowerCase())) return;
  DB.customCategories[type].push(name);
  if(!DB.categoryIcons[name]) DB.categoryIcons[name] = "🔹";
}
function monefyRowToTx(raw, accountId){
  const amount = Math.abs(parseFloat(findCol(raw,['amount','Amount'])));
  if(!amount || isNaN(amount)) return null;
  const type = monefyRowType(raw);
  let category = String(findCol(raw,['category','Category']) || '').trim();
  if(!category) category = type==='income' ? 'Other Income' : 'Other';
  ensureCategoryExists(type, category);
  const note = String(findCol(raw,['Note','note','Notes']) || '').trim();
  return { type, amount, category, accountId, date: monefyDate(findCol(raw,['date','Date'])), note };
}
function doImportMonefyFile(e){
  const file = e.target.files[0]; if(!file) return;
  const isCsv = /\.csv$/i.test(file.name);
  pendingMonefyFileName = file.name;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      let objects;
      if(window.XLSX){
        const data = new Uint8Array(reader.result);
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        objects = XLSX.utils.sheet_to_json(sheet, {defval:''});
      } else if(isCsv){
        const text = new TextDecoder('utf-8').decode(new Uint8Array(reader.result));
        objects = rowsToObjects(parseCsvText(text));
      } else {
        toast("Excel import needs an internet connection to load the parser. Try a .csv file, or reconnect and retry.");
        e.target.value = ''; return;
      }
      // Keep only rows that look like real transactions (has a parseable amount).
      const hasAmount = objects.filter(raw => {
        const amt = parseFloat(findCol(raw,['amount','Amount']));
        return !isNaN(amt) && amt !== 0;
      });
      // Some exports (e.g. Monefy's recurring/projected entries) include
      // rows dated after today — those haven't happened yet, so they're
      // excluded from import entirely rather than showing up as "recent"
      // activity or inflating this month's totals.
      const todayKey = todayStr();
      const valid = hasAmount.filter(raw => monefyDate(findCol(raw,['date','Date'])) <= todayKey);
      const futureCount = hasAmount.length - valid.length;
      if(!valid.length){
        toast(futureCount ? `All ${futureCount} row(s) were future-dated — nothing to import` : "No valid transaction rows found — check the file has date, account, category, amount columns");
        e.target.value=''; return;
      }
      pendingMonefyRows = valid;
      pendingMonefyFutureCount = futureCount;
      openMonefyImportSheet(valid.length);
    }catch(err){
      toast("Could not read that file — check it's a valid CSV/Excel export");
    }
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}
function openMonefyImportSheet(count){
  openSheet(`
    <h3>Import Transactions</h3>
    <p style="font-size:0.85rem;color:var(--muted,#888);margin-top:-4px;">Found <b>${count}</b> transaction${count===1?'':'s'} in <b>${escapeHtml(pendingMonefyFileName)}</b>${pendingMonefyFutureCount?` <span style="color:var(--rust)">(${pendingMonefyFutureCount} future-dated row${pendingMonefyFutureCount===1?'':'s'} excluded)</span>`:''}. Choose which account to add them to — amounts will update that account's balance.</p>
    <div class="field"><label>Import Into Account</label><select id="monefyAccount">${accOptions()}</select></div>
    <button class="btn" id="monefyImportBtn">Import ${count} Transaction${count===1?'':'s'}</button>
    <button class="btn secondary" id="monefyCancelBtn" style="margin-top:8px;">Cancel</button>
  `);
  document.getElementById('monefyImportBtn').onclick = confirmMonefyImport;
  document.getElementById('monefyCancelBtn').onclick = ()=>{ pendingMonefyRows = null; pendingMonefyFutureCount = 0; closeSheet(); };
}
// Like applyTransaction, but skips the per-row localStorage persist() so
// importing thousands of rows doesn't re-save the whole DB thousands of times.
function applyTransactionBulk(tx){
  tx.id = uid();
  tx.date = tx.date || todayStr();
  DB.transactions.push(tx);
  const acc = DB.accounts.find(a=>a.id===tx.accountId);
  if(tx.type==="income" && acc) acc.balance += Number(tx.amount);
  if(tx.type==="expense" && acc) acc.balance -= Number(tx.amount);
}
function confirmMonefyImport(){
  if(!pendingMonefyRows || !pendingMonefyRows.length){ closeSheet(); return; }
  const accountId = document.getElementById('monefyAccount').value;
  if(!accountId){ toast("Pick an account first"); return; }
  let added = 0, skipped = 0;
  pendingMonefyRows.forEach(raw=>{
    const tx = monefyRowToTx(raw, accountId);
    if(tx){ applyTransactionBulk(tx); added++; } else skipped++;
  });
  const futureCount = pendingMonefyFutureCount;
  pendingMonefyRows = null;
  pendingMonefyFutureCount = 0;
  closeSheet();
  if(added){
    DB.transactions.sort((a,b)=> b.date.localeCompare(a.date)); // keep newest-first display order
    persist();
    render();
  }
  const skipParts = [skipped? skipped+' skipped':'', futureCount? futureCount+' future-dated excluded':''].filter(Boolean).join(', ');
  toast(added? `Imported ${added} transaction${added===1?'':'s'}${skipParts? ', '+skipParts:''}` : 'No valid rows found');
}

/* ===================== CLOUD BACKUP (generic webhook: Firebase / Apps Script / JSONBin) ===================== */
let cloudBackupTimer = null;
let cloudBusy = false;

// Apps Script web apps only implement doGet/doPost — no doPut — and have no
// OPTIONS handler, so any request that triggers a CORS "preflight" (PUT, a
// custom header, or a non-simple Content-Type like application/json) gets
// silently blocked by the browser before it ever reaches the script.
function cloudIsAppsScript(url){ return /script\.google(usercontent)?\.com/.test(url); }

function cloudHeaders(url){
  if(cloudIsAppsScript(url)){
    // text/plain keeps this a CORS "simple request" (no preflight); the script
    // still receives valid JSON text in e.postData.contents.
    return { "Content-Type": "text/plain;charset=utf-8" };
  }
  const h = { "Content-Type": "application/json" };
  const key = (DB.settings.cloudApiKey||"").trim();
  if(key) h["X-Master-Key"] = key;
  return h;
}

async function cloudBackupNow(silent){
  const url = (DB.settings.cloudBackupUrl||"").trim();
  if(!url){ if(!silent) toast("Paste your Cloud Backup URL first"); return; }
  if(cloudBusy) return;
  cloudBusy = true;
  try{
    const res = await fetch(url, {
      method: cloudIsAppsScript(url) ? "POST" : "PUT",
      headers: cloudHeaders(url),
      body: JSON.stringify(DB, null, 2)
    });
    if(!res.ok) throw new Error("cloud-upload-failed");
    DB.settings.cloudLastBackup = new Date().toISOString();
    persistRaw();
    if(!silent){ toast("Backed up to cloud"); render(); }
    else if(document.getElementById('cloudCard')){ document.getElementById('content').innerHTML = viewMore(); afterRender(); }
  }catch(err){
    if(!silent) toast("Cloud backup failed — check the URL/key");
  }finally{ cloudBusy = false; }
}

async function cloudRestoreNow(){
  const url = (DB.settings.cloudBackupUrl||"").trim();
  if(!url){ toast("Paste your Cloud Backup URL first"); return; }
  try{
    const res = await fetch(url, { headers: cloudIsAppsScript(url) ? {} : cloudHeaders(url) });
    if(!res.ok) throw new Error("cloud-download-failed");
    let data = await res.json();
    if(data && data.record && !data.accounts) data = data.record; // JSONBin v3 wraps payload in "record"
    if(!data.accounts || !data.transactions){ toast("Cloud backup looks invalid"); return; }
    if(!confirm("This will overwrite the data on this device with the cloud backup. Continue?")) return;
    const keepSettings = Object.assign({}, DB.settings, data.settings||{});
    DB = Object.assign({accounts:[],transactions:[],budgets:[],goals:[],recurring:[],investments:[],customCategories:{income:[],expense:[],investment:[]},categoryIcons:{}}, data, {settings:keepSettings});
    persist(); render(); toast("Restored from cloud");
  }catch(err){ toast("Restore from cloud failed"); }
}

// Debounced auto-backup, fired a few seconds after any local data change so rapid edits collapse into one upload.
function cloudMaybeAutoBackup(){
  if(!DB.settings.cloudAutoBackup || !(DB.settings.cloudBackupUrl||"").trim()) return;
  clearTimeout(cloudBackupTimer);
  cloudBackupTimer = setTimeout(()=> cloudBackupNow(true), 4000);
}
// persist() calls this on every save; persistRaw() is the same underlying write without re-triggering it (used by the backup routine itself).
function persistRaw(){ DB_KEYS.forEach(k=>save(k,DB[k])); }

/* ===================== PIN LOCK ===================== */
let pinBuffer = "";
function buildPinPad(){
  const pad = document.getElementById('pinPad');
  pad.innerHTML = "";
  ["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(k=>{
    const btn = document.createElement('button');
    btn.textContent = k;
    if(k===""){ btn.style.visibility="hidden"; }
    btn.onclick = ()=>{
      if(k==="⌫"){ pinBuffer = pinBuffer.slice(0,-1); }
      else if(k!==""){ pinBuffer += k; }
      updateDots();
      if(pinBuffer.length===4){
        if(pinBuffer===DB.settings.pin){
          document.getElementById('lockScreen').style.display='none';
          sessionStorage.setItem('mhs_unlocked','1');
        } else {
          document.getElementById('lockErr').textContent = "Incorrect PIN";
          setTimeout(()=>{ pinBuffer=""; updateDots(); document.getElementById('lockErr').textContent=""; }, 500);
        }
      }
    };
    pad.appendChild(btn);
  });
}
function updateDots(){
  document.getElementById('pinDots').innerHTML = [0,1,2,3].map(i=>`<div class="d ${i<pinBuffer.length?'f':''}"></div>`).join("");
}
function maybeShowLock(){
  if(DB.settings.pin && sessionStorage.getItem('mhs_unlocked')!=='1'){
    document.getElementById('lockScreen').style.display='flex';
    buildPinPad(); updateDots();
  }
}

processRecurring();
DB.investments.forEach(normalizeInvest);
persist();
maybeShowLock();
render();
checkMaturityReminders();
render(); // re-render once so the bell badge / Upcoming Maturities reflect any reminders just fired
