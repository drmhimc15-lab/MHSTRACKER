      const m=IMP.acctMap[k];
      if(m.mode==='existing' && byId[m.id]) accId[k]=m.id;
      else { const id=uid(); const a={id,name:impTrim(m.name||k),type:m.type||'bank',balance:0,opening:0}; accounts.push(a); byId[id]=a; before[id]=0; accId[k]=id; createdAcc.push(id); }
    });
    // categories
    const cc={income:DB.customCategories.income.slice(),expense:DB.customCategories.expense.slice(),investment:(DB.customCategories.investment||[]).slice()};
    const icons=Object.assign({},DB.categoryIcons); const createdCats=[];
    const hasCat=(type,name)=>CATS[type].filter(c=>!(DB.settings.hiddenCats[type]||[]).includes(c)).concat(cc[type]).some(c=>c.toLowerCase()===name.toLowerCase());
    // build transactions in chunks
    const touched=new Set(); const out=[]; let imported=0, skippedRows=0; const skippedItems=[];
    for(let i=0;i<final.length;i++){
      if(R.cancel){ R.running=false; R.result={cancelled:true}; impRender(); return; }
      const t=final[i];
      if(skip.has(t._i)){ skippedRows+=t.sr.length; skippedItems.push(t); continue; }
      const tx={ id:batch+'.'+(i+1).toString(36), type:t.type, amount:t.amount, accountId:accId[impNorm(t._acc)], date:t.date, note:t.note, imp:batch, sr:t.sr, oa:t.oa };
      if(t._to) tx.toAccountId=accId[impNorm(t._to)];
      if(t.category!==undefined){ tx.category=t.category; if(t.type==='income'||t.type==='expense'){ if(!hasCat(t.type,t.category)){ cc[t.type].push(t.category); if(!icons[t.category]) icons[t.category]=impGuessCatIcon(t.category,t.type); createdCats.push({type:t.type,name:t.category}); } } }
      if(t.dir) tx.dir=t.dir; if(t.oc) tx.oc=t.oc;
      if(!tx.accountId || (t._to && !tx.toAccountId)) throw new Error('Account mapping missing for row '+t.sr[0]);
      impEffects(tx).forEach(([id,d])=>{ byId[id].balance += d; touched.add(id); });
      out.push(tx); imported+=t.sr.length;
      if(i%800===0){ setP(5+Math.round(i/final.length*60),'Preparing transactions '+(i+1)+' / '+final.length); await tick(); }
    }
    if(R.cancel){ R.running=false; R.result={cancelled:true}; impRender(); return; }
    if(!out.length) throw new Error('Nothing to import — every row was skipped or invalid.');
    ['income','expense'].forEach(ty=>{   // newly created categories: natural order (1., 2., 3. … 99.)
      const nn=createdCats.filter(c=>c.type===ty).map(c=>c.name);
      if(nn.length>1){ const set=new Set(nn); cc[ty]=cc[ty].filter(x=>!set.has(x)).concat(nn.slice().sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}))); }
    });
    touched.forEach(id=>{ byId[id].balance=Math.round(byId[id].balance*100)/100; });
    setP(70,'Saving to the database…'); await tick();
    // ----- COMMIT POINT -----
    const P=IMP.plan, S=P.stats;
    const merged=old.transactions.concat(out.slice().reverse());           // newest-first within a day
    merged.sort((a,b)=>b.date.localeCompare(a.date));
    const hist={ id:batch, file:IMP.file.name, size:IMP.file.size, at:startedAt, status:'completed',
      totalRows:S.total, importedRows:imported, txCreated:out.length, skippedRows, dupRows:S.dupRows, dupGroups:S.dupGroups, invalidRows:S.invalid,
      income:out.filter(t=>t.type==='income').length, expense:out.filter(t=>t.type==='expense').length,
      transfers:out.filter(t=>t.type==='transfer').length, openings:out.filter(t=>t.type==='opening').length,
      dupMode:IMP.dupMode, mergeTransfers:IMP.mergeTransfers, openingMode:IMP.openingMode,
      accountsCreated:createdAcc, categoriesCreated:createdCats,
      dMin:out.reduce((m,t)=>!m||t.date<m?t.date:m,''), dMax:out.reduce((m,t)=>!m||t.date>m?t.date:m,''),
      invalid:P.invalid.slice(0,200).map(r=>({n:r.n,why:r.errors.join('; '),raw:r.raw.join(' | ').slice(0,160)})) };
    DB.accounts=accounts; DB.transactions=merged; DB.customCategories=cc; DB.categoryIcons=icons;
    DB.importHistory=impHist().concat([hist]);
    try{ DB_KEYS.forEach(k=>save(k,DB[k])); }
    catch(e){ throw new Error('Could not save to device storage ('+(e&&e.name==='QuotaExceededError'?'storage is full':e.message)+').'); }
    // ----- VERIFY -----
    setP(88,'Verifying…'); await tick();
    const checks=impReconcile(P,final,skip,batch,before,imported,skippedRows);
    hist.checks=checks.map(c=>({name:c.name,ok:c.ok,detail:c.detail}));
    if(checks.some(c=>!c.ok)) throw new Error('Verification failed: '+checks.filter(c=>!c.ok).map(c=>c.name+' ('+c.detail+')').join('; '));
    save('importHistory',DB.importHistory);
    if(typeof cloudMaybeAutoBackup==='function') cloudMaybeAutoBackup();
    setP(100,'Done');
    R.running=false; R.result={ ok:true, hist, checks };
    render(); impRender();
  }catch(err){
    // ----- ROLLBACK -----
    DB.accounts=old.accounts; DB.transactions=old.transactions; DB.customCategories=old.customCategories; DB.categoryIcons=old.categoryIcons; DB.importHistory=old.importHistory;
    DB_KEYS.forEach(k=>{ try{ if(snap[k]===null) localStorage.removeItem('mhs_'+k); else localStorage.setItem('mhs_'+k,snap[k]); }catch(e){} });
    R.running=false; R.result={ failed:true, error:String(err&&err.message||err) };
    try{ impHist().push({id:batch,file:IMP.file.name,size:IMP.file.size,at:startedAt,status:'failed (rolled back)',totalRows:IMP.plan.stats.total,importedRows:0,txCreated:0,skippedRows:0,dupRows:IMP.plan.stats.dupRows,invalidRows:IMP.plan.stats.invalid,error:R.result.error}); save('importHistory',DB.importHistory); }catch(e){}
    render(); impRender();
  }
}
function impReconcile(P,final,skip,batch,before,imported,skippedRows){
  const checks=[]; const add=(name,ok,detail)=>checks.push({name,ok:!!ok,detail});
  const mine=DB.transactions.filter(t=>t.imp===batch);
  const exp=final.filter(t=>!skip.has(t._i));
  add('Source rows accounted for (imported + skipped duplicates + invalid = total)', imported+skippedRows+P.stats.invalid===P.stats.total, imported+' + '+skippedRows+' + '+P.stats.invalid+' = '+(imported+skippedRows+P.stats.invalid)+' of '+P.stats.total);
  add('Imported transactions match the plan', mine.length===exp.length, mine.length+' vs '+exp.length);
  const covered=new Set(); mine.forEach(t=>t.sr.forEach(n=>covered.add(n)));
  add('Every imported source row present exactly once', covered.size===imported && mine.reduce((s,t)=>s+t.sr.length,0)===imported, covered.size+' distinct / '+imported);
  // signed totals over imported source rows
  const impRows=new Set(); exp.forEach(t=>t.sr.forEach(n=>impRows.add(n)));
  let sp=0,sn=0; P.valid.forEach(r=>{ if(impRows.has(r.n)){ if(r.amount>0) sp+=impCents(r.amount); else sn+=impCents(r.amount); } });
  let dp=0,dn=0; mine.forEach(t=>impLegs(t).forEach(l=>{ if(l.v>0) dp+=impCents(l.v); else dn+=impCents(l.v); }));
  add('Total positive amounts (source = database)', sp===dp, impMoney(sp/100)+' vs '+impMoney(dp/100));
  add('Total negative amounts (source = database)', sn===dn, impMoney(sn/100)+' vs '+impMoney(dn/100));
  add('Source income rows', true, P.stats.pos+' rows (+'+impMoney(P.stats.posSum)+')');
  add('Source expense rows', true, P.stats.neg+' rows ('+impMoney(P.stats.negSum)+')');
  // per-account balance change
  const expDelta={};
  mine.forEach(t=>impEffects(t).forEach(([id,d])=>{ expDelta[id]=(expDelta[id]||0)+impCents(d); }));
  const srcDelta={};
  P.valid.forEach(r=>{ if(!impRows.has(r.n)) return; const id=impResolveAccId(r.account); srcDelta[id]=(srcDelta[id]||0)+impCents(r.amount); });
  // converted single-leg transfers also credit/debit the chosen counter-account
  exp.forEach(t=>{ if(t._item.kind==='transfer-single'){ const other = t._item.signed<0 ? impResolveAccId(t._to) : impResolveAccId(t._acc); srcDelta[other]=(srcDelta[other]||0)+(t._item.signed<0? impCents(t.amount): -impCents(t.amount)); } });
  let balOk=true, balBad='';
  new Set(Object.keys(srcDelta).concat(Object.keys(expDelta))).forEach(id=>{
    const a=DB.accounts.find(x=>x.id===id); const actual=a?impCents(a.balance)-impCents(before[id]||0):NaN;
    if(Math.abs(actual-(srcDelta[id]||0))>1){ balOk=false; balBad+=(a?a.name:id)+': '+actual/100+' vs '+(srcDelta[id]||0)/100+'; '; }
  });
  add('Per-account balance change equals source totals (incl. counter-legs of converted transfers)', balOk, balOk?Object.keys(srcDelta).length+' accounts':balBad);
  add('Earliest / latest imported date', true, impDMY(mine.reduce((m,t)=>!m||t.date<m?t.date:m,''))+' → '+impDMY(mine.reduce((m,t)=>!m||t.date>m?t.date:m,'')));
  { const srcCats=new Set(P.valid.map(r=>r.category)); const ord=new Set(final.filter(t=>t._item.kind==='ordinary'||t._item.kind==='special-asis').map(t=>t._item.srcCat));
    const sp=[...srcCats].filter(c=>!ord.has(c)).length;
    add('Source category labels preserved', true, srcCats.size+' source labels = '+ord.size+' imported as categories + '+sp+' To/From/Initial-balance labels kept on transfer/opening records'); }
  add('Accounts used', true, new Set(mine.flatMap(t=>[t.accountId,t.toAccountId].filter(Boolean))).size+' accounts');
  add('Distinct categories on imported income/expense', true, new Set(mine.filter(t=>t.type==='income'||t.type==='expense').map(t=>t.category)).size+' categories');
  const ids=new Set(DB.transactions.map(t=>t.id));
  add('Unique transaction IDs (no collisions)', ids.size===DB.transactions.length, ids.size+' of '+DB.transactions.length);
  add('Every transaction points to an existing account', DB.transactions.every(t=>DB.accounts.some(a=>a.id===t.accountId)&&(!t.toAccountId||DB.accounts.some(a=>a.id===t.toAccountId))), 'ok');
  let stored=0; try{ stored=JSON.parse(localStorage.getItem('mhs_transactions')||'[]').length; }catch(e){}
  add('Saved database re-read from storage matches memory', stored===DB.transactions.length, stored+' vs '+DB.transactions.length);
  return checks;
}
function impResolveAccId(name){ const m=IMP.acctMap[impNorm(name)]; if(!m) return null; if(m.mode==='existing') return m.id; const a=DB.accounts.find(x=>impNorm(x.name)===impNorm(m.name||name)); return a?a.id:null; }
/* ---------- rollback of a finished import (explicit, separate from deleting its history record) ---------- */
function impRollbackBatch(id){
  const h=impHist().find(x=>x.id===id); if(!h) return;
  if(!confirm('Roll back this import? Its '+(h.txCreated||0)+' transactions are removed and account balances are restored. Transactions you added yourself are untouched.')) return;
  const snap={}; DB_KEYS.forEach(k=>{ snap[k]=localStorage.getItem('mhs_'+k); });
  const old={accounts:DB.accounts,transactions:DB.transactions,customCategories:DB.customCategories,categoryIcons:DB.categoryIcons,importHistory:DB.importHistory};
  try{
    const accounts=DB.accounts.map(a=>Object.assign({},a)); const byId={}; accounts.forEach(a=>byId[a.id]=a);
    const mine=DB.transactions.filter(t=>t.imp===id);
    mine.forEach(t=>impEffects(t).forEach(([aid,d])=>{ if(byId[aid]) byId[aid].balance=Math.round((byId[aid].balance-d)*100)/100; }));
    const rest=DB.transactions.filter(t=>t.imp!==id);
    const used=new Set(); rest.forEach(t=>{ used.add(t.accountId); if(t.toAccountId) used.add(t.toAccountId); });
    DB.accounts=accounts.filter(a=>!(h.accountsCreated||[]).includes(a.id) || used.has(a.id) || Math.abs(a.balance)>0.005);
    DB.transactions=rest;
    const cc={income:DB.customCategories.income.slice(),expense:DB.customCategories.expense.slice(),investment:(DB.customCategories.investment||[]).slice()};
    (h.categoriesCreated||[]).forEach(c=>{ if(!rest.some(t=>t.type===c.type&&t.category===c.name)){ cc[c.type]=cc[c.type].filter(x=>x!==c.name); } });
    DB.customCategories=cc;
    const icons=Object.assign({},DB.categoryIcons);
    (h.categoriesCreated||[]).forEach(c=>{ if(!cc[c.type].includes(c.name) && !DB.transactions.some(t=>t.category===c.name)) delete icons[c.name]; });
    DB.categoryIcons=icons;
    h.status='rolled back'; h.rolledBackAt=new Date().toISOString();
    DB_KEYS.forEach(k=>save(k,DB[k]));
    toast('Import rolled back'); render(); impOpenHistory();
  }catch(e){
    DB.accounts=old.accounts; DB.transactions=old.transactions; DB.customCategories=old.customCategories; DB.categoryIcons=old.categoryIcons; DB.importHistory=old.importHistory;
    DB_KEYS.forEach(k=>{ try{ if(snap[k]===null) localStorage.removeItem('mhs_'+k); else localStorage.setItem('mhs_'+k,snap[k]); }catch(_){} });
    toast('Rollback failed — nothing was changed');
  }
}

    ${(h.invalid||[]).length?`<div class="section-title">Invalid rows (${h.invalidRows}${h.invalid.length<h.invalidRows?', first '+h.invalid.length:''})</div>${h.invalid.map(r=>`<div style="font-size:.74rem;padding:3px 0;">Row ${r.n+1}: ${escapeHtml(r.why)}<div style="color:var(--ink-soft);">${escapeHtml(r.raw)}</div></div>`).join('')}`:''}

}

function impBind(s){

  const on=(sel,ev,fn)=>document.querySelectorAll(sel).forEach(e=>e[ev]=fn);
  if(s===1){
    const inp=$('impFile'); if(inp) inp.onchange=e=>{ const file=e.target.files[0]; if(!file) return;
      const rd=new FileReader();
      rd.onerror=()=>{ IMP.error='This file could not be opened. Check it is accessible and try again.'; impRender(); };
      rd.onload=()=>{ try{ IMP.buf=rd.result; IMP.file=impLoadBuffer(file.name,file.size,rd.result); IMP.map=impAutoMap(IMP.file.headers); IMP.plan=null; IMP.error=''; }catch(err){ IMP.file=null; IMP.error=err.message; } impRender(); };
      rd.readAsArrayBuffer(file); };
    const sh=$('impSheet'); if(sh) sh.onchange=()=>{ try{ IMP.file=impLoadBuffer(IMP.file.name,IMP.file.size,IMP.buf,sh.value); IMP.map=impAutoMap(IMP.file.headers); IMP.plan=null; }catch(err){ IMP.error=err.message; } impRender(); };
    const c=$('impCancel1'); if(c) c.onclick=impClose;
    const qk=$('impQuick'); if(qk) qk.onclick=impQuick;
  }
  if(s===2){
    on('[data-impmap]','onchange',function(){ IMP.map[this.dataset.impmap]=parseInt(this.value,10); IMP.plan=null; const n=$('impNext'); if(n) n.disabled=!impCanNext(); });
    $('impDateFmt').onchange=function(){ IMP.dateFmt=this.value; IMP.plan=null; };
    $('impCur').oninput=function(){ IMP.defCur=this.value.trim().toUpperCase()||'BDT'; IMP.plan=null; };
  }
  if(s===3){
    const m=$('impMerge'); if(m) m.onchange=()=>{ IMP.mergeTransfers=m.checked; impKeepScroll(()=>{ IMP.plan=impBuildPlan(); impRender(); }); };
    on('[name=impOpen]','onchange',function(){ IMP.openingMode=this.value; impKeepScroll(()=>{ IMP.plan=impBuildPlan(); impRender(); }); });
    on('[data-impunp]','onchange',function(){ IMP.unpaired[this.dataset.impunp]=this.value; impKeepScroll(()=>{ IMP.plan=impBuildPlan(); impRender(); }); });

  if(s===4){
    on('[data-impacc]','onchange',function(){ const k=this.dataset.impacc; const cur=IMP.acctMap[k];

      impKeepScroll(impRender); });
    on('[data-impacctype]','onchange',function(){ IMP.acctMap[this.dataset.impacctype].type=this.value; });
  }
  if(s===5){
    on('[data-impcat]','oninput',function(){ IMP.catMap[this.dataset.impcat]=this.value; });
    on('[data-impcat]','onchange',function(){ impKeepScroll(impRender); });
    const q=$('impCatQ'); if(q) q.onchange=()=>{ IMP.catQ=q.value; impRender(); };
  }
  if(s===6){
    on('[data-impflt]','onclick',function(){ IMP.pvFilter=this.dataset.impflt; IMP.pvPage=0; impKeepScroll(impRender); });
    const q=$('impPvQ'); if(q) q.onchange=()=>{ IMP.pvQ=q.value; IMP.pvPage=0; impRender(); };
    $('impPvPrev').onclick=()=>{ if(IMP.pvPage>0){ IMP.pvPage--; impKeepScroll(impRender); } };
    $('impPvNext').onclick=()=>{ IMP.pvPage++; impKeepScroll(impRender); };
  }
  if(s===7){
    on('[name=impDup]','onchange',function(){ IMP.dupMode=this.value; impKeepScroll(impRender); });
    on('[data-impskip]','onchange',function(){ IMP.dupSkip[this.dataset.impskip]=this.checked; });
    const m=$('impMoreDup'); if(m) m.onclick=()=>{ IMP.dupReviewShown+=200; impKeepScroll(impRender); };
  }

    const st=$('impStart'); if(st) st.onclick=()=>impRun();

/* ===================== CLOUD BACKUP (generic webhook: Firebase / Apps Script / JSONBin) ===================== */
let cloudBackupTimer = null;
let cloudBusy = false;

// Apps Script web apps only implement doGet/doPost — no doPut — and have no
// OPTIONS handler, so any request that triggers a CORS "preflight" (PUT, a
// custom header, or a non-simple Content-Type like application/json) gets
// silently blocked by the browser before it ever reaches the script.
function cloudIsAppsScript(url){ return /script\.google(usercontent)?\.com/.test(url); }

function cloudHeaders(url){
  if(cloudIsAppsScript(url)){
    // text/plain keeps this a CORS "simple request" (no preflight); the script
    // still receives valid JSON text in e.postData.contents.
    return { "Content-Type": "text/plain;charset=utf-8" };
  }
  const h = { "Content-Type": "application/json" };
  const key = (DB.settings.cloudApiKey||"").trim();
  if(key) h["X-Master-Key"] = key;
  return h;
}

async function cloudBackupNow(silent){
  const url = (DB.settings.cloudBackupUrl||"").trim();
  if(!url){ if(!silent) toast("Paste your Cloud Backup URL first"); return; }
  if(cloudBusy) return;
  cloudBusy = true;
  try{
    const res = await fetch(url, {
      method: cloudIsAppsScript(url) ? "POST" : "PUT",
      headers: cloudHeaders(url),
      body: JSON.stringify(DB, null, 2)
    });
    if(!res.ok) throw new Error("cloud-upload-failed");
    DB.settings.cloudLastBackup = new Date().toISOString();
    persistRaw();
    if(!silent){ toast("Backed up to cloud"); render(); }
    else if(document.getElementById('cloudCard')){ document.getElementById('content').innerHTML = viewMore(); afterRender(); }
  }catch(err){
    if(!silent) toast("Cloud backup failed — check the URL/key");
  }finally{ cloudBusy = false; }
}

async function cloudRestoreNow(){
  const url = (DB.settings.cloudBackupUrl||"").trim();
  if(!url){ toast("Paste your Cloud Backup URL first"); return; }
  try{
    const res = await fetch(url, { headers: cloudIsAppsScript(url) ? {} : cloudHeaders(url) });
    if(!res.ok) throw new Error("cloud-download-failed");
    let data = await res.json();
    if(data && data.record && !data.accounts) data = data.record; // JSONBin v3 wraps payload in "record"
    if(!data.accounts || !data.transactions){ toast("Cloud backup looks invalid"); return; }
    if(!confirm("This will overwrite the data on this device with the cloud backup. Continue?")) return;
    const keepSettings = Object.assign({}, DB.settings, data.settings||{});
    DB = Object.assign({accounts:[],transactions:[],budgets:[],ccEmis:[],ccRewards:[],recurring:[],investments:[],customCategories:{income:[],expense:[],investment:[]},categoryIcons:{}}, data, {settings:keepSettings});
    persist(); render(); toast("Restored from cloud");
  }catch(err){ toast("Restore from cloud failed"); }
}

// Debounced auto-backup, fired a few seconds after any local data change so rapid edits collapse into one upload.
function cloudMaybeAutoBackup(){
  if(!DB.settings.cloudAutoBackup || !(DB.settings.cloudBackupUrl||"").trim()) return;
  clearTimeout(cloudBackupTimer);
  cloudBackupTimer = setTimeout(()=> cloudBackupNow(true), 4000);
}

erit;\n}\n.field input:focus,.field select:focus{outline:none;border-color:var(--primary);}\n.field input[type=\"number\"]:focus{outline:none;}\n.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}\n.form-actions{display:flex;gap:8px;margin-top:4px;}\n\n/* list items */\n.list-item{background:var(--card);border-radius:12px;padding:12px;margin-bottom:9px;border:1px solid var(--border);}\n.li-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}\n.li-title{font-size:13.5px;font-weight:700;}\n.li-sub{font-size:11px;color:var(--muted);margin-top:2px;}\n.li-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}\n.tag{font-size:10px;background:var(--primary-light);color:var(--primary-dark);padding:3px 8px;border-radius:20px;font-weight:600;}\n.tag.low{background:#FDECEC;color:var(--red);}\n.tag.warn{background:#FFF3E0;color:#B9770E;}\n.li-right{text-align:right;}\n.li-num{font-size:14px;font-weight:800;color:var(--primary-dark);}\n.li-actions{display:flex;gap:6px;margin-top:8px;}\n.li-actions button{flex:1;}\n\n.searchbar{display:flex;gap:8px;margin-bottom:12px;}\n.searchbar input{flex:1;padding:10px 12px;border-radius:10px;border:1.4px solid var(--border);font-size:13px;background:#fff;}\n.filter-chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}\n.chip{white-space:nowrap;padding:6px 12px;border-radius:20px;font-size:11.5px;background:#fff;border:1.3px solid var(--border);color:var(--muted);font-weight:600;}\n.chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}\n\ntable.simple{width:100%;border-collapse:collapse;font-size:11.5px;}\ntable.simple th{text-align:left;padding:7px 6px;background:var(--primary-light);color:var(--primary-dark);font-size:10.5px;}\ntable.simple td{padding:7px 6px;border-bottom:1px solid var(--border);}\n.tablewrap{overflow-x:auto;background:#fff;border-radius:12px;border:1px solid var(--border);}\n\n.tabbar-scroll{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;}\n.subtab{white-space:nowrap;padding:7px 13px;border-radius:20px;font-size:12px;font-weight:700;background:#fff;border:1.3px solid var(--border);color:var(--muted);}\n.subtab.active{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark);}\n\n/* side nav */\nnav.sidenav{\n  position:fixed;top:0;left:0;bottom:0;width:64px;background:#fff;border-right:1px solid var(--border);\n  display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:4px;\n  padding:14px 4px calc(14px + env(safe-area-inset-bottom));z-index:50;overflow-y:auto;\n  box-shadow:4px 0 14px rgba(0,0,0,.05);\n}\nnav.sidenav button{\n  background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;\n  font-size:9.5px;color:var(--muted);padding:8px 2px;font-family:inherit;font-weight:600;border-radius:10px;\n}\nnav.sidenav button .ic{font-size:18px;}\nnav.sidenav button.active{color:var(--primary-dark);background:var(--primary-light);}\n\n.moremenu{display:none;position:fixed;bottom:0;left:64px;right:0;background:#fff;\n  border-radius:16px 16px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.15);padding:14px 14px calc(14px + env(safe-area-inset-bottom));z-index:60;}\n.moremenu.open{display:block;}\n.moremenu .mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}\n.moremenu .mitem{text-align:center;padding:12px 4px;border-radius:12px;background:var(--bg);font-size:11.5px;font-weight:700;color:var(--text);}\n.moremenu .mitem .ic{font-size:22px;display:block;margin-bottom:4px;}\n.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55;}\n.overlay.open{display:block;}\n\n.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;\n  padding:10px 18px;border-radius:30px;font-size:12.5px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;}\n.toast.show{opacity:1;}\n\n.section-header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}\n.section-header-row .btn-sm{white-space:nowrap;}\n.pnl-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border);font-size:12.5px;}\n.pnl-row:last-child{border-bottom:none;}\n.pnl-row .lab{color:var(--muted);}\n.pnl-row .amt{font-weight:800;}\n.amt.pos{color:var(--primary-dark);}\n.amt.neg{color:var(--red);}\n\n.rank-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}\n.rank-item:last-child{border-bottom:none;}\n.rank-badge{width:20px;height:20px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-right:8px;}\n\n::-webkit-scrollbar{display:none;}\n\n/* Store switcher */\n.store-switch{margin:-14px 14px 0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px;position:relative;z-index:1;}\n.store-switch select{flex:1;background:transparent;border:none;color:#fff;font-size:12.5px;font-weight:700;font-family:inherit;}\n.store-switch select option{color:#1F2937;}\n.store-switch .lbl2{font-size:15px;}\n\n/* WhatsApp button */\n.btn-whatsapp{background:#25D366;color:#fff;}\n.btn-whatsapp:active{background:#1DA851;}\n\n/* Backup card */\n.backup-status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:6px;}\n.dot{width:8px;height:8px;border-radius:50%;background:var(--red);}\n.dot.on{background:#2AA96B;}\n.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;}\n.switch{position:relative;width:42px;height:24px;flex-shrink:0;}\n.switch input{opacity:0;width:0;height:0;}\n.slider-tog{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:24px;transition:.2s;}\n.slider-tog:before{content:\"\";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}\n.switch input:checked + .slider-tog{background:var(--primary);}\n.switch input:checked + .slider-tog:before{transform:translateX(18px);}\n\n/* Exit modal */\n.exit-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;}\n.exit-modal.open{display:flex;}\n.exit-box{background:#fff;border-radius:16px;padding:22px 20px;width:82%;max-width:340px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);}\n.exit-box .eic{font-size:34px;margin-bottom:8px;}\n.exit-box h3{font-size:15.5px;margin-bottom:6px;color:var(--text);}\n.exit-box p{font-size:12px;color:var(--muted);margin-bottom:16px;}\n.exit-box .form-actions{margin-top:0;}\n\n/* Shop sales detail modal */\n.detail-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:210;align-items:flex-end;justify-content:center;}\n.detail-modal.open{display:flex;}\n.detail-box{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.25);}\n.detail-box .db-head{padding:16px 16px 8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}\n.detail-box .db-head h3{font-size:15.5px;color:var(--primary-dark);}\n.detail-box .db-head .dbsub{font-size:11.5px;color:var(--muted);margin-top:2px;}\n.detail-box .dbclose{background:var(--bg);border:none;width:30px;height:30px;min-width:30px;border-radius:50%;font-size:15px;color:var(--text);}\n.detail-box .dbstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 16px;border-bottom:1px solid var(--border);}\n.detail-box .dbst{text-align:center;}\n.detail-box .dbst .v{font-size:12.5px;font-weight:800;color:var(--primary-dark);}\n.detail-box .dbst.due .v{color:var(--red);}\n.detail-box .dbst .l{font-size:9px;color:var(--muted);margin-top:2px;}\n.detail-box .dblist{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(20px + env(safe-area-inset-bottom));flex:1;}\n.dbsale{padding:10px 0;border-bottom:1px dashed var(--border);font-size:12px;}\n.dbsale:last-child{border-bottom:none;}\n.dbsale .r1{display:flex;justify-content:space-between;font-weight:700;color:var(--text);}\n.dbsale .r2{display:flex;justify-content:space-between;color:var(--muted);margin-top:2px;font-size:11px;}\n.dbsale .r3{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}\n.dbsale .r3 .btn{padding:4px 8px;font-size:10.5px;}\n\n/* Payment entry modal */\n.pay-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:220;align-items:center;justify-content:center;}\n.pay-modal.open{display:flex;}\n.pay-box{background:#fff;border-radius:16px;padding:18px;width:86%;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.25);}\n.pay-box h3{font-size:14.5px;margin-bottom:12px;color:var(--primary-dark);}\n.import-row{display:flex;gap:8px;margin-bottom:12px;}\n.import-row .btn{flex:1;}\n.btn-excel{background:#1D6F42;color:#fff;}\n.btn-excel:active{background:#154F2F;}\n\n/* Invoice module */\n.status-badge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;display:inline-block;}\n.status-draft{background:#EDEEF0;color:#5B6470;}\n.status-unpaid{background:#FFF3E0;color:#B9770E;}\n.status-partial{background:#E4F0FF;color:#1D5EBF;}\n.status-paid{background:#E4F3EF;color:#0A5C4F;}\n.status-overdue{background:#FDECEC;color:#C22;}\n.status-cancelled{background:#F2F2F2;color:#999;text-decoration:line-through;}\n.status-quotation{background:#F3E9FF;color:#6B2FB3;}\n.inv-item-row{display:grid;grid-template-columns:1fr 52px 74px 24px;gap:6px;align-items:center;margin-bottom:6px;}\n.inv-item-row select,.inv-item-row input{padding:7px 6px;font-size:12px;border-radius:8px;border:1.4px solid var(--border);background:#FBFDFC;}\n.inv-item-row .rm{background:var(--red);color:#fff;borde "card accent\"><div class=\"icon\">✅<\/div><div class=\"val\" id=\"dMonthNet\">Tk 0<\/div><div class=\"lbl\">This Month Net Profit<\/div><\/div>\n      <\/div>\n\n      <h2 class=\"stitle\">🔔 Smart Alerts<\/h2>\n      <div id=\"dashAlerts\"><\/div>\n\n      <h2 class=\"stitle\">🏭 Top Companies by Product<\/h2>\n      <div class=\"card wide\" id=\"topCompanyCard\"><\/div>\n    <\/section>\n\n    <!-- PRODUCTS -->\n    <section class=\"section\" id=\"sec-products\">\n      <div class=\"section-header-row\">\n        <h2 class=\"stitle\">📦 Product Master<\/h2>\n        <button class=\"btn btn-primary btn-sm\" onclick=\"openAddProductForm()\">+ New Product<\/button>\n      <\/div>\n      <div class=\"form-panel\" id=\"form-product\">\n        <h3 id=\"p-form-title\">Add Product<\/h3>\n        <div class=\"field\"><label>Product Name<\/label><input id=\"p-name\" placeholder=\"e.g. Glow Face Wash\"><\/div>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>Brand/Company<\/label><input id=\"p-brand\" placeholder=\"Brand\"><\/div>\n          <div class=\"field\"><label>Category<\/label><input id=\"p-category\" placeholder=\"Face Wash\"><\/div>\n        <\/div>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>Sub-category<\/label><input id=\"p-subcategory\" placeholder=\"Optional\"><\/div>\n          <div class=\"field\"><label>Size/Volume<\/label><input id=\"p-size\" placeholder=\"100 ml\"><\/div>\n        <\/div>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>SKU/Code<\/label><input id=\"p-sku\" placeholder=\"Optional\"><\/div>\n          <div class=\"field\"><label>Barcode<\/label><input id=\"p-barcode\" placeholder=\"Optional\"><\/div>\n        <\/div>\n        <div class=\"field\"><label>Minimum Stock Level<\/label><input id=\"p-minstock\" type=\"number\" placeholder=\"10\"><\/div>\n        <div class=\"form-actions\">\n          <button class=\"btn btn-primary btn-block\" id=\"p-save-btn\" oncli >\n        <\/div>\n        <div class=\"form-actions\">\n          <button class=\"btn btn-primary btn-block\" id=\"pu-save-btn\" onclick=\"savePurchase()\">Save Purchase<\/button>\n          <button class=\"btn btn-outline\" onclick=\"cancelPurchaseForm()\">Cancel<\/button>\n        <\/div>\n      <\/div>\n      <div id=\"purchaseList\"><\/div>\n    <\/section>\n\n    <!-- INVENTORY -->\n    <section class=\"section\" id=\"sec-inventory\">\n      <h2 class=\"stitle\">🏪 Store / Inventory<\/h2>\n      <div class=\"searchbar\"><input id=\"invSearch\" placeholder=\"Search\" oninput=\"renderInventory()\"><\/div>\n      <div class=\"filter-chips\" id=\"invFilters\"><\/div>\n      <div class=\"tablewrap\">\n        <table class=\"simple\">\n          <thead><tr><th>Product<\/th><th>Batch<\/th><th>Stock<\/th><th>Expiry<\/th><th>TP Value<\/th><th>MRP Value<\/th><\/tr><\/thead>\n          <tbody id=\"inventoryTable\"><\/tbody>\n        <\/table>\n      <\/div>\n    <\/section>\n\n    <!-- SHOPS -->\n    <section class=\"section\" id=\"sec-shops\">\n      <div class=\"section-header-row\">\n        <h2 class=\"stitle\">👨‍💼 Seller / Shop<\/h2>\n        <button class=\"btn btn-primary btn-sm\" onclick=\"openAddShopForm()\">+ New Shop<\/button>\n      <\/div>\n      <div class=\"form-panel\" id=\"form-shop\">\n        <h3 id=\"sh-form-title\">Add Shop<\/h3>\n        <div class=\"field\"><label>Shop/Customer Name<\/label><input id=\"sh-name\" placeholder=\"e.g. ABC Pharmacy\"><\/div>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>Contact Person<\/label><input id=\"sh-contact\"><\/div>\n          <div class=\"field\"><label>Phone (Mobile)<\/label><input id=\"sh-phone\"><\/div>\n        <\/div>\n        <div class=\"field\"><label>Email<\/label><input id=\"sh-email\" type=\"email\" placeholder=\"Optional\"><\/div>\n        <div class=\"field\"><label>Address<\/label><input id=\"sh-address\"><\/div>\n        <div class=\"field\"><label>Opening Balance (Optional, enter if there is a previous due)<\/label><input id=\"sh-opening\" type=\"number\" placeholder=\"0\"><\/div>\n        <div class=\"form-actions\">\n          <button class=\"btn btn-primary btn-block\" id=\"sh-save-btn\" onclick=\"saveShop()\">Save Shop<\/button>\n          <button class=\"btn btn-outline\" onclick=\"cancelShopForm()\">Cancel<\/button>\n        <\/div>\n      <\/div>\n      <div id=\"shopList\"><\/div>\n    <\/section>\n\n    <!-- INVOICES & QUOTATIONS -->\n    <section class=\"section\" id=\"sec-invoices\">\n      <div class=\"section-header-row\">\n        <h2 class=\"stitle\">Invoice and Quotation<\/h2>\n      <\/div>\n      <div class=\"type-toggle\">\n        <button class=\"btn-primary active\" id=\"inv-btn-invoice\" onclick=\"openAddInvoiceForm('invoice')\">+ New Invoice<\/button>\n        <button id=\"inv-btn-quotation\" onclick=\"openAddInvoiceForm('quotation')\">+ New Quotation<\/button>\n      <\/div>\n\n      <div class=\"form-panel\" id=\"form-invoice\">\n        <h3 id=\"inv-form-title\">Create Invoice<\/h3>\n        <div class=\"field\"><label>Customer<\/label>\n          <select id=\"inv-customer\"><\/select>\n        <\/div>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>Date<\/label><input id=\"inv-date\" type=\"date\"><\/div>\n          <div class=\"field\"><label>Due Date<\/label><input id=\"inv-duedate\" type=\"date\"><\/div>\n        <\/div>\n\n        <label style=\"font-size:11.5px;color:var(--muted);font-weight:600;\">Items<\/label>\n        <div id=\"inv-items\"><\/div>\n        <button class=\"btn btn-outline btn-sm btn-block\" onclick=\"addInvoiceItemRow()\">+ Add Item<\/button>\n\n        <div class=\"field-row\" style=\"margin-top:10px;\">\n          <div class=\"field\"><label>Discount %<\/label><input id=\"inv-discpct\" type=\"number\" placeholder=\"0\" oninput=\"calcInvoiceTotals()\"><\/div>\n          <div class=\"field\"><label>VAT/Tax %<\/label><input id=\"inv-vatpct\" type=\"number\" placeholder=\"0\" oninput=\"calcInvoiceTotals()\"><\/div>\n        <\/div>\n        <div class=\"field\"><label>Shipping/Delivery Charge<\/label><input id=\"inv-shipping\" type=\"number\" placeholder=\"0\" oninput=\"calcInvoiceTotals()\"><\/div>\n        <div class=\"field\"><label>Note<\/label><textarea id=\"inv-notes\" rows=\"2\" placeholder=\"e.g. Thank you for your business\"><\/textarea><\/div>\n        <div class=\"field\"><label>Terms &amp; Conditions<\/label><textarea id=\"inv-terms\" rows=\"2\" placeholder=\"e.g. Please pay within 7 days\"><\/textarea><\/div>\n        <div class=\"field\"><label>Status<\/label>\n          <select id=\"inv-manualstatus\">\n            <option value=\"\">Automatic (based on Payment)<\/option>\n            <option value=\"draft\">📝 Draft<\/option>\n            <option value=\"cancelled\">❌ Cancelled<\/option>\n          <\/select>\n        <\/div>\n\n        <div class=\"inv-totals\" id=\"inv-totalsBox\"><\/div>\n\n        <div class=\"form-actions\">\n          <button class=\"btn btn-primary btn-block\" id=\"inv-save-btn\" onclick=\"saveInvoice()\">Save<\/button>\n          <button class=\"btn btn-outline\" onclick=\"cancelInvoiceForm()\">Cancel<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"searchbar\"><input id=\"inv-search\" placeholder=\"Search Customer name, Invoice number or date\" oninput=\"renderInvoices()\"><\/div>\n      <div class=\"filter-chips\" id=\"invStatusChips\"><\/div>\n      <div id=\"invoiceList\"><\/div>\n    <\/section>\n\n    <!-- SALES -->\n    <section class=\"section\" id=\"sec-sales\">\n      <div class=\"section-header-row\">\n        <h2 class=\"stitle\">💰 Sales Entry<\/h2>\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;\"><button class=\"btn btn-outline btn-sm\" onclick=\"openCourierSale()\">🚚 Courier Delivery<\/button><button class=\"btn btn-outline btn-sm\" onclick=\"openQuickSale()\">⚡ Quick Sale (5)<\/button><button class=\"btn btn-primary btn-sm\" onclick=\"openNewSale()\">+ New Sale<\/button><\/div>\n      <\/div>\n      <div class=\"import-row\">\n        <button class=\"btn btn-excel btn-sm\" onclick=\"triggerSalesImport()\">Import from Excel<\/button>\n        <button class=\"btn btn-outline btn-sm\" onclick=\"downloadSalesTemplate()\">Sample Excel<\/button>\n      <\/div>\n      <input type=\"file\" id=\"sl-excel-input\" accept=\".xlsx,.xls,.csv\" style=\"display:none\" onchange=\"importSalesExcel(event)\">\n      <div class=\"form-panel\" id=\"form-qsale\">\n        <h3>⚡ Quick Sale — 5 Products<\/h3>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>Shop<\/label><select id=\"qs-shop\"><\/select><\/div>\n          <div class=\"field\"><label>Date<\/label><input id=\"qs-date\" type=\"date\"><\/div>\n        <\/div>\n        <div id=\"qs-rows\"><\/div>\n        <div class=\"field\" style=\"background:#EFF6F4;border-radius:10px;padding:8px 10px;\">\n          <div style=\"display:flex;justify-content:space-between;font-weight:700;\"><span>Total MRP<\/span><span id=\"qs-total\">Tk 0<\/span><\/div>\n        <\/div>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>Shipping Charge<\/label><input id=\"qs-ship\" type=\"number\" min=\"0\" placeholder=\"0\" oninput=\"qsCalc()\"><\/div>\n          <div class=\"field\"><label>COD Charge<\/label><input id=\"qs-cod\" type=\"number\" min=\"0\" placeholder=\"0\" oninput=\"qsCalc()\"><\/div>\n        <\/div>\n        <div class=\"field\"><label>Discount (Tk)<\/label><input id=\"qs-disc\" type=\"number\" min=\"0\" placeholder=\"0\" oninput=\"qsCalc()\"><\/div>\n        <div class=\"field\" style=\"background:#EFF6F4;border-radius:10px;padding:8px 10px;\">\n          <div style=\"display:flex;justify-content:space-between;font-weight:800;color:var(--primary-dark);\"><span>Grand Total (Payable)<\/span><span id=\"qs-grand\">Tk 0<\/span><\/div>\n        <\/div>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>Total Bank Payment<\/label><input id=\"qs-bank\" type=\"number\" min=\"0\" placeholder=\"0\" oninput=\"qsCalc()\"><\/div>\n          <div class=\"field\"><label>Total bKash Payment<\/label><input id=\"qs-bkash\" type=\"number\" min=\"0\" placeholder=\"0\" oninput=\"qsCalc()\"><\/div>\n        <\/div>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>Net Payment (Bank + bKash)<\/label><input id=\"qs-net\" type=\"number\" readonly style=\"background:#EFF6F4;font-weight:700;\"><\/div>\n          <div class=\"field\"><label>Due<\/label><input id=\"qs-due\" type=\"number\" readonly style=\"background:#EFF6F4;\"><\/div>\n        <\/div>\n        <div class=\"field\"><label>Note (Optional)<\/label><textarea id=\"qs-note\" rows=\"2\"><\/textarea><\/div>\n        <div class=\"form-actions\">\n          <button class=\"btn btn-primary btn-block\" onclick=\"saveQuickSale()\">Save Quick Sale<\/button>\n          <button class=\"btn btn-outline\" onclick=\"cancelQuickSale()\">Cancel<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"form-panel\" id=\"form-courier\">\n        <h3>🚚 Courier Delivery<\/h3>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>Shop / Customer<\/label><select id=\"cr-shop\"><\/select><\/div>\n          <div class=\"field\"><label>Date<\/label><input id=\"cr-date\" type=\"date\"><\/div>\n        <\/div>\n        <div class=\"field\"><label>Product <span id=\"cr-info\" style=\"font-weight:400;\"><\/span><\/label><select id=\"cr-product\" onchange=\"crProductChange()\"><\/select><\/div>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>Product Quantity<\/label><input id=\"cr-qty\" type=\"number\" min=\"1\" value=\"1\" oninput=\"crCalc()\"><\/div>\n          <div class=\"field\"><label>MRP (per unit)<\/label><input id=\"cr-mrp\" type=\"number\" min=\"0\" placeholder=\"0\" oninput=\"crCalc()\"><\/div>\n        <\/div>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>Discount (Tk)<\/label><input id=\"cr-disc\" type=\"number\" min=\"0\" placeholder=\"0\" oninput=\"crCalc()\"><\/div>\n          <div class=\"field\"><label>Advance Payment<\/label><input id=\"cr-adv\" type=\"number\" min=\"0\" placeholder=\"0\" oninput=\"crCalc()\"><\/div>\n        <\/div>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>Due<\/label><input id=\"cr-due\" type=\"number\" readonly style=\"background:#EFF6F4;font-weight:700;\"><\/div>\n          <div class=\"field\"><label>Delivery Charge<\/label><input id=\"cr-del\" type=\"number\" min=\"0\" placeholder=\"0\" oninput=\"crCalc()\"><\/div>\n        <\/div>\n        <div class=\"field\" style=\"background:#EFF6F4;border-radius:10px;padding:8px 10px;\">\n          <div style=\"display:flex;justify-content:space-between;font-weight:700;color:var(--primary-dark);\"><span>Gross Profit<\/span><span id=\"cr-gross\">Tk 0<\/span><\/div>\n        <\/div>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>COD Charge — type<\/label><select id=\"cr-codmode\" onchange=\"crCodModeChange()\"><option value=\"pct\">% (percent)<\/option><option value=\"amt\">Direct (Tk)<\/option><\/select><\/div>\n          <div class=\"field\"><label id=\"cr-codlbl\">COD Charge (%)<\/label><input id=\"cr-codval\" type=\"number\" min=\"0\" step=\"any\" value=\"1\" oninput=\"crCalc()\"><\/div>\n        <\/div>\n        <div class=\"field\" style=\"background:#EFF6F4;border-radius:10px;padding:8px 10px;\">\n          <div style=\"display:flex;justify-content:space-between;\"><span>COD Charge<\/span><b id=\"cr-codamt\">Tk 0<\/b><\/div>\n          <div style=\"display:flex;justify-content:space-between;font-weight:800;color:var(--primary-dark);margin-top:6px;\"><span>Net Profit<\/span><span id=\"cr-net\">Tk 0<\/span><\/div>\n          <div id=\"cr-costnote\" style=\"font-size:10.5px;color:var(--muted);margin-top:6px;\"><\/div>\n        <\/div>\n        <div class=\"field\"><label>Note (Optional)<\/label><textarea id=\"cr-note\" rows=\"2\"><\/textarea><\/div>\n        <div class=\"form-actions\">\n          <button class=\"btn btn-primary btn-block\" onclick=\"saveCourierSale()\">Save Courier Delivery<\/button>\n          <button class=\"btn btn-outline\" onclick=\"toggleForm('form-courier')\">Cancel<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"form-panel\" id=\"form-sale\">\n        <h3>Sale Entry<\/h3>\n        <div class=\"field\"><label>Shop<\/label><select id=\"sl-shop\"><\/select><\/div>\n        <div class=\"field\"><label>Product<\/label><select id=\"sl-product\" onchange=\"loadBatchOptions()\"><\/select><\/div>\n        <div class=\"field\"><label>Batches (enter Quantity for each Batch you want to sell from)<\/label><div id=\"sl-batch-list\"><\/div><\/div>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>Total Quantity<\/label><input id=\"sl-qty\" type=\"number\" placeholder=\"0\" readonly style=\"background:#EFF6F4\"><\/div>\n          <div class=\"field\"><label>Date<\/label><input id=\"sl-date\" type=\"date\"><\/div>\n        <\/div>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>MRP (per unit, all Batches)<\/label><input id=\"sl-mrp\" type=\"number\" oninput=\"onMrpChange()\"><\/div>\n          <div class=\"field\"><label>Discount %<\/label><input id=\"sl-discount\" type=\"number\" placeholder=\"0\" oninput=\"onDiscPctChange()\"><\/div>\n        <\/div>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>Discount Amount (Tk /unit)<\/label><input id=\"sl-discount-amt\" type=\"number\" placeholder=\"0\" oninput=\"onDiscAmtChange()\"><\/div>\n          <div class=\"field\"><label>Final Selling Price/unit<\/label><input id=\"sl-sellprice\" type=\"number\" readonly style=\"background:#EFF6F4\"><\/div>\n        <\/div>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>Transport Cost (Total)<\/label><input id=\"sl-transport\" type=\"number\" placeholder=\"0\" oninput=\"calcSale()\"><\/div>\n          <div class=\"field\"><label>Paid Now<\/label><input id=\"sl-paid\" type=\"number\" placeholder=\"0\"><\/div>\n        <\/div>\n        <div class=\"field\"><label>Note (Optional)<\/label><textarea id=\"sl-note\" rows=\"2\" placeholder=\"e.g. special discount, next payment date etc.\"><\/textarea><\/div>\n        <div class=\"field\" style=\"background:#EFF6F4;border-radius:10px;padding:8px 10px;\">\n          <div style=\"font-size:11.5px;color:var(--muted);\">Estimated Profit: <b id=\"sl-profitPreview\" style=\"color:var(--primary-dark);\">Tk 0<\/b>\n          <span id=\"sl-transport-note\" style=\"display:none;margin-left:8px;color:var(--red);font-size:10.5px;\"><\/span><\/div>\n        <\/div>\n        <div class=\"form-actions\">\n          <button class=\"btn btn-primary btn-block\" onclick=\"saveSale()\">Save Sale<\/button>\n          <button class=\"btn btn-outline\" onclick=\"cancelSaleForm()\">Cancel<\/button>\n        <\/div>\n      <\/div>\n      <div id=\"salesList\"><\/div>\n    <\/section>\n\n    <!-- PROFIT & LOSS -->\n    <section class=\"section\" id=\"sec-pnl\">\n      <h2 class=\"stitle\">📊 Profit & Loss<\/h2>\n      <div class=\"card wide\" style=\"margin-bottom:14px;\">\n        <div class=\"pnl-row\"><span class=\"lab\">Today Sales<\/span><span class=\"amt\" id=\"pnlTodaySales\">Tk 0<\/span><\/div>\n        <div class=\"pnl-row\"><span class=\"lab\">Today Cost<\/span><span class=\"amt\" id=\"pnlTodayCost\">Tk 0<\/span><\/div>\n        <div class=\"pnl-row\"><span class=\"lab\">Today Gross Profit<\/span><span class=\"amt pos\" id=\"pnlTodayProfit\">Tk 0<\/span><\/div>\n        <div class=\"pnl-row\"><span class=\"lab\">Margin<\/span><span class=\"amt\" id=\"pnlTodayMargin\">0%<\/span><\/div>\n      <\/div>\n      <div class=\"card wide\" style=\"margin-bottom:14px;\">\n        <div class=\"pnl-row\"><span class=\"lab\">This Month Sales<\/span><sp tn-outline btn-block\" onclick=\"exportCSV('aging')\">⬇️ Aging Report CSV<\/button>\n      <\/div>\n      <div class=\"tablewrap\">\n        <table class=\"simple\">\n          <thead><tr><th>Customer<\/th><th>0-7<\/th><th>8-30<\/th><th>31-60<\/th><th>61-90<\/th><th>90+<\/th><th>Total Due<\/th><\/tr><\/thead>\n          <tbody id=\"agingTable\"><\/tbody>\n        <\/table>\n      <\/div>\n    <\/section>\n\n    <!-- ANALYTICS -->\n    <section class=\"section\" id=\"sec-analytics\">\n      <h2 class=\"stitle\">📈 Business Analytics<\/h2>\n      <div class=\"tabbar-scroll\" id=\"anTabs\">\n        <button class=\"subtab active\" data-a=\"topsales\" onclick=\"setAnTab('topsales',this)\">Top by Sales<\/button>\n        <button class=\"subtab\" data-a=\"topprofit\" onclick=\"setAnTab('topprofit',this)\">Top by Profit<\/button>\n        <button class=\"subtab\" data-a=\"topshop\" onclick=\"setAnTab('topshop',this)\">Top Shops<\/button>\n        <button class=\"subtab\" data-a=\"topstore\" onclick=\"setAnTab('topstore',this)\">Branch-wise Sales<\/button>\n        <button class=\"subtab\" data-a=\"slow\" onclick=\"setAnTab('slow',this)\">Slow Moving<\/button>\n      <\/div>\n      <div class=\"card wide\" id=\"anCard\"><\/div>\n    <\/section>\n\n    <!-- EXPENSES -->\n    <section class=\"section\" id=\"sec-expenses\">\n      <div class=\"section-header-row\">\n        <h2 class=\"stitle\">🧾 Expense Management<\/h2>\n        <button class=\"btn btn-primary btn-sm\" onclick=\"openAddExpenseForm()\">+ New Expense<\/button>\n      <\/div>\n      <div class=\"form-panel\" id=\"form-expense\">\n        <h3 id=\"ex-form-title\">Add Expense<\/h3>\n        <div class=\"field-row\">\n          <div class=\"field\"><label>Category<\/label>\n            <select id=\"ex-category\">\n              <option value=\"Delivery\">🚚 Delivery<\/option>\n              <option value=\"Salary\">👤 Salary<\/option>\n              <option value=\"Transport\">🚗 Transport<\/option>\n              <opt d\"><label>Mobile Number<\/label><input id=\"biz-phone\" placeholder=\"01XXXXXXXXX\"><\/div>\n          <div class=\"field\"><label>Email<\/label><input id=\"biz-email\" type=\"email\" placeholder=\"shop@example.com\"><\/div>\n        <\/div>\n        <div class=\"field\"><label>Address<\/label><input id=\"biz-address\" placeholder=\"Shop Address\"><\/div>\n        <div class=\"field\">\n          <label>Business Logo<\/label>\n          <div style=\"display:flex;align-items:center;gap:10px;\">\n            <img id=\"biz-logo-preview\" class=\"logo-preview\" src=\"\" style=\"display:none;\">\n            <input id=\"biz-logo\" type=\"file\" accept=\"image/*\" onchange=\"onBizLogoPick(event)\" style=\"flex:1;\">\n          <\/div>\n        <\/div>\n        <div class=\"form-actions\">\n          <button class=\"btn btn-primary btn-block\" onclick=\"saveBusinessProfile()\">Save Info<\/button>\n        <\/div>\n      <\/div>\n\n      <h2 class=\"stitle\">☁️ Automatic Cloud Backup<\/h2>\n      <div class=\"card wide\" style=\"margin-bottom:14px;\">\n        <div class=\"field\"><label>Cloud Backup URL (Firebase / Google Apps Script / JSONBin Webhook)<\/label>\n          <input id=\"cb-url\" placeholder=\"https://yourbackup-endpoint.com/...\">\n        <\/div>\n        <div class=\"field\"><label>API Key / X-Master-Key (for JSONBin, leave blank otherwise)<\/label>\n          <input id=\"cb-key\" placeholder=\"Optional\">\n        <\/div>\n        <div class=\"toggle-row\">\n          <span style=\"font-size:12.5px;font-weight:700;\">Auto Backup on every change<\/span>\n          <label class=\"switch\"><input type=\"checkbox\" id=\"cb-auto\" onchange=\"toggleAutoBackup(this.checked)\"><span class=\"slider-tog\"><\/span><\/label>\n        <\/div>\n        <div class=\"backup-status\"><span class=\"dot\" id=\"cbDot\"><\/span><span id=\"cbStatusText\">No backup taken yet<\/span><\/div>\n        <div class=\"form-actions\" style=\"margin-top:12px;\">\n          <button class=\"btn btn-primary btn-block\" onclick=\"saveBackupSettings()\">Save Settings<\/button>\n        <\/div>\n        <div class=\"form-actions\">\n          <button class=\"btn btn-outline btn-block\" onclick=\"cloudBackupNow()\">Backup Now<\/button>\n          <button class=\"btn btn-outline btn-block\" onclick=\"cloudRestoreNow()\">Restore from Cloud<\/button>\n        <\/div>\n      <\/div>\n      <h2 class=\"stitle\">💾 Local Backup (File)<\/h2>\n      <div class=\"card wide\" style=\"display:flex;flex-direction:column;gap:10px;\">\n        <button class=\"btn btn-outline btn-block\" onclick=\"exportLocalBackup()\">Download Backup File (.json)<\/button>\n        <label class=\"btn btn-outline btn-block\" style=\"cursor:pointer;\">Restore from Backup File\n          <input type=\"file\" accept=\"application/json\" style=\"display:none;\" onchange=\"importLocalBackup(event)\">\n        <\/label>\n      <\/div>\n    <\/section>\n\n  <\/main>\n\n  <button class=\"fab\" onclick=\"quickAdd()\">+<\/button>\n\n  <div class=\"overlay\" id=\"overlay\" onclick=\"closeMore()\"><\/div>\n  <div class=\"moremenu\" id=\"moreMenu\">\n    <div class=\"mgrid\">\n      <div class=\"mitem\" onclick=\"go('suppliers')\"><span class=\"ic\">🏭<\/span>Suppliers<\/div>\n      <div class=\"mitem\" onclick=\"go('reports')\"><span class=\"ic\">📑<\/span>Reports<\/div>\n      <div class=\"mitem\" onclick=\"go('stores')\"><span class=\"ic\">🏬<\/span>Branches<\/div>\n      <div class=\"mitem\" onclick=\"go('settings')\"><span class=\"ic\">☁️<\/span>Cloud Backup<\/div>\n      <div class=\"mitem\" onclick=\"wipeConfirm()\"><span class=\"ic\">🗑️<\/span>Reset Data<\/div>\n    <\/div>\n  <\/div>\n\n  <nav class=\"sidenav\">\n    <button data-tab=\"dashboard\" onclick=\"go('dashboard')\" class=\"active\"><span class=\"ic\">🏠<\/span>Dashboard<\/button>\n    <button data-tab=\"invoices\" onclick=\"go('invoices')\"><span class=\"ic\">🧾<\/span>Invoice<\/button>\n    <button data-tab=\"products\" onclick=\"go(' list\" id=\"sd-list\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"detail-modal\" id=\"genDetailModal\" onclick=\"if(event.target===this) closeGenDetail()\">\n    <div class=\"detail-box\">\n      <div class=\"db-head\">\n        <div>\n          <h3 id=\"gd-name\">—<\/h3>\n          <div class=\"dbsub\" id=\"gd-sub\"><\/div>\n        <\/div>\n        <button class=\"dbclose\" onclick=\"closeGenDetail()\">✕<\/button>\n      <\/div>\n      <div class=\"tabbar-scroll\" id=\"gd-tabs\" style=\"display:none;\"><\/div>\n      <div class=\"dbstats\" id=\"gd-stats\"><\/div>\n      <div class=\"dblist\" id=\"gd-list\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"pay-modal\" id=\"paymentModal\" onclick=\"if(event.target===this) closePaymentModal()\">\n    <div class=\"pay-box\">\n      <h3 id=\"pay-title\">💰 Payment Entry<\/h3>\n      <div class=\"field\"><label>Date<\/label><input id=\"pay-date\" type=\"date\"><\/div>\n      <div class=\"field\"><label>Amount (Tk)<\/label><input id=\"pay-amount\" type=\"number\" placeholder=\"e.g. 500\"><\/div>\n      <div class=\"field\"><label>Note / Reference (optional)<\/label><input id=\"pay-note\" placeholder=\"e.g. Bkash TrxID, cheque no.\"><\/div>\n      <div class=\"form-actions\">\n        <button class=\"btn btn-outline btn-block\" onclick=\"closePaymentModal()\">Cancel<\/button>\n        <button class=\"btn btn-primary btn-block\" onclick=\"savePaymentEntry()\">Save Payment<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Invoice detail / print / payment / adjustment modal -->\n  <div class=\"detail-modal\" id=\"invDetailModal\" onclick=\"if(event.target===this) closeInvDetail()\">\n    <div class=\"detail-box\">\n      <div class=\"db-head\">\n        <div>\n          <h3 id=\"invd-name\">—<\/h3>\n          <div class=\"dbsub\" id=\"invd-sub\"><\/div>\n        <\/div>\n        <button class=\"dbclose\" onclick=\"closeInvDetail()\">✕<\/button>\n      <\/div>\n      <div class=\"dbstats\" id=\"invd-stats\"><\/div>\n      <div style=\"padding:10px 16px 0;display:flex;gap:6px;flex-wrap:wrap;\">\n        <button class=\"btn btn-whatsapp btn-sm\" onclick=\"whatsappInvoice(currentInvDetailId)\">📲 WhatsApp<\/button>\n        <button class=\"btn btn-outline btn-sm\" onclick=\"printInvoiceA4(currentInvDetailId)\">🖨️ Print A4<\/button>\n        <button class=\"btn btn-outline btn-sm\" onclick=\"printInvoicePOS(currentInvDetailId)\">🧾 POS Receipt<\/button>\n        <button class=\"btn btn-outline btn-sm\" onclick=\"openInvPayModal(currentInvDetailId)\">💰 Payment<\/button>\n        <button class=\"btn btn-outline btn-sm\" onclick=\"openInvAdjModal(currentInvDetailId)\">➕➖ Adjustment<\/button>\n        <button class=\"btn btn-outline btn-sm\" onclick=\"duplicateInvoice(currentInvDetailId)\">📄 Duplicate<\/button>\n      <\/div>\n      <div class=\"dblist\" id=\"invd-list\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"pay-modal\" id=\"invPayModal\" onclick=\"if(event.target===this) closeInvPayModal()\">\n    <div class=\"pay-box\">\n      <h3>💰 Payment Entry<\/h3>\n      <div class=\"field\"><label>Date<\/label><input id=\"ivp-date\" type=\"date\"><\/div>\n      <div class=\"field\"><label>Amount (Tk)<\/label><input id=\"ivp-amount\" type=\"number\" placeholder=\"e.g. 500\"><\/div>\n      <div class=\"field\"><label>Payment Method<\/label>\n        <select id=\"ivp-method\">\n          <option>Cash<\/option><option>bKash<\/option><option>Nagad<\/option><option>Bank<\/option><option>Card<\/option><option>Others<\/option>\n        <\/select>\n      <\/div>\n      <div class=\"field\"><label>Note / Reference ID<\/label><input id=\"ivp-note\" placeholder=\"Optional\"><\/div>\n      <div class=\"form-actions\">\n        <button class=\"btn btn-outline btn-block\" onclick=\"closeInvPayModal()\">Cancel<\/button>\n        <button class=\"btn btn-primary btn-block\" onclick=\"saveInvPayment()\">Save Payment<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"pay-modal\" id=\"invAdjModal\" onclick=\"if(event.target===this) closeInvAdjModal()\">\n    <div class=\"pay-box\">\n      <h3>➕➖ Credit/Debit Adjustment<\/h3>\n      <div class=\"field\"><label>Type<\/label>\n        <select id=\"ivadj-type\"><option value=\"debit\">Debit (increases bill)<\/option><option value=\"credit\">Credit (reduces bill / Return)<\/option><\/select>\n      <\/div>\n      <div class=\"field\"><label>Amount (Tk)<\/label><input id=\"ivadj-amount\" type=\"number\" placeholder=\"e.g. 100\"><\/div>\n      <div class=\"field\"><label>Note (Reason)<\/label><input id=\"ivadj-note\" placeholder=\"e.g. Product Return\"><\/div>\n      <div class=\"form-actions\">\n        <button class=\"btn btn-outline btn-block\" onclick=\"closeInvAdjModal()\">Cancel<\/button>\n        <button class=\"btn btn-primary btn-block\" onclick=\"saveInvAdjustment()\">Save<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n/* ---------------- DATA LAYER ---------------- */\nconst DB_KEY = 'stockmaster_db_v1';\nlet DB = loadDB();\n\nfunction blankDB(){\n  return {products:[],suppliers:[],batches:[],shops:[],sales:[],supplierPayments:[],shopPayments:[],\n    stores:[], expenses:[], invoices:[], invoicePayments:[], invoiceAdjustments:[],\n    settings:{cloudBackupUrl:'', cloudBackupKey:'', autoBackup:false, lastBackupAt:null, lastBackupConfirmed:true, currentStoreId:'',\n      businessName:'', businessPhone:'', businessEmail:'', businessAddress:'', businessLogo:''}};\n}\nfunction loadDB(){\n  try{\n    const raw = localStorage.getItem(DB_KEY);\n    if(raw){\n      const data = JSON.parse(raw);\n      // migrate old data that may not have newer fields\n      const blank = blankDB();\n      Object.keys(blank).forEach(k=>{ if(data[k]===undefined) data[k]=blank[k]; });\n      if(!data.settings) data.settings = blank.settings;\n      Object.keys(blank.settings).forEach(k=>{ if(data.settings[k]===undefined) data.settings[k]=blank.settings[k]; });\n      return data;\n    }\n  }catch(e){}\n  return blankDB();\n}\nlet backupDebounce = null;\nfunction saveDB(){\n  localStorage.setItem(DB_KEY, JSON.stringify(DB));\n  if(DB.settings && DB.settings.autoBackup && DB.settings.cloudBackupUrl){\n    clearTimeout(backupDebounce);\n    backupDebounce = setTimeout(()=>cloudBackupNow(true), 1200);\n  }\n}\nfunction uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }\n/* A sale entered from several Batches is stored as one record per Batch that\n   share the same saleGroup id. These helpers let the rest of the app treat\n   them as ONE sale (statement, lists, edit, delete, share). */\nfunction saleGroupRecs(id){\n  const r = DB.sales.find(x=>x.id===id);\n  if(!r) return [];\n  return r.saleGroup ? DB.sales.filter(x=>x.saleGroup===r.saleGroup) : [r];\n}\nfunction releaseSaleStock(id){ saleGroupRecs(id).forEach(r=>{ const b=DB.batches.find(x=>x.id===r.batchId); if(b) b.soldQty -= r.qty; }); }\nfunction restoreSaleStock(id){ saleGroupRecs(id).forEach(r=>{ const b=DB.batches.find(x=>x.id===r.batchId); if(b) b.soldQty += r.qty; }); }\nfunction saleExtras(x){ return (x.shipCharge||0)+(x.codCharge||0); }\n/* A Quick Sale with several products is ONE group: list every product, not just the first */\nfunction saleItems(g){\n  const mp=new Map();\n  g.recs.forEach(r=>{ const o=mp.get(r.productId)||{id:r.productId,qty:0,amt:0}; o.qty+=r.qty; o.amt+=r.sellingPrice*r.qty; mp.set(r.productId,o); });\n  return [...mp.values()];\n}\nfunction saleProductsLabel(g){\n  const it=saleItems(g);\n  return it.length<=1 ? productName(g.productId) : it.map(o=>productName(o.id)+' ×'+o.qty).join(', ');\n}\nfunction groupedSales(list){\n  const map = new Map(), out = [];\n  list.forEach(x=>{\n    const k = x.saleGroup || x.id;\n    let g = map.get(k);\n    if(!g){ g = {id:x.id, recs:[], date:x.date, shopId:x.shopId, productId:x.productId, note:x.note||'', qty:0, gross:0, total:0, paid:0, profit:0, transport:0, ship:0, cod:0, disc:0, courier:false, cDel:0, cCod:0}; map.set(k,g); out.push(g); }\n    g.recs.push(x); g.qty += x.qty; g.gross += (x.mrp||0)*x.qty; g.total += x.sellingPrice*x.qty;\n    g.paid += (x.paid||0); g.profit += x.profit; g.transport += (x.transport||0);\n    g.ship += (x.shipCharge||0); g.cod += (x.codCharge||0); g.disc += (x.extraDiscount||0);\n    if(x.courier){ g.courier=true; g.cDel += (x.courierCharge||0); g.cCod += (x.courierCod||0); }\n  });\n  return out;\n}\nfunction todayStr(){ return new Date().toISOString().slice(0,10); }\nfunction fmt(n){ n = Math.round((n||0)*100)/100; return 'Tk '+n.toLocaleString('en-IN'); }\nfunction showToast(msg){\n  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');\n  setTimeout(()=>t.classList.remove('show'), 1800);\n}\n\n/* ---------------- NAVIGATION ---------------- */\nlet qsEditingId = null;   // Quick Sale being edited (its stock is released until you Update or Cancel)\nfunction restoreSaleEditIfPending(){\n  qsRestorePending();\n  if(editingSaleId){\n    restoreSaleStock(editingSaleId);\n    editingSaleId = null;\n  }\n}\n/* navStack: remembers which tab you came FROM, so the phone/browser Back\n   button returns you to your previous page instead of always jumping to\n   the Dashboard. fromBack=true is passed when go() is called as a result\n   of a Back press, so we don't push that navigation onto the stack again. */\nlet navStack = [];\nfunction go(tab, fromBack){\n  const activeEl = document.querySelector('.section.active');\n  const currentTab = activeEl ? activeEl.id.replace('sec-','') : null;\n  if(!fromBack && currentTab && currentTab!==tab) navStack.push(currentTab);\n  restoreSaleEditIfPending();\n  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));\n  document.getElementById('sec-'+tab).classList.add('active');\n  document.querySelectorAll('nav.sidenav button').forEach(b=>b.classList.remove('active'));\n  const navBtn = document.querySelector('nav.sidenav button[data-tab=\"'+tab+'\"]');\n  if(navBtn) navBtn.classList.add('active');\n  closeMore();\n  try{ localStorage.setItem('stockmaster_last_tab', tab); }catch(e){}\n  renderAll();\n  window.scrollTo(0,0);\n}\nfunction openMore(){ document.getElementById('moreMenu').classList.add('open'); document.getElementById('overlay').classList.add('open'); }\nfunction closeMore(){ document.getElementById('moreMenu').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }\nfunction toggleForm(id){\n  document.querySelectorAll('.form-panel').forEach(f=>{ if(f.id!==id) f.classList.remove('open'); });\n  document.getElementById(id).classList.toggle('open');\n}\nfunction quickAdd(){\n  const active = document.querySelector('.section.active').id;\n  if(active==='sec-products'){ openAddProductForm(); return; }\n  if(active==='sec-suppliers'){ openAddSupplierForm(); return; }\n  if(active==='sec-purchase'){ openAddPurchaseForm(); return; }\n  if(active==='sec-shops'){ openAddShopForm(); return; }\n  if(active==='sec-invoices'){ openAddInvoiceForm('invoice'); return; }\n  if(active==='sec-sales'){ openNewSale(); return; }\n  if(active==='sec-expenses'){ openAddExpenseForm(); return; }\n  if(active==='sec-stores'){ openAddStoreForm(); return; }\n  go('sales'); setTimeout(()=>toggleForm('form-sale'),50);\n}\nfunction wipeConfirm(){\n  if(confirm('All data will be erased. Are you sure?')){\n    localStorage.removeItem(DB_KEY); DB = loadDB(); renderAll(); showToast('Data reset successfully'); closeMore();\n  }\n}\n\n/* ---------------- CALC HELPERS ---------------- */\nfunction batchStock(b){ return b.qty - b.soldQty; }\nfunction inCurrentStore(storeId){ return !DB.settings.currentStoreId || (storeId||'')===DB.settings.currentStoreId; }\nfunction storeMatches(batchStoreId, targetStoreId){ return !targetStoreId || (batchStoreId||'')===targetStoreId; }\nfunction productBatches(pid){ return DB.batches.filter(b=>b.productId===pid && inCurrentStore(b.storeId)); }\nfunction productStock(pid){ return productBatches(pid).reduce((s,b)=>s+batchStock(b),0); }\nfunction productTPValue(pid){ return productBatches(pid).reduce((s,b)=>s+batchStock(b)*b.tp,0); }\nfunction productMRPValue(pid){ return productBatches(pid).reduce((s,b)=>s+batchStock(b)*b.mrp,0); }\nfunction totalStockTP(){ return DB.batches.filter(b=>inCurrentStore(b.storeId)).reduce((s,b)=>s+batchStock(b)*b.tp,0); }\nfunction totalStockMRP(){ return DB.batches.filter(b=>inCurrentStore(b.storeId)).reduce((s,b)=>s+batchStock(b)*b.mrp,0); }\nfunction supplierTotalPurchase(sid){ return DB.batches.filter(b=>b.supplierId===sid && inCurrentStore(b.storeId)).reduce((s,b)=>s+(b.qty*b.tp),0); }\nfunction supplierPaid(sid){\n  const initPaid = DB.batches.filter(b=>b.supplierId===sid && inCurrentStore(b.storeId)).reduce((s,b)=>s+(b.initialPaid||0),0);\n  const extra = DB.supplierPayments.filter(p=>p.supplierId===sid && inCurrentStore(p.storeId)).reduce((s,p)=>s+p.amount,0);\n  return initPaid+extra;\n}\nfunction supplierDue(sid){ return supplierTotalPurchase(sid) - supplierPaid(sid); }\nfunction shopTotalSales(shid){ return DB.sales.filter(s=>s.shopId===shid && inCurrentStore(s.storeId)).reduce((s,x)=>s+x.sellingPrice*x.qty+saleExtras(x),0); }\nfunction shopPaidTotal(shid){\n  const initPaid = DB.sales.filter(s=>s.shopId===shid && inCurrentStore(s.storeId)).reduce((s,x)=>s+(x.paid||0),0);\n  const extra = DB.shopPayments.filter(p=>p.shopId===shid && inCurrentStore(p.storeId)).reduce((s,p)=>s+p.amount,0);\n  return initPaid+extra;\n}\nfunction shopOpeningBalance(shid){ const s=DB.shops.find(x=>x.id===shid); return (s && s.openingBalance) || 0; }\nfunction shopDue(shid){ return shopOpeningBalance(shid) + shopTotalSales(shid) - shopPaidTotal(shid); }\n/* Date-range aware variants — used by the Due screen's date filter */\nfunction dateInRange(dateStr, from, to){\n  if(!from && !to) return true;\n  if(from && (!dateStr || dateStr < from)) return false;\n  if(to && (!dateStr || dateStr > to)) return false;\n  return true;\n}\nfunction shopTotalSalesInRange(shid, from, to){ return DB.sales.filter(s=>s.shopId===shid && inCurrentStore(s.storeId) && dateInRange(s.date,from,to)).reduce((s,x)=>s+x.sellingPrice*x.qty+saleExtras(x),0); }\nfunction shopPaidTotalInRange(shid, from, to){\n  const initPaid = DB.sales.filter(s=>s.shopId===shid && inCurrentStore(s.storeId) && dateInRange(s.date,from,to)).reduce((s,x)=>s+(x.paid||0),0);\n  const extra = DB.shopPayments.filter(p=>p.shopId===shid && inCurrentStore(p.storeId) && dateInRange(p.date,from,to)).reduce((s,p)=>s+p.amount,0);\n  return initPaid+extra;\n}\nfunction shopDueInRange(shid, from, to){ return shopTotalSalesInRange(shid,from,to) - shopPaidTotalInRange(shid,from,to); }\nfunction supplierTotalPurchaseInRange(sid, from, to){ return DB.batches.filter(b=>b.supplierId===sid && inCurrentStore(b.storeId) && dateInRange(b.date,from,to)).reduce((s,b)=>s+(b.qty*b.tp),0); }\nfunction supplierPaidInRange(sid, from, to){\n  const initPaid = DB.batches.filter(b=>b.supplierId===sid && inCurrentStore(b.storeId) && dateInRange(b.date,from,to)).reduce((s,b)=>s+(b.initialPaid||0),0);\n  const extra = DB.supplierPayments.filter(p=>p.supplierId===sid && inCurrentStore(p.storeId) && dateInRange(p.date,from,to)).reduce((s,p)=>s+p.amount,0);\n  return initPaid+extra;\n}\nfunction supplierDueInRange(sid, from, to){ return supplierTotalPurchaseInRange(sid,from,to) - supplierPaidInRange(sid,from,to); }\n\n/* Unified running ledger (Statement of Account) for a shop/customer:\n   combines opening balance + sales (Debit) + payments (Credit), sorted\n   chronologically, with a running balance — see explanation this replaces\n   the old separate \"sales list\" / \"payments list\" screens. */\nfunction buildShopLedger(shopId){\n  const rows = [];\n  const opening = shopOpeningBalance(shopId);\n  if(opening) rows.push({date:'', type:'opening', desc:'Opening Balance', qty:null, rate:null, debit:opening>0?opening:0, credit:opening<0?-opening:0, id:null});\n  // one ledger entry per sale (a sale from several Batches shows as a single total line)\n  groupedSales(DB.sales.filter(x=>x.shopId===shopId && inCurrentStore(x.storeId))).forEach(g=>{\n    rows.push({date:g.date||'', type:'sale', desc:saleProductsLabel(g), note:g.note||'', qty:g.qty, rate:g.qty?g.gross/g.qty:0, debit:g.gross, credit:0, id:g.id});\n    if(g.ship>0) rows.push({date:g.date||'', type:'sale-charge', desc:'Shipping Charge', qty:null, rate:null, debit:g.ship, credit:0, id:g.id});\n    if(g.cod>0) rows.push({date:g.date||'', type:'sale-charge', desc:'COD Charge', qty:null, rate:null, debit:g.cod, credit:0, id:g.id});\n    if(g.disc>0) rows.push({date:g.date||'', type:'sale-discount', desc:'Discount (at time of sale)', qty:null, rate:null, debit:0, credit:g.disc, id:g.id});\n    if(g.paid>0) rows.push({date:g.date||'', type:'sale-payment', desc:'Paid at time of sale', qty:null, rate:null, debit:0, credit:g.paid, id:g.id});\n  });\n  DB.shopPayments.filter(p=>p.shopId===shopId && inCurrentStore(p.storeId)).forEach(p=>{\n    rows.push({date:p.date||'', type:'payment', desc:'Payment Received', note:p.note||'', qty:null, rate:null, debit:0, credit:p.amount, id:p.id});\n  });\n  rows.sort((a,b)=>(a.date||'').localeCompare(b.date||''));\n  let bal = 0;\n  rows.forEach(r=>{ bal += (r.debit - r.credit); r.balance = bal; });\n  return rows;\n}\nfunction shopStatementDiscount(shopId){\n  const s = DB.shops.find(x=>x.id===shopId);\n  return { type: (s && s.discountType) || 'pct', value: (s && s.discountValue) || 0 };\n}\nfunction shopStatementTotals(shopId){\n  const ledger = buildShopLedger(shopId);\n  const totalSold = ledger.reduce((a,r)=>a+r.debit,0);\n  const saleDisc = ledger.filter(r=>r.type==='sale-discount').reduce((a,r)=>a+r.credit,0);\n  const paid = ledger.reduce((a,r)=>a+r.credit,0) - saleDisc;\n  const disc = shopStatementDiscount(shopId);\n  const discAmt = (disc.type==='pct' ? (totalSold*(disc.value||0)/100) : (disc.value||0)) + saleDisc;\n  const netSold = totalSold - discAmt;\n  const s = DB.shops.find(x=>x.id===shopId);\n  const additionalDiscount = (s && s.additionalDiscount) || 0;\n  const netSoldFinal = netSold - additionalDiscount;\n  const presentDue = netSoldFinal - paid;\n  return { totalSold, paid, disc, discAmt, netSold, additionalDiscount, netSoldFinal, presentDue };\n}\nfunction applyStatementDiscount(shopId){\n  const s = DB.shops.find(x=>x.id===shopId);\n  if(!s) return;\n  const type = document.getElementById('stmt-disc-type').value;\n  const value = Number(document.getElementById('stmt-disc-value').value)||0;\n  s.discountType = type; s.discountValue = value;\n  saveDB();\n  openDueHistory('shop', shopId);\n  showToast('Discount Applied ✅');\n}\nfunction applyAdditionalDiscount(shopId){\n  const s = DB.shops.find(x=>x.id===shopId);\n  if(!s) return;\n  const value = Number(document.getElementById('stmt-addl-disc-value').value)||0;\n  s.additionalDiscount = value;\n  saveDB();\n  openDueHistory('shop', shopId);\n  showToast('Additional Discount Applied ✅');\n}\nfunction daysUntil(dateStr){ if(!dateStr) return null; const d1=new Date(dateStr), d0=new Date(todayStr()); return Math.round((d1-d0)/86400000); }\nfunction productName(pid){ const p=DB.products.find(x=>x.id===pid); return p?p.name:'—'; }\nfunction supplierName(sid){ const s=DB.suppliers.find(x=>x.id===sid); return s?s.name:'—'; }\nfunction shopName(shid){ const s=DB.shops.find(x=>x.id===shid); return s?s.name:'—'; }\nfunction storeName(stid){ if(!stid) return 'Main Branch'; const s=DB.stores.find(x=>x.id===stid); return s?s.name:'Main Branch'; }\nfunction getBizProfile(storeId){\n  const store = storeId ? DB.stores.find(x=>x.id===storeId) : null;\n  return {\n    name: (store && store.name) || DB.settings.businessName || 'My Business',\n    phone: (store && store.phone) || DB.settings.businessPhone || '',\n    email: (store && store.email) || DB.settings.businessEmail || '',\n    address: (store && store.address) || DB.settings.businessAddress || '',\n    logo: (store && store.logo) || DB.settings.businessLogo || ''\n  };\n}\n\n\n/* ---------------- MULTIPLE STORES / BRANCHES ---------------- */\nlet editingStoreId = null;\nfunction populateStoreSwitcher(){\n  const sel = document.getElementById('storeSwitcher');\n  if(!sel) return;\n  const opts = ['<option value=\"\">All Branches<\/option>'].concat(DB.stores.map(s=>`<option value=\"${s.id}\">${s.name}<\/option>`));\n  sel.innerHTML = opts.join('');\n  sel.value = DB.settings.currentStoreId || '';\n  const exSel = document.getElementById('ex-store');\n  if(exSel){ exSel.innerHTML = '<option value=\"\">Main Branch<\/option>' + DB.stores.map(s=>`<option value=\"${s.id}\">${s.name}<\/option>`).join(''); }\n}\nfunction setCurrentStore(id){\n  DB.settings.currentStoreId = id;\n  saveDB();\n  showToast(id ? 'Active Branch: '+storeName(id) : 'Showing All Branches');\n  renderAll();\n}\nlet pendingStoreLogo = null;\nfunction onStoreLogoPick(ev){\n  const file = ev.target.files && ev.target.files[0];\n  if(!file) return;\n  const reader = new FileReader();\n  reader.onload = function(){\n    pendingStoreLogo = reader.result;\n    const prev = document.getElementById('st-logo-preview');\n    prev.src = pendingStoreLogo; prev.style.display = 'inline-block';\n  };\n  reader.readAsDataURL(file);\n}\nfunction openAddStoreForm(){\n  editingStoreId = null; pendingStoreLogo = null;\n  ['st-name','st-contact','st-phone','st-address','st-invcounter'].forEach(id=>document.getElementById(id).value='');\n  document.getElementById('st-logo').value='';\n  document.getElementById('st-logo-preview').style.display='none';\n  document.getElementById('st-form-title').textContent = 'Add Branch';\n  document.getElementById('st-save-btn').textContent = 'Save Branch';\n  const panel = document.getElementById('form-store');\n  if(!panel.classList.contains('open')) toggleForm('form-store');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\nfunction editStore(id){\n  const s = DB.stores.find(x=>x.id===id);\n  if(!s) return;\n  editingStoreId = id; pendingStoreLogo = s.logo || null;\n  document.getElementById('st-name').value = s.name || '';\n  document.getElementById('st-contact').value = s.contact || '';\n  document.getElementById('st-phone').value = s.phone || '';\n  document.getElementById('st-address').value = s.address || '';\n  document.getElementById('st-invcounter').value = s.invoiceCounter || 1;\n  document.getElementById('st-logo').value='';\n  const prev = document.getElementById('st-logo-preview');\n  if(s.logo){ prev.src = s.logo; prev.style.display='inline-block'; } else { prev.style.display='none'; }\n  document.getElementById('st-form-title').textContent = 'Update Branch';\n  document.getElementById('st-save-btn').textContent = 'Update Branch';\n  const panel = document.getElementById('form-store');\n  if(!panel.classList.contains('open')) toggleForm('form-store');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\nfunction cancelStoreForm(){ editingStoreId = null; pendingStoreLogo = null; toggleForm('form-store'); }\nfunction saveStore(){\n  const name = document.getElementById('st-name').value.trim();\n  if(!name){ showToast('Enter Branch Name'); return; }\n  const invCounterInput = Number(document.getElementById('st-invcounter').value);\n  const data = { name, contact:document.getElementById('st-contact').value.trim(),\n    phone:document.getElementById('st-phone').value.trim(), address:document.getElementById('st-address').value.trim(),\n    logo: pendingStoreLogo };\n  if(editingStoreId){\n    const s = DB.stores.find(x=>x.id===editingStoreId);\n    if(s){ Object.assign(s, data); if(invCounterInput>0) s.invoiceCounter = invCounterInput; if(s.quoteCounter===undefined) s.quoteCounter=1; }\n    showToast('Branch Updated ✅');\n  } else {\n    DB.stores.push({ id:uid(), ...data, invoiceCounter: invCounterInput>0?invCounterInput:1, quoteCounter:1 });\n    showToast('Branch Saved ✅');\n  }\n  saveDB();\n  editingStoreId = null; pendingStoreLogo = null;\n  ['st-name','st-contact','st-phone','st-address','st-invcounter'].forEach(id=>document.getElementById(id).value='');\n  document.getElementById('st-logo-preview').style.display='none';\n  document.getElementById('st-form-title').textContent = 'Add Branch';\n  document.getElementById('st-save-btn').textContent = 'Save Branch';\n  toggleForm('form-store'); renderAll();\n}\nfunction deleteStore(id){\n  const hasData = DB.batches.some(b=>b.storeId===id) || DB.sales.some(s=>s.storeId===id) || DB.expenses.some(e=>e.storeId===id) || DB.invoices.some(i=>i.storeId===id);\n  if(hasData){ showToast('This Branch has Purchase/Sale/Expense data, so it cannot be deleted'); return; }\n  if(!confirm('Delete this Branch?')) return;\n  DB.stores = DB.stores.filter(s=>s.id!==id);\n  if(DB.settings.currentStoreId===id) DB.settings.currentStoreId='';\n  saveDB(); renderAll();\n}\nfunction renderStores(){\n  const box = document.getElementById('storeList');\n  if(!box) return;\n  if(DB.stores.length===0){ box.innerHTML = '<div class=\"empty\">No Branch added yet. By default all data goes to Main Branch.<\/div>'; return; }\n  box.innerHTML = DB.stores.map(s=>{\n    const salesQty = DB.sales.filter(x=>(x.storeId||'')===s.id).reduce((a,x)=>a+x.qty,0);\n    const salesAmt = DB.sales.filter(x=>(x.storeId||'')===s.id).reduce((a,x)=>a+x.sellingPrice*x.qty,0);\n    return `<div class=\"list-item\">\n      <div class=\"li-top\">\n        <div><div class=\"li-title\">🏬 ${s.name} ${((DB.settings.currentStoreId||'')===s.id)?'<span class=\"tag\">Active<\/span>':''}<\/div><div class=\"li-sub\">${s.contact||''} ${s.phone?('· '+s.phone):''} ${s.address?('· '+s.address):''}<\/div>\n        <div class=\"li-tags\"><span class=\"tag\">Sales Qty: ${salesQty}<\/span><span class=\"tag\">Sales: ${fmt(salesAmt)}<\/span><\/div><\/div>\n      <\/div>\n      <div class=\"li-actions\">\n        <button class=\"btn btn-outline btn-sm\" onclick=\"setCurrentStore('
