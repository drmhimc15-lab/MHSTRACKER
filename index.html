${s.id}')\">Set Active<\/button>\n        <button class=\"btn btn-outline btn-sm\" onclick=\"editStore('${s.id}')\">✏️ Edit<\/button>\n        <button class=\"btn btn-danger btn-sm\" onclick=\"deleteStore('${s.id}')\">🗑️ Delete<\/button>\n      <\/div>\n    <\/div>`;\n  }).join('');\n}\n\n/* ---------------- EXPENSE MANAGEMENT ---------------- */\nlet editingExpenseId = null;\nlet exFilterCat = 'all';\nconst EXPENSE_CATS = ['Delivery','Salary','Transport','Rent','Utility','Other'];\nconst EXPENSE_LABEL = {Delivery:'🚚 Delivery',Salary:'👤 Salary',Transport:'🚗 Transport',Rent:'🏠 Rent',Utility:'💡 Utility',Other:'📌 Other'};\nfunction openAddExpenseForm(){\n  editingExpenseId = null;\n  ['ex-amount','ex-note'].forEach(id=>document.getElementById(id).value='');\n  document.getElementById('ex-date').value = todayStr();\n  document.getElementById('ex-category').value = 'Delivery';\n  document.getElementById('ex-store').value = DB.settings.currentStoreId || '';\n  document.getElementById('ex-form-title').textContent = 'Add Expense';\n  document.getElementById('ex-save-btn').textContent = 'Save Expense';\n  const panel = document.getElementById('form-expense');\n  if(!panel.classList.contains('open')) toggleForm('form-expense');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\nfunction editExpense(id){\n  const e = DB.expenses.find(x=>x.id===id);\n  if(!e) return;\n  editingExpenseId = id;\n  document.getElementById('ex-category').value = e.category;\n  document.getElementById('ex-amount').value = e.amount;\n  document.getElementById('ex-date').value = e.date;\n  document.getElementById('ex-store').value = e.storeId||'';\n  document.getElementById('ex-note').value = e.note||'';\n  document.getElementById('ex-form-title').textContent = 'Update Expense';\n  document.getElementById('ex-save-btn').textContent = 'Update Expense';\n  const panel = document.getElementById('form-expense');\n  if(!panel.classList.contains('open')) toggleForm('form-expense');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\nfunction cancelExpenseForm(){ editingExpenseId = null; toggleForm('form-expense'); }\nfunction saveExpense(){\n  const amount = Number(document.getElementById('ex-amount').value);\n  if(!amount || amount<=0){ showToast('Enter a valid Amount'); return; }\n  const data = {\n    category: document.getElementById('ex-category').value,\n    amount, date: document.getElementById('ex-date').value || todayStr(),\n    storeId: document.getElementById('ex-store').value || '',\n    note: document.getElementById('ex-note').value.trim()\n  };\n  if(editingExpenseId){\n    const e = DB.expenses.find(x=>x.id===editingExpenseId);\n    if(e) Object.assign(e, data);\n    showToast('Expense Updated ✅');\n  } else {\n    DB.expenses.push({ id:uid(), ...data });\n    showToast('Expense Saved ✅');\n  }\n  saveDB();\n  editingExpenseId = null;\n  ['ex-amount','ex-note'].forEach(id=>document.getElementById(id).value='');\n  document.getElementById('ex-form-title').textContent = 'Add Expense';\n  document.getElementById('ex-save-btn').textContent = 'Save Expense';\n  toggleForm('form-expense'); renderAll();\n}\nfunction deleteExpense(id){\n  if(!confirm('Delete this Expense?')) return;\n  DB.expenses = DB.expenses.filter(e=>e.id!==id); saveDB(); renderAll();\n}\nfunction setExFilter(c){ exFilterCat=c; renderExpenses(); }\nfunction renderExpenses(){\n  const filterBox = document.getElementById('exFilters');\n  if(filterBox){\n    filterBox.innerHTML = ['all',...EXPENSE_CATS].map(c=>`<button class=\"subtab ${exFilterCat===c?'active':''}\" onclick=\"setExFilter('${c}')\">${c==='all'?'All':EXPENSE_LABEL[c]}<\/button>`).join('');\n  }\n  const box = document.getElementById('expenseList');\n  if(!box) return;\n  let list = [...DB.expenses];\n  if(exFilterCat!=='all') list = list.filter(e=>e.category===exFilterCat);\n  list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));\n  if(list.length===0){ box.innerHTML = '<div class=\"empty\">No Expense found.<\/div>'; return; }\n  box.innerHTML = list.map(e=>`<div class=\"list-item\">\n      <div class=\"li-top\">\n        <div><div class=\"li-title\">${EXPENSE_LABEL[e.category]||e.category}<\/div>\n        <div class=\"li-sub\">${e.date} ${e.storeId?('· '+storeName(e.storeId)):''} ${e.note?('· '+e.note):''}<\/div><\/div>\n        <div class=\"li-right\"><div class=\"li-num\">${fmt(e.amount)}<\/div><\/div>\n      <\/div>\n      <div class=\"li-actions\">\n        <button class=\"btn btn-outline btn-sm\" onclick=\"editExpense('${e.id}')\">✏️ Edit<\/button>\n        <button class=\"btn btn-danger btn-sm\" onclick=\"deleteExpense('${e.id}')\">🗑️ Delete<\/button>\n      <\/div>\n    <\/div>`).join('');\n\n  const ym = new Date().toISOString().slice(0,7);\n  const monthExp = DB.expenses.filter(x=>x.date && x.date.slice(0,7)===ym).reduce((a,x)=>a+Number(x.amount),0);\n  const monthSales = DB.sales.filter(s=>s.date && s.date.slice(0,7)===ym);\n  const monthProfit = monthSales.reduce((a,x)=>a+x.profit,0);\n  document.getElementById('exMonthTotal').textContent = fmt(monthExp);\n  document.getElementById('exMonthNet').textContent = fmt(monthProfit-monthExp);\n}\n\n/* ---------------- WHATSAPP SHARE ---------------- */\nfunction shareOnWhatsApp(text, phone){\n  const encoded = encodeURIComponent(text);\n  const cleanPhone = (phone||'').replace(/[^0-9]/g,'');\n  const url = cleanPhone ? `https://wa.me/${cleanPhone}?text=${encoded}` : `https://wa.me/?text=${encoded}`;\n  window.open(url, '_blank');\n}\nfunction shareSaleWhatsApp(saleId){\n  const g = groupedSales(saleGroupRecs(saleId))[0];\n  if(!g) return;\n  const s = { date:g.date, productId:g.productId, shopId:g.shopId, qty:g.qty, sellingPrice:g.qty?g.total/g.qty:0, paid:g.paid, note:g.note };\n  const shop = DB.shops.find(x=>x.id===s.shopId);\n  const total = g.total + g.ship + g.cod;\n  const due = total - (s.paid||0);\n  const lines = [\n    '🧾 *StockMaster Invoice*',\n    '',\n    'Shop: '+(shop?shop.name:'-'),\n    'Date: '+s.date,\n    ...(saleItems(g).length>1\n      ? ['Products:', ...saleItems(g).map(o=>'• '+productName(o.id)+' × '+o.qty+' @ '+fmt(o.amt/o.qty)), 'Total Quantity: '+s.qty]\n      : ['Product: '+productName(s.productId), 'Quantity: '+s.qty, 'Price/Unit: '+fmt(s.sellingPrice)]),\n    ...(g.ship?['Shipping: '+fmt(g.ship)]:[]),\n    ...(g.cod?['COD Charge: '+fmt(g.cod)]:[]),\n    ...(g.disc?['Discount: -'+fmt(g.disc)]:[]),\n    'Total Bill: '+fmt(total),\n    'Paid: '+fmt(s.paid||0),\n    'Due: '+fmt(due),\n    ...(s.note?['Note: '+s.note]:[]),\n    '',\n    'Thank you for your business 🙏'\n  ];\n  shareOnWhatsApp(lines.join('\\n'), shop?shop.phone:'');\n}\nfunction shareShopDueWhatsApp(shopId){\n  const shop = DB.shops.find(x=>x.id===shopId);\n  if(!shop) return;\n  const total = shopTotalSales(shopId), paid = shopPaidTotal(shopId), due = shopDue(shopId);\n  const lines = [\n    '🧾 *StockMaster - Account Statement*',\n    '',\n    'Shop: '+shop.name,\n    'Date: '+todayStr(),\n    'Total Sales: '+fmt(total),\n    'Total Paid: '+fmt(paid),\n    'Current Due: '+fmt(due),\n    '',\n    'Please pay the due amount. Thank you 🙏'\n  ];\n  shareOnWhatsApp(lines.join('\\n'), shop.phone);\n}\n\n/* ---------------- BUSINESS PROFILE ---------------- */\nlet pendingBizLogo = null;\nfunction onBizLogoPick(ev){\n  const file = ev.target.files && ev.target.files[0];\n  if(!file) return;\n  const reader = new FileReader();\n  reader.onload = function(){\n    pendingBizLogo = reader.result;\n    const prev = document.getElementById('biz-logo-preview');\n    prev.src = pendingBizLogo; prev.style.display = 'inline-block';\n  };\n  reader.readAsDataURL(file);\n}\nfunction saveBusinessProfile(){\n  const name = document.getElementById('biz-name').value.trim();\n  DB.settings.businessName = name;\n  DB.settings.businessPhone = document.getElementById('biz-phone').value.trim();\n  DB.settings.businessEmail = document.getElementById('biz-email').value.trim();\n  DB.settings.businessAddress = document.getElementById('biz-address').value.trim();\n  if(pendingBizLogo!==null) DB.settings.businessLogo = pendingBizLogo;\n  saveDB();\n  pendingBizLogo = null;\n  renderHeader();\n  showToast('Business info saved ✅');\n}\nfunction renderBusinessProfileForm(){\n  const n=document.getElementById('biz-name'), p=document.getElementById('biz-phone'),\n        e=document.getElementById('biz-email'), a=document.getElementById('biz-address');\n  if(n) n.value = DB.settings.businessName || '';\n  if(p) p.value = DB.settings.businessPhone || '';\n  if(e) e.value = DB.settings.businessEmail || '';\n  if(a) a.value = DB.settings.businessAddress || '';\n  pendingBizLogo = null;\n  const logoInput = document.getElementById('biz-logo');\n  if(logoInput) logoInput.value = '';\n  const prev = document.getElementById('biz-logo-preview');\n  if(prev){\n    if(DB.settings.businessLogo){ prev.src = DB.settings.businessLogo; prev.style.display='inline-block'; }\n    else { prev.style.display='none'; }\n  }\n}\n\n/* ---------------- CLOUD BACKUP ---------------- */\nfunction saveBackupSettings(){\n  DB.settings.cloudBackupUrl = document.getElementById('cb-url').value.trim();\n  DB.settings.cloudBackupKey = document.getElementById('cb-key').value.trim();\n  saveDB();\n  showToast('Backup Settings Saved ✅');\n  renderBackupStatus();\n}\nfunction toggleAutoBackup(checked){\n  DB.settings.autoBackup = checked;\n  saveDB();\n  showToast(checked?'Auto Backup turned on ✅':'Auto Backup turned off');\n}\nfunction isJsonBin(url){ return /api\\.jsonbin\\.io/i.test(url); }\nfunction isAppsScript(url){ return /script\\.google\\.com/i.test(url); }\nfunction cloudBackupNow(silent){\n  const url = DB.settings.cloudBackupUrl;\n  if(!url){ if(!silent) showToast('Set Cloud Backup URL first'); return; }\n  const appsScript = isAppsScript(url);\n  const headers = appsScript ? {'Content-Type':'text/plain;charset=utf-8'} : {'Content-Type':'application/json'};\n  if(DB.settings.cloudBackupKey) headers['X-Master-Key'] = DB.settings.cloudBackupKey;\n  const opts = {\n    method: isJsonBin(url) ? 'PUT' : 'POST',\n    headers,\n    body: JSON.stringify(DB)\n  };\n  // Apps Script responses often can't be read cross-origin by fetch even\n  // though the request itself succeeds server-side. no-cors guarantees the\n  // request is DISPATCHED but we cannot verify the server actually saved it\n  // (auth failure, script error, malformed data on their end are all\n  // invisible to us) — so this case is tracked and shown separately as\n  // \"sent, unconfirmed\" rather than reported as a confirmed success.\n  if(appsScript) opts.mode = 'no-cors';\n  fetch(url, opts).then(r=>{\n    if(!appsScript && !r.ok) throw new Error('HTTP '+r.status);\n    DB.settings.lastBackupAt = new Date().toISOString();\n    DB.settings.lastBackupConfirmed = !appsScript;\n    localStorage.setItem(DB_KEY, JSON.stringify(DB));\n    renderBackupStatus();\n    if(!silent) showToast(appsScript ? 'Sent to Backup Server (could not confirm) ⚠️' : 'Cloud Backup Successful ✅');\n  }).catch(err=>{\n    console.error('Cloud backup failed:', err);\n    if(!silent) showToast('Backup Failed. Check URL/Key/Internet ❌');\n  });\n}\nfunction cloudRestoreNow(){\n  const url = DB.settings.cloudBackupUrl;\n  if(!url){ showToast('Set Cloud Backup URL first'); return; }\n  if(!confirm('Restoring data from Cloud will overwrite current data. Are you sure?')) return;\n  const headers = {};\n  if(DB.settings.cloudBackupKey) headers['X-Master-Key'] = DB.settings.cloudBackupKey;\n  fetch(url, {headers}).then(r=>{\n    if(!r.ok) throw new Error('HTTP '+r.status);\n    return r.json();\n  }).then(data=>{\n    if(data && data.record) data = data.record; // JSONBin v3 wraps the saved data\n    const blank = blankDB();\n    Object.keys(blank).forEach(k=>{ if(data[k]===undefined) data[k]=blank[k]; });\n    DB = data;\n    saveDB();\n    showToast('Restored from Cloud ✅');\n    renderAll();\n  }).catch(err=>{ console.error('Cloud restore failed:', err); showToast('Restore Failed ❌'); });\n}\nfunction renderBackupStatus(){\n  const urlInput = document.getElementById('cb-url');\n  const keyInput = document.getElementById('cb-key');\n  const autoInput = document.getElementById('cb-auto');\n  if(urlInput) urlInput.value = DB.settings.cloudBackupUrl || '';\n  if(keyInput) keyInput.value = DB.settings.cloudBackupKey || '';\n  if(autoInput) autoInput.checked = !!DB.settings.autoBackup;\n  const dot = document.getElementById('cbDot');\n  const txt = document.getElementById('cbStatusText');\n  if(!txt) return;\n  if(DB.settings.lastBackupAt){\n    dot.classList.add('on');\n    const d = new Date(DB.settings.lastBackupAt);\n    const confirmed = DB.settings.lastBackupConfirmed!==false;\n    txt.textContent = (confirmed?'Last Backup: ':'Last Backup sent (could not confirm): ')+d.toLocaleString('en-US');\n  } else {\n    dot.classList.remove('on');\n    txt.textContent = 'No backup taken yet';\n  }\n}\nfunction exportLocalBackup(){\n  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a'); a.href=url; a.download='stockmaster_backup_'+todayStr()+'.json';\n  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);\n  showToast('Downloading Backup File...');\n}\nfunction importLocalBackup(event){\n  const file = event.target.files[0];\n  if(!file) return;\n  if(!confirm('Restoring from Backup File will overwrite current data. Are you sure?')) return;\n  const reader = new FileReader();\n  reader.onload = function(e){\n    try{\n      const data = JSON.parse(e.target.result);\n      const blank = blankDB();\n      Object.keys(blank).forEach(k=>{ if(data[k]===undefined) data[k]=blank[k]; });\n      DB = data; saveDB(); showToast('Restored ✅'); renderAll();\n    }catch(err){ showToast('Invalid Backup File ❌'); }\n  };\n  reader.readAsText(file);\n  event.target.value = '';\n}\n\n/* ---------------- EXIT ON BACK BUTTON (HOME PAGE) ---------------- */\nfunction showExitModal(){ document.getElementById('exitModal').classList.add('open'); }\nfunction closeExitModal(){ document.getElementById('exitModal').classList.remove('open'); }\nfunction confirmExitApp(){\n  closeExitModal();\n  window.close();\n  setTimeout(()=>{ showToast('You can now close the Browser/App'); }, 300);\n}\n/* ---------------- RENDER: HEADER + DASHBOARD ---------------- */\nfunction renderHeader(){\n  const titleEl = document.getElementById('appTitleName');\n  if(titleEl) titleEl.textContent = DB.settings.businessName || 'StockMaster';\n  document.title = (DB.settings.businessName || 'StockMaster') + ' — Business Management';\n  document.getElementById('hcStock').textContent = fmt(totalStockTP());\n  const today = todayStr();\n  const todaySales = DB.sales.filter(s=>s.date===today && inCurrentStore(s.storeId));\n  document.getElementById('hcToday').textContent = fmt(todaySales.reduce((s,x)=>s+x.sellingPrice*x.qty,0));\n  document.getElementById('hcProfit').textContent = fmt(todaySales.reduce((s,x)=>s+x.profit,0));\n}\n\nfunction renderDashboard(){\n  const storeSales = DB.sales.filter(s=>inCurrentStore(s.storeId));\n  const storeBatches = DB.batches.filter(b=>inCurrentStore(b.storeId));\n  document.getElementById('dTotalProducts').textContent = DB.settings.currentStoreId ? new Set(storeBatches.map(b=>b.productId)).size : DB.products.length;\n  document.getElementById('dStockTP').textContent = fmt(totalStockTP());\n  document.getElementById('dStockMRP').textContent = fmt(totalStockMRP());\n  document.getElementById('dTotalSoldQty').textContent = storeSales.reduce((s,x)=>s+Number(x.qty),0);\n  document.getElementById('dTotalSales').textContent = fmt(storeSales.reduce((s,x)=>s+x.sellingPrice*x.qty,0));\n  document.getElementById('dTotalProfit').textContent = fmt(storeSales.reduce((s,x)=>s+x.profit,0));\n\n  const now = new Date(); const ym = now.toISOString().slice(0,7);\n  const monthSales = storeSales.filter(s=>s.date && s.date.slice(0,7)===ym);\n  document.getElementById('dMonthSales').textContent = fmt(monthSales.reduce((s,x)=>s+x.sellingPrice*x.qty,0));\n  const monthProfitVal = monthSales.reduce((s,x)=>s+x.profit,0);\n  document.getElementById('dMonthProfit').textContent = fmt(monthProfitVal);\n  const monthExpenseVal = DB.expenses.filter(x=>x.date && x.date.slice(0,7)===ym && inCurrentStore(x.storeId)).reduce((s,x)=>s+Number(x.amount),0);\n  document.getElementById('dMonthExpense').textContent = fmt(monthExpenseVal);\n  document.getElementById('dMonthNet').textContent = fmt(monthProfitVal-monthExpenseVal);\n\n  // alerts\n  const alerts = [];\n  DB.products.forEach(p=>{\n    const stock = storeBatches.filter(b=>b.productId===p.id).reduce((s,b)=>s+batchStock(b),0);\n    if(p.minStock && stock<=Number(p.minStock)) alerts.push({type:'danger',text:'🔴 Low Stock: '+p.name+' (only '+stock+' pcs left)'});\n  });\n  storeBatches.forEach(b=>{\n    const rem = batchStock(b); if(rem<=0) return;\n    const d = daysUntil(b.expDate);\n    if(d===null) return;\n    if(d<0) alerts.push({type:'danger',text:'🔴 Expired: '+productName(b.productId)+' (Batch '+(b.batchNo||'-')+')'});\n    else if(d<=30) alerts.push({type:'danger',text:'🔴 '+d+' days to Expire: '+productName(b.productId)});\n    else if(d<=90) alerts.push({type:'warn',text:'🟠 '+d+' days to Expire (90 days): '+productName(b.productId)});\n  });\n  DB.shops.forEach(sh=>{ const due=shopDue(sh.id); if(due>0) alerts.push({type:'warn',text:'💰 '+sh.name+' Due: '+fmt(due)}); });\n  DB.suppliers.forEach(su=>{ const due=supplierDue(su.id); if(due>0) alerts.push({type:'warn',text:'💰 '+su.name+' Payable: '+fmt(due)}); });\n\n  const box = document.getElementById('dashAlerts');\n  if(alerts.length===0){ box.innerHTML = '<div class=\"empty\">No Alerts at the moment ✅<\/div>'; }\n  else{\n    box.innerHTML = alerts.slice(0,15).map(a=>`<div class=\"alert-item ${a.type==='danger'?'danger':''}\"><span>${a.text}<\/span><\/div>`).join('');\n  }\n\n  // top company by stock qty\n  const companyMap = {};\n  storeBatches.forEach(b=>{\n    const p = DB.products.find(x=>x.id===b.productId); if(!p) return;\n    const key = p.brand||'Unknown';\n    companyMap[key] = (companyMap[key]||0) + batchStock(b);\n  });\n  const sorted = Object.entries(companyMap).sort((a,b)=>b[1]-a[1]).slice(0,5);\n  const tc = document.getElementById('topCompanyCard');\n  if(sorted.length===0) tc.innerHTML = '<div class=\"empty\">No data found<\/div>';\n  else tc.innerHTML = sorted.map((c,i)=>`<div class=\"rank-item\"><span><span class=\"rank-badge\">${i+1}<\/span>${c[0]}<\/span><b>${c[1]} pcs<\/b><\/div>`).join('');\n}\n\n/* ---------------- PRODUCTS ---------------- */\nlet editingProductId = null;\n\nfunction openAddProductForm(){\n  editingProductId = null;\n  ['p-name','p-brand','p-category','p-subcategory','p-size','p-sku','p-barcode','p-minstock'].forEach(id=>document.getElementById(id).value='');\n  document.getElementById('p-form-title').textContent = 'Add Product';\n  document.getElementById('p-save-btn').textContent = 'Save Product';\n  const panel = document.getElementById('form-product');\n  if(!panel.classList.contains('open')) toggleForm('form-product');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\n\nfunction editProduct(id){\n  const p = DB.products.find(x=>x.id===id);\n  if(!p) return;\n  editingProductId = id;\n  document.getElementById('p-name').value = p.name || '';\n  document.getElementById('p-brand').value = p.brand || '';\n  document.getElementById('p-category').value = p.category || '';\n  document.getElementById('p-subcategory').value = p.subcategory || '';\n  document.getElementById('p-size').value = p.size || '';\n  document.getElementById('p-sku').value = p.sku || '';\n  document.getElementById('p-barcode').value = p.barcode || '';\n  document.getElementById('p-minstock').value = p.minStock || '';\n  document.getElementById('p-form-title').textContent = 'Update Product';\n  document.getElementById('p-save-btn').textContent = 'Update Product';\n  const panel = document.getElementById('form-product');\n  if(!panel.classList.contains('open')) toggleForm('form-product');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\n\nfunction cancelProductForm(){\n  editingProductId = null;\n  toggleForm('form-product');\n}\n\nfunction saveProduct(){\n  const name = document.getElementById('p-name').value.trim();\n  if(!name){ showToast('Enter Product Name'); return; }\n  const data = {\n    name, brand:document.getElementById('p-brand').value.trim(),\n    category:document.getElementById('p-category').value.trim(),\n    subcategory:document.getElementById('p-subcategory').value.trim(),\n    size:document.getElementById('p-size').value.trim(),\n    sku:document.getElementById('p-sku').value.trim(),\n    barcode:document.getElementById('p-barcode').value.trim(),\n    minStock:document.getElementById('p-minstock').value || 0\n  };\n  if(data.sku && DB.products.some(p=>p.id!==editingProductId && (p.sku||'').trim().toLowerCase()===data.sku.toLowerCase())){\n    showToast('This SKU is already used by another Product'); return;\n  }\n  if(data.barcode && DB.products.some(p=>p.id!==editingProductId && (p.barcode||'').trim().toLowerCase()===data.barcode.toLowerCase())){\n    showToast('This Barcode is already used by another Product'); return;\n  }\n  if(editingProductId){\n    const p = DB.products.find(x=>x.id===editingProductId);\n    if(p) Object.assign(p, data);\n    showToast('Product Updated ✅');\n  } else {\n    DB.products.push({ id:uid(), ...data });\n    showToast('Product Saved ✅');\n  }\n  saveDB();\n  editingProductId = null;\n  ['p-name','p-brand','p-category','p-subcategory','p-size','p-sku','p-barcode','p-minstock'].forEach(id=>document.getElementById(id).value='');\n  document.getElementById('p-form-title').textContent = 'Add Product';\n  document.getElementById('p-save-btn').textContent = 'Save Product';\n  toggleForm('form-product');\n  renderAll();\n}\nfunction deleteProduct(id){\n  if(DB.sales.some(s=>s.productId===id)){ showToast('This Product has Sale History, so it cannot be deleted — delete those Sales first'); return; }\n  if(!confirm('Delete this Product?')) return;\n  DB.products = DB.products.filter(p=>p.id!==id);\n  DB.batches = DB.batches.filter(b=>b.productId!==id);\n  saveDB(); renderAll();\n}\nfunction renderProducts(){\n  const q = (document.getElementById('prodSearch')?.value||'').toLowerCase();\n  const list = DB.products.filter(p=>!q || (p.name+p.brand+p.sku+p.barcode+p.category).toLowerCase().includes(q));\n  const box = document.getElementById('productList');\n  if(list.length===0){ box.innerHTML = '<div class=\"empty\">No Product found. Add one from above.<\/div>'; return; }\n  box.innerHTML = list.map(p=>{\n    const stock = productStock(p.id);\n    const low = stock<=5 || (p.minStock && stock<=Number(p.minStock));\n    return `<div class=\"list-item\">\n      <div class=\"li-top\">\n        <div><div class=\"li-title\">${p.name}<\/div><div class=\"li-sub\">${p.brand||''} ${p.category?('· '+p.category):''} ${p.size?('· '+p.size):''}<\/div>\n        <div class=\"li-tags\">\n          <span class=\"tag ${low?'low':''}\">Stock: ${stock}<\/span>\n          ${p.sku?`<span class=\"tag\">SKU: ${p.sku}<\/span>`:''}\n        <\/div><\/div>\n        <div class=\"li-right\"><div class=\"li-num\">${fmt(productTPValue(p.id))}<\/div><div class=\"li-sub\">MRP ${fmt(productMRPValue(p.id))}<\/div><\/div>\n      <\/div>\n      <div class=\"li-actions\">\n        <button class=\"btn btn-outline btn-sm\" onclick=\"editProduct('${p.id}')\">✏️ Edit<\/button>\n        <button class=\"btn btn-outline btn-sm\" onclick=\"quickPurchase('${p.id}')\">🛒 Purchase<\/button>\n        <button class=\"btn btn-danger btn-sm\" onclick=\"deleteProduct('${p.id}')\">🗑️ Delete<\/button>\n      <\/div>\n    <\/div>`;\n  }).join('');\n}\nfunction quickPurchase(pid){\n  go('purchase');\n  setTimeout(()=>{ openAddPurchaseForm(); document.getElementById('pu-product').value = pid; },60);\n}\n\n/* ---------------- SUPPLIERS ---------------- */\nlet editingSupplierId = null;\n\nfunction openAddSupplierForm(){\n  editingSupplierId = null;\n  ['s-name','s-contact','s-phone','s-address'].forEach(id=>document.getElementById(id).value='');\n  document.getElementById('s-form-title').textContent = 'Add Supplier';\n  document.getElementById('s-save-btn').textContent = 'Save Supplier';\n  const panel = document.getElementById('form-supplier');\n  if(!panel.classList.contains('open')) toggleForm('form-supplier');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\nfunction editSupplier(id){\n  const s = DB.suppliers.find(x=>x.id===id);\n  if(!s) return;\n  editingSupplierId = id;\n  document.getElementById('s-name').value = s.name || '';\n  document.getElementById('s-contact').value = s.contact || '';\n  document.getElementById('s-phone').value = s.phone || '';\n  document.getElementById('s-address').value = s.address || '';\n  document.getElementById('s-form-title').textContent = 'Update Supplier';\n  document.getElementById('s-save-btn').textContent = 'Update Supplier';\n  const panel = document.getElementById('form-supplier');\n  if(!panel.classList.contains('open')) toggleForm('form-supplier');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\nfunction cancelSupplierForm(){ editingSupplierId = null; toggleForm('form-supplier'); }\nfunction saveSupplier(){\n  const name = document.getElementById('s-name').value.trim();\n  if(!name){ showToast('Enter Company Name'); return; }\n  const data = { name, contact:document.getElementById('s-contact').value.trim(),\n    phone:document.getElementById('s-phone').value.trim(), address:document.getElementById('s-address').value.trim() };\n  if(editingSupplierId){\n    const s = DB.suppliers.find(x=>x.id===editingSupplierId);\n    if(s) Object.assign(s, data);\n    showToast('Supplier Updated ✅');\n  } else {\n    DB.suppliers.push({ id:uid(), ...data });\n    showToast('Supplier Saved ✅');\n  }\n  saveDB();\n  editingSupplierId = null;\n  ['s-name','s-contact','s-phone','s-address'].forEach(id=>document.getElementById(id).value='');\n  document.getElementById('s-form-title').textContent = 'Add Supplier';\n  document.getElementById('s-save-btn').textContent = 'Save Supplier';\n  toggleForm('form-supplier'); renderAll();\n}\nfunction deleteSupplier(id){\n  if(!confirm('Delete this Supplier?')) return;\n  DB.suppliers = DB.suppliers.filter(s=>s.id!==id); saveDB(); renderAll();\n}\nfunction renderSuppliers(){\n  const box = document.getElementById('supplierList');\n  if(DB.suppliers.length===0){ box.innerHTML = '<div class=\"empty\">No Supplier found.<\/div>'; return; }\n  box.innerHTML = DB.suppliers.map(s=>{\n    const total = supplierTotalPurchase(s.id), due = supplierDue(s.id);\n    return `<div class=\"list-item\">\n      <div class=\"li-top\">\n        <div><div class=\"li-title\">${s.name}<\/div><div class=\"li-sub\">${s.contact||''} ${s.phone?('· '+s.phone):''}<\/div>\n        <div class=\"li-tags\"><span class=\"tag\">Total Purchase: ${fmt(total)}<\/span>${due>0?`<span class=\"tag low\">Payable: ${fmt(due)}<\/span>`:''}<\/div><\/div>\n      <\/div>\n      <div class=\"li-actions\">\n        <button class=\"btn btn-outline btn-sm\" onclick=\"editSupplier('${s.id}')\">✏️ Edit<\/button>\n        <button class=\"btn btn-danger btn-sm\" onclick=\"deleteSupplier('${s.id}')\">🗑️ Delete<\/button>\n      <\/div>\n    <\/div>`;\n  }).join('');\n}\n\n/* ---------------- PURCHASE ---------------- */\nlet editingBatchId = null;\n\nfunction populateSelects(){\n  const puS = document.getElementById('pu-supplier'), puP = document.getElementById('pu-product');\n  const slS = document.getElementById('sl-shop'), slP = document.getElementById('sl-product');\n  if(puS) puS.innerHTML = DB.suppliers.map(s=>`<option value=\"${s.id}\">${s.name}<\/option>`).join('') || '<option value=\"\">-- Add a Supplier first --<\/option>';\n  if(puP) puP.innerHTML = DB.products.map(p=>`<option value=\"${p.id}\">${p.name} ${p.brand?('('+p.brand+')'):''}<\/option>`).join('') || '<option value=\"\">-- Add a Product first --<\/option>';\n  if(slS) slS.innerHTML = DB.shops.map(s=>`<option value=\"${s.id}\">${s.name}<\/option>`).join('') || '<option value=\"\">-- Add a Shop first --<\/option>';\n  if(slP) slP.innerHTML = DB.products.map(p=>`<option value=\"${p.id}\">${p.name}<\/option>`).join('') || '<option value=\"\">-- Add a Product first --<\/option>';\n  if(slP && slP.value) loadBatchOptions();\n  const ivC = document.getElementById('inv-customer');\n  if(ivC) ivC.innerHTML = DB.shops.map(s=>`<option value=\"${s.id}\">${s.name}${s.phone?(' · '+s.phone):''}<\/option>`).join('') || '<option value=\"\">-- Add a Customer first --<\/option>';\n  populateStoreSwitcher();\n  renderBackupStatus();\n  renderBusinessProfileForm();\n}\nfunction openAddPurchaseForm(){\n  editingBatchId = null;\n  document.getElementById('pu-product').disabled = false;\n  document.getElementById('pu-supplier').disabled = false;\n  ['pu-batch','pu-invoice','pu-mfg','pu-exp','pu-qty','pu-tp','pu-mrp','pu-discount','pu-paid'].forEach(id=>document.getElementById(id).value='');\n  document.getElementById('pu-date').value = todayStr();\n  document.getElementById('pu-form-title').textContent = 'Purchase Invoice Entry';\n  document.getElementById('pu-save-btn').textContent = 'Save Purchase';\n  const panel = document.getElementById('form-purchase');\n  if(!panel.classList.contains('open')) toggleForm('form-purchase');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\nfunction editBatch(id){\n  const b = DB.batches.find(x=>x.id===id);\n  if(!b) return;\n  editingBatchId = id;\n  document.getElementById('pu-supplier').value = b.supplierId;\n  const supplierLocked = (b.soldQty||0)>0 || (b.initialPaid||0)>0 || DB.supplierPayments.some(p=>p.supplierId===b.supplierId);\n  document.getElementById('pu-supplier').disabled = supplierLocked;\n  document.getElementById('pu-product').value = b.productId;\n  document.getElementById('pu-product').disabled = (b.soldQty || 0) > 0;\n  document.getElementById('pu-batch').value = b.batchNo || '';\n  document.getElementById('pu-invoice').value = b.invoiceNo || '';\n  document.getElementById('pu-mfg').value = b.mfgDate || '';\n  document.getElementById('pu-exp').value = b.expDate || '';\n  document.getElementById('pu-qty').value = b.qty;\n  document.getElementById('pu-date').value = b.date || todayStr();\n  document.getElementById('pu-tp').value = (b.grossTp!=null ? b.grossTp : b.tp);\n  document.getElementById('pu-mrp').value = b.mrp;\n  document.getElementById('pu-discount').value = b.discount || 0;\n  document.getElementById('pu-paid').value = b.initialPaid || 0;\n  document.getElementById('pu-form-title').textContent = 'Update Purchase';\n  document.getElementById('pu-save-btn').textContent = 'Update Purchase';\n  const panel = document.getElementById('form-purchase');\n  if(!panel.classList.contains('open')) toggleForm('form-purchase');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\nfunction cancelPurchaseForm(){ editingBatchId = null; document.getElementById('pu-product').disabled = false; document.getElementById('pu-supplier').disabled = false; toggleForm('form-purchase'); }\nfunction savePurchase(){\n  const productId = document.getElementById('pu-product').value;\n  let supplierId = document.getElementById('pu-supplier').value;\n  const qty = Number(document.getElementById('pu-qty').value);\n  const tp = Number(document.getElementById('pu-tp').value);\n  const mrp = Number(document.getElementById('pu-mrp').value);\n  const discount = Number(document.getElementById('pu-discount').value)||0;\n  const paid = Number(document.getElementById('pu-paid').value)||0;\n  const mfgDate = document.getElementById('pu-mfg').value;\n  const expDate = document.getElementById('pu-exp').value;\n  if(!productId || !supplierId || !(qty>0) || !(tp>0)){ showToast('Fill in Product, Supplier, Quantity(>0), TP(>0)'); return; }\n  if(discount<0 || discount>100){ showToast('Discount % must be between 0-100'); return; }\n  // \"discount\" is a purchase-invoice discount from the supplier, so it reduces\n  // the actual per-unit cost basis (effectiveTp) used everywhere for stock\n  // value, supplier dues, and profit — not just a cosmetic display field.\n  const effectiveTp = discount ? +(tp*(1-discount/100)).toFixed(4) : tp;\n  const total = qty*effectiveTp;\n  if(paid<0 || paid>total){ showToast('Payment cannot be more than the total amount (Tk '+total.toFixed(2)+')'); return; }\n  if(mfgDate && expDate && expDate<mfgDate){ showToast('Expiry Date cannot be before Mfg Date'); return; }\n  if(mrp && mrp<effectiveTp && !confirm('MRP (Tk '+mrp+'), Cost after discount (Tk '+effectiveTp.toFixed(2)+') — this Product will sell at a loss. Continue?')) return;\n  if(editingBatchId){\n    const b = DB.batches.find(x=>x.id===editingBatchId);\n    if(b){\n      const soldSoFar = b.soldQty || 0;\n      if(qty < soldSoFar){ showToast(''+soldSoFar+' pcs have already been sold from this Batch, Quantity cannot be less than that'); return; }\n      if(soldSoFar > 0 && productId !== b.productId){ showToast(''+soldSoFar+' pcs have already been sold from this Batch, so Product cannot be changed'); return; }\n      const supplierLocked = document.getElementById('pu-supplier').disabled;\n      if(supplierLocked) supplierId = b.supplierId; // ignore any tampering; original supplier already has payments attached\n      b.productId = productId; b.supplierId = supplierId;\n      b.batchNo = document.getElementById('pu-batch').value.trim();\n      b.invoiceNo = document.getElementById('pu-invoice').value.trim();\n      b.mfgDate = mfgDate;\n      b.expDate = expDate;\n      b.qty = qty;\n      b.tp = effectiveTp; b.grossTp = tp; b.mrp = mrp||effectiveTp;\n      b.discount = discount;\n      b.date = document.getElementById('pu-date').value || todayStr();\n      b.initialPaid = paid;\n    }\n    showToast('Purchase Updated ✅');\n  } else {\n    DB.batches.push({\n      id:uid(), productId, supplierId, storeId: DB.settings.currentStoreId||'',\n      batchNo:document.getElementById('pu-batch').value.trim(),\n      invoiceNo:document.getElementById('pu-invoice').value.trim(),\n      mfgDate, expDate,\n      qty, soldQty:0, tp:effectiveTp, grossTp:tp, mrp: mrp||effectiveTp,\n      discount,\n      date: document.getElementById('pu-date').value || todayStr(),\n      initialPaid: paid\n    });\n    showToast('Purchase Saved ✅ Stock Updated');\n  }\n  saveDB();\n  editingBatchId = null;\n  document.getElementById('pu-product').disabled = false;\n  document.getElementById('pu-supplier').disabled = false;\n  ['pu-batch','pu-invoice','pu-mfg','pu-exp','pu-qty','pu-date','pu-tp','pu-mrp','pu-discount','pu-paid'].forEach(id=>document.getElementById(id).value='');\n  document.getElementById('pu-form-title').textContent = 'Purchase Invoice Entry';\n  document.getElementById('pu-save-btn').textContent = 'Save Purchase';\n  toggleForm('form-purchase'); renderAll();\n}\nfunction deleteBatch(id){\n  const b = DB.batches.find(x=>x.id===id);\n  if(b && (b.soldQty||0) > 0){ showToast(''+b.soldQty+' pcs have already been sold from this Batch, so it cannot be deleted — delete those Sales first'); return; }\n  if(!confirm('Delete this Purchase Batch?')) return;\n  DB.batches = DB.batches.filter(b=>b.id!==id); saveDB(); renderAll();\n}\n\n/* ---------------- EXCEL IMPORT HELPERS ---------------- */\nfunction num(v){ const n = Number(v); return isNaN(n) ? 0 : n; }\nfunction excelCellToDateStr(val){\n  if(val===undefined || val===null || val==='') return '';\n  if(val instanceof Date && !isNaN(val)) return val.toISOString().slice(0,10);\n  if(typeof val === 'number' && typeof XLSX!=='undefined' && XLSX.SSF){\n    const d = XLSX.SSF.parse_date_code(val);\n    if(d) return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0');\n  }\n  const s = String(val).trim();\n  let m = s.match(/^(\\d{4})[-\\/](\\d{1,2})[-\\/](\\d{1,2})/);\n  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');\n  m = s.match(/^(\\d{1,2})[-\\/](\\d{1,2})[-\\/](\\d{4})/);\n  if(m) return m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');\n  return s;\n}\nfunction pick(row, keys){\n  for(const k of keys){ if(row[k]!==undefined && row[k]!=='') return row[k]; }\n  return '';\n}\nfunction findOrCreateProduct(name){\n  name = String(name||'').trim();\n  if(!name) return null;\n  let p = DB.products.find(x=>(x.name||'').trim().toLowerCase()===name.toLowerCase());\n  if(!p){ p = { id:uid(), name, brand:'', category:'', subcategory:'', size:'', sku:'', barcode:'', minStock:0 }; DB.products.push(p); }\n  return p;\n}\nfunction findOrCreateSupplier(name){\n  name = String(name||'').trim();\n  if(!name) return null;\n  let s = DB.suppliers.find(x=>(x.name||'').trim().toLowerCase()===name.toLowerCase());\n  if(!s){ s = { id:uid(), name, contact:'', phone:'', address:'' }; DB.suppliers.push(s); }\n  return s;\n}\nfunction findOrCreateShop(name){\n  name = String(name||'').trim();\n  if(!name) return null;\n  let s = DB.shops.find(x=>(x.name||'').trim().toLowerCase()===name.toLowerCase());\n  if(!s){ s = { id:uid(), name, contact:'', phone:'', address:'' }; DB.shops.push(s); }\n  return s;\n}\nfunction readExcelRows(file, callback){\n  const reader = new FileReader();\n  reader.onload = function(e){\n    try{\n      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});\n      const sheet = wb.Sheets[wb.SheetNames[0]];\n      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});\n      callback(null, rows);\n    }catch(err){ callback(err); }\n  };\n  reader.onerror = function(){ callback(new Error('read failed')); };\n  reader.readAsArrayBuffer(file);\n}\nfunction downloadPurchaseTemplate(){\n  downloadCSV('purchase_import_template.csv', [\n    ['Product','Supplier','Batch Number','Invoice No','Mfg Date','Expiry Date','Quantity','Purchase Date','TP','MRP','Discount %','Paid'],\n    ['Napa 500mg','ABC Pharma Ltd','BX-001','INV-1001','2026-01-01','2027-06-30',100,'2026-08-14',8,10,0,500]\n  ]);\n  showToast('Downloading Sample Excel...');\n}\nfunction downloadSalesTemplate(){\n  downloadCSV('sales_import_template.csv', [\n    ['Shop','Product','Batch Number','Quantity','Date','MRP','Discount %','Transport Cost','Paid'],\n    ['ABC Pharmacy','Napa 500mg','BX-001',10,'2026-08-14',10,0,50,80]\n  ]);\n  showToast('Downloading Sample Excel...');\n}\n\n/* ---------------- PURCHASE EXCEL IMPORT ---------------- */\nfunction triggerPurchaseImport(){ document.getElementById('pu-excel-input').click(); }\nfunction importPurchaseExcel(evt){\n  const file = evt.target.files[0];\n  if(!file) return;\n  readExcelRows(file, function(err, rows){\n    evt.target.value='';\n    if(err){ showToast('Problem reading Excel file ❌'); console.error(err); return; }\n    let ok=0, fail=0; const errors=[]; const warnings=[];\n    rows.forEach((r,i)=>{\n      const productName = pick(r,['Product']);\n      const supplierName = pick(r,['Supplier']);\n      const qty = num(pick(r,['Quantity','Qty']));\n      const tp = num(pick(r,['TP']));\n      const mrp = num(pick(r,['MRP'])) || tp;\n      const discount = num(pick(r,['Discount %','Discount']));\n      const paid = num(pick(r,['Paid']));\n      const mfgDate = excelCellToDateStr(pick(r,['Mfg Date']));\n      const expDate = excelCellToDateStr(pick(r,['Expiry Date','Expiry']));\n      if(!productName || !supplierName || qty<=0 || tp<=0){ fail++; errors.push('Row '+(i+2)+': Product/Supplier/Quantity/TP missing or invalid (0 or negative)'); return; }\n      if(discount<0 || discount>100){ fail++; errors.push('Row '+(i+2)+': Discount % must be between 0-100'); return; }\n      const effectiveTp = discount ? +(tp*(1-discount/100)).toFixed(4) : tp;\n      const total = qty*effectiveTp;\n      if(paid<0 || paid>total){ fail++; errors.push('Row '+(i+2)+': Paid Amount cannot be more than the total amount (Tk '+total.toFixed(2)+')'); return; }\n      if(mfgDate && expDate && expDate<mfgDate){ fail++; errors.push('Row '+(i+2)+': Expiry Date cannot be before Mfg Date'); return; }\n      if(mrp<effectiveTp) warnings.push('Row '+(i+2)+': MRP (Tk '+mrp+') is less than Cost after discount (Tk '+effectiveTp.toFixed(2)+') — may sell at a loss');\n      const p = findOrCreateProduct(productName);\n      const s = findOrCreateSupplier(supplierName);\n      DB.batches.push({\n        id:uid(), productId:p.id, supplierId:s.id, storeId: DB.settings.currentStoreId||'',\n        batchNo: String(pick(r,['Batch Number','Batch'])).trim(),\n        invoiceNo: String(pick(r,['Invoice No','Invoice'])).trim(),\n        mfgDate, expDate,\n        qty, soldQty:0, tp:effectiveTp, grossTp:tp, mrp,\n        discount,\n        date: excelCellToDateStr(pick(r,['Purchase Date','Date'])) || todayStr(),\n        initialPaid: paid\n      });\n      ok++;\n    });\n    saveDB(); renderAll();\n    showToast('✅ '+ok+' Purchases Imported'+(fail?', '+fail+' skipped':''));\n    if(errors.length || warnings.length){ console.warn(errors.concat(warnings).join('\\n')); if(errors.length) alert(errors.slice(0,15).join('\\n')); }\n  });\n}\n\n/* ---------------- SALES EXCEL IMPORT ---------------- */\nfunction triggerSalesImport(){ document.getElementById('sl-excel-input').click(); }\nfunction importSalesExcel(evt){\n  const file = evt.target.files[0];\n  if(!file) return;\n  readExcelRows(file, function(err, rows){\n    evt.target.value='';\n    if(err){ showToast('Problem reading Excel file ❌'); console.error(err); return; }\n    let ok=0, fail=0; const errors=[];\n    rows.forEach((r,i)=>{\n      const shopName = String(pick(r,['Shop'])).trim();\n      const productName = String(pick(r,['Product'])).trim();\n      const qty = num(pick(r,['Quantity','Qty']));\n      const mrpIn = num(pick(r,['MRP']));\n      const disc = num(pick(r,['Discount %','Discount']));\n      const transport = num(pick(r,['Transport','Transport Cost']));\n      const paid = num(pick(r,['Paid']));\n      const dateStr = excelCellToDateStr(pick(r,['Date','Sale Date'])) || todayStr();\n      const batchNoWanted = String(pick(r,['Batch Number','Batch'])).trim();\n      if(!shopName || !productName || qty<=0){ fail++; errors.push('Row '+(i+2)+': Shop/Product/Quantity missing or invalid (0 or negative)'); return; }\n      if(disc<0 || disc>100){ fail++; errors.push('Row '+(i+2)+': Discount % must be between 0-100'); return; }\n      const p = DB.products.find(x=>(x.name||'').trim().toLowerCase()===productName.toLowerCase());\n      if(!p){ fail++; errors.push('Row '+(i+2)+': Product \"'+productName+'\" not found'); return; }\n      const shop = findOrCreateShop(shopName);\n      // Only consider batches belonging to the currently active branch, so a sale\n      // never draws stock from a different branch than the one it's recorded under.\n      let batches = DB.batches.filter(b=>b.productId===p.id && batchStock(b)>0 && inCurrentStore(b.storeId));\n      let b = null;\n      if(batchNoWanted){\n        b = batches.find(x=>(x.batchNo||'').trim().toLowerCase()===batchNoWanted.toLowerCase());\n        if(!b){ fail++; errors.push('Row '+(i+2)+': Batch \"'+batchNoWanted+'\" not found in this Branch'); return; }\n      } else {\n        b = batches.sort((a,c)=>(a.expDate||'9999').localeCompare(c.expDate||'9999'))[0];\n      }\n      if(!b){ fail++; errors.push('Row '+(i+2)+': No stock for \"'+productName+'\" in this Branch'); return; }\n      if(qty > batchStock(b)){ fail++; errors.push('Row '+(i+2)+': Not enough stock (remaining '+batchStock(b)+')'); return; }\n      const mrp = mrpIn || b.mrp;\n      const sellingPrice = mrp - (mrp*disc/100);\n      const total = sellingPrice*qty;\n      if(paid<0 || paid>total+0.01){ fail++; errors.push('Row '+(i+2)+': Paid Amount cannot be more than the total bill (Tk '+total.toFixed(2)+')'); return; }\n      const profit = (sellingPrice - b.tp) * qty - transport;\n      DB.sales.push({ id:uid(), date:dateStr, shopId:shop.id, productId:p.id, batchId:b.id,\n        storeId: DB.settings.currentStoreId||'', qty, mrp, discountPct:disc, sellingPrice, tp:b.tp, transport, profit, paid });\n      b.soldQty += qty;\n      ok++;\n    });\n    saveDB(); renderAll();\n    showToast('✅ '+ok+' Sales Imported'+(fail?', '+fail+' skipped':''));\n    if(errors.length){ console.warn(errors.join('\\n')); if(fail) alert(errors.slice(0,15).join('\\n')); }\n  });\n}\n\nfunction renderPurchases(){\n  const box = document.getElementById('purchaseList');\n  const storeBatches = DB.batches.filter(b=>inCurrentStore(b.storeId));\n  if(storeBatches.length===0){ box.innerHTML = '<div class=\"empty\">No Purchase found.<\/div>'; return; }\n  const productIds = [...new Set(storeBatches.map(b=>b.productId))];\n  const withProduct = productIds.map(id=>DB.products.find(p=>p.id===id)).filter(Boolean)\n    .sort((a,b)=>{\n      const ba = storeBatches.filter(x=>x.productId===a.id).reduce((s,x)=>s+x.qty*x.tp,0);\n      const bb = storeBatches.filter(x=>x.productId===b.id).reduce((s,x)=>s+x.qty*x.tp,0);\n      return bb-ba;\n    });\n  if(withProduct.length===0){ box.innerHTML = '<div class=\"empty\">No Purchase found.<\/div>'; return; }\n  box.innerHTML = withProduct.map(p=>{\n    const batches = storeBatches.filter(b=>b.productId===p.id);\n    const totalQty = batches.reduce((s,b)=>s+Number(b.qty||0),0);\n    const totalCost = batches.reduce((s,b)=>s+b.qty*b.tp,0);\n    const stockLeft = batches.reduce((s,b)=>s+batchStock(b),0);\n    const lastDate = batches.reduce((m,b)=> (b.date||'') > m ? b.date : m, '');\n    const nearExp = batches.some(b=>{ const d=daysUntil(b.expDate); return d!==null && d<=30; });\n    return `<div class=\"list-item\" onclick=\"openProductDetail('${p.id}')\" style=\"cursor:pointer;\">\n      <div class=\"li-top\">\n        <div><div class=\"li-title\">📦 ${p.name}<\/div>\n        <div class=\"li-sub\">${batches.length} Entries${lastDate?(' · Last '+lastDate):''}<\/div>\n        <div class=\"li-tags\"><span class=\"tag\">Qty: ${totalQty}<\/span><span class=\"tag\">Cost: ${fmt(totalCost)}<\/span><span class=\"tag\">Stock Left: ${stockLeft}<\/span>${nearExp?'<span class=\"tag low\">Expiry Soon<\/span>':''}<\/div><\/div>\n      <\/div>\n    <\/div>`;\n  }).join('');\n}\n\n/* ---------------- INVENTORY ---------------- */\nlet invFilter = 'all';\nfunction renderInventoryFilters(){\n  const cats = ['all', ...new Set(DB.products.map(p=>p.category).filter(Boolean))];\n  document.getElementById('invFilters').innerHTML = cats.map(c=>`<button class=\"chip ${invFilter===c?'active':''}\" onclick=\"setInvFilter('${c}')\">${c==='all'?'All':c}<\/button>`).join('');\n}\nfunction setInvFilter(c){ invFilter=c; renderInventory(); }\nfunction renderInventory(){\n  renderInventoryFilters();\n  const q = (document.getElementById('invSearch')?.value||'').toLowerCase();\n  let rows = DB.batches.filter(b=>batchStock(b)>0 && inCurrentStore(b.storeId));\n  if(invFilter!=='all') rows = rows.filter(b=>{ const p=DB.products.find(x=>x.id===b.productId); return p && p.category===invFilter; });\n  if(q) rows = rows.filter(b=>{ const p=DB.products.find(x=>x.id===b.productId); return p && (p.name+p.brand+p.sku+p.barcode).toLowerCase().includes(q); });\n  rows.sort((a,b)=>(a.expDate||'9999').localeCompare(b.expDate||'9999'));\n  const tb = document.getElementById('inventoryTable');\n  if(rows.length===0){ tb.innerHTML = '<tr><td colspan=\"6\" style=\"text-align:center;color:var(--muted);padding:16px;\">No data found<\/td><\/tr>'; return; }\n  tb.innerHTML = rows.map(b=>{\n    const stock = batchStock(b);\n    const d = daysUntil(b.expDate);\n    let expLabel = b.expDate||'-';\n    let color = 'inherit';\n    if(d!==null){ if(d<0) color='var(--red)'; else if(d<=30) color='var(--red)'; else if(d<=90) color='var(--amber)'; }\n    return `<tr><td>${productName(b.productId)}<\/td><td>${b.batchNo||'-'}<\/td><td>${stock}<\/td><td style=\"color:${color}\">${expLabel}<\/td><td>${fmt(stock*b.tp)}<\/td><td>${fmt(stock*b.mrp)}<\/td><\/tr>`;\n  }).join('');\n}\n\n/* ---------------- SHOPS ---------------- */\nlet editingShopId = null;\n\nfunction openAddShopForm(){\n  editingShopId = null;\n  ['sh-name','sh-contact','sh-phone','sh-email','sh-address','sh-opening'].forEach(id=>document.getElementById(id).value='');\n  document.getElementById('sh-form-title').textContent = 'Add Shop';\n  document.getElementById('sh-save-btn').textContent = 'Save Shop';\n  const panel = document.getElementById('form-shop');\n  if(!panel.classList.contains('open')) toggleForm('form-shop');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\nfunction editShop(id){\n  const s = DB.shops.find(x=>x.id===id);\n  if(!s) return;\n  editingShopId = id;\n  document.getElementById('sh-name').value = s.name || '';\n  document.getElementById('sh-contact').value = s.contact || '';\n  document.getElementById('sh-phone').value = s.phone || '';\n  document.getElementById('sh-email').value = s.email || '';\n  document.getElementById('sh-address').value = s.address || '';\n  document.getElementById('sh-opening').value = s.openingBalance || '';\n  document.getElementById('sh-form-title').textContent = 'Update Shop';\n  document.getElementById('sh-save-btn').textContent = 'Update Shop';\n  const panel = document.getElementById('form-shop');\n  if(!panel.classList.contains('open')) toggleForm('form-shop');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\nfunction cancelShopForm(){ editingShopId = null; toggleForm('form-shop'); }\nfunction saveShop(){\n  const name = document.getElementById('sh-name').value.trim();\n  if(!name){ showToast('Enter Shop Name'); return; }\n  const data = { name, contact:document.getElementById('sh-contact').value.trim(),\n    phone:document.getElementById('sh-phone').value.trim(), email:document.getElementById('sh-email').value.trim(),\n    address:document.getElementById('sh-address').value.trim(),\n    openingBalance: Number(document.getElementById('sh-opening').value)||0 };\n  if(editingShopId){\n    const s = DB.shops.find(x=>x.id===editingShopId);\n    if(s) Object.assign(s, data);\n    showToast('Shop Updated ✅');\n  } else {\n    DB.shops.push({ id:uid(), ...data });\n    showToast('Shop Saved ✅');\n  }\n  saveDB();\n  editingShopId = null;\n  ['sh-name','sh-contact','sh-phone','sh-email','sh-address','sh-opening'].forEach(id=>document.getElementById(id).value='');\n  document.getElementById('sh-form-title').textContent = 'Add Shop';\n  document.getElementById('sh-save-btn').textContent = 'Save Shop';\n  toggleForm('form-shop'); renderAll();\n}\nfunction deleteShop(id){\n  if(!confirm('Delete this Shop?')) return;\n  DB.shops = DB.shops.filter(s=>s.id!==id); saveDB(); renderAll();\n}\nfunction renderShops(){\n  const box = document.getElementById('shopList');\n  if(DB.shops.length===0){ box.innerHTML = '<div class=\"empty\">No Shop found.<\/div>'; return; }\n  box.innerHTML = DB.shops.map(s=>{\n    const total = shopTotalSales(s.id), due = shopDue(s.id);\n    const sales = DB.sales.filter(x=>x.shopId===s.id);\n    const profit = sales.reduce((a,x)=>a+x.profit,0);\n    return `<div class=\"list-item\" onclick=\"openShopDetail('${s.id}')\" style=\"cursor:pointer;\">\n      <div class=\"li-top\">\n        <div><div class=\"li-title\">${s.name}<\/div><div class=\"li-sub\">${s.contact||''} ${s.phone?('· '+s.phone):''}<\/div>\n        <div class=\"li-tags\"><span class=\"tag\">Sales: ${fmt(total)}<\/span><span class=\"tag\">Profit: ${fmt(profit)}<\/span>${due>0?`<span class=\"tag low\">Due: ${fmt(due)}<\/span>`:''}<\/div><\/div>\n      <\/div>\n      <div class=\"li-actions\">\n        <button class=\"btn btn-outline btn-sm\" onclick=\"event.stopPropagation();openDueHistory('shop','${s.id}')\">📜 Statement<\/button>\n        <button class=\"btn btn-outline btn-sm\" onclick=\"event.stopPropagation();editShop('${s.id}')\">✏️ Edit<\/button>\n        <button class=\"btn btn-danger btn-sm\" onclick=\"event.stopPropagation();deleteShop('${s.id}')\">🗑️ Delete<\/button>\n      <\/div>\n    <\/div>`;\n  }).join('');\n}\nfunction openShopDetail(shopId){\n  const s = DB.shops.find(x=>x.id===shopId);\n  if(!s) return;\n  const sales = DB.sales.filter(x=>x.shopId===shopId).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));\n  const total = shopTotalSales(shopId), paid = shopPaidTotal(shopId), due = shopDue(shopId);\n  const profit = sales.reduce((a,x)=>a+x.profit,0);\n  document.getElementById('sd-name').textContent = '🏬 ' + s.name;\n  document.getElementById('sd-sub').textContent = [s.contact, s.phone].filter(Boolean).join(' · ') || (sales.length+' Sales');\n  document.getElementById('sd-stats').innerHTML = `\n    <div class=\"dbst\"><div class=\"v\">${fmt(total)}<\/div><div class=\"l\">Total Sales<\/div><\/div>\n    <div class=\"dbst\"><div class=\"v\">${fmt(paid)}<\/div><div class=\"l\">Paid<\/div><\/div>\n    <div class=\"dbst due\"><div class=\"v\">${fmt(due)}<\/div><div class=\"l\">Due<\/div><\/div>\n    <div class=\"dbst\"><div class=\"v\">${fmt(profit)}<\/div><div class=\"l\">Profit<\/div><\/div>`;\n  const box = document.getElementById('sd-list');\n  let listHtml = `<div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;\">\n      <button class=\"btn btn-primary btn-sm\" onclick=\"addShopPayment('${shopId}')\">💰 Payment Add<\/button>\n      <button class=\"btn btn-outline btn-sm\" onclick=\"closeShopDetail();openDueHistory('shop','${shopId}')\">📜 Full Statement (Ledger)<\/button>\n    <\/div>`;\n  if(sales.length===0){\n    listHtml += '<div class=\"empty\">No sales in this shop.<\/div>';\n  } else {\n    listHtml += groupedSales(sales).map(x=>{\n      const lineTotal = x.total + x.ship + x.cod, lineDue = lineTotal - (x.paid||0);\n      return `<div class=\"dbsale\">\n        <div class=\"r1\"><span>${saleProductsLabel(x)}<\/span><span>${fmt(lineTotal)}<\/span><\/div>\n        <div class=\"r2\"><span>📅 ${x.date||''} · ${x.qty} pcs${x.recs.length>1?' · '+x.recs.length+' Batches':''}${x.transport>0?' · 🚚 Tk '+x.transport:''}${x.courier?' · 🚚 Courier (Delivery '+fmt(x.cDel)+' · COD '+fmt(x.cCod)+')':''}<\/span><span>Profit ${fmt(x.profit)}${lineDue>0?(' · Due '+fmt(lineDue)):''}<\/span><\/div>\n        ${x.note?`<div style=\"font-size:11px;color:var(--muted);margin-top:4px;\">📝 ${x.note}<\/div>`:''}\n        <div class=\"r3\">\n          <button class=\"btn btn-outline\" onclick=\"closeShopDetail();go('sales');setTimeout(()=>editSale('${x.id}'),80);\">✏️ Edit<\/button>\n          <button class=\"btn btn-whatsapp\" onclick=\"shareSaleWhatsApp('${x.id}')\">📤 WhatsApp<\/button>\n          <button class=\"btn btn-danger\" onclick=\"deleteSale('${x.id}');openShopDetail('${shopId}');\">🗑️ Delete<\/button>\n        <\/div>\n      <\/div>`;\n    }).join('');\n  }\n  box.innerHTML = listHtml;\n  document.getElementById('shopDetailModal').classList.add('open');\n}\nfunction closeShopDetail(){ document.getElementById('shopDetailModal').classList.remove('open'); }\n\n/* ---------------- QUICK SALE (5 product boxes) ---------------- */\nconst QS_ROWS = 5;\nfunction qsBridge(){ try{ return window.parent && window.parent!==window ? window.parent.mhsBridge : null; }catch(e){ return null; } }\nfunction qsFifoBatches(pid){ return productBatches(pid).filter(b=>batchStock(b)>0).sort((a,b)=>(a.expDate||'9999').localeCompare(b.expDate||'9999')); }\nfunction qsBuildRows(){\n  const opts = '<option value=\"\">— Select product —<\/option>' + DB.products.map(p=>`<option value=\"${p.id}\">${p.name}${p.brand?(' ('+p.brand+')'):''}<\/option>`).join('');\n  const box = document.getElementById('qs-rows');\n  box.innerHTML = Array.from({length:QS_ROWS},(_,i)=>`\n    <div class=\"sl-brow\" id=\"qs-row-${i}\">\n      <div class=\"sl-binfo\"><b>Product ${i+1}<\/b> <span id=\"qs-info-${i}\"><\/span><\/div>\n      <select id=\"qs-p-${i}\" style=\"width:100%;margin-bottom:6px;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;\" onchange=\"qsProductChange(${i})\">${opts}<\/select>\n      <div class=\"sl-binputs\">\n        <label>Quantity<input id=\"qs-q-${i}\" type=\"number\" min=\"0\" placeholder=\"0\" oninput=\"qsCalc()\"><\/label>\n        <label>MRP (per unit)<input id=\"qs-m-${i}\" type=\"number\" min=\"0\" placeholder=\"0\" oninput=\"qsCalc()\"><\/label>\n        <label>Line Total<input id=\"qs-l-${i}\" type=\"number\" readonly style=\"background:#EFF6F4;\"><\/label>\n      <\/div>\n    <\/div>`).join('');\n}\nfunction qsProductChange(i){\n  const pid = document.getElementById('qs-p-'+i).value;\n  const info = document.getElementById('qs-info-'+i);\n  const mrp = document.getElementById('qs-m-'+i);\n  if(!pid){ info.textContent=''; mrp.value=''; qsCalc(); return; }\n  const bs = qsFifoBatches(pid);\n  const left = bs.reduce((a,b)=>a+batchStock(b),0);\n  info.textContent = '· Stock '+left;\n  mrp.value = bs.length ? bs[0].mrp : '';\n  qsCalc();\n}\nfunction qsLines(){\n  const out=[];\n  for(let i=0;i<QS_ROWS;i++){\n    const pid=document.getElementById('qs-p-'+i).value;\n    const qty=Number(document.getElementById('qs-q-'+i).value)||0;\n    const mrp=Number(document.getElementById('qs-m-'+i).value)||0;\n    out.push({i,pid,qty,mrp});\n  }\n  return out;\n}\nfunction qsCalc(){\n  let total=0;\n  qsLines().forEach(l=>{\n    const lt = l.pid ? l.qty*l.mrp : 0;\n    total += lt;\n    document.getElementById('qs-l-'+l.i).value = lt>0 ? lt : '';\n    document.getElementById('qs-row-'+l.i).classList.toggle('active', !!l.pid && l.qty>0);\n  });\n  const ship=Number(document.getElementById('qs-ship').value)||0;\n  const cod=Number(document.getElementById('qs-cod').value)||0;\n  const disc=Number(document.getElementById('qs-disc').value)||0;\n  const grand=Math.max(0,total+ship+cod-disc);\n  const bank=Number(document.getElementById('qs-bank').value)||0;\n  const bkash=Number(document.getElementById('qs-bkash').value)||0;\n  const net=bank+bkash;\n  document.getElementById('qs-total').textContent = fmt(total);\n  document.getElementById('qs-grand').textContent = fmt(grand);\n  document.getElementById('qs-net').value = net>0 ? net : '';\n  document.getElementById('qs-due').value = grand>0 ? Math.max(0,grand-net) : '';\n  return {total,ship,cod,disc,grand,bank,bkash,net};\n}\nfunction openQuickSale(){\n  qsRestorePending(); qsSetMode(false);\n  qsBuildRows();\n  document.getElementById('qs-shop').innerHTML = DB.shops.map(s=>`<option value=\"${s.id}\">${s.name}<\/option>`).join('') || '<option value=\"\">-- Add a Shop first --<\/option>';\n  document.getElementById('qs-date').value = todayStr();\n  ['qs-bank','qs-bkash','qs-note','qs-ship','qs-cod','qs-disc'].forEach(id=>document.getElementById(id).value='');\n  qsCalc();\n  const panel = document.getElementById('form-qsale');\n  if(!panel.classList.contains('open')) toggleForm('form-qsale');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\nfunction qsSetMode(edit){\n  const p=document.getElementById('form-qsale');\n  p.querySelector('h3').textContent = edit ? '✏️ Edit Quick Sale' : '⚡ Quick Sale — 5 Products';\n  p.querySelector('.form-actions .btn-primary').textContent = edit ? 'Update Quick Sale' : 'Save Quick Sale';\n}\nfunction qsRestorePending(){\n  if(qsEditingId){ restoreSaleStock(qsEditingId); qsEditingId=null; qsSetMode(false); }\n}\nfunction cancelQuickSale(){ qsRestorePending(); toggleForm('form-qsale'); renderAll(); }\nfunction editQuickSale(id){\n  const recs=saleGroupRecs(id); if(!recs.length) return;\n  qsRestorePending();\n  releaseSaleStock(id);            // free this sale's stock so it can be re-entered\n  qsEditingId=id;\n  qsBuildRows();\n  document.getElementById('qs-shop').innerHTML = DB.shops.map(s=>`<option value=\"${s.id}\">${s.name}<\/option>`).join('') || '<option value=\"\">-- Add a Shop first --<\/option>';\n  document.getElementById('qs-shop').value = recs[0].shopId;\n  document.getElementById('qs-date').value = recs[0].date || todayStr();\n  const lines=new Map();\n  recs.forEach(r=>{ const k=r.productId+'|'+r.mrp; const o=lines.get(k)||{pid:r.productId,mrp:r.mrp,qty:0}; o.qty+=r.qty; lines.set(k,o); });\n  [...lines.values()].slice(0,QS_ROWS).forEach((l,i)=>{\n    document.getElementById('qs-p-'+i).value=l.pid;\n    qsProductChange(i);\n    document.getElementById('qs-m-'+i).value=l.mrp;\n    document.getElementById('qs-q-'+i).value=l.qty;\n  });\n  const sum=f=>recs.reduce((a,r)=>a+(r[f]||0),0);\n  const setv=(i,v)=>{ document.getElementById(i).value = v ? v : ''; };\n  setv('qs-ship',sum('shipCharge')); setv('qs-cod',sum('codCharge')); setv('qs-disc',sum('extraDiscount'));\n  setv('qs-bank',sum('payBank')); setv('qs-bkash',sum('payBkash'));\n  let un = recs[0].qsNote;\n  if(un===undefined) un = (recs[0].note||'').split(' · ').filter(p=>!/^(Quick Sale|Shipping |COD |Discount |Bank |bKash )/.test(p)).join(' · ');\n  document.getElementById('qs-note').value = un||'';\n  qsSetMode(true);\n  qsCalc();\n  const panel=document.getElementById('form-qsale');\n  if(!panel.classList.contains('open')) toggleForm('form-qsale');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\nfunction saveQuickSale(){\n  const shopId = document.getElementById('qs-shop').value;\n  const lines = qsLines().filter(l=>l.pid && l.qty>0);\n  if(!shopId){ showToast('Select a Shop'); return; }\n  if(!lines.length){ showToast('Select at least one Product with Quantity'); return; }\n  const t = qsCalc();\n  if(t.net<0 || t.bank<0 || t.bkash<0){ showToast('Payment cannot be negative'); return; }\n  if(t.ship<0 || t.cod<0 || t.disc<0){ showToast('Shipping, COD and Discount cannot be negative'); return; }\n  if(t.disc>t.total+0.01){ showToast('Discount cannot be more than Total MRP (Tk '+t.total+')'); return; }\n  if(t.net>t.grand+0.01){ showToast('Net Payment cannot be more than Grand Total (Tk '+t.grand+')'); return; }\n  // stock check per product (same product picked in two boxes is summed)\n  const need={}; lines.forEach(l=>{ need[l.pid]=(need[l.pid]||0)+l.qty; });\n  for(const pid in need){\n    const left = qsFifoBatches(pid).reduce((a,b)=>a+batchStock(b),0);\n    if(need[pid]>left){ showToast('Not enough Stock for '+productName(pid)+' (left '+left+')'); return; }\n  }\n  const date = document.getElementById('qs-date').value || todayStr();\n  const userNote = (document.getElementById('qs-note').value||'').trim();\n  const note = ('Quick Sale'+(t.ship?(' · Shipping '+t.ship):'')+(t.cod?(' · COD '+t.cod):'')+(t.disc?(' · Discount '+t.disc):'')+(t.bank?(' · Bank '+t.bank):'')+(t.bkash?(' · bKash '+t.bkash):'')+(userNote?(' · '+userNote):''));\n  // build one sale record per batch (FIFO: nearest expiry first); each box keeps its own MRP\n  const recs=[]; const used={}; // used[batchId] = qty taken in this save\n  lines.forEach(l=>{\n    let left=l.qty;\n    qsFifoBatches(l.pid).forEach(b=>{\n      if(left<=0) return;\n      const avail = batchStock(b) - (used[b.id]||0);\n      const take = Math.min(avail,left); if(take<=0) return;\n      used[b.id]=(used[b.id]||0)+take; left-=take;\n      recs.push({b, productId:l.pid, qty:take, mrp:l.mrp});\n    });\n  });\n  // spread the Discount over the lines in proportion to their MRP value\n  const gross = recs.reduce((a,r)=>a+r.mrp*r.qty,0);\n  recs.forEach(r=>{\n    const share = gross>0 ? t.disc*(r.mrp*r.qty)/gross : 0;\n    r.sp = r.qty>0 ? r.mrp - share/r.qty : r.mrp;\n  });\n  // editing: swap the old entries for the new ones (their stock was already released when Edit was opened)\n  const qsWasEditing = qsEditingId; let qsStoreId = DB.settings.currentStoreId||'';\n  if(qsWasEditing){\n    const old=saleGroupRecs(qsWasEditing);\n    if(old[0]) qsStoreId = old[0].storeId||'';\n    const oldIds=new Set(old.map(r=>r.id));\n    DB.sales = DB.sales.filter(x=>!oldIds.has(x.id));\n    qsEditingId=null; qsSetMode(false);\n  }\n  const groupId = recs.length>1 ? uid() : undefined;\n  let paidLeft = t.net; const made=[];\n  recs.forEach((r,i)=>{\n    const total = r.sp*r.qty;\n    const paid = Math.min(paidLeft,total); paidLeft-=paid;\n    const rec = { id:uid(), storeId:qsStoreId, date, shopId, productId:r.productId, batchId:r.b.id,\n      qty:r.qty, mrp:r.mrp, discountPct:0, sellingPrice:r.sp, tp:r.b.tp, transport:0,\n      profit:(r.sp-r.b.tp)*r.qty, paid, note, saleGroup:groupId,\n      shipCharge: i===0 ? t.ship : 0, codCharge: i===0 ? t.cod : 0, extraDiscount: i===0 ? t.disc : 0,\n      payBank: i===0 ? t.bank : 0, payBkash: i===0 ? t.bkash : 0, qsNote:userNote };\n    r.b.soldQty += r.qty;\n    DB.sales.push(rec); made.push(rec);\n  });\n  // whatever is left of the payment covers Shipping / COD charges\n  if(paidLeft>0.0001 && made.length) made[made.length-1].paid += paidLeft;\n  saveDB();\n  toggleForm('form-qsale');\n  showToast(qsWasEditing ? 'Quick Sale Updated ✅' : 'Quick Sale Saved ✅');\n  renderAll();\n}\n\n/* ---------------- COURIER DELIVERY ---------------- */\n/* Same stock rule as Quick Sale: every unit sold is taken from the Batches (FIFO, nearest expiry first),\n   so Product stock goes down on save and comes back if the sale is deleted. */\nfunction crNum(id){ return Number(document.getElementById(id).value)||0; }\nfunction crR2(n){ return Math.round((n||0)*100)/100; }\nfunction crPlan(pid, qty){\n  const recs=[]; let left=qty;\n  qsFifoBatches(pid).forEach(b=>{\n    if(left<=0) return;\n    const take=Math.min(batchStock(b), left); if(take<=0) return;\n    recs.push({b, qty:take}); left-=take;\n  });\n  return {recs, short:left};\n}\nfunction crCalc(){\n  const pid=document.getElementById('cr-product').value;\n  const qty=crNum('cr-qty'), mrp=crNum('cr-mrp'), disc=crNum('cr-disc'), adv=crNum('cr-adv'), del=crNum('cr-del');\n  const total = pid ? qty*mrp : 0;\n  const payable = Math.max(0, total-disc);\n  const due = Math.max(0, payable-adv);\n  const gross = due-del;                         // Gross Profit = Due − Delivery Charge\n  const mode = document.getElementById('cr-codmode').value;\n  const cv = crNum('cr-codval');\n  const cod = crR2(mode==='pct' ? Math.max(0,gross)*cv/100 : cv);   // COD Charge: % of Gross Profit, or direct Tk\n  const net = crR2(gross-cod);                   // Net Profit = Gross Profit − COD Charge\n  document.getElementById('cr-due').value = (pid && payable>0) ? crR2(due) : '';\n  document.getElementById('cr-gross').textContent = fmt(gross);\n  document.getElementById('cr-codamt').textContent = fmt(cod);\n  document.getElementById('cr-net').textContent = fmt(net);\n  let cost=0; if(pid && qty>0){ crPlan(pid,qty).recs.forEach(r=>{ cost+=r.b.tp*r.qty; }); }\n  document.getElementById('cr-costnote').textContent = pid ? ('Product cost (TP) '+fmt(cost)+' → Final profit after cost: '+fmt(payable-cost-del-cod)) : '';\n  return {pid,qty,mrp,disc,adv,del,total,payable,due,gross,mode,cv,cod,net,cost};\n}\nfunction crCodModeChange(){\n  const mode=document.getElementById('cr-codmode').value;\n  document.getElementById('cr-codlbl').textContent = mode==='pct' ? 'COD Charge (%)' : 'COD Charge (Tk)';\n  document.getElementById('cr-codval').value = mode==='pct' ? 1 : '';\n  crCalc();\n}\nfunction crProductChange(){\n  const pid=document.getElementById('cr-product').value;\n  const info=document.getElementById('cr-info'), mrp=document.getElementById('cr-mrp');\n  if(!pid){ info.textContent=''; mrp.value=''; crCalc(); return; }\n  const bs=qsFifoBatches(pid);\n  info.textContent='· Stock '+bs.reduce((a,b)=>a+batchStock(b),0);\n  mrp.value = bs.length ? bs[0].mrp : '';\n  crCalc();\n}\nfunction openCourierSale(){\n  qsRestorePending();\n  document.getElementById('cr-shop').innerHTML = DB.shops.map(s=>`<option value=\"${s.id}\">${s.name}<\/option>`).join('') || '<option value=\"\">-- Add a Shop first --<\/option>';\n  document.getElementById('cr-product').innerHTML = '<option value=\"\">— Select product —<\/option>' + DB.products.map(p=>`<option value=\"${p.id}\">${p.name}${p.brand?(' ('+p.brand+')'):''}<\/option>`).join('');\n  document.getElementById('cr-date').value = todayStr();\n  ['cr-mrp','cr-disc','cr-adv','cr-del','cr-note'].forEach(id=>document.getElementById(id).value='');\n  document.getElementById('cr-qty').value = 1;\n  document.getElementById('cr-codmode').value = 'pct';\n  document.getElementById('cr-codlbl').textContent = 'COD Charge (%)';\n  document.getElementById('cr-codval').value = 1;\n  document.getElementById('cr-info').textContent = '';\n  crCalc();\n  const panel=document.getElementById('form-courier');\n  if(!panel.classList.contains('open')) toggleForm('form-courier');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\nfunction saveCourierSale(){\n  const shopId=document.getElementById('cr-shop').value;\n  const t=crCalc();\n  if(!shopId){ showToast('Select a Shop'); return; }\n  if(!t.pid){ showToast('Select a Product'); return; }\n  if(!(t.qty>0)){ showToast('Enter Product Quantity'); return; }\n  if(t.mrp<0 || t.disc<0 || t.adv<0 || t.del<0 || t.cv<0){ showToast('Amounts cannot be negative'); return; }\n  if(t.mode==='pct' && t.cv>100){ showToast('COD % must be between 0-100'); return; }\n  if(t.disc>t.total+0.01){ showToast('Discount cannot be more than Total MRP (Tk '+t.total+')'); return; }\n  if(t.adv>t.payable+0.01){ showToast('Advance cannot be more than Payable (Tk '+t.payable+')'); return; }\n  const plan=crPlan(t.pid,t.qty);\n  if(plan.short>0){ showToast('Not enough Stock for '+productName(t.pid)+' (left '+(t.qty-plan.short)+')'); return; }\n  const date=document.getElementById('cr-date').value||todayStr();\n  const userNote=(document.getElementById('cr-note').value||'').trim();\n  const note='Courier Delivery · Delivery '+t.del+' · COD '+t.cod+(t.disc?(' · Discount '+t.disc):'')+(t.adv?(' · Advance '+t.adv):'')+(userNote?(' · '+userNote):'');\n  const sp = t.mrp - t.disc/t.qty;               // discount spread equally over the units\n  const groupId = plan.recs.length>1 ? uid() : undefined;\n  let paidLeft=t.adv;\n  plan.recs.forEach((r,i)=>{\n    const total=sp*r.qty;\n    const paid=Math.min(paidLeft,total); paidLeft-=paid;\n    DB.sales.push({ id:uid(), storeId:DB.settings.currentStoreId||'', date, shopId, productId:t.pid, batchId:r.b.id,\n      qty:r.qty, mrp:t.mrp, discountPct:0, sellingPrice:sp, tp:r.b.tp, transport:0,\n      profit:(sp-r.b.tp)*r.qty - (i===0 ? (t.del+t.cod) : 0), paid, note, saleGroup:groupId,\n      shipCharge:0, codCharge:0, extraDiscount: i===0 ? t.disc : 0,\n      courier:true, courierCharge: i===0 ? t.del : 0, courierCod: i===0 ? t.cod : 0,\n      courierCodMode: i===0 ? t.mode : undefined, courierCodVal: i===0 ? t.cv : undefined });\n    r.b.soldQty += r.qty;                        // stock minus\n  });\n  const made=DB.sales.filter(x=>groupId ? x.saleGroup===groupId : false);\n  if(paidLeft>0.0001){ const last=groupId ? made[made.length-1] : DB.sales[DB.sales.length-1]; if(last) last.paid += paidLeft; }\n  saveDB();\n  toggleForm('form-courier');\n  showToast('Courier Delivery Saved ✅');\n  renderAll();\n}\n\n/* ---------------- SALES ---------------- */\nfunction loadBatchOptions(){\n  const pid = document.getElementById('sl-product').value;\n  const box = document.getElementById('sl-batch-list');\n  // remember what was already typed so refreshes don't wipe the entry\n  const keep = {};\n  box.querySelectorAll('.sl-brow').forEach(r=>{\n    keep[r.dataset.bid] = {qty:r.querySelector('.sl-bqty').value, mrp:r.querySelector('.sl-bmrp').value};\n  });\n  const batches = productBatches(pid).filter(b=>batchStock(b)>0).sort((a,b)=>(a.expDate||'9999').localeCompare(b.expDate||'9999'));\n  if(!batches.length){ box.innerHTML = '<div class=\"empty\" style=\"padding:10px 0;\">No stock<\/div>'; calcSale(); return; }\n  box.innerHTML = batches.map(b=>{\n    const k = keep[b.id];\n    const exp = b.expDate ? (' · Exp '+b.expDate) : '';\n    return `<div class=\"sl-brow\" data-bid=\"${b.id}\">\n      <div class=\"sl-binfo\"><b>Batch ${b.batchNo||'-'}<\/b> · Left ${batchStock(b)} · TP ${b.tp}${exp}<\/div>\n      <div class=\"sl-binputs\">\n        <label>Quantity<input class=\"sl-bqty\" type=\"number\" min=\"0\" placeholder=\"0\" value=\"${k?k.qty:''}\" oninput=\"onBatchInput()\"><\/label>\n        <label>MRP<input class=\"sl-bmrp\" type=\"number\" value=\"${k&&k.mrp!==''?k.mrp:b.mrp}\" oninput=\"onBatchInput()\"><\/label>\n        <button type=\"button\" class=\"sl-bmax\" onclick=\"fillBatchMax('${b.id}')\">Max<\/button>\n      <\/div>\n    <\/div>`;\n  }).join('');\n  if(!editingSaleId && !batches.some(b=>keep[b.id])){\n    document.getElementById('sl-discount').value = '';\n    document.getElementById('sl-discount-amt').value = '';\n  }\n  syncTopMrp();\n  calcSale();\n}\nfunction batchRows(){\n  return [...document.querySelectorAll('#sl-batch-list .sl-brow')].map(r=>{\n    const b = DB.batches.find(x=>x.id===r.dataset.bid);\n    return { row:r, b, qty:Number(r.querySelector('.sl-bqty').value)||0, mrp:Number(r.querySelector('.sl-bmrp').value)||0 };\n  }).filter(x=>x.b);\n}\nfunction fillBatchMax(bid){\n  const r = document.querySelector('#sl-batch-list .sl-brow[data-bid=\"'+bid+'\"]');\n  const b = DB.batches.find(x=>x.id===bid);\n  if(!r||!b) return;\n  r.querySelector('.sl-bqty').value = batchStock(b);\n  onBatchInput();\n}\nfunction onBatchInput(){ syncTopMrp(); calcSale(); }\n// top MRP box mirrors the rows: shows the common MRP, or blank when Batches differ\nfunction syncTopMrp(){\n  const rows = batchRows();\n  const used = rows.filter(r=>r.qty>0);\n  const list = used.length ? used : rows;\n  const top = document.getElementById('sl-mrp');\n  if(!list.length){ top.value=''; return; }\n  const same = list.every(r=>r.mrp===list[0].mrp);\n  top.value = same ? list[0].mrp : '';\n  top.placeholder = same ? '' : 'Mixed';\n}\nfunction onMrpChange(){\n  // typing a MRP in the top box applies it to every Batch row\n  const v = document.getElementById('sl-mrp').value;\n  document.querySelectorAll('#sl-batch-list .sl-bmrp').forEach(i=>i.value = v);\n  calcSale();\n}\nfunction saleTotals(){\n  const disc = Number(document.getElementById('sl-discount').value)||0;\n  const lines = batchRows().filter(r=>r.qty>0);\n  let qty=0, mrpSum=0, revenue=0, cost=0;\n  lines.forEach(l=>{\n    const sp = Math.max(0, l.mrp - l.mrp*disc/100);\n    qty += l.qty; mrpSum += l.mrp*l.qty; revenue += sp*l.qty; cost += l.b.tp*l.qty;\n  });\n  return { lines, disc, qty, revenue, cost, effMrp: qty>0 ? mrpSum/qty : 0, effSell: qty>0 ? revenue/qty : 0 };\n}\nfunction calcSale(skipDiscAmtSync){\n  const t = saleTotals();\n  const transport = Number(document.getElementById('sl-transport').value)||0;\n  // highlight selected / over-stock rows\n  batchRows().forEach(r=>{\n    r.row.classList.toggle('active', r.qty>0);\n    r.row.classList.toggle('over', r.qty>batchStock(r.b));\n  });\n  document.getElementById('sl-qty').value = t.qty>0 ? t.qty : '';\n  document.getElementById('sl-sellprice').value = t.qty>0 ? t.effSell.toFixed(2) : '';\n  if(!skipDiscAmtSync){\n    document.getElementById('sl-discount-amt').value = (t.effMrp > 0 && t.disc > 0) ? (t.effMrp * t.disc / 100).toFixed(2) : '';\n  }\n  const note = document.getElementById('sl-transport-note');\n  if(transport>0){\n    note.style.display='inline';\n    note.textContent = '(excluding Transport Tk '+transport+')';\n  } else {\n    note.style.display='none';\n  }\n  document.getElementById('sl-profitPreview').textContent = fmt(t.revenue - t.cost - transport);\n}\nfunction onDiscPctChange(){ calcSale(); }\nfunction onDiscAmtChange(){\n  const t = saleTotals();\n  let ref = t.effMrp;\n  if(!(ref>0)){ ref = Number(document.getElementById('sl-mrp').value)||0; }\n  const discAmt = Number(document.getElementById('sl-discount-amt').value)||0;\n  const discPct = ref > 0 ? Math.min(100, discAmt / ref * 100) : 0;\n  document.getElementById('sl-discount').value = discAmt > 0 ? discPct.toFixed(2) : '';\n  calcSale(true); // skip overwriting discount-amt field\n}\nlet editingSaleId = null;\nfunction saveSale(){\n  const shopId = document.getElementById('sl-shop').value;\n  const productId = document.getElementById('sl-product').value;\n  const lines = batchRows().filter(r=>r.qty>0);\n  if(!shopId || !productId || lines.length===0){ showToast('Select Shop, Product and enter Quantity for at least one Batch'); return; }\n  for(const l of lines){\n    if(l.qty > batchStock(l.b)){ showToast('Not enough Stock in Batch '+(l.b.batchNo||'-')+' (remaining '+batchStock(l.b)+')'); return; }\n    if(l.mrp < 0){ showToast('MRP cannot be negative'); return; }\n  }\n  const disc = Number(document.getElementById('sl-discount').value)||0;\n  const discAmt = Number(document.getElementById('sl-discount-amt').value)||0;\n  const minMrp = Math.min(...lines.map(l=>l.mrp));\n  if(disc<0 || disc>100){ showToast('Discount % must be between 0-100'); return; }\n  if(discAmt<0 || discAmt>minMrp+0.01){ showToast('Discount Amount cannot be more than MRP (Tk '+minMrp+')'); return; }\n  const transport = Number(document.getElementById('sl-transport').value)||0;\n  if(transport<0){ showToast('Transport Cost cannot be negative'); return; }\n  const paid = Number(document.getElementById('sl-paid').value)||0;\n  const date = document.getElementById('sl-date').value||todayStr();\n  const note = (document.getElementById('sl-note').value||'').trim();\n\n  // build one sale record per batch\n  lines.forEach(l=>{\n    l.sellingPrice = Math.max(0, l.mrp - l.mrp*disc/100);\n    l.total = l.sellingPrice * l.qty;\n  });\n  const _prev = editingSaleId ? saleGroupRecs(editingSaleId) : [];\n  const keepShip = _prev.reduce((a,r)=>a+(r.shipCharge||0),0);\n  const keepCod = _prev.reduce((a,r)=>a+(r.codCharge||0),0);\n  const rawTotal = lines.reduce((a,l)=>a+l.total,0);\n  const keepDisc = Math.min(_prev.reduce((a,r)=>a+(r.extraDiscount||0),0), rawTotal);\n  const keepCourier = _prev.reduce((a,r)=>a+(r.courierCharge||0)+(r.courierCod||0),0);\n  if(keepDisc>0 && rawTotal>0){\n    lines.forEach(l=>{ const share = keepDisc*l.total/rawTotal; l.sellingPrice -= share/l.qty; l.total -= share; });\n  }\n  const grandTotal = lines.reduce((a,l)=>a+l.total,0) + keepShip + keepCod;\n  if(paid<0 || paid>grandTotal+0.01){ showToast('Paid Amount cannot be more than the total bill (Tk '+grandTotal.toFixed(2)+')'); return; }\n  // Transport goes on the first line; Paid fills the lines in order\n  let paidLeft = paid;\n  lines.forEach((l,i)=>{\n    l.transport = i===0 ? transport : 0;\n    l.paid = Math.min(paidLeft, l.total);\n    paidLeft -= l.paid;\n    l.profit = (l.sellingPrice - l.b.tp) * l.qty - l.transport - (i===0 ? keepCourier : 0);\n  });\n  if(paidLeft > 0) lines[lines.length-1].paid += paidLeft;\n\n  const origRecs = editingSaleId ? saleGroupRecs(editingSaleId) : [];\n  const orig = origRecs[0] || null;\n  const groupId = lines.length>1 ? ((orig && orig.saleGroup) || uid()) : undefined;\n  const storeIdForNew = orig ? (orig.storeId||'') : (DB.settings.currentStoreId||'');\n  lines.forEach((l,i)=>{\n    const rec = {\n      date, shopId, productId, batchId:l.b.id, qty:l.qty, mrp:l.mrp, discountPct:disc,\n      sellingPrice:l.sellingPrice, tp:l.b.tp, transport:l.transport, profit:l.profit, paid:l.paid, note,\n      saleGroup:groupId,\n      shipCharge: i===0 ? keepShip : 0, codCharge: i===0 ? keepCod : 0, extraDiscount: i===0 ? keepDisc : 0\n    };\n    if(origRecs[i]){ Object.assign(origRecs[i], rec); }\n    else { DB.sales.push(Object.assign({ id:uid(), storeId:storeIdForNew }, rec)); }\n    l.b.soldQty += l.qty;\n  });\n  // edited sale now uses fewer Batches than before: drop the extra old records (stock was already released)\n  if(origRecs.length > lines.length){\n    const drop = new Set(origRecs.slice(lines.length).map(r=>r.id));\n    DB.sales = DB.sales.filter(x=>!drop.has(x.id));\n  }\
