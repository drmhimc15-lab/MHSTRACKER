const CC_MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const CC_MERCH_CAT=[
  [/uber|pathao|obhai|fuel|filling|petrol|cng|padma|meghna|shell/i,'Transport'],
  [/shwapno|agora|meena|unimart|supershop|super shop|chaldal|grocer/i,'Groceries'],
  [/kfc|pizza|burger|restaurant|cafe|coffee|foodpanda|food panda|hungrynaki|bbq|dominos|starbucks|kitchen/i,'Restaurant'],
  [/pharma|lazz|apollo|square|hospital|clinic|medic|diagnostic|lab\b/i,'Medicine'],
  [/airline|biman|us-bangla|novoair|hotel|booking|airbnb|travel|resort/i,'Travel'],
  [/netflix|spotify|youtube|cinema|cineplex|bongo|prime|steam/i,'Entertainment'],
  [/grameenphone|robi|banglalink|airtel|teletalk|link3|carnival|internet/i,'Internet'],
  [/desco|dpdc|electric|wasa|titas/i,'Electricity'],
  [/daraz|aarong|ryans|star tech|startech|bata|apex|mall|shop|store|fashion|yellow/i,'Clothing'],
  [/aws|google|apple|microsoft|adobe|github|openai|anthropic|digitalocean|namecheap|canva/i,'Software']
];
function ccGuessCat(s){ for(const [re,c] of CC_MERCH_CAT){ if(re.test(s||'')) return c; } return 'Other'; }
function ccParseDate(v){
  if(v instanceof Date && !isNaN(v)) return ymdLocal(v);
  const s=String(v==null?'':v).trim(); if(!s) return '';
  let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/(\d{1,2})[\s\-\/.,]+([A-Za-z]{3})[A-Za-z]*[\s\-\/.,]+(\d{2,4})/);
  if(m){ const mo=CC_MON[m[2].toLowerCase()]; if(mo){ let y=+m[3]; if(y<100) y+=2000; return `${y}-${String(mo).padStart(2,'0')}-${m[1].padStart(2,'0')}`; } }
  m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return '';
}
function ccParseNum(v){
  if(typeof v==='number') return v;
  let s=String(v==null?'':v).trim(); if(!s) return 0;
  const neg=/^\(.*\)$/.test(s)||/^-/.test(s);
  s=s.replace(/[^0-9.]/g,''); const n=parseFloat(s)||0; return neg?-n:n;
}
function ccParseSms(text){
  let blocks=text.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  if(blocks.length===1){ const ls=text.split('\n').map(s=>s.trim()).filter(Boolean); if(ls.length>1 && ls.every(l=>/\d/.test(l)&&l.length>25)) blocks=ls; }
  const cards=ccCards(), rows=[];
  if(!cards.length) return rows;
  blocks.forEach(b=>{
    let cur='BDT', mAmt=b.match(/(BDT|Tk\.?|৳|USD|EUR|GBP|\$)\s*([\d,]+(?:\.\d{1,2})?)/i);
    if(!mAmt){ const m2=b.match(/([\d,]+(?:\.\d{1,2})?)\s*(BDT|Tk|taka|USD)/i); if(m2) mAmt=[m2[0],m2[2],m2[1]]; }
    if(!mAmt) return;
    const rawCur=mAmt[1].toUpperCase().replace('.','');
    if(rawCur==='USD'||rawCur==='$') cur='USD'; else if(rawCur==='EUR') cur='EUR'; else if(rawCur==='GBP') cur='GBP';
    const amt=parseFloat(mAmt[2].replace(/,/g,'')); if(!amt) return;
    const l4=(b.match(/(?:card|cc|ending|no\.?|x{2,}|\*{2,}|•+)\D{0,8}(\d{4})\b/i)||[])[1];
    const card=(l4&&cards.find(a=>ccm(a).last4===l4)) || ccPickCard();
    const kind = /refund|reversal|reversed|credited back/i.test(b) ? 'refund' : /payment (?:received|of|has been)|thank you for (?:your )?payment|repayment|paid to (?:your )?card/i.test(b) ? 'payment' : 'purchase';
    let merchant=((b.match(/\bat\s+([^.,\n]+?)(?=\s+(?:on|using|with|via|ref|txn|trx|avl|available|balance|card|ending|debit|credit)\b|[.,\n]|$)/i)||[])[1]||'').trim();
    const date=ccParseDate(b)||todayStr();
    rows.push({inc:true,kind,amount:amt,cur,date,merchant,category:ccGuessCat(merchant||b),cardId:card.id,raw:b});
  });
  return rows;
}
function ccParseCsv(text){
  const rows=[]; let r=[], c='', q=false; text=text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ c+='"'; i++; } else q=false; } else c+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ r.push(c); c=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; r.push(c); c=''; if(r.some(x=>x.trim()!=='')) rows.push(r); r=[]; }
    else c+=ch;
  }
  r.push(c); if(r.some(x=>x.trim()!=='')) rows.push(r);
  return rows;
}
function ccRowsFromTable(tbl){
  let hi=-1;
  for(let i=0;i<Math.min(tbl.length,20);i++){
    const cells=tbl[i].map(x=>String(x).toLowerCase());
    if(cells.some(x=>/date/.test(x)) && cells.some(x=>/desc|merchant|narr|detail|particular|amount|debit|credit|transaction/.test(x))){ hi=i; break; }
  }
  if(hi<0) return [];
  const head=tbl[hi].map(x=>String(x).toLowerCase().trim());
  const find=re=>head.findIndex(h=>re.test(h));
  const cDate=find(/date/), cDesc=find(/desc|merchant|narr|detail|particular|payee|transaction/), cDeb=find(/debit|withdraw|charge|\bdr\b/), cCre=find(/credit|deposit|\bcr\b|payment/), cAmt=find(/^amount|amount$|amt/);
  const card=ccPickCard(), out=[];
  tbl.slice(hi+1).forEach(r=>{
    const date=ccParseDate(r[cDate]); if(!date) return;
    const desc=String(cDesc>=0?r[cDesc]:'').trim();
    let amount=0, kind='purchase';
    if(cDeb>=0||cCre>=0){
      const d=cDeb>=0?Math.abs(ccParseNum(r[cDeb])):0, c=cCre>=0?Math.abs(ccParseNum(r[cCre])):0;
      if(d>0){ amount=d; } else if(c>0){ amount=c; kind=/payment|thank/i.test(desc)?'payment':'refund'; }
    } else if(cAmt>=0){
      const v=ccParseNum(r[cAmt]); amount=Math.abs(v);
      if(v<0) kind=/payment|thank/i.test(desc)?'payment':'refund';
    }
    if(!amount) return;
    out.push({inc:true,kind,amount,cur:'BDT',date,merchant:desc.slice(0,60),category:ccGuessCat(desc),cardId:card.id,raw:desc});
  });
  return out;
}
function ccIsDup(row){
  return DB.transactions.some(t=>{
    if(!row.amount) return false;
    const amt=Math.abs(Number(t.amount)||0);
    if(Math.abs(amt-row.amount)>=0.5 || Math.abs(daysBetween(t.date,row.date))>1) return false;
    if(row.kind==='payment') return t.type==='transfer' && t.toAccountId===row.cardId;
    return t.type==='expense' && t.accountId===row.cardId;
  });
}
function ccImportFile(e){
  const f=e.target.files[0]; if(!f) return;
  const isX=/\.xlsx?$/i.test(f.name), reader=new FileReader();
  reader.onload=()=>{
    try{
      let tbl;
      if(isX){
        if(!window.XLSX){ toast('Excel needs an internet connection — save as CSV instead'); return; }
        const wb=XLSX.read(new Uint8Array(reader.result),{type:'array',cellDates:true});
        tbl=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:true,blankrows:false});
      } else tbl=ccParseCsv(String(reader.result));
      const rows=ccRowsFromTable(tbl);
      if(!rows.length){ toast('No transactions found — need Date, Description and Amount (or Debit/Credit) columns'); return; }
      ccPreviewSheet(rows,'Statement: '+f.name);
    }catch(err){ console.error(err); toast('Could not read that file'); }
  };
  if(isX) reader.readAsArrayBuffer(f); else reader.readAsText(f);
}

function checkCardAlerts(){
  if(!alertPref('cards')) return 0;
  let n=0; const mo=monthStr(), today=todayStr();
  const thr=(DB.settings.ccUtilAlerts||[50,75,90]).slice().sort((a,b)=>a-b), rem=(DB.settings.ccRemind||[3,1,0]);
  ccCards().forEach(a=>{
    const m=ccm(a);
    if(m.status==='Active' && ccLimit(a)>0){
      const u=ccUtil(a), hit=thr.filter(x=>u>=x).pop();
      if(hit && alertOnce(`cc-util:${a.id}:${hit}:${mo}`,{title:`${a.name}: ${hit}% of limit used`,body:`${fmt(ccOwed(a))} of ${fmt(ccLimit(a))} · ${fmt(ccAvail(a))} available`,kind:'card',nav:'cards'})) n++;
    }
    const s=ccStatement(a);
    if(s.remaining>0){
      if(s.daysLeft<0){
        if(alertOnce(`cc-over:${a.id}:${s.due}`,{title:'Card payment overdue',body:`${a.name} · was due ${fmtDMY(s.due)} · ${fmt(s.remaining)} payable${m.lateFee?' · late fee '+fmt(m.lateFee)+' may apply':''}`,kind:'card',nav:'cards'})) n++;
      } else {
        const k=rem.filter(x=>s.daysLeft<=x).sort((x,y)=>x-y)[0];
        if(k!==undefined){
          const title=s.daysLeft===0?'Card payment due today':s.daysLeft===1?'Card payment due tomorrow':`Card payment due in ${s.daysLeft} days`;
          if(alertOnce(`cc-due:${a.id}:${s.due}:${k}`,{title,body:`${a.name} · ${fmtDMY(s.due)} · ${fmt(s.remaining)} payable (min ${fmt(s.remMin)})`,kind:'card',nav:'cards'})) n++;
        }
      }
    }
  });
  (DB.ccRewards||[]).filter(x=>x.kind==='points'&&x.expiry).forEach(x=>{
    const d=daysBetween(today,x.expiry), c=DB.accounts.find(a=>a.id===x.cardId);
    if(c && d>=0 && d<=30){ const st=ccRewardStats(c.id); if(st.earned-st.redeemed>0 && alertOnce(`cc-exp:${x.id}`,{title:'Reward points expiring',body:`${Math.round(x.amount).toLocaleString('en-IN')} points on ${c.name} expire ${fmtDMY(x.expiry)}`,kind:'card',nav:'cards'})) n++; }
  });
  return n;
}

/* ---------- Event wiring ---------- */
function ccAct(act,id,el){
  switch(act){
    case 'addcard': ccCardSheet(); break;
    case 'editcard': ccCardSheet(id); break;
    case 'purchase': ccPurchaseSheet(id); break;
    case 'refund': ccPurchaseSheet(id,true); break;
    case 'pay': ccPaySheet(id); break;
    case 'cashadv': ccCashAdvSheet(id); break;
    case 'fee': ccFeeSheet(id, el&&el.dataset.k); break;
    case 'sms': ccSmsSheet(); break;
    case 'import': { if(ccNeedCard()) return; const inp=document.createElement('input'); inp.type='file'; inp.accept='.csv,.txt,.xlsx,.xls'; inp.onchange=ccImportFile; inp.click(); break; }
    case 'sel': ccSel=id; ccShowAll=false; render(); break;
    case 'kind': ccKindF=id; ccShowAll=false; render(); break;
    case 'showall': ccShowAll=true; ccRefreshTx(); break;
    case 'addemi': ccEmiSheet(); break;
    case 'settleemi': ccSettleEmiSheet(id); break;
    case 'delemi': if(confirm('Remove this EMI plan? Installments already booked stay in your ledger.')){ DB.ccEmis=(DB.ccEmis||[]).filter(p=>p.id!==id); persist(); render(); } break;
    case 'addreward': ccRewardSheet(); break;
    case 'delreward': if(confirm('Delete this entry?')){ DB.ccRewards=(DB.ccRewards||[]).filter(x=>x.id!==id); persist(); render(); } break;
  }
}
function ccWire(){
  document.querySelectorAll('[data-cctab]').forEach(b=> b.onclick=(e)=>{ e.preventDefault(); ccTab=b.dataset.cctab; render(); });
  document.querySelectorAll('[data-cc]').forEach(el=> el.onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); ccAct(el.dataset.cc, el.dataset.id, el); });
  const s=document.getElementById('ccSearch'); if(s) s.oninput=()=>{ ccQ=s.value; ccRefreshTx(); };
  ['ccIcBal','ccIcRate','ccIcDays'].forEach(i=>{ const el=document.getElementById(i); if(el) el.oninput=ccIcCalc; });
  if(document.getElementById('ccIcOut')) ccIcCalc();
  document.querySelectorAll('.cc-ut,.cc-rm').forEach(c=> c.onclick=()=> c.classList.toggle('on'));
  const sv=document.getElementById('ccsSave'); if(sv) sv.onclick=()=>{
    DB.settings.ccUtilAlerts=Array.from(document.querySelectorAll('.cc-ut.on')).map(c=>+c.dataset.v);
    DB.settings.ccRemind=Array.from(document.querySelectorAll('.cc-rm.on')).map(c=>+c.dataset.v);
    DB.settings.ccMinPct=parseFloat(document.getElementById('ccsMinPct').value)||5;
    persist(); scheduleAlertCheck(); toast('Credit card settings saved');
  };
  document.querySelectorAll('[data-txid-link]').forEach(r=>{ r.style.cursor='pointer'; r.onclick=()=>openTransactionDetail(r.dataset.txidLink); });
}

      row.classList.toggle('off', off); btn.innerHTML = off ? eyeOff : eyeOn; save();
    };
  });
  // Drag to reorder. The dragged row follows the finger with a transform and the others slide out of the way;
  // the DOM is reordered only once, on release (moving a node mid-drag makes browsers drop the touch/pointer stream).
  box.querySelectorAll('[data-grip]').forEach(h=>{
    h.style.touchAction = 'none';
    h.onpointerdown = e=>{
      if(e.button!==undefined && e.button>0) return;
      e.preventDefault();
      const rows = [...box.querySelectorAll('.ro-row')], row = h.closest('.ro-row'), from = rows.indexOf(row);
      const step = rows.length>1 ? (rows[1].getBoundingClientRect().top - rows[0].getBoundingClientRect().top) : row.offsetHeight+8;
      const startY = e.clientY, startScroll = box.scrollTop, pid = e.pointerId;
      let to = from, lastY = startY;
      row.classList.add('drag'); row.style.transition='none'; row.style.zIndex=5;
      rows.forEach(r=>{ if(r!==row) r.style.transition='transform .15s'; });
      const apply = ()=>{
        let dy = lastY - startY + (box.scrollTop - startScroll);
        dy = Math.max(-from*step, Math.min((rows.length-1-from)*step, dy));
        row.style.transform = `translateY(${dy}px)`;
        to = Math.max(0, Math.min(rows.length-1, Math.round(from + dy/step)));
        rows.forEach((r,i)=>{
          if(r===row) return;
          let t = 0;
          if(from<to && i>from && i<=to) t = -step;
          else if(to<from && i>=to && i<from) t = step;
          r.style.transform = t ? `translateY(${t}px)` : '';
        });
      };
      let raf = null;
      const edge = ()=>{
        const br = box.getBoundingClientRect();
        if(lastY < br.top+36) box.scrollTop -= 8; else if(lastY > br.bottom-36) box.scrollTop += 8;
        apply(); raf = requestAnimationFrame(edge);
      };
      raf = requestAnimationFrame(edge);
      const move = ev=>{ if(ev.pointerId!==pid) return; ev.preventDefault(); lastY = ev.clientY; apply(); };
      const up = ev=>{
        if(ev.pointerId!==pid) return;
        cancelAnimationFrame(raf);
        window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
        rows.forEach(r=>{ r.style.transition=''; r.style.transform=''; r.style.zIndex=''; });
        row.classList.remove('drag');
        if(to!==from){
          row.remove();
          const rest = [...box.querySelectorAll('.ro-row')];
          if(to>=rest.length) box.appendChild(row); else box.insertBefore(row, rest[to]);
          save();
        }
      };
      window.addEventListener('pointermove',move,{passive:false}); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
    };
  });
  document.getElementById('roReset').onclick = ()=>{
    if(DB.settings.catOrder) delete DB.settings.catOrder[type];
    if(DB.settings.catHidden) delete DB.settings.catHidden[type];
    persist(); render(); openCategoryReorderSheet(type);
  };
}

let txfsState = null;

function openTxFullScreen(type, allowed){
  const firstAccount = DB.accounts[0];
  txfsState = {
    type,
    allowed: allowed || ['expense','income','transfer'],
    expr: "0",
    note: "",
    accountId: firstAccount ? firstAccount.id : "",
    toAccountId: (DB.accounts[1]||firstAccount||{}).id || "",
    date: todayStr(),
    step: "amount",
    suggestedCat: null
  };
  renderTxfs();
}
function closeTxFullScreen(){
  document.getElementById('txfsRoot').innerHTML = "";
  txfsState = null;
}
function txfsDisplayExpr(){ return txfsState.expr.replace(/\*/g,'×').replace(/\//g,'÷'); }
function txfsEvaluate(){
  let e = (txfsState.expr||"").trim().replace(/[+\-*/.]+$/,'').replace(/(^|[+\-*/])0+(?=\d)/g,'$1');
  if(!e) return 0;
  if(!/^[0-9+\-*/.]+$/.test(e)) return 0;
  try{
    const val = Function('"use strict";return ('+e+')')();
    return (typeof val === 'number' && isFinite(val)) ? val : 0;
  }catch(err){ return 0; }
}
function txfsRoundAmt(n){ return Math.round(n*100)/100; }
function txfsDateLabel(){
  const d = new Date(txfsState.date+'T00:00:00');
  return d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});
}
function txfsKeypadHtml(){
  const keys = ['1','2','3','+','4','5','6','-','7','8','9','×','.','0','=','÷'];
  return `<div class="txfs-key">${keys.map(k=>{
    const op = ['+','-','×','÷'].includes(k);
    return `<button data-k="${k}" class="${op?'op':k==='='?'eq':''}">${k}</button>`;
  }).join('')}</div>`;
}
function txfsHue(name){ let h=0; for(const ch of String(name)) h=(h*31+ch.charCodeAt(0))%360; return h; }
function txfsCategoryGridHtml(){
  const cats = getCatsRanked(txfsState.type);
  return `<div class="txfs-catgrid">${cats.map(c=>`
    <button class="c ${txfsState.suggestedCat===c?'on':''}" data-cat="${escapeHtml(c)}" style="--h:${txfsHue(c)}">
      <span class="ic">${catIcon(c)}</span>
      <span>${escapeHtml(c)}</span>
    </button>
  `).join('')}</div>`;
}
function renderTxfs(){
  const root = document.getElementById('txfsRoot');
  const s = txfsState;
  const title = s.type==='income' ? 'New income' : s.type==='transfer' ? 'New transfer' : 'New expense';

        </div>
        ${isTr ? '<span style="width:40px"></span>' : '<button id="txfsRecur" title="Add as recurring" aria-label="Recurring">🔁</button>'}
      </div>

        <label class="txfs-chip" id="txfsDateRow" style="position:relative;cursor:pointer;">📅 ${txfsDateLabel()}<input type="date" id="txfsDateInput" value="${txfsState.date}" max="${todayStr()}" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;"></label>
        <label class="txfs-chip">${isTr?'From':'🏦'} <select id="txfsAcc">${accOptions()}</select></label>
      </div>

      <div class="txfs-amt ${s.type}">

          <div class="val" id="txfsVal">${txfsDisplayExpr()}</div>

        </div>

      </div>

      <div class="txfs-suggest" id="txfsSuggest" style="display:none;"></div>
      <div class="txfs-mid" id="txfsMid">${s.step==='amount' ? txfsKeypadHtml() : txfsCategoryGridHtml()}</div>
      ${s.step==='amount' ? `<button class="txfs-choose" id="txfsChoose">${isTr?'SAVE TRANSFER':'CHOOSE CATEGORY →'}</button>` : ''}

  `;
  const accSel = document.getElementById('txfsAcc');
  if(accSel) accSel.value = s.accountId;

function updateTxfsVal(){
  const el = document.getElementById('txfsVal'); if(el){ el.textContent = txfsDisplayExpr(); el.scrollLeft = el.scrollWidth; }
  const pv = document.getElementById('txfsPrev');
  if(pv) pv.textContent = /[+\-*/]/.test(txfsState.expr.replace(/^-/,'')) ? '= '+txfsRoundAmt(txfsEvaluate()) : '';
}

// Searches past expense/income notes as the user types, so a repeat entry
// (e.g. "Agora groceries") can be filled in from history with one tap.
function txfsMatchingHistory(){
  const q = (txfsState.note||"").trim().toLowerCase();
  if(!q) return [];
  const seen = new Set();
  const matches = [];
  for(const t of DB.transactions){
    if(t.type !== txfsState.type || !t.note) continue;
    if(!t.note.toLowerCase().includes(q)) continue;
    const key = t.note.toLowerCase()+'|'+t.category+'|'+t.amount;
    if(seen.has(key)) continue;
    seen.add(key);
    matches.push(t);
    if(matches.length>=6) break;
  }
  return matches;
}
function renderTxfsSuggestions(){
  const box = document.getElementById('txfsSuggest');
  if(!box) return;
  const matches = txfsMatchingHistory();
  if(!matches.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display = 'block';
  box.innerHTML = matches.map(t=>`
    <div class="si" data-sugnote="${escapeHtml(t.note)}" data-sugamt="${t.amount}" data-sugcat="${escapeHtml(t.category||'')}">
      <span>${catIcon(t.category)} ${escapeHtml(t.note)}</span>
      <span class="sub">${fmt(t.amount)} · ${escapeHtml(t.category||'')}</span>
    </div>
  `).join('');
  box.querySelectorAll('.si').forEach(row=>{
    row.onclick = ()=>{
      txfsState.note = row.dataset.sugnote;
      txfsState.suggestedCat = row.dataset.sugcat || null;
      renderTxfs();
    };
  });
}
function txfsKeyPress(k){
  const s = txfsState;
  if(k==='='){ s.expr = String(txfsRoundAmt(txfsEvaluate())); updateTxfsVal(); return; }
  if(['+','-','×','÷'].includes(k)){
    const opChar = k==='×'?'*':k==='÷'?'/':k;
    s.expr = /[+\-*/]$/.test(s.expr) ? s.expr.slice(0,-1)+opChar : s.expr+opChar;
    updateTxfsVal(); return;
  }
  if(k==='.'){
    const last = s.expr.split(/[+\-*/]/).pop();
    if(last.includes('.')) return;
    s.expr += (last===''? '0.' : '.');
    updateTxfsVal(); return;
  }
  // Replace a lone "0" in the number being typed (so 5+0 then 7 → 5+7, never 5+07)
  const seg = s.expr.split(/[+\-*/]/).pop();
  s.expr = (seg==='0') ? s.expr.slice(0,-1)+k : s.expr+k;
  updateTxfsVal();
}

  toast((s.type==='income'?'Income':'Expense')+" added", {label:'Edit', onClick:()=>openEditTransactionSheet(tx.id)});

}
function txfsBuzz(){ try{ navigator.vibrate && navigator.vibrate(6); }catch(e){} }
function txfsBackspace(){ const s=txfsState; s.expr = s.expr.length>1 ? s.expr.slice(0,-1) : "0"; updateTxfsVal(); }
// Physical keyboard support (desktop): digits, + - * / . Enter Backspace Esc
document.addEventListener('keydown', e=>{
  if(!txfsState || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (document.activeElement||{}).tagName;
  if(e.key==='Escape'){ e.preventDefault(); closeTxFullScreen(); return; }
  if(tag==='INPUT' || tag==='SELECT' || txfsState.step!=='amount') return;
  const k = e.key;
  if(/^[0-9]$/.test(k) || k==='.'){ txfsKeyPress(k); }
  else if(k==='+'||k==='-'){ txfsKeyPress(k); }
  else if(k==='*'||k==='x'||k==='X'){ txfsKeyPress('×'); }
  else if(k==='/'){ txfsKeyPress('÷'); }
  else if(k==='='){ txfsKeyPress('='); }
  else if(k==='Backspace'){ txfsBackspace(); }
  else if(k==='Enter'){ const b=document.getElementById('txfsChoose'); if(b) b.click(); }
  else return;
  e.preventDefault();
});
function wireTxfsTabs(){
  const s = txfsState;
  document.querySelectorAll('.txfs-seg button').forEach(b=> b.onclick = ()=>{
    if(b.dataset.t===s.type) return;
    s.type = b.dataset.t; s.step = 'amount'; s.suggestedCat = null;   // amount, note, date & account carry over
    renderTxfs();
  });
}
function wireTxfs(){
  wireTxfsTabs();
  const s = txfsState;
  document.getElementById('txfsBack').onclick = ()=>{
    if(s.step==='category'){ s.step='amount'; renderTxfs(); }
    else closeTxFullScreen();
  };
  const rcb = document.getElementById('txfsRecur'); if(rcb) rcb.onclick = ()=>{ closeTxFullScreen(); openRecurringSheet(); };
  // The real date input sits invisibly over the chip, so the tap opens the browser's own picker directly (past dates work everywhere).
  const dIn = document.getElementById('txfsDateInput');
  dIn.onchange = ()=>{ let val = dIn.value; if(!val) return; if(val > todayStr()){ toast("Future dates aren't allowed"); val = todayStr(); } s.date = val; renderTxfs(); };
  const noteEl = document.getElementById('txfsNote');
  if(noteEl){
    noteEl.oninput = (e)=>{ s.note = e.target.value; s.suggestedCat = null; renderTxfsSuggestions(); };
    noteEl.addEventListener('focus', renderTxfsSuggestions);
    noteEl.addEventListener('blur', ()=> setTimeout(()=>{
      const box = document.getElementById('txfsSuggest'); if(box) box.style.display='none';
    }, 150));
  }
  const accEl = document.getElementById('txfsAcc');
  if(accEl) accEl.onchange = (e)=>{ s.accountId = e.target.value; };
  const toEl = document.getElementById('txfsToAcc');
  if(toEl) toEl.onchange = (e)=>{ s.toAccountId = e.target.value; };

  if(s.step==='amount'){
    // Fire on pointerdown (no tap delay) with one delegated handler; preventDefault avoids ghost clicks/focus jumps.
    const bk = document.getElementById('txfsBksp'); let lp = null, rep = null;
    const stopRep = ()=>{ clearTimeout(lp); clearInterval(rep); };
    bk.onpointerdown = (e)=>{
      e.preventDefault(); txfsBuzz(); txfsBackspace();
      lp = setTimeout(()=>{ rep = setInterval(()=>{
        if(s.expr==="0"){ stopRep(); return; }
        txfsBackspace();
      }, 55); }, 350);
    };
    ['pointerup','pointerleave','pointercancel'].forEach(ev=> bk.addEventListener(ev, stopRep));
    bk.onclick = (e)=> e.preventDefault();
    const pad = document.querySelector('.txfs-key');
    pad.addEventListener('pointerdown', (e)=>{
      const b = e.target.closest('button'); if(!b) return;
      e.preventDefault(); txfsBuzz();
      b.classList.add('hit'); txfsKeyPress(b.dataset.k);
    });
    const unhit = (e)=>{ pad.querySelectorAll('.hit').forEach(x=>x.classList.remove('hit')); };
    ['pointerup','pointerleave','pointercancel'].forEach(ev=> pad.addEventListener(ev, unhit));
    document.getElementById('txfsChoose').onclick = ()=>{ if(s.type==='transfer') txfsSaveTransfer(); else { s.step='category'; renderTxfs(); } };
  } else {
    document.querySelectorAll('.txfs-catgrid .c').forEach(b=>{ b.onclick = ()=>{ txfsBuzz(); txfsSaveWithCategory(b.dataset.cat); }; });
  }
}

/* ===== Balance period breakdown: all categories for the selected period ===== */
function trLabel(t){
  if(t.invId){ const a=DB.accounts.find(x=>x.id===(t.accountId||t.toAccountId)); return t.invKind==='return' ? 'Investment → '+(a?a.name:'?') : (a?a.name:'?')+' → Investment'; }
  const f = DB.accounts.find(a=>a.id===t.accountId), to = DB.accounts.find(a=>a.id===t.toAccountId);
  return (f?f.name:'?')+' → '+(to?to.name:'?');
}
function periodCategoryBreakdown(){
  const income = {}, expense = {}, transfer = {};
  periodTx().forEach(t=>{
    if(t.type==="income") income[t.category] = (income[t.category]||0) + Number(t.amount);
    else if(t.type==="expense") expense[t.category] = (expense[t.category]||0) + Number(t.amount);
    else if(t.type==="transfer"){ const k=trLabel(t); transfer[k] = (transfer[k]||0) + Number(t.amount); }
  });
  return {
    income: Object.entries(income).sort((a,b)=>b[1]-a[1]),
    expense: Object.entries(expense).sort((a,b)=>b[1]-a[1]),
    transfer: Object.entries(transfer).sort((a,b)=>b[1]-a[1])
  };
}
function shiftPeriod(dir){
  const p = balancePeriod;
  if(["day","week","month","year"].indexOf(p.mode)<0) return;
  const d = new Date((p.anchor||todayStr())+'T00:00:00');
  if(p.mode==="month") d.setDate(1);            // avoid 31st -> next-next month overflow
  if(p.mode==="year"){ d.setMonth(0); d.setDate(1); }
  p.anchor = shiftSummaryAnchor(p.mode, ymdLocal(d), dir);
  renderHeader();
  renderPeriodBreakdown(dir>0 ? 'next' : 'prev');
}
let pbExpanded = new Set();
let pbSections = new Set();   // which of 'income' / 'expense' are opened (both collapsed by default)
function renderPeriodBreakdown(slide){
  const root = document.getElementById('periodRoot');
  const swipeable = !!periodRangeNow();
  const {income, expense, transfer} = periodCategoryBreakdown();
  const totalIncome = income.reduce((s,[,v])=>s+v,0);
  const totalExpense = expense.reduce((s,[,v])=>s+v,0);
  const totalTransfer = transfer.reduce((s,[,v])=>s+v,0);
  const row = (name, amt, type) => {
    const key = type+'|'+name, open = pbExpanded.has(key);
    const isTr = type==='transfer';
    const items = periodTx().filter(t=> isTr ? (t.type==='transfer' && trLabel(t)===name) : (t.type===type && t.category===name));
    const sg = isTr ? '' : (type==="expense"?"−":"+");
    let detail = '';
    if(open){
      const byDay = {};
      items.forEach(t=>{ (byDay[t.date] = byDay[t.date]||[]).push(t); });
      detail = '<div class="pb-detail">' + Object.keys(byDay).sort().reverse().map(d=>{
        const list = byDay[d].slice().sort((a,b)=>(b.time||'').localeCompare(a.time||''));
        const tot = list.reduce((s,t)=>s+Number(t.amount),0);
        return `<div class="pb-day"><span>${fmtDateShort(d)}</span><span class="mono">${sg}${fmt(tot)}</span></div>` +
          list.map(t=>`<div class="pb-tx"><span>${t.time?fmtTime(t.time):'—'}${t.note?` <span class="n">· ${escapeHtml(t.note)}</span>`:''}</span><span class="mono ${type}">${sg}${fmt(t.amount)}</span></div>`).join('');
      }).join('') + '</div>';
    }
    return `
    <div class="pb-row pb-click ${open?'open':''}" data-pbcat="${escapeHtml(key)}">
      <span class="pb-name">${isTr?'⇄':catIcon(name)} ${escapeHtml(name)}<span class="pb-cnt">${items.length}</span><span class="pb-chev">›</span></span>
      <span class="pb-amt ${type}">${sg}${fmt(amt)}</span>
    </div>${detail}`;
  };
  root.innerHTML = `
    <div class="period-ovl">
      <div class="p-hd"><button id="periodBreakBack">←</button><div class="p-title">${escapeHtml(periodLabel())}</div><button class="p-x" aria-label="Close">✕</button></div>
      ${swipeable ? `
      <div class="pb-tabs">${["day","week","month","year"].map(m=>`<button class="${balancePeriod.mode===m?'on':''}" data-pbmode="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join("")}</div>
      <div class="pb-nav">
        <button id="pbPrev" aria-label="Previous">‹</button>
        <div class="pb-nav-lbl">${escapeHtml(periodRangeNow().label)}${periodIsCurrent()?'':' <a href="#" id="pbToday">Today</a>'}</div>
        <button id="pbNext" aria-label="Next">›</button>
      </div>
      <div class="pb-hint">← swipe left / right →</div>` : ''}
      <div class="period-breakdown ${slide==='next'?'slide-next':slide==='prev'?'slide-prev':''}">
        <div class="pb-summary">
          <div class="pb-box ${pbSections.has('income')?'open':''}" data-pbsec="income">Income<b class="income">${fmt(totalIncome)}</b><span class="pb-tap">${pbSections.has('income')?'▲ hide':'▼ details'}</span></div>
          <div class="pb-box ${pbSections.has('expense')?'open':''}" data-pbsec="expense">Expense<b class="expense">${fmt(totalExpense)}</b><span class="pb-tap">${pbSections.has('expense')?'▲ hide':'▼ details'}</span></div>
          <div class="pb-box ${pbSections.has('transfer')?'open':''}" data-pbsec="transfer">Transfer<b class="transfer">${fmt(totalTransfer)}</b><span class="pb-tap">${pbSections.has('transfer')?'▲ hide':'▼ details'}</span></div>
        </div>
        ${pbSections.has('income') && income.length ? `<div class="pb-section-title">Income categories</div>${income.map(([c,v])=>row(c,v,"income")).join("")}` : ""}
        ${pbSections.has('expense') && expense.length ? `<div class="pb-section-title">Expense categories</div>${expense.map(([c,v])=>row(c,v,"expense")).join("")}` : ""}
        ${pbSections.has('transfer') && transfer.length ? `<div class="pb-section-title">Transfers</div>${transfer.map(([c,v])=>row(c,v,"transfer")).join("")}` : ""}
        ${(!expense.length && !income.length && !transfer.length) ? `<div class="empty">No transactions in this period</div>` : ""}
      </div>
    </div>
  `;
  document.getElementById('periodBreakBack').onclick = renderPeriodPicker;
  root.querySelectorAll('[data-pbsec]').forEach(b=> b.onclick = ()=>{
    const k = b.dataset.pbsec;
    if(pbSections.has(k)) pbSections.delete(k); else pbSections.add(k);
    renderPeriodBreakdown();
  });
  root.querySelectorAll('[data-pbcat]').forEach(r=> r.onclick = ()=>{
    const k = r.dataset.pbcat;
    if(pbExpanded.has(k)) pbExpanded.delete(k); else pbExpanded.add(k);
    const sc = root.querySelector('.period-breakdown'); const top = sc ? sc.scrollTop : 0;
    renderPeriodBreakdown();
    const sc2 = root.querySelector('.period-breakdown'); if(sc2) sc2.scrollTop = top;
  });
  if(swipeable){
    const ovl = root.querySelector('.period-ovl');
    document.getElementById('pbPrev').onclick = ()=> shiftPeriod(-1);
    document.getElementById('pbNext').onclick = ()=> shiftPeriod(1);
    const td = document.getElementById('pbToday');
    if(td) td.onclick = (e)=>{ e.preventDefault(); balancePeriod.anchor = todayStr(); renderHeader(); renderPeriodBreakdown(); };
    root.querySelectorAll('[data-pbmode]').forEach(b=> b.onclick = ()=>{ balancePeriod.mode = b.dataset.pbmode; renderHeader(); renderPeriodBreakdown(); });
    // Finger swipe: left = next period, right = previous (month/week/day/year follows the selected tab)
    let sx=0, sy=0, track=false;
    ovl.addEventListener('touchstart', e=>{ if(e.touches.length!==1){ track=false; return; } sx=e.touches[0].clientX; sy=e.touches[0].clientY; track=true; }, {passive:true});
    ovl.addEventListener('touchend', e=>{
      if(!track) return; track=false;
      const t = e.changedTouches[0], dx = t.clientX-sx, dy = t.clientY-sy;
      if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5) shiftPeriod(dx<0 ? 1 : -1);
    }, {passive:true});
  }
}

  };
}

/* Ledger search: re-render the list on every keystroke WITHOUT replacing the
   search <input> itself. Replacing it (old behaviour) destroyed the focused
   element, so the phone keyboard closed after each letter. */
function ledgerSearchRerender(){
  const content = document.getElementById('content');
  const oldBar = content.querySelector('.search-bar');
  const tmp = document.createElement('div');
  tmp.innerHTML = viewTransactions();
  const newBar = tmp.querySelector('.search-bar');
  if(!oldBar || !newBar){ content.innerHTML = viewTransactions(); afterRenderLite(); return; }
  Array.from(content.childNodes).forEach(n=>{ if(n!==oldBar) n.remove(); });
  let before = true;
  Array.from(tmp.childNodes).forEach(n=>{
    if(n===newBar){
      before = false;
      oldBar.querySelectorAll('button').forEach(b=>{
        const nb = b.id ? newBar.querySelector('#'+b.id) : null;
        if(nb) b.replaceWith(nb);
      });
      return;
    }
    if(before) content.insertBefore(n, oldBar); else content.appendChild(n);
  });
  afterRenderLite();
}

function downloadBlob(content,filename,type){
  const blob = new Blob([content],{type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function doImportJson(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.accounts || !data.transactions){ toast("Invalid backup file"); return; }
      DB = Object.assign({accounts:[],transactions:[],budgets:[],ccEmis:[],ccRewards:[],recurring:[],settings:DB.settings}, data);

    }catch(err){ toast("Could not read file"); }

  reader.readAsText(file);
}

/* ===================== INVESTMENT CSV / EXCEL IMPORT =====================
   Bulk-import an existing portfolio (FDRs, stocks, bonds, etc.) from a .csv,
   .xlsx or .xls file. Uses SheetJS (loaded from CDN — needs an internet
   connection) for .xlsx/.xls; .csv files also work fully offline via a
   built-in fallback parser if SheetJS hasn't loaded. */
const INVEST_IMPORT_COLS = ["Name","Category","Subcategory","Institution","Date","Capital","RateType","RateValue","DurationNum","DurationUnit","ProfitType","Status","Notes"];
function downloadInvestTemplate(){
  const sample = ["City Bank FDR","FDR / Fixed Deposit","Bank FDR","City Bank Ltd.","2026-01-15","500000","annual","7.5","1","years","simple","active","Sample row — delete before importing"];
  const rows = [INVEST_IMPORT_COLS, sample];
  const csv = rows.map(r=> r.map(csvEscape).join(",")).join("\n");
  downloadBlob(csv, "mhs-investment-import-template.csv", "text/csv");
  toast("Template downloaded");
}
function csvEscape(v){
  v = String(v==null?'':v);
  return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
// Minimal RFC4180-ish CSV parser used as an offline fallback when SheetJS hasn't loaded.
function parseCsvText(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=> r.some(c=>String(c).trim()!==''));
}
function rowsToObjects(rows){
  if(!rows.length) return [];
  const headers = rows[0].map(h=> String(h||'').trim());
  return rows.slice(1).map(r=>{
    const o = {};
    headers.forEach((h,i)=> o[h] = r[i]!==undefined? r[i] : '');
    return o;
  });
}
function findCol(obj, names){
  const keys = Object.keys(obj);
  for(const name of names){
    const hit = keys.find(k=> k.toLowerCase().replace(/[^a-z0-9]/g,'') === name.toLowerCase().replace(/[^a-z0-9]/g,''));
    if(hit!==undefined) return obj[hit];
  }
  return '';
}
function normalizeImportDate(v){
  if(!v) return todayStr();
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v === 'number'){ // Excel serial date
    const d = new Date(Math.round((v-25569)*86400*1000));
    return d.toISOString().slice(0,10);
  }
  const s = String(v).trim();
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  const d = new Date(s);
  return isNaN(d) ? todayStr() : d.toISOString().slice(0,10);
}
function investRowToObject(raw){
  const name = String(findCol(raw,['Name','InvestmentName']) || '').trim();
  const capital = parseFloat(findCol(raw,['Capital','Amount','CapitalAmount']));
  if(!name || !capital || capital<=0) return null; // invalid row, skip
  let category = String(findCol(raw,['Category']) || '').trim();
  if(!INVEST_CATS.includes(category) && !DB.customCategories.investment.includes(category)) category = category || 'Other';
  let rateType = String(findCol(raw,['RateType','Rate Type']) || 'annual').trim().toLowerCase();
  if(!['annual','monthly','fixed','variable','none'].includes(rateType)) rateType = 'annual';
  let durationUnit = String(findCol(raw,['DurationUnit','Duration Unit','Unit']) || 'years').trim().toLowerCase();
  if(!['years','months','days'].includes(durationUnit)) durationUnit = 'years';
  let profitType = String(findCol(raw,['ProfitType','Profit Type']) || 'simple').trim().toLowerCase();
  if(!['simple','compound','dividend','interest','capital-gain'].includes(profitType)) profitType = 'simple';
  let status = String(findCol(raw,['Status']) || 'active').trim().toLowerCase();
  if(!['active','matured','withdrawn','reinvested'].includes(status)) status = 'active';
  return {
    id: uid(), name,
    date: normalizeImportDate(findCol(raw,['Date','InvestmentDate','Investment Date'])),
    category, subcategory: String(findCol(raw,['Subcategory','Sub-category']) || '').trim(),
    institution: String(findCol(raw,['Institution','Bank','BankName']) || '').trim(),
    capital, rateType, rateValue: parseFloat(findCol(raw,['RateValue','Rate','RateOfProfit'])) || 0,
    durationNum: parseFloat(findCol(raw,['DurationNum','Duration'])) || 1, durationUnit,
    profitType, status,
    additionalCapital:[], partialWithdrawals:[], reinvestments:[], actualProfit:null,
    reminderDays: (DB.settings.reminderDaysDefault||[30,7,1,0,-7]).slice(), remindersSent:[], linkedFromId:null,
    notes: String(findCol(raw,['Notes','Note']) || '').trim(), fundedAccountId: null
  };
}

/* ===================== RAW PORTFOLIO SHEET IMPORT =====================
   Handles messy, hand-kept portfolio spreadsheets like:
   Institution | Investment NAME | Date | Maturity Date | Duration Month | Capital | Rate Annual % | Profit | Total
   where the Institution column is only filled on the first row of each
   group (forward-filled downward), dates are sometimes partial
   ("28/1" = day/month, year assumed current), and Duration Month is
   sometimes text like "20 yrs" or "3/91 d". Auto-detected — no template
   required — and used instead of the strict-template importer above when
   a sheet's headers match this shape. */
function normHeader(h){ return String(h||'').trim().toLowerCase().replace(/[^a-z0-9]/g,''); }
function buildPortfolioColIndex(headerRow){
  const idx = {};
  (headerRow||[]).forEach((h,i)=>{ const n = normHeader(h); if(idx[n]===undefined) idx[n]=i; });
  function find(names){
    for(const nm of names){ const n = normHeader(nm); if(idx[n]!==undefined) return idx[n]; }
    return -1;
  }
  return {
    institution: find(['Institution']),
    name: find(['Investment NAME','InvestmentName','Name']),
    date: find(['Date']),
    maturityDate: find(['Maturity Date','MaturityDate']),
    durationMonth: find(['Duration Month','DurationMonth','Duration']),
    capital: find(['Capital']),
    rateAnnual: find(['Rate Annual %','RateAnnual','Rate']),
    profit: find(['Profit']),
    total: find(['Total'])
  };
}
function isPortfolioSheet(col){
  return col.name!==-1 && col.institution!==-1 && col.capital!==-1 && col.maturityDate!==-1;
}
// Flexible date parser for this sheet: full dates (Date objects, Excel
// serials, dd/mm/yyyy, dd/mm/yy) are used as-is; a bare "dd/mm" with no
// year is assumed to be the current year, since that's how these entries
// were consistently written relative to the sheet's other full dates.
function parseFlexInvestDate(v, opts){
  opts = opts||{};
  if(v===null||v===undefined||v==='') return '';
  const pad = n=> String(n).padStart(2,'0');
  if(v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  if(typeof v === 'number'){ const d = new Date(Math.round((v-25569)*86400*1000)); return isNaN(d)?'':d.toISOString().slice(0,10); }
  const s = String(v).trim();
  if(!s) return '';
  // ISO yyyy-mm-dd
  let m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  // dd/mm/yyyy, dd/mm/yy, dd/mm, with any mix of / - . separators ("1/11-26", "11/1-27")
  const parts = s.split(/[\/\-.]/).map(x=>x.trim());
  if(parts.length>=2 && parts.length<=3 && parts.every(x=>/^\d{1,4}$/.test(x))){
    const d = parseInt(parts[0],10), mo = parseInt(parts[1],10);
    if(d<1||d>31||mo<1||mo>12) return '';
    if(parts.length===3){
      let y = parseInt(parts[2],10);
      if(parts[2].length<=2) y += 2000;
      return `${y}-${pad(mo)}-${pad(d)}`;
    }
    // No year written. Use the current year; a purchase date can't be in the
    // future, so if that lands after today it belongs to last year.
    const now = new Date(); let y = now.getFullYear();
    let iso = `${y}-${pad(mo)}-${pad(d)}`;
    if(opts.notFuture && iso > todayStr()) iso = `${y-1}-${pad(mo)}-${pad(d)}`;
    return iso;
  }
  return '';   // free text such as "BOND", "balance", "20 yrs" is not a date
}
// Duration Month column can be a plain number (months), or text like
// "20 yrs" or "3/91 d" (bank FDR terms). Falls back to the Date/Maturity
// Date gap; returns null when the row has no end (shares, funds, crypto).
function parsePortfolioDuration(raw, dateStr, maturityStr){
  if(raw!==null && raw!==undefined && raw!==''){
    if(typeof raw === 'number' && raw>0) return {durationNum:raw, durationUnit:'months'};
    const s = String(raw).trim();
    let unit = 'months';
    const unitMatch = s.match(/(yr|year|mo|month|day|d\b)/i);
    if(unitMatch){
      const u = unitMatch[1].toLowerCase();
      unit = u.startsWith('y') ? 'years' : u.startsWith('d') ? 'days' : 'months';
    }
    const nums = s.match(/\d+(\.\d+)?/g);
    if(nums && nums.length){
      const num = parseFloat(nums[nums.length-1]);
      if(!isNaN(num) && num>0) return {durationNum:num, durationUnit:unit};
    }
  }
  if(dateStr && maturityStr && maturityStr>dateStr){
    const months = Math.max(1, Math.round((new Date(maturityStr)-new Date(dateStr))/(1000*3600*24*30.44)));
    return {durationNum:months, durationUnit:'months'};
  }
  return null;
}
// Category guess. Name is checked first (so a "FD" under any institution is a
// Fixed Deposit and Ekush/Edge are Mutual Funds), then the institution.
// Always one of the app's existing investment categories.
const PORTFOLIO_CAT_MAP = [
  [/\bfdr?\b|fixed deposit/i,'FDR / Fixed Deposit'],
  [/ekush|edge|mutual|\bfund\b/i,'Mutual Fund'],
  [/sukuk|treasury|t-?bill|\bbond\b/i,'Government Bond / Treasury Bill'],
  [/crypto|bitcoin/i,'Crypto'],
  [/share market|\bshare\b|stock|\bdse\b|\bcse\b/i,'Stock Market'],
  [/ifarmer|growup|halal ?invest|crowd/i,'Crowdfunding'],
  [/prime islamic|\bmtb\b|prime now/i,'FDR / Fixed Deposit'],
  [/pacific/i,'Stock Market'],
  [/bini/i,'Mutual Fund']
];
function guessPortfolioCategory(institution, name){
  for(const [re,cat] of PORTFOLIO_CAT_MAP){ if(re.test(name||'')) return cat; }
  for(const [re,cat] of PORTFOLIO_CAT_MAP){ if(re.test(institution||'')) return cat; }
  return 'Other';
}
function cleanPortfolioText(v){ return String(v==null?'':v).replace(/\s+/g,' ').trim(); }
function portfolioNum(v){
  if(typeof v==='number') return v;
  const n = parseFloat(String(v==null?'':v).replace(/,/g,'').trim());
  return n;
}
function parsePortfolioRows(rows, col){
  let currentInst = '';
  const rawItems = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || !r.length) continue;
    let instCell = col.institution>=0 ? cleanPortfolioText(r[col.institution]) : '';
    // A pure number in the Institution column is the sheet's per-group
    // subtotal (e.g. 878300, "986,637"), not a name — never use it as one.
    if(instCell && /^[\d,.\s]+$/.test(instCell)) instCell = '';
    const nameCell = col.name>=0 ? cleanPortfolioText(r[col.name]) : '';
    const dateCell = col.date>=0 ? r[col.date] : '';
    const hasDate = !(dateCell===''||dateCell==null);
    if(instCell) currentInst = instCell;
    const capVal = col.capital>=0 ? portfolioNum(r[col.capital]) : NaN;
    if(isNaN(capVal) || capVal<=0) continue;        // section header / blank separator row
    // Grand-total row at the bottom: only numbers, no institution, name or date.
    if(!instCell && !nameCell && !hasDate) continue;
    rawItems.push({
      institution: currentInst || 'Other',
      name: nameCell,
      date: dateCell,
      maturityDate: col.maturityDate>=0 ? r[col.maturityDate] : '',
      durationRaw: col.durationMonth>=0 ? r[col.durationMonth] : '',
      capital: capVal,
      rateAnnual: col.rateAnnual>=0 ? portfolioNum(r[col.rateAnnual]) : NaN,
      profit: col.profit>=0 ? r[col.profit] : '',
      total: col.total>=0 ? r[col.total] : '',
      extra: [col.total+1, col.total+2].filter(k=>k>0).map(k=> cleanPortfolioText(r[k])).filter(Boolean)
    });
  }
  // Auto-name rows that had a blank Investment NAME, grouped by institution.
  const blankGroups = {};
  rawItems.forEach(it=>{ if(!it.name){ (blankGroups[it.institution] = blankGroups[it.institution]||[]).push(it); } });
  Object.keys(blankGroups).forEach(inst=>{
    const list = blankGroups[inst];
    if(list.length===1) list[0].name = inst;
    else list.forEach((it,idx)=> it.name = `${inst} #${idx+1}`);
  });
  return rawItems.map(it=>{
    let maturityStr = parseFlexInvestDate(it.maturityDate);
    let date = parseFlexInvestDate(it.date) || '';
    const dateHasYear = /^\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}$/.test(String(it.date||'').trim()) || it.date instanceof Date || typeof it.date==='number';
    // Year-less date in the future: it belongs to last year, unless the sheet's
    // own (dated) maturity is after it, which proves it is this year's entry.
    if(date && !dateHasYear && date>todayStr() && !(maturityStr && maturityStr>date)) date = parseFlexInvestDate(it.date,{notFuture:true});
    if(!date) date = todayStr();
    // Maturity written without a year, or with a typo that puts it before the
    // start date: push it to the next valid year, otherwise ignore it.
    if(maturityStr && maturityStr<=date){
      const txt = String(it.maturityDate).trim();
      const yearless = /^\d{1,2}[\/\-.]\d{1,2}$/.test(txt);
      if(yearless){ let y=parseInt(date.slice(0,4),10); let cand=maturityStr; while(cand<=date && y<parseInt(date.slice(0,4),10)+3){ y++; cand=y+maturityStr.slice(4); } maturityStr=cand; }
      else maturityStr='';
    }
    const dur = parsePortfolioDuration(it.durationRaw, date, maturityStr);
    const openEnded = !dur;                       // shares / funds / crypto: no end date
    const durationNum = dur ? dur.durationNum : 10;
    const durationUnit = dur ? dur.durationUnit : 'years';
    // Make the app's projected profit equal the profit written in the sheet.
    // The sheet's "Rate Annual %" is sometimes the whole-term rate, so derive
    // the true annual rate from Profit when it is present.
    const years = durationUnit==='days' ? durationNum/365 : durationUnit==='months' ? durationNum/12 : durationNum;
    const profitNum = portfolioNum(it.profit);
    let rateValue = isNaN(it.rateAnnual) ? 0 : it.rateAnnual;
    if(!isNaN(profitNum) && profitNum>0 && years>0) rateValue = Math.round(profitNum/it.capital/years*100*10000)/10000;
    const rateType = (openEnded && !(profitNum>0)) ? 'none' : 'annual';
    const status = (!openEnded && maturityStr && maturityStr < todayStr()) ? 'matured' : 'active';
    const category = guessPortfolioCategory(it.institution, it.name);
    let note = 'Imported from portfolio sheet.';
    if(!isNaN(it.rateAnnual)) note += ` Sheet rate: ${it.rateAnnual}%.`;
    if(!isNaN(profitNum) && profitNum>0) note += ` Recorded profit: ${profitNum}.`;
    const totalNum = portfolioNum(it.total);
    if(!isNaN(totalNum)) note += ` Recorded total: ${totalNum}.`;
    if(!maturityStr && String(it.maturityDate||'').trim()) note += ` Maturity: ${String(it.maturityDate).trim()}.`;
    if(it.extra.length) note += ' ' + it.extra.join(' · ');
    if(!String(it.date||'').toString().trim()) note += ' (No date in sheet — set to import day.)';
    return {
      id: uid(), name: it.name || it.institution,
      date, category, subcategory: '',
      institution: it.institution,
      capital: it.capital, rateType, rateValue,
      durationNum, durationUnit,
      profitType: 'simple', status,
      additionalCapital:[], partialWithdrawals:[], reinvestments:[], actualProfit:null,
      reminderDays: (DB.settings.reminderDaysDefault||[30,7,1,0,-7]).slice(), remindersSent:[], linkedFromId:null,
      notes: note, fundedAccountId: null
    };
  });
}
function doImportInvestFile(e){
  const file = e.target.files[0]; if(!file) return;
  const isCsv = /\.csv$/i.test(file.name);
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      let rows; // array-of-arrays, rows[0] = header
      if(window.XLSX){
        const data = new Uint8Array(reader.result);
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      } else if(isCsv){
        const text = new TextDecoder('utf-8').decode(new Uint8Array(reader.result));
        rows = parseCsvText(text);
      } else {
        toast("Excel import needs an internet connection to load the parser. Try a .csv file, or reconnect and retry.");
        e.target.value = ''; return;
      }
      if(!rows || !rows.length){ toast("Empty file"); e.target.value=''; return; }
      let added = 0, skipped = 0;
      const col = buildPortfolioColIndex(rows[0]);
      if(isPortfolioSheet(col)){
        // Messy hand-kept portfolio sheet (Institution/Investment NAME/Date/Maturity Date/...) — no template needed.
        const items = parsePortfolioRows(rows, col);
        let dup = 0;
        const sig = i=> [i.name.toLowerCase(), i.date, i.capital, (i.institution||'').toLowerCase()].join('|');
        const seen = new Set(DB.investments.map(sig));
        items.forEach(inv=>{ if(seen.has(sig(inv))){ dup++; return; } seen.add(sig(inv)); DB.investments.push(inv); added++; });
        if(added || dup) toast(`Imported ${added} investment${added===1?'':'s'}${dup? ', '+dup+' duplicate'+(dup===1?'':'s')+' skipped':''} — please review categories`);
      } else {
        const objects = rowsToObjects(rows);
        objects.forEach(raw=>{
          const inv = investRowToObject(raw);
          if(inv){ DB.investments.push(inv); added++; } else skipped++;
        });
        if(added || skipped) toast(added? `Imported ${added} investment${added===1?'':'s'}${skipped? ', '+skipped+' skipped':''}` : 'No valid rows found — check the template format');
      }
      if(added){ persist(); render(); }
      if(!added && !skipped) toast('No valid rows found — check the file format');
    }catch(err){
      toast("Could not read that file — check it matches the template format");
    }
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

/* ===================== MONEFY / GENERIC TRANSACTION CSV / EXCEL IMPORT =====================
   Bulk-import income/expense transactions from a Monefy export (columns:
   date, account, category, amount, Note — where "account" actually holds
   Income/Expense, not a real account name) or any CSV/Excel using those
   header names. All imported rows land in one MHS account the user picks
   before the import runs. Reuses the SheetJS/CSV parsing helpers already
   defined above for the Investment importer. */
let pendingMonefyRows = null;
let pendingMonefyFileName = "";
let pendingMonefyFutureCount = 0;

function monefyAmt(raw){ // handles "1,000" / "৳1,200" (parseFloat alone would read "1,000" as 1)
  const v = findCol(raw,['amount','Amount']);
  return typeof v==='number' ? v : parseFloat(String(v).replace(/[,\s৳]/g,''));
}
function monefyRowType(raw){
  const ie = String(findCol(raw,['IncomeExpense']) || '').trim().toLowerCase();
  if(ie.startsWith('income')) return 'income';
  if(ie.startsWith('expense')) return 'expense';
  const accRaw = String(findCol(raw,['account','Account','Type']) || '').trim().toLowerCase();
  if(accRaw.includes('income')) return 'income';
  if(accRaw.includes('expense')) return 'expense';
  const amt = monefyAmt(raw);
  return (amt<0) ? 'expense' : 'income';
}
function monefyDate(v){
  // Native Excel date cells in this export were auto-recognized using MM/DD
  // ordering, while the plain-text dates elsewhere in the same file are
  // DD/MM (Monefy's real default, handled below). Swap month/day back for
  // native date cells wherever that's unambiguous (day<=12), so both
  // agree — otherwise entries like Nov/Oct/Dec 2026 show up as "future"
  // when they're really March/January/June 2026 in the file's real format.
  if(v instanceof Date && !isNaN(v)){
    let mo = v.getUTCMonth()+1, day = v.getUTCDate(), yr = v.getUTCFullYear();
    if(day<=12){ const t=mo; mo=day; day=t; }
    return `${yr}-${String(mo).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }
  if(typeof v === 'number'){ // Excel serial date
    const d = new Date(Math.round((v-25569)*86400*1000));
    return isNaN(d) ? todayStr() : d.toISOString().slice(0,10);
  }
  const s = String(v||'').trim();
  if(!s) return todayStr();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); // yyyy-mm-dd
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); // dd/mm/yyyy (Monefy default)
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  const d = new Date(s);
  return isNaN(d) ? todayStr() : d.toISOString().slice(0,10);
}
// Adds a category to income/expense custom categories if it's not already
// known, without spamming a toast per row during a bulk import.
function ensureCategoryExists(type, name){
  if(!name) return;
  if(getCats(type).some(c=>c.toLowerCase()===name.toLowerCase())) return;
  DB.customCategories[type].push(name);
  if(!DB.categoryIcons[name]) DB.categoryIcons[name] = "🔹";
}
function monefyRowToTx(raw, accountId){
  const amount = Math.abs(monefyAmt(raw));
  if(!amount || isNaN(amount)) return null;
  const type = monefyRowType(raw);
  let category = String(findCol(raw,['category','Category']) || '').trim();
  if(!category) category = type==='income' ? 'Other Income' : 'Other';
  ensureCategoryExists(type, category);
  const note = String(findCol(raw,['Note','note','Notes']) || '').trim();
  return { type, amount, category, accountId, date: monefyDate(findCol(raw,['date','Date'])), note };
}
function doImportMonefyFile(e){
  const file = e.target.files[0]; if(!file) return;
  const isCsv = /\.csv$/i.test(file.name);
  pendingMonefyFileName = file.name;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      let objects;
      if(window.XLSX){
        const data = new Uint8Array(reader.result);
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        objects = XLSX.utils.sheet_to_json(sheet, {defval:''});
      } else if(isCsv){
        const text = new TextDecoder('utf-8').decode(new Uint8Array(reader.result));
        objects = rowsToObjects(parseCsvText(text));
      } else {
        toast("Excel import needs an internet connection to load the parser. Try a .csv file, or reconnect and retry.");
        e.target.value = ''; return;
      }
      // Keep only rows that look like real transactions (has a parseable amount).
      const hasAmount = objects.filter(raw => {
        const amt = monefyAmt(raw);
        return !isNaN(amt) && amt !== 0;
      });
      // Some exports (e.g. Monefy's recurring/projected entries) include
      // rows dated after today — those haven't happened yet, so they're
      // excluded from import entirely rather than showing up as "recent"
      // activity or inflating this month's totals.
      const todayKey = todayStr();
      const valid = hasAmount.filter(raw => monefyDate(findCol(raw,['date','Date'])) <= todayKey);
      const futureCount = hasAmount.length - valid.length;
      if(!valid.length){
        toast(futureCount ? `All ${futureCount} row(s) were future-dated — nothing to import` : "No valid transaction rows found — check the file has date, account, category, amount columns");
        e.target.value=''; return;
      }
      pendingMonefyRows = valid;
      pendingMonefyFutureCount = futureCount;
      openMonefyImportSheet(valid.length);
    }catch(err){
      toast("Could not read that file — check it's a valid CSV/Excel export");
    }
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}
function openMonefyImportSheet(count){
  openSheet(`
    <h3>Import Transactions</h3>
    <p style="font-size:0.85rem;color:var(--muted,#888);margin-top:-4px;">Found <b>${count}</b> transaction${count===1?'':'s'} in <b>${escapeHtml(pendingMonefyFileName)}</b>${pendingMonefyFutureCount?` <span style="color:var(--rust)">(${pendingMonefyFutureCount} future-dated row${pendingMonefyFutureCount===1?'':'s'} excluded)</span>`:''}. Choose which account to add them to — amounts will update that account's balance.</p>
    <div class="field"><label>Import Into Account</label><select id="monefyAccount">${accOptions()}</select></div>
    <button class="btn" id="monefyImportBtn">Import ${count} Transaction${count===1?'':'s'}</button>
    <button class="btn secondary" id="monefyCancelBtn" style="margin-top:8px;">Cancel</button>
  `);
  document.getElementById('monefyImportBtn').onclick = confirmMonefyImport;
  document.getElementById('monefyCancelBtn').onclick = ()=>{ pendingMonefyRows = null; pendingMonefyFutureCount = 0; closeSheet(); };
}
// Like applyTransaction, but skips the per-row localStorage persist() so
// importing thousands of rows doesn't re-save the whole DB thousands of times.
function applyTransactionBulk(tx){
  tx.id = uid();
  tx.date = tx.date || todayStr();
  DB.transactions.push(tx);
  const acc = DB.accounts.find(a=>a.id===tx.accountId);
  if(tx.type==="income" && acc) acc.balance += Number(tx.amount);
  if(tx.type==="expense" && acc) acc.balance -= Number(tx.amount);
}
function confirmMonefyImport(){
  if(!pendingMonefyRows || !pendingMonefyRows.length){ closeSheet(); return; }
  const accountId = document.getElementById('monefyAccount').value;
  if(!accountId){ toast("Pick an account first"); return; }
  let added = 0, skipped = 0;
  pendingMonefyRows.forEach(raw=>{
    const tx = monefyRowToTx(raw, accountId);
    if(tx){ applyTransactionBulk(tx); added++; } else skipped++;
  });
  const futureCount = pendingMonefyFutureCount;
  pendingMonefyRows = null;
  pendingMonefyFutureCount = 0;
  closeSheet();
  if(added){
    DB.transactions.sort((a,b)=> b.date.localeCompare(a.date)); // keep newest-first display order
    persist();
    render();
  }
  const skipParts = [skipped? skipped+' skipped':'', futureCount? futureCount+' future-dated excluded':''].filter(Boolean).join(', ');
  toast(added? `Imported ${added} transaction${added===1?'':'s'}${skipParts? ', '+skipParts:''}` : 'No valid rows found');
}


/* ===================== IMPORT FINANCIAL DATA (CSV / XLSX / XLS) =====================
   Multi-step, audited migration of historical transactions into the existing MHS
   data model (DB.accounts / DB.transactions / DB.customCategories). Nothing is written
   until the final step; the commit is all-or-nothing with verification + rollback.
   Every imported transaction carries: imp (batch id), sr (source row numbers),
   oa (original signed amount) and oc (original category, only when it was re-mapped). */
let IMP = null;
const IMP_STEPS = ['File','Columns','Types','Accounts','Categories','Preview','Duplicates','Import'];
const IMP_FIELDS = [['date','Date',true],['account','Account',true],['category','Category',true],['amount','Amount',true],
  ['currency','Currency',false],['converted','Converted amount',false],['convCur','Converted currency',false],['note','Note',false],['type','Type (Income / Expense)',false],['description','Description',false]];
function impHist(){ if(!Array.isArray(DB.importHistory)) DB.importHistory = []; return DB.importHistory; }
function impNorm(s){ return String(s==null?'':s).normalize('NFC').toLowerCase().replace(/[\s'"`‘’“”._\-]+/g,''); }
function impTrim(s){ return String(s==null?'':s).normalize('NFC').replace(/\s+/g,' ').trim(); }
function impMoney(n){ return Number(n).toLocaleString('en-IN',{maximumFractionDigits:2}); }
function impDMY(iso){ return iso? iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4) : ''; }
function impCents(n){ return Math.round(Number(n)*100); }
function impNewState(){
  return { step:1, file:null, buf:null, map:{}, dateFmt:'DMY', defCur:'BDT', mergeTransfers:true, openingMode:'opening',
    unpaired:{}, acctMap:{}, catMap:{}, dupMode:'all', dupSkip:{}, dupReviewShown:200, plan:null, pvFilter:'all', pvPage:0, pvQ:'',
    running:false, cancel:false, result:null, error:'' };
}
/* ---------- parsing ---------- */
function impParseCsv(text, delim){
  const rows=[]; let row=[], field='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else q=false; } else field+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else if(c==='\r'){ /* skip */ }
    else field+=c;
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows;
}
function impLoadBuffer(name,size,buf,sheetName){
  const u8=new Uint8Array(buf);
  if(!u8.length) throw new Error('The file is empty.');
  let format='CSV';
  if(u8[0]===0x50&&u8[1]===0x4B) format='XLSX'; else if(u8[0]===0xD0&&u8[1]===0xCF) format='XLS';
  let rows, sheetNames=[], sheet='';
  if(format==='CSV'){
    let text=new TextDecoder('utf-8').decode(u8).replace(/^\uFEFF/,'');
    const first=text.split('\n')[0]||'';
    const cnt=d=>first.split(d).length;
    const delim = cnt('\t')>cnt(',') && cnt('\t')>cnt(';') ? '\t' : (cnt(';')>cnt(',') ? ';' : ',');
    rows=impParseCsv(text,delim);
  } else {
    if(!window.XLSX) throw new Error('Excel files need the SheetJS parser, which loads from the internet. Reconnect and retry, or save the sheet as CSV.');
    const wb=XLSX.read(u8,{type:'array',cellDates:true});
    sheetNames=wb.SheetNames.slice(); sheet=sheetName||sheetNames[0];
    rows=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,raw:true,defval:'',blankrows:false});
  }
  rows=rows.filter(r=>r.some(c=>String(c==null?'':c).trim()!==''));
  if(rows.length<2) throw new Error('No data rows found — the file needs a header row plus at least one transaction.');
  const seen={}; const headers=rows[0].map(h=>{
    let k=String(h==null?'':h).replace(/^\uFEFF/,'').trim()||'column';
    if(seen[k]===undefined){ seen[k]=0; return k; }
    seen[k]++; return k+'.'+seen[k];            // duplicate header "currency" becomes "currency.1"
  });
  return { name, size, format, sheetNames, sheet, headers, rows:rows.slice(1) };
}
function impAutoMap(hd){
  const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
  const alias={ date:['date','transactiondate','txndate','datetime','day'], account:['account','accountname','wallet'],
    category:['category','categoryname'], amount:['amount','amt','value'], currency:['currency','curr'],
    converted:['convertedamount','convertedvalue'], convCur:['currency1','convertedcurrency'],
    description:['description','details','remark','remarks'], note:['note','notes','memo'],
    type:['incomeexpense','incomeorexpense','type','transactiontype'] };
  const used=new Set(), m={};
  IMP_FIELDS.forEach(([f])=>{
    const i=hd.findIndex((h,idx)=>!used.has(idx)&&alias[f].includes(norm(h)));
    m[f]=i; if(i>=0) used.add(i);
  });
  return m;
}
function impFixText(s){
  // Repairs UTF-8 text that was mis-decoded as Latin-1 (e.g. Bengali saved as "à¦¡à¦¾…").
  if(typeof s!=='string' || !/[\u00c2-\u00f4][\u0080-\u00bf]/.test(s)) return s;
  try{
    const b=new Uint8Array(s.length);
    for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); if(c>255) return s; b[i]=c; }
    return new TextDecoder('utf-8',{fatal:true}).decode(b);
  }catch(e){ return s; }
}
function impParseDate(v,fmt){
  if(v instanceof Date && !isNaN(v)){ const d=new Date(v.getTime()+12*3600e3); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
  if(typeof v==='number' && isFinite(v)){ const d=new Date(Math.round((v-25569)*86400e3)); return isNaN(d)?null:d.toISOString().slice(0,10); }
  const s=String(v==null?'':v).trim(); if(!s) return null;
  const m=s.match(/^(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{1,4})(?:[ T].*)?$/); if(!m) return null;
  let y,mo,d;
  if(fmt==='YMD'){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  else if(fmt==='MDY'){ mo=+m[1]; d=+m[2]; y=+m[3]; }
  else { d=+m[1]; mo=+m[2]; y=+m[3]; }
  if(y<100) y+=2000;
  if(y<1900||y>2200||mo<1||mo>12||d<1) return null;
  const dim=new Date(Date.UTC(y,mo,0)).getUTCDate(); if(d>dim) return null;
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function impParseAmount(v){
  if(typeof v==='number') return isFinite(v)?v:NaN;
  let s=String(v==null?'':v).trim(); if(!s) return NaN;
  s=s.replace(/[০-৯]/g,c=>String(c.charCodeAt(0)-0x09E6)).replace(/[−–—]/g,'-').replace(/[\u00a0\s,৳$]/g,'').replace(/^(BDT|TK|USD)/i,'').replace(/(BDT|TK|USD)$/i,'');
  let neg=false;
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1); }
  if(/-$/.test(s)){ neg=!neg; s=s.slice(0,-1); }
  if(!/^[-+]?\d+(\.\d+)?$/.test(s) && !/^[-+]?\.\d+$/.test(s)) return NaN;
  const n=parseFloat(s); return neg? -Math.abs(n) : n;
}
function impSpecial(cat){
  const m=String(cat||'').match(/^\s*(to|from|initial\s+balance)\s*['‘’"“”`´]\s*(.+?)\s*['‘’"“”`´]\s*$/i);
  if(!m) return null;
  const k=m[1].toLowerCase().replace(/\s+/g,' ');
  return { kind: k==='initial balance'?'opening':k, name:m[2].trim(), label:impTrim(cat) };
}
/* ---------- step 2/3: rows -> validated records ---------- */
function impBuildRecs(){
  const f=IMP.file, m=IMP.map, recs=[];
  const get=(r,k)=> m[k]>=0 ? r[m[k]] : '';
  const cell=v=> v==null?'':(v instanceof Date?v.toISOString().slice(0,10):String(v));
  f.rows.forEach((r,i)=>{
    const rec={ n:i+1, errors:[], warns:[], raw:r.map(cell) };
    rec.dateRaw=get(r,'date'); rec.date=impParseDate(rec.dateRaw,IMP.dateFmt);
    rec.account=impFixText(impTrim(get(r,'account')));
    rec.category=impFixText(impTrim(get(r,'category')));
    const _txt=k=>String(get(r,k)==null?'':get(r,k)).trim();
    const _joined=[_txt('note'),_txt('description')].filter((x,i,a)=>x&&a.indexOf(x)===i).join(' · ');
    rec.desc=impFixText(_joined);
    if(rec.desc!==_joined) rec.warns.push('Text encoding repaired');
    rec.amount=impParseAmount(get(r,'amount'));
    { const tRaw=impTrim(get(r,'type')).toLowerCase();   // optional "Income /Expense" column decides the sign
      if(tRaw && !isNaN(rec.amount)){
        if(/^(expense|expenses|exp|debit|dr|out|withdrawal)$/.test(tRaw)) rec.amount=-Math.abs(rec.amount);
        else if(/^(income|inc|credit|cr|in|deposit)$/.test(tRaw)) rec.amount=Math.abs(rec.amount); } }
    rec.currency=impTrim(get(r,'currency'))||IMP.defCur;
    const conv=get(r,'converted'); rec.conv=(conv===''||conv==null)?null:impParseAmount(conv);
    rec.convCur=impTrim(get(r,'convCur'))||rec.currency;
    if(!rec.date) rec.errors.push('Invalid or missing date ("'+cell(rec.dateRaw)+'")');
    if(!rec.account) rec.errors.push('Missing account');
    if(isNaN(rec.amount)) rec.errors.push('Invalid or missing amount ("'+cell(get(r,'amount'))+'")');
    else if(rec.amount===0) rec.errors.push('Zero amount — needs review');
    if(!rec.category) rec.warns.push('Missing category');
    if(rec.conv!=null && !isNaN(rec.conv) && !isNaN(rec.amount) && rec.currency===rec.convCur && impCents(rec.conv)!==impCents(rec.amount)) rec.warns.push('Converted amount differs from amount');
    if(rec.currency!==IMP.defCur) rec.warns.push('Currency '+rec.currency+' differs from default '+IMP.defCur);
    recs.push(rec);
  });
  // exact duplicate fingerprint across ALL source columns (informational only — never auto-removed)
  const seen={};
  recs.forEach(rec=>{ const k=rec.raw.map(x=>impTrim(x)).join('\u0001'); seen[k]=(seen[k]||0)+1; rec.dupIdx=seen[k]-1; rec.fpKey=k; });
  recs.forEach(rec=>{ rec.dupTotal=seen[rec.fpKey]; });
  return recs;
}
function impBuildPlan(){
  const recs=impBuildRecs();
  const valid=recs.filter(r=>!r.errors.length), invalid=recs.filter(r=>r.errors.length);
  valid.forEach(r=>{ r.sp=impSpecial(r.category); });
  const acctNorms=new Set(valid.map(r=>impNorm(r.account)).concat(DB.accounts.map(a=>impNorm(a.name))));
  const pk=(d,o,i,amt)=>d+'|'+impNorm(o)+'|'+impNorm(i)+'|'+impCents(amt);
  const pairedSkip=new Set(), pairOf={};
  if(IMP.mergeTransfers){
    const froms=new Map();
    valid.forEach(r=>{ if(r.sp&&r.sp.kind==='from'&&r.amount>0){ const k=pk(r.date,r.sp.name,r.account,r.amount); if(!froms.has(k)) froms.set(k,[]); froms.get(k).push(r); } });
    valid.forEach(r=>{ if(r.sp&&r.sp.kind==='to'&&r.amount<0){ const k=pk(r.date,r.account,r.sp.name,-r.amount); const l=froms.get(k); if(l&&l.length){ const o=l.shift(); pairOf[r.n]=o; pairedSkip.add(o.n); } } });
  }
  const items=[], unpairedGroups={};
  valid.forEach(r=>{
    if(pairedSkip.has(r.n)) return;
    const base={ rows:[r.n], date:r.date, desc:r.desc, signed:r.amount, srcCat:r.category, warns:r.warns, dup:r.dupIdx>0 };
    if(pairOf[r.n]){
      const o=pairOf[r.n];
      items.push(Object.assign(base,{ type:'transfer', kind:'transfer-pair', amount:-r.amount, accName:r.account, toAccName:o.account, rows:[r.n,o.n], srcCat2:o.category, desc:r.desc||o.desc, dup:r.dupIdx>0&&o.dupIdx>0 }));
      return;
    }
    if(r.sp && r.sp.kind==='opening' && IMP.openingMode==='opening'){
      items.push(Object.assign(base,{ type:'opening', kind:'opening', amount:Math.abs(r.amount), dir:r.amount>0?'in':'out', accName:r.account })); return;
    }
    if(r.sp && (r.sp.kind==='to'||r.sp.kind==='from')){
      const okSign = r.sp.kind==='to' ? r.amount<0 : r.amount>0;
      const diffAcc=impNorm(r.sp.name)!==impNorm(r.account);
      // "validated" = the named counter-account really exists (in the file or the app) and the sign matches To/From
      const g=unpairedGroups[r.sp.label]||(unpairedGroups[r.sp.label]={label:r.sp.label,kind:r.sp.kind,target:r.sp.name,count:0,total:0,canTransfer:okSign&&acctNorms.has(impNorm(r.sp.name))&&diffAcc,canConvert:okSign&&diffAcc,exists:acctNorms.has(impNorm(r.sp.name))});
      g.count++; g.total+=r.amount; g.mode=IMP.unpaired[r.sp.label]||(g.canTransfer?'transfer':'asis');
      if(okSign && diffAcc && g.mode==='transfer'){
        items.push(Object.assign(base,{ type:'transfer', kind:'transfer-single', amount:Math.abs(r.amount),
          accName:r.sp.kind==='to'?r.account:r.sp.name, toAccName:r.sp.kind==='to'?r.sp.name:r.account })); return;
      }
    }
    const type=r.amount>0?'income':'expense';
    let cat=r.category; if(!cat) cat=type==='income'?'Other Income':'Other';
    items.push(Object.assign(base,{ type, kind:r.sp?'special-asis':'ordinary', amount:Math.abs(r.amount), accName:r.account, srcCat:cat }));
  });
  const stats={ total:recs.length, valid:valid.length, invalid:invalid.length,
    pos:valid.filter(r=>r.amount>0).length, neg:valid.filter(r=>r.amount<0).length,
    zero:recs.filter(r=>r.amount===0).length,
    posSum:valid.filter(r=>r.amount>0).reduce((s,r)=>s+impCents(r.amount),0)/100,
    negSum:valid.filter(r=>r.amount<0).reduce((s,r)=>s+impCents(r.amount),0)/100,
    emptyDesc:recs.filter(r=>!r.desc).length, emptyCat:recs.filter(r=>!r.category).length,
    dupRows:recs.filter(r=>r.dupIdx>0).length, dupGroups:new Set(recs.filter(r=>r.dupTotal>1).map(r=>r.fpKey)).size,
    accounts:new Set(valid.map(r=>impNorm(r.account))).size, categories:new Set(valid.map(r=>r.category)).size,
    dMin:valid.reduce((m,r)=>!m||r.date<m?r.date:m,''), dMax:valid.reduce((m,r)=>!m||r.date>m?r.date:m,''),
    repaired:recs.filter(r=>r.warns.includes('Text encoding repaired')).length,
    pairs:Object.keys(pairOf).length, openings:items.filter(i=>i.type==='opening').length,
    currencies:[...new Set(valid.map(r=>r.currency))], convMismatch:valid.filter(r=>r.warns.includes('Converted amount differs from amount')).length };

}
/* ---------- step 4/5: account + category resolution ---------- */
function impGuessAcctType(n){

  if(/fdr|dps/.test(s)) return 'fdr'; if(/share|invest|growup|farmer|stock|fund/.test(s)) return 'investment';
  return 'bank';
}
function impAccountList(){
  const out=[], seen=new Set();
  IMP.plan.items.forEach(it=>[it.accName,it.toAccName].forEach(n=>{
    if(!n) return; const k=impNorm(n); if(seen.has(k)) return; seen.add(k);
    let a=IMP.acctMap[k];
    const ex=DB.accounts.find(x=>impNorm(x.name)===k);
    if(!a || (a.mode==='existing' && !DB.accounts.some(x=>x.id===a.id))) a=IMP.acctMap[k]= ex? {mode:'existing',id:ex.id} : {mode:'create',name:impTrim(n),type:impGuessAcctType(n)};

  }));

}
function impDefaultCat(type,src){

}
function impGuessCatIcon(name,type){

  const rules=[[/inject/,'💉'],[/lab|scan|diagnos|path|x-?ray/,'🧪'],[/doctime|doctor|consult/,'🩺'],[/procedure/,'🩹'],[/medicine|sell|selling|kona|pharm/,'💊'],
    [/deposit/,'💰'],[/invest/,'📈'],[/other/,'➕'],[/hospital|clinic|care|medicare|health|cardiac|hormone|center|centre|city|janani|niramoy|american|pacific|imperial|baraka|digital|universal|modern|padma|zu\b/,'🏥'],[/navana/,'🏢']];

function impCategoryList(){
  const rows=new Map();

    const key=it.type+'|'+it.srcCat; let r=rows.get(key);

  out.forEach(r=>{

/* ---------- step 7: duplicates against the existing ledger ---------- */
function impResolveItems(){
  // Turns plan items into final, DB-ready transactions (ids assigned at commit).
  const accOf=name=>{ const a=IMP.acctMap[impNorm(name)]; return a; };
  const catOf=(type,src)=>{ const t=impTrim(IMP.catMap[type+'|'+src]); return t||src; };
  return IMP.plan.items.map((it,idx)=>{
    const t={ _i:idx, type:it.type, amount:it.amount, date:it.date, note:it.desc||'', sr:it.rows, oa:it.signed, _acc:it.accName, _to:it.toAccName||null, _item:it };
    if(it.type==='income'||it.type==='expense'){ t.category=catOf(it.type,it.srcCat); if(t.category!==it.srcCat) t.oc=it.srcCat; }
    if(it.type==='opening'){ t.category=it.srcCat; t.dir=it.dir; }
    if(it.kind==='transfer-single') t.oc=it.srcCat;

}
function impExistingMatches(final){
  const bucket=new Map();
  const key=(date,accId,type,amt,cat,note)=>[date,accId,type,impCents(amt),(cat||'').toLowerCase(),impTrim(note)].join('|');
  DB.transactions.forEach(t=>{ const k=key(t.date,t.accountId,t.type,t.amount,t.category,t.note); bucket.set(k,(bucket.get(k)||0)+1); });
  const hits=new Set();
  final.forEach(t=>{
    const a=IMP.acctMap[impNorm(t._acc)]; if(!a||a.mode!=='existing') return;
    const k=key(t.date,a.id,t.type,t.amount,t.category,t.note);
    const c=bucket.get(k)||0; if(c>0){ bucket.set(k,c-1); hits.add(t._i); }
  });
  return hits;
}

/* ---------- commit (all-or-nothing) ---------- */
function impFinalSet(){
  const final=impResolveItems();
  const hits=impExistingMatches(final);
  const skip=new Set();
  const cand=[];
  final.forEach(t=>{
    const isHit=hits.has(t._i), isFileDup=!!t._item.dup;
    if(isHit||isFileDup) cand.push({t,isHit,isFileDup});
    if(IMP.dupMode==='skip' && isHit) skip.add(t._i);
    if(IMP.dupMode==='review'){
      const v=IMP.dupSkip[t._i]; const sk = v===undefined ? isHit : v;
      if(sk && (isHit||isFileDup)) skip.add(t._i);
    }
  });
  return { final, hits, skip, cand };
}
function impLegs(tx){
  const sr=tx.sr||[]; const a=Number(tx.amount);
  if(tx.type==='income') return [{acc:tx.accountId,v:a}];
  if(tx.type==='expense') return [{acc:tx.accountId,v:-a}];
  if(tx.type==='opening') return [{acc:tx.accountId,v:tx.dir==='out'?-a:a}];
  if(tx.type==='transfer'){
    if(sr.length>=2) return [{acc:tx.accountId,v:-a},{acc:tx.toAccountId,v:a}];
    return (tx.oa<0)? [{acc:tx.accountId,v:-a}] : [{acc:tx.toAccountId,v:a}];
  }
  return [];
}
function impEffects(tx){          // true balance effect on app accounts (mirrors applyTransaction)
  const a=Number(tx.amount);
  if(tx.type==='income') return [[tx.accountId,a]];
  if(tx.type==='expense') return [[tx.accountId,-a]];
  if(tx.type==='opening') return [[tx.accountId,tx.dir==='out'?-a:a]];
  if(tx.type==='transfer') return [[tx.accountId,-a],[tx.toAccountId,a]];

}
