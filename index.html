n  showToast(orig ? ('Sale Updated ✅'+(lines.length>1?' ('+lines.length+' Batches)':'')) : ('Sale Saved ✅'+(lines.length>1?' ('+lines.length+' Batches)':'')));\n  saveDB();\n  resetSaleForm();\n  toggleForm('form-sale');\n  renderAll();\n}\nfunction editSale(id){\n  const recs = saleGroupRecs(id);\n  if(!recs.length) return;\n  const s = recs[0];\n  if(new Set(recs.map(r=>r.productId)).size>1 || recs.some(r=>/^Quick Sale/.test(r.note||''))){ editQuickSale(id); return; }\n  qsRestorePending();\n  editingSaleId = s.id;\n  releaseSaleStock(s.id); // temporarily release stock so this sale is editable\n  document.getElementById('sl-shop').value = s.shopId;\n  document.getElementById('sl-product').value = s.productId;\n  document.getElementById('sl-batch-list').innerHTML = ''; // start rows fresh for this sale\n  loadBatchOptions();\n  recs.forEach(r=>{\n    const row = document.querySelector('#sl-batch-list .sl-brow[data-bid=\"'+r.batchId+'\"]');\n    if(row){\n      row.querySelector('.sl-bqty').value = r.qty;\n      row.querySelector('.sl-bmrp').value = r.mrp;\n    }\n  });\n  document.getElementById('sl-date').value = s.date;\n  document.getElementById('sl-discount').value = s.discountPct||0;\n  document.getElementById('sl-transport').value = recs.reduce((a,r)=>a+(r.transport||0),0);\n  document.getElementById('sl-paid').value = recs.reduce((a,r)=>a+(r.paid||0),0);\n  document.getElementById('sl-note').value = s.note||'';\n  syncTopMrp();\n  calcSale();\n  const panel = document.getElementById('form-sale');\n  if(!panel.classList.contains('open')) toggleForm('form-sale');\n  panel.querySelector('h3').textContent = '✏️ Edit Sale (you can add more Batches too)';\n  panel.querySelector('.btn-primary').textContent = 'Update Sale';\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\nfunction resetSaleForm(){\n  editingSaleId = null;\n  const panel = document.getElementById('form-sale');\n  panel.querySelector('h3').textContent = 'Sale Entry';\n  panel.querySelector('.btn-primary').textContent = 'Save Sale';\n  ['sl-qty','sl-mrp','sl-discount','sl-paid'].forEach(id=>document.getElementById(id).value='');\n  document.getElementById('sl-batch-list').innerHTML='';\n  document.getElementById('sl-discount-amt').value='';\n  document.getElementById('sl-transport').value='';\n  document.getElementById('sl-note').value='';\n  document.getElementById('sl-sellprice').value='';\n  document.getElementById('sl-profitPreview').textContent='Tk 0';\n  document.getElementById('sl-transport-note').style.display='none';\n}\nfunction openNewSale(){\n  qsRestorePending();\n  const wasEditing = !!editingSaleId;\n  if(editingSaleId){ restoreSaleStock(editingSaleId); }\n  resetSaleForm();\n  loadBatchOptions();\n  const panel = document.getElementById('form-sale');\n  if(wasEditing && panel.classList.contains('open')){\n    // keep the panel open, just now blank/fresh instead of toggling it closed\n  } else {\n    toggleForm('form-sale');\n  }\n}\nfunction cancelSaleForm(){\n  if(editingSaleId){ restoreSaleStock(editingSaleId); }\n  resetSaleForm();\n  toggleForm('form-sale');\n}\nfunction deleteSale(id){\n  if(!confirm('Delete this Sale? Stock will be returned.')) return;\n  const recs = saleGroupRecs(id);\n  const ids = new Set(recs.map(r=>r.id));\n  recs.forEach(r=>{ if(r.mainTxId){ try{ const br=qsBridge(); if(br) br.deleteTx(r.mainTxId); }catch(e){} } });\n  recs.forEach(r=>{ const b = DB.batches.find(x=>x.id===r.batchId); if(b) b.soldQty -= r.qty; });\n  DB.sales = DB.sales.filter(x=>!ids.has(x.id)); saveDB(); renderAll();\n}\nfunction renderSales(){\n  const box = document.getElementById('salesList');\n  const storeSales = DB.sales.filter(s=>inCurrentStore(s.storeId));\n  if(storeSales.length===0){ box.innerHTML = '<div class=\"empty\">No Sale found.<\/div>'; return; }\n  const shopIds = [...new Set(storeSales.map(s=>s.shopId))];\n  const shopsWithSales = shopIds.map(id=>DB.shops.find(s=>s.id===id)).filter(Boolean)\n    .sort((a,b)=>shopTotalSales(b.id)-shopTotalSales(a.id));\n  if(shopsWithSales.length===0){ box.innerHTML = '<div class=\"empty\">No Sale found.<\/div>'; return; }\n  box.innerHTML = shopsWithSales.map(s=>{\n    const entries = storeSales.filter(x=>x.shopId===s.id);\n    const total = entries.reduce((a,x)=>a+x.sellingPrice*x.qty+saleExtras(x),0);\n    const due = DB.settings.currentStoreId ? null : shopDue(s.id);\n    const profit = entries.reduce((a,x)=>a+x.profit,0);\n    const lastDate = entries.reduce((m,x)=> (x.date||'') > m ? x.date : m, '');\n    return `<div class=\"list-item\" onclick=\"openShopDetail('${s.id}')\" style=\"cursor:pointer;\">\n      <div class=\"li-top\">\n        <div><div class=\"li-title\">🏬 ${s.name}<\/div>\n        <div class=\"li-sub\">${groupedSales(entries).length} Entries${lastDate?(' · Last '+lastDate):''}<\/div>\n        <div class=\"li-tags\"><span class=\"tag\">Sales: ${fmt(total)}<\/span><span class=\"tag\">Profit: ${fmt(profit)}<\/span>${due!==null&&due>0?`<span class=\"tag low\">Due: ${fmt(due)}<\/span>`:''}<\/div><\/div>\n        <div class=\"li-right\"><div class=\"li-num\">${fmt(total)}<\/div><\/div>\n      <\/div>\n    <\/div>`;\n  }).join('');\n}\n\n/* ---------------- PROFIT & LOSS ---------------- */\nlet pnlRankType = 'product';\nfunction setPnlRank(t, el){\n  pnlRankType = t;\n  document.querySelectorAll('#pnlTabs .subtab').forEach(b=>b.classList.remove('active'));\n  el.classList.add('active');\n  renderPnl();\n}\nfunction renderPnl(){\n  const today = todayStr();\n  const todaySales = DB.sales.filter(s=>s.date===today && inCurrentStore(s.storeId));\n  const tSales = todaySales.reduce((a,x)=>a+x.sellingPrice*x.qty,0);\n  const tCost = todaySales.reduce((a,x)=>a+x.tp*x.qty+(x.courierCharge||0)+(x.courierCod||0),0);\n  const tProfit = tSales-tCost;\n  document.getElementById('pnlTodaySales').textContent = fmt(tSales);\n  document.getElementById('pnlTodayCost').textContent = fmt(tCost);\n  document.getElementById('pnlTodayProfit').textContent = fmt(tProfit);\n  document.getElementById('pnlTodayMargin').textContent = (tSales? (tProfit/tSales*100).toFixed(1):0)+'%';\n\n  const ym = new Date().toISOString().slice(0,7);\n  const mSales = DB.sales.filter(s=>s.date && s.date.slice(0,7)===ym && inCurrentStore(s.storeId));\n  const mS = mSales.reduce((a,x)=>a+x.sellingPrice*x.qty,0);\n  const mC = mSales.reduce((a,x)=>a+x.tp*x.qty+(x.courierCharge||0)+(x.courierCod||0),0);\n  document.getElementById('pnlMonthSales').textContent = fmt(mS);\n  document.getElementById('pnlMonthCost').textContent = fmt(mC);\n  document.getElementById('pnlMonthProfit').textContent = fmt(mS-mC);\n\n  const totalDue = DB.shops.reduce((a,s)=>a+Math.max(0,shopDue(s.id)),0);\n  const totalCollection = DB.shops.reduce((a,s)=>a+shopPaidTotal(s.id),0);\n  document.getElementById('pnlOutstanding').textContent = fmt(totalDue);\n  document.getElementById('pnlCollection').textContent = fmt(totalCollection);\n\n  const map = {};\n  DB.sales.filter(s=>inCurrentStore(s.storeId)).forEach(s=>{\n    let key;\n    const p = DB.products.find(x=>x.id===s.productId);\n    if(pnlRankType==='product') key = p?p.name:'Unknown';\n    else if(pnlRankType==='category') key = p?(p.category||'Unknown'):'Unknown';\n    else if(pnlRankType==='company') key = p?(p.brand||'Unknown'):'Unknown';\n    else if(pnlRankType==='shop') key = shopName(s.shopId);\n    map[key] = (map[key]||0) + s.profit;\n  });\n  const sorted = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,10);\n  const card = document.getElementById('pnlRankCard');\n  card.innerHTML = sorted.length ? sorted.map((c,i)=>`<div class=\"rank-item\"><span><span class=\"rank-badge\">${i+1}<\/span>${c[0]}<\/span><b>${fmt(c[1])}<\/b><\/div>`).join('') : '<div class=\"empty\">No data<\/div>';\n}\n\n/* ---------------- DUE / PAYMENTS ---------------- */\nlet dueTab = 'shop';\nlet dueFromDate = '';\nlet dueToDate = '';\nfunction onDueDateRangeChange(){\n  dueFromDate = document.getElementById('due-from-date').value || '';\n  dueToDate = document.getElementById('due-to-date').value || '';\n  renderDue();\n}\nfunction clearDueDateRange(){\n  dueFromDate = ''; dueToDate = '';\n  document.getElementById('due-from-date').value = '';\n  document.getElementById('due-to-date').value = '';\n  renderDue();\n}\nfunction setDueTab(t, el){ dueTab=t; document.querySelectorAll('#sec-due .subtab').forEach(b=>b.classList.remove('active')); el.classList.add('active'); renderDue(); }\nfunction renderDue(){\n  const box = document.getElementById('dueList');\n  const summary = document.getElementById('dueSummary');\n  const from = dueFromDate, to = dueToDate;\n  const filtering = !!(from || to);\n  const rangeLbl = filtering ? ' (' + (from||'…') + ' → ' + (to||'…') + ')' : '';\n  if(dueTab==='shop'){\n    const shopsInScope = DB.shops.filter(s=>!DB.settings.currentStoreId || DB.sales.some(x=>x.shopId===s.id && inCurrentStore(x.storeId)));\n    const totalPaid = shopsInScope.reduce((a,s)=>a+(filtering?shopPaidTotalInRange(s.id,from,to):shopPaidTotal(s.id)),0);\n    const totalDue = shopsInScope.reduce((a,s)=>a+Math.max(0, filtering?shopDueInRange(s.id,from,to):shopDue(s.id)),0);\n    summary.innerHTML = `\n      <div class=\"card accent\"><div class=\"icon\">💰<\/div><div class=\"val\">${fmt(totalPaid)}<\/div><div class=\"lbl\">Total Paid${rangeLbl}<\/div><\/div>\n      <div class=\"card danger\"><div class=\"icon\">⚠️<\/div><div class=\"val\">${fmt(totalDue)}<\/div><div class=\"lbl\">Total Due${rangeLbl}<\/div><\/div>`;\n    if(shopsInScope.length===0){ box.innerHTML='<div class=\"empty\">No Shop found.<\/div>'; return; }\n    box.innerHTML = shopsInScope.map(s=>{\n      const total = filtering ? shopTotalSalesInRange(s.id,from,to) : shopTotalSales(s.id);\n      const paid = filtering ? shopPaidTotalInRange(s.id,from,to) : shopPaidTotal(s.id);\n      const due = filtering ? shopDueInRange(s.id,from,to) : shopDue(s.id);\n      const payCount = DB.shopPayments.filter(p=>p.shopId===s.id && inCurrentStore(p.storeId) && (!filtering || dateInRange(p.date,from,to))).length;\n      return `<div class=\"list-item\" onclick=\"openDueHistory('shop','${s.id}')\" style=\"cursor:pointer;\">\n        <div class=\"li-top\"><div><div class=\"li-title\">${s.name}<\/div>\n        <div class=\"li-sub\">${payCount} Payment Entries${rangeLbl}<\/div>\n        <div class=\"li-tags\"><span class=\"tag\">Sales: ${fmt(total)}<\/span><span class=\"tag\">Paid: ${fmt(paid)}<\/span>${due>0?`<span class=\"tag low\">Due: ${fmt(due)}<\/span>`:'<span class=\"tag\">Due: Tk 0<\/span>'}<\/div><\/div><\/div>\n        <div class=\"li-actions\"><button class=\"btn btn-primary btn-sm\" onclick=\"event.stopPropagation();addShopPayment('${s.id}')\">💰 Receive Payment<\/button><button class=\"btn btn-outline btn-sm\" onclick=\"event.stopPropagation();openDueHistory('shop','${s.id}')\">📜 History<\/button><button class=\"btn btn-whatsapp btn-sm\" onclick=\"event.stopPropagation();shareShopDueWhatsApp('${s.id}')\">📤 WhatsApp<\/button><\/div>\n      <\/div>`;\n    }).join('');\n  } else {\n    const suppliersInScope = DB.suppliers.filter(s=>!DB.settings.currentStoreId || DB.batches.some(b=>b.supplierId===s.id && inCurrentStore(b.storeId)));\n    const totalPaid = suppliersInScope.reduce((a,s)=>a+(filtering?supplierPaidInRange(s.id,from,to):supplierPaid(s.id)),0);\n    const totalDue = suppliersInScope.reduce((a,s)=>a+Math.max(0, filtering?supplierDueInRange(s.id,from,to):(supplierTotalPurchase(s.id)-supplierPaid(s.id))),0);\n    summary.innerHTML = `\n      <div class=\"card accent\"><div class=\"icon\">💸<\/div><div class=\"val\">${fmt(totalPaid)}<\/div><div class=\"lbl\">Total Paid${rangeLbl}<\/div><\/div>\n      <div class=\"card danger\"><div class=\"icon\">⚠️<\/div><div class=\"val\">${fmt(totalDue)}<\/div><div class=\"lbl\">Total Payable${rangeLbl}<\/div><\/div>`;\n    if(suppliersInScope.length===0){ box.innerHTML='<div class=\"empty\">No Supplier found.<\/div>'; return; }\n    box.innerHTML = suppliersInScope.map(s=>{\n      const total = filtering ? supplierTotalPurchaseInRange(s.id,from,to) : supplierTotalPurchase(s.id);\n      const paid = filtering ? supplierPaidInRange(s.id,from,to) : supplierPaid(s.id);\n      const due = filtering ? supplierDueInRange(s.id,from,to) : (supplierTotalPurchase(s.id)-supplierPaid(s.id));\n      const payCount = DB.supplierPayments.filter(p=>p.supplierId===s.id && inCurrentStore(p.storeId) && (!filtering || dateInRange(p.date,from,to))).length;\n      return `<div class=\"list-item\" onclick=\"openDueHistory('supplier','${s.id}')\" style=\"cursor:pointer;\">\n        <div class=\"li-top\"><div><div class=\"li-title\">${s.name}<\/div>\n        <div class=\"li-sub\">${payCount} Payment Entries${rangeLbl}<\/div>\n        <div class=\"li-tags\"><span class=\"tag\">Purchase: ${fmt(total)}<\/span><span class=\"tag\">Paid: ${fmt(paid)}<\/span>${due>0?`<span class=\"tag low\">Payable: ${fmt(due)}<\/span>`:'<span class=\"tag\">Payable: Tk 0<\/span>'}<\/div><\/div><\/div>\n        <div class=\"li-actions\"><button class=\"btn btn-primary btn-sm\" onclick=\"event.stopPropagation();addSupplierPayment('${s.id}')\">💸 Give Payment<\/button><button class=\"btn btn-outline btn-sm\" onclick=\"event.stopPropagation();openDueHistory('supplier','${s.id}')\">📜 History<\/button><\/div>\n      <\/div>`;\n    }).join('');\n  }\n}\nlet payTarget = null;\nfunction openPaymentModal(type, id, editPayId){\n  payTarget = {type, id, editId: editPayId || null};\n  const isEdit = !!editPayId;\n  let existing = null;\n  if(isEdit){\n    existing = type==='shop' ? DB.shopPayments.find(x=>x.id===editPayId) : DB.supplierPayments.find(x=>x.id===editPayId);\n  }\n  document.getElementById('pay-title').textContent = isEdit ? '✏️ Edit Payment' : (type==='shop' ? '💰 Receive Shop Payment' : '💸 Give Supplier Payment');\n  document.getElementById('pay-date').value = existing ? (existing.date || todayStr()) : todayStr();\n  document.getElementById('pay-amount').value = existing ? existing.amount : '';\n  document.getElementById('pay-note').value = existing ? (existing.note || '') : '';\n  document.getElementById('paymentModal').classList.add('open');\n}\nfunction closePaymentModal(){ document.getElementById('paymentModal').classList.remove('open'); payTarget=null; }\nfunction savePaymentEntry(){\n  if(!payTarget) return;\n  const amt = Number(document.getElementById('pay-amount').value);\n  const date = document.getElementById('pay-date').value || todayStr();\n  const note = document.getElementById('pay-note').value.trim();\n  if(!amt || amt<=0){ showToast('Enter a valid Amount'); return; }\n  const isEdit = !!payTarget.editId;\n  let existing = null;\n  if(isEdit){\n    existing = payTarget.type==='shop' ? DB.shopPayments.find(x=>x.id===payTarget.editId) : DB.supplierPayments.find(x=>x.id===payTarget.editId);\n  }\n  const originalAmt = existing ? existing.amount : 0;\n  const due = (payTarget.type==='shop' ? shopDue(payTarget.id) : supplierDue(payTarget.id)) + originalAmt;\n  if(due>0 && amt>due+0.01){ showToast('Amount cannot be more than the Due (Due: '+fmt(due)+')'); return; }\n  if(isEdit){\n    if(existing){ existing.date = date; existing.amount = amt; existing.note = note; }\n  } else if(payTarget.type==='shop'){\n    DB.shopPayments.push({id:uid(), date, shopId:payTarget.id, amount:amt, note, storeId: DB.settings.currentStoreId||''});\n  } else {\n    DB.supplierPayments.push({id:uid(), date, supplierId:payTarget.id, amount:amt, note, storeId: DB.settings.currentStoreId||''});\n  }\n  saveDB(); showToast(isEdit ? 'Payment Updated ✅' : 'Payment Added ✅'); closePaymentModal(); renderAll();\n  if(document.getElementById('genDetailModal').classList.contains('open')) openDueHistory(payTarget.type, payTarget.id);\n}\nfunction addShopPayment(shopId){ openPaymentModal('shop', shopId); }\nfunction addSupplierPayment(supplierId){ openPaymentModal('supplier', supplierId); }\nfunction editShopPayment(payId){\n  const p = DB.shopPayments.find(x=>x.id===payId); if(!p) return;\n  openPaymentModal('shop', p.shopId, payId);\n}\nfunction editSupplierPayment(payId){\n  const p = DB.supplierPayments.find(x=>x.id===payId); if(!p) return;\n  openPaymentModal('supplier', p.supplierId, payId);\n}\nfunction saveStatementNote(shopId){\n  const s = DB.shops.find(x=>x.id===shopId); if(!s) return;\n  s.statementNote = (document.getElementById('stmt-note').value||'').trim();\n  saveDB(); showToast('Note Saved ✅');\n}\nfunction deleteShopPayment(payId){\n  if(!confirm('Delete this Payment entry?')) return;\n  const p = DB.shopPayments.find(x=>x.id===payId);\n  DB.shopPayments = DB.shopPayments.filter(x=>x.id!==payId);\n  saveDB(); showToast('Payment Deleted ✅'); renderAll();\n  if(p) openDueHistory('shop', p.shopId);\n}\nfunction deleteSupplierPayment(payId){\n  if(!confirm('Delete this Payment entry?')) return;\n  const p = DB.supplierPayments.find(x=>x.id===payId);\n  DB.supplierPayments = DB.supplierPayments.filter(x=>x.id!==payId);\n  saveDB(); showToast('Payment Deleted ✅'); renderAll();\n  if(p) openDueHistory('supplier', p.supplierId);\n}\nfunction closeGenDetail(){ document.getElementById('genDetailModal').classList.remove('open'); gdProductId = null; document.getElementById('gd-tabs').style.display='none'; document.getElementById('gd-tabs').innerHTML=''; }\nlet gdProductId = null;\nlet gdProductTab = 'sales';\nfunction openProductDetail(productId){\n  gdProductId = productId;\n  gdProductTab = 'sales';\n  renderProductDetailModal();\n  document.getElementById('genDetailModal').classList.add('open');\n}\nfunction setGDProductTab(t){ gdProductTab = t; renderProductDetailModal(); }\nfunction renderProductDetailModal(){\n  const p = DB.products.find(x=>x.id===gdProductId);\n  if(!p) return;\n  document.getElementById('gd-name').textContent = '📦 ' + p.name;\n  const tabs = document.getElementById('gd-tabs');\n  tabs.style.display = 'flex';\n  tabs.innerHTML = `\n    <button class=\"subtab ${gdProductTab==='sales'?'active':''}\" onclick=\"setGDProductTab('sales')\">💰 Sales<\/button>\n    <button class=\"subtab ${gdProductTab==='purchase'?'active':''}\" onclick=\"setGDProductTab('purchase')\">📥 Purchase<\/button>`;\n  if(gdProductTab==='purchase') renderProductPurchaseTab(p);\n  else renderProductSalesTab(p);\n}\nfunction renderProductPurchaseTab(p){\n  const batches = DB.batches.filter(b=>b.productId===p.id).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));\n  const totalQty = batches.reduce((s,b)=>s+Number(b.qty||0),0);\n  const totalCost = batches.reduce((s,b)=>s+b.qty*b.tp,0);\n  const stockLeft = batches.reduce((s,b)=>s+batchStock(b),0);\n  document.getElementById('gd-sub').textContent = (p.brand||'') + (batches.length? (' · '+batches.length+' Purchase Entries') : '');\n  document.getElementById('gd-stats').innerHTML = `\n    <div class=\"dbst\"><div class=\"v\">${totalQty}<\/div><div class=\"l\">Total Qty<\/div><\/div>\n    <div class=\"dbst\"><div class=\"v\">${fmt(totalCost)}<\/div><div class=\"l\">Total Cost<\/div><\/div>\n    <div class=\"dbst\"><div class=\"v\">${stockLeft}<\/div><div class=\"l\">Stock Left<\/div><\/div>\n    <div class=\"dbst\"><div class=\"v\">${batches.length}<\/div><div class=\"l\">Entries<\/div><\/div>`;\n  const box = document.getElementById('gd-list');\n  if(batches.length===0){\n    box.innerHTML = '<div class=\"empty\">No Purchase found for this Product.<\/div>';\n  } else {\n    box.innerHTML = batches.map(b=>{\n      const d = daysUntil(b.expDate);\n      let expTxt = b.expDate ? (' · Exp: '+b.expDate) : '';\n      return `<div class=\"dbsale\">\n        <div class=\"r1\"><span>📅 ${b.date||''}<\/span><span>TP ${fmt(b.tp)}<\/span><\/div>\n        <div class=\"r2\"><span>${supplierName(b.supplierId)} · Batch ${b.batchNo||'-'} · Qty ${b.qty}<\/span><span>Left ${batchStock(b)}${expTxt}<\/span><\/div>\n        <div class=\"r3\">\n          <button class=\"btn btn-outline\" onclick=\"closeGenDetail();go('purchase');setTimeout(()=>editBatch('${b.id}'),80);\">✏️ Edit<\/button>\n          <button class=\"btn btn-danger\" onclick=\"deleteBatch('${b.id}');renderProductDetailModal();\">🗑️ Delete<\/button>\n        <\/div>\n      <\/div>`;\n    }).join('');\n  }\n}\nfunction renderProductSalesTab(p){\n  const sales = DB.sales.filter(s=>s.productId===p.id).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));\n  const totalQty = sales.reduce((s,x)=>s+Number(x.qty||0),0);\n  const totalSales = sales.reduce((s,x)=>s+x.sellingPrice*x.qty+saleExtras(x),0);\n  const totalProfit = sales.reduce((s,x)=>s+x.profit,0);\n  const totalPaid = sales.reduce((s,x)=>s+(x.paid||0),0);\n  const totalDue = totalSales - totalPaid;\n  document.getElementById('gd-sub').textContent = (p.brand||'') + (sales.length? (' · '+groupedSales(sales).length+' Sales Entries') : '');\n  document.getElementById('gd-stats').innerHTML = `\n    <div class=\"dbst\"><div class=\"v\">${totalQty}<\/div><div class=\"l\">Total Sold Qty<\/div><\/div>\n    <div class=\"dbst\"><div class=\"v\">${fmt(totalSales)}<\/div><div class=\"l\">Total Sales<\/div><\/div>\n    <div class=\"dbst\"><div class=\"v\">${fmt(totalProfit)}<\/div><div class=\"l\">Total Profit<\/div><\/div>\n    <div class=\"dbst due\"><div class=\"v\">${fmt(totalDue)}<\/div><div class=\"l\">Due<\/div><\/div>`;\n  const box = document.getElementById('gd-list');\n  if(sales.length===0){\n    box.innerHTML = '<div class=\"empty\">No sales for this Product.<\/div>';\n  } else {\n    box.innerHTML = groupedSales(sales).map(x=>{\n      const lineTotal = x.total + x.ship + x.cod, lineDue = lineTotal - (x.paid||0);\n      return `<div class=\"dbsale\">\n        <div class=\"r1\"><span>🏬 ${shopName(x.shopId)}<\/span><span>${fmt(lineTotal)}<\/span><\/div>\n        <div class=\"r2\"><span>📅 ${x.date||''} · ${x.qty} pcs${x.recs.length>1?' · '+x.recs.length+' Batches':''}<\/span><span>Profit ${fmt(x.profit)}${lineDue>0?(' · Due '+fmt(lineDue)):''}<\/span><\/div>\n        ${x.note?`<div style=\"font-size:11px;color:var(--muted);margin-top:4px;\">📝 ${x.note}<\/div>`:''}\n        <div class=\"r3\">\n          <button class=\"btn btn-outline\" onclick=\"closeGenDetail();go('sales');setTimeout(()=>editSale('${x.id}'),80);\">✏️ Edit<\/button>\n          <button class=\"btn btn-whatsapp\" onclick=\"shareSaleWhatsApp('${x.id}')\">📤 WhatsApp<\/button>\n          <button class=\"btn btn-danger\" onclick=\"deleteSale('${x.id}');renderProductDetailModal();\">🗑️ Delete<\/button>\n        <\/div>\n      <\/div>`;\n    }).join('');\n  }\n}\nfunction openDueHistory(type, id){\n  gdProductId = null;\n  document.getElementById('gd-tabs').style.display='none';\n  document.getElementById('gd-tabs').innerHTML='';\n  if(type==='shop'){\n    const s = DB.shops.find(x=>x.id===id); if(!s) return;\n    const ledger = buildShopLedger(id);\n    const t = shopStatementTotals(id);\n    document.getElementById('gd-name').textContent = '🏬 ' + s.name;\n    document.getElementById('gd-sub').textContent = 'Statement / Ledger · ' + ledger.length + ' Entries';\n    document.getElementById('gd-stats').innerHTML = `\n      <div class=\"dbst\"><div class=\"v\">${fmt(t.totalSold)}<\/div><div class=\"l\">Total Sold<\/div><\/div>\n      <div class=\"dbst\"><div class=\"v\">${fmt(t.discAmt)}<\/div><div class=\"l\">Discount<\/div><\/div>\n      <div class=\"dbst\"><div class=\"v\">${fmt(t.netSoldFinal)}<\/div><div class=\"l\">Net Sold<\/div><\/div>\n      <div class=\"dbst\"><div class=\"v\">${fmt(t.paid)}<\/div><div class=\"l\">Paid<\/div><\/div>\n      <div class=\"dbst due\"><div class=\"v\">${fmt(t.presentDue)}<\/div><div class=\"l\">Present Due<\/div><\/div>`;\n    const box = document.getElementById('gd-list');\n    let html = `<div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;\">\n        <button class=\"btn btn-primary btn-sm\" onclick=\"addShopPayment('${id}')\">💰 Payment Add<\/button>\n        <button class=\"btn btn-outline btn-sm\" onclick=\"printShopStatement('${id}')\">🖨️ Statement Print<\/button>\n        <button class=\"btn btn-whatsapp btn-sm\" onclick=\"whatsappShopStatement('${id}')\">📲 WhatsApp Statement<\/button>\n      <\/div>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#F5FAF9;border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:12px;\">\n        <span style=\"font-size:11.5px;font-weight:700;color:var(--muted);\">Discount on Total Sold:<\/span>\n        <select id=\"stmt-disc-type\" style=\"width:auto;padding:6px 8px;\">\n          <option value=\"pct\" ${t.disc.type==='pct'?'selected':''}>%<\/option>\n          <option value=\"amount\" ${t.disc.type==='amount'?'selected':''}>Fixed (Tk)<\/option>\n        <\/select>\n        <input id=\"stmt-disc-value\" type=\"number\" placeholder=\"0\" value=\"${t.disc.value||''}\" style=\"width:90px;padding:6px 8px;\">\n        <button class=\"btn btn-primary btn-sm\" onclick=\"applyStatementDiscount('${id}')\">Apply<\/button>\n      <\/div>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#F5FAF9;border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:12px;\">\n        <span style=\"font-size:11.5px;font-weight:700;color:var(--muted);\">Additional Discount (Tk, after Net Sold):<\/span>\n        <input id=\"stmt-addl-disc-value\" type=\"number\" placeholder=\"0\" value=\"${t.additionalDiscount||''}\" style=\"width:90px;padding:6px 8px;\">\n        <button class=\"btn btn-primary btn-sm\" onclick=\"applyAdditionalDiscount('${id}')\">Apply<\/button>\n      <\/div>`;\n    if(ledger.length===0){\n      html += '<div class=\"empty\">No transactions found.<\/div>';\n    } else {\n      html += `<div class=\"tablewrap\"><table class=\"simple\">\n        <thead><tr><th>Date<\/th><th>Description<\/th><th style=\"text-align:right;\">Qty<\/th><th style=\"text-align:right;\">Rate<\/th><th style=\"text-align:right;\">Sold (Dr)<\/th><th style=\"text-align:right;\">Paid (Cr)<\/th><th style=\"text-align:right;\">Balance<\/th><th><\/th><\/tr><\/thead>\n        <tbody>${ledger.map(r=>{\n          const actionBtn = r.type==='payment' ? `<button class=\"btn btn-outline btn-sm\" style=\"padding:3px 6px;font-size:10px;\" onclick=\"editShopPayment('${r.id}')\">✏️<\/button> <button class=\"btn btn-danger btn-sm\" style=\"padding:3px 6px;font-size:10px;\" onclick=\"deleteShopPayment('${r.id}')\">🗑️<\/button>`\n            : (r.type==='sale' ? `<button class=\"btn btn-outline btn-sm\" style=\"padding:3px 6px;font-size:10px;\" onclick=\"closeGenDetail();closeShopDetail();go('sales');setTimeout(()=>editSale('${r.id}'),80);\">✏️<\/button>` : '');\n          return `<tr><td>${r.date||'—'}<\/td><td>${r.desc}${r.note?`<div style=\"font-size:10.5px;color:var(--muted);margin-top:2px;\">📝 ${r.note}<\/div>`:''}<\/td><td style=\"text-align:right;\">${r.qty!=null?r.qty:'-'}<\/td><td style=\"text-align:right;\">${r.rate!=null?fmt(r.rate):'-'}<\/td><td style=\"text-align:right;\">${r.debit?fmt(r.debit):'-'}<\/td><td style=\"text-align:right;\">${r.credit?fmt(r.credit):'-'}<\/td><td style=\"text-align:right;font-weight:700;\">${fmt(r.balance)}<\/td><td>${actionBtn}<\/td><\/tr>`;\n        }).join('')}<\/tbody>\n      <\/table><\/div>\n      <div style=\"margin-top:10px;font-size:12px;\">\n        <div style=\"display:flex;justify-content:space-between;padding:3px 0;\"><span>Total Sold<\/span><span>${fmt(t.totalSold)}<\/span><\/div>\n        <div style=\"display:flex;justify-content:space-between;padding:3px 0;color:var(--red);\"><span>Discount (${t.disc.type==='pct'?(t.disc.value||0)+'%':'Fixed'})<\/span><span>-${fmt(t.discAmt)}<\/span><\/div>\n        <div style=\"display:flex;justify-content:space-between;padding:3px 0;font-weight:700;border-top:1px dashed var(--border);\"><span>Net Sold<\/span><span>${fmt(t.netSold)}<\/span><\/div>\n        <div style=\"display:flex;justify-content:space-between;padding:3px 0;color:var(--red);\"><span>Additional Discount<\/span><span>-${fmt(t.additionalDiscount)}<\/span><\/div>\n        <div style=\"display:flex;justify-content:space-between;padding:3px 0;font-weight:700;border-top:1px dashed var(--border);\"><span>Net Sold (Final)<\/span><span>${fmt(t.netSoldFinal)}<\/span><\/div>\n        <div style=\"display:flex;justify-content:space-between;padding:3px 0;\"><span>Total Paid<\/span><span>${fmt(t.paid)}<\/span><\/div>\n        <div style=\"display:flex;justify-content:space-between;padding:6px 0;font-weight:800;font-size:14px;border-top:2px solid var(--primary-dark);color:var(--primary-dark);\"><span>Present Due<\/span><span>${fmt(t.presentDue)}<\/span><\/div>\n      <\/div>`;\n    }\n    html += `<div style=\"margin-top:14px;\">\n        <label style=\"font-size:11.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px;\">📝 Note<\/label>\n        <textarea id=\"stmt-note\" rows=\"2\" placeholder=\"e.g. next payment date, special agreement etc.\">${s.statementNote||''}<\/textarea>\n        <button class=\"btn btn-primary btn-sm\" style=\"margin-top:6px;\" onclick=\"saveStatementNote('${id}')\">Save Note<\/button>\n      <\/div>`;\n    box.innerHTML = html;\n    document.getElementById('genDetailModal').classList.add('open');\n    return;\n  }\n  const s = DB.suppliers.find(x=>x.id===id); if(!s) return;\n  const name = '🏭 ' + s.name;\n  let payments = DB.supplierPayments.filter(p=>p.supplierId===id);\n  const total = supplierTotalPurchase(id), paid = supplierPaid(id);\n  const totalLabel = 'Total Purchase';\n  const deleteFn = 'deleteSupplierPayment';\n  payments = payments.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));\n  const due = total - paid;\n  document.getElementById('gd-name').textContent = name;\n  document.getElementById('gd-sub').textContent = payments.length + ' Payment Entries';\n  document.getElementById('gd-stats').innerHTML = `\n    <div class=\"dbst\"><div class=\"v\">${fmt(total)}<\/div><div class=\"l\">${totalLabel}<\/div><\/div>\n    <div class=\"dbst\"><div class=\"v\">${fmt(paid)}<\/div><div class=\"l\">Paid<\/div><\/div>\n    <div class=\"dbst due\"><div class=\"v\">${fmt(due)}<\/div><div class=\"l\">Due<\/div><\/div>\n    <div class=\"dbst\"><div class=\"v\">${payments.length}<\/div><div class=\"l\">Payments<\/div><\/div>`;\n  const box = document.getElementById('gd-list');\n  if(payments.length===0){\n    box.innerHTML = '<div class=\"empty\">No Payment entries found.<\/div>';\n  } else {\n    box.innerHTML = payments.map(p=>`<div class=\"dbsale\">\n      <div class=\"r1\"><span>📅 ${p.date||''}<\/span><span>${fmt(p.amount)}<\/span><\/div>\n      ${p.note?`<div class=\"r2\"><span>📝 ${p.note}<\/span><\/div>`:''}\n      <div class=\"r3\"><button class=\"btn btn-outline\" onclick=\"editSupplierPayment('${p.id}')\">✏️ Edit<\/button><button class=\"btn btn-danger\" onclick=\"${deleteFn}('${p.id}')\">🗑️ Delete<\/button><\/div>\n    <\/div>`).join('');\n  }\n  document.getElementById('genDetailModal').classList.add('open');\n}\n\n/* Statement of Account (running ledger) print + WhatsApp share for a shop/customer */\nfunction printShopStatement(shopId){\n  const s = DB.shops.find(x=>x.id===shopId);\n  if(!s) return;\n  const biz = getBizProfile(DB.settings.currentStoreId);\n  const ledger = buildShopLedger(shopId);\n  const t = shopStatementTotals(shopId);\n  const rows = ledger.map(r=>`<tr><td>${r.date||'—'}<\/td><td>${r.desc}${r.note?`<div style=\"font-size:10.5px;color:#777;margin-top:2px;\">📝 ${r.note}<\/div>`:''}<\/td><td style=\"text-align:right;\">${r.qty!=null?r.qty:'-'}<\/td><td style=\"text-align:right;\">${r.rate!=null?fmt(r.rate):'-'}<\/td><td style=\"text-align:right;\">${r.debit?fmt(r.debit):'-'}<\/td><td style=\"text-align:right;\">${r.credit?fmt(r.credit):'-'}<\/td><td style=\"text-align:right;\">${fmt(r.balance)}<\/td><\/tr>`).join('');\n  const html = `<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><title>Statement - ${s.name}<\/title>\n<style>\nbody{font-family:\"Segoe UI\",sans-serif;padding:30px;color:#1F2937;}\n.hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0E7C6B;padding-bottom:14px;margin-bottom:18px;}\n.hd h1{font-size:22px;color:#0A5C4F;}\n.hd .biz{font-size:12px;color:#555;margin-top:4px;}\n.doctype{font-size:18px;font-weight:800;color:#0A5C4F;text-align:right;}\n.meta{display:flex;justify-content:space-between;margin-bottom:16px;font-size:12.5px;}\ntable{width:100%;border-collapse:collapse;margin-bottom:16px;}\nth{background:#E4F3EF;color:#0A5C4F;padding:8px;text-align:left;font-size:11.5px;}\ntd{padding:8px;border-bottom:1px solid #eee;font-size:12px;}\n.totals{width:300px;margin-left:auto;font-size:12.5px;}\n.totals div{display:flex;justify-content:space-between;padding:4px 0;}\n.totals .disc{color:#C0392B;}\n.totals .grand{font-weight:800;font-size:15px;border-top:2px solid #0A5C4F;padding-top:8px;color:#0A5C4F;}\nimg.logo{height:52px;margin-bottom:6px;}\n@media print{ body{padding:10mm;} }\n<\/style><\/head><body>\n<div class=\"hd\">\n  <div>${biz.logo?`<img class=\"logo\" src=\"${biz.logo}\">`:''}<h1>${biz.name}<\/h1>\n    <div class=\"biz\">${biz.address||''}${biz.phone?(' · 📞 '+biz.phone):''}${biz.email?(' · ✉️ '+biz.email):''}<\/div><\/div>\n  <div class=\"doctype\">STATEMENT OF ACCOUNT<\/div>\n<\/div>\n<div class=\"meta\">\n  <div><b>Bill To:<\/b><br>${s.name}${s.phone?('<br>📞 '+s.phone):''}${s.address?('<br>'+s.address):''}<\/div>\n  <div style=\"text-align:right;\"><b>Date:<\/b> ${todayStr()}<\/div>\n<\/div>\n<table><thead><tr><th>Date<\/th><th>Description<\/th><th style=\"text-align:right;\">Qty<\/th><th style=\"text-align:right;\">Rate<\/th><th style=\"text-align:right;\">Sold (Dr)<\/th><th style=\"text-align:right;\">Paid (Cr)<\/th><th style=\"text-align:right;\">Balance<\/th><\/tr><\/thead>\n<tbody>${rows}<\/tbody><\/table>\n<div class=\"totals\">\n  <div><span>Total Sold<\/span><span>${fmt(t.totalSold)}<\/span><\/div>\n  <div class=\"disc\"><span>Discount (${t.disc.type==='pct'?(t.disc.value||0)+'%':'Fixed'})<\/span><span>-${fmt(t.discAmt)}<\/span><\/div>\n  <div><span>Net Sold<\/span><span>${fmt(t.netSold)}<\/span><\/div>\n  <div class=\"disc\"><span>Additional Discount<\/span><span>-${fmt(t.additionalDiscount)}<\/span><\/div>\n  <div><span>Net Sold (Final)<\/span><span>${fmt(t.netSoldFinal)}<\/span><\/div>\n  <div><span>Total Paid<\/span><span>${fmt(t.paid)}<\/span><\/div>\n  <div class=\"grand\"><span>Present Due<\/span><span>${fmt(t.presentDue)}<\/span><\/div>\n<\/div>\n${s.statementNote?`<div style=\"margin-top:14px;font-size:12px;padding-top:10px;border-top:1px dashed #ccc;\"><b>Note:<\/b> ${s.statementNote}<\/div>`:''}\n<\/body><\/html>`;\n  const w = window.open('', '_blank');\n  if(!w) { showToast('Popup is Blocked, please Allow Popups'); return; }\n  w.document.write(html); w.document.close();\n  setTimeout(()=>{ w.focus(); w.print(); }, 300);\n}\nfunction whatsappShopStatement(shopId){\n  const s = DB.shops.find(x=>x.id===shopId);\n  if(!s) return;\n  const biz = getBizProfile(DB.settings.currentStoreId);\n  const ledger = buildShopLedger(shopId);\n  const t = shopStatementTotals(shopId);\n  let text = `*${biz.name}*\\nStatement of Account\\nBill To: ${s.name}\\nDate: ${todayStr()}\\n\\n`;\n  ledger.forEach(r=>{\n    const qr = r.qty!=null ? ` (${r.qty} x Tk ${r.rate})` : '';\n    if(r.debit) text += `${r.date||''} ${r.desc}${qr}: +Tk ${r.debit.toFixed(0)}\\n`;\n    if(r.credit) text += `${r.date||''} ${r.desc}: -Tk ${r.credit.toFixed(0)}\\n`;\n    if(r.note) text += `   📝 ${r.note}\\n`;\n  });\n  text += `\\nTotal Sold: Tk ${t.totalSold.toFixed(0)}`;\n  text += `\\nDiscount (${t.disc.type==='pct'?(t.disc.value||0)+'%':'Fixed'}): -Tk ${t.discAmt.toFixed(0)}`;\n  text += `\\nNet Sold: Tk ${t.netSold.toFixed(0)}`;\n  text += `\\nAdditional Discount: -Tk ${t.additionalDiscount.toFixed(0)}`;\n  text += `\\nNet Sold (Final): Tk ${t.netSoldFinal.toFixed(0)}`;\n  text += `\\nTotal Paid: Tk ${t.paid.toFixed(0)}`;\n  text += `\\n*Present Due: Tk ${t.presentDue.toFixed(0)}*`;\n  if(s.statementNote) text += `\\n\\n📝 Note: ${s.statementNote}`;\n  const phone = (s.phone||'').replace(/[^0-9]/g,'');\n  const url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(text);\n  window.open(url, '_blank');\n}\n\n\n/* ---------------- ANALYTICS ---------------- */\nlet anTab = 'topsales';\nfunction setAnTab(t, el){ anTab=t; document.querySelectorAll('#anTabs .subtab').forEach(b=>b.classList.remove('active')); el.classList.add('active'); renderAnalytics(); }\nfunction renderAnalytics(){\n  const card = document.getElementById('anCard');\n  if(anTab==='topsales' || anTab==='topprofit'){\n    const map = {};\n    DB.sales.forEach(s=>{\n      const key = productName(s.productId);\n      if(!map[key]) map[key]={sales:0,profit:0};\n      map[key].sales += s.sellingPrice*s.qty; map[key].profit += s.profit;\n    });\n    const arr = Object.entries(map).sort((a,b)=> anTab==='topsales' ? b[1].sales-a[1].sales : b[1].profit-a[1].profit).slice(0,10);\n    card.innerHTML = arr.length ? arr.map((c,i)=>`<div class=\"rank-item\"><span><span class=\"rank-badge\">${i+1}<\/span>${c[0]}<\/span><b>${fmt(anTab==='topsales'?c[1].sales:c[1].profit)}<\/b><\/div>`).join('') : '<div class=\"empty\">No data<\/div>';\n  } else if(anTab==='topshop'){\n    const arr = DB.shops.map(s=>({name:s.name, sales:shopTotalSales(s.id)})).sort((a,b)=>b.sales-a.sales).slice(0,10);\n    card.innerHTML = arr.length ? arr.map((c,i)=>`<div class=\"rank-item\"><span><span class=\"rank-badge\">${i+1}<\/span>${c.name}<\/span><b>${fmt(c.sales)}<\/b><\/div>`).join('') : '<div class=\"empty\">No data<\/div>';\n  } else if(anTab==='topstore'){\n    const map = {};\n    DB.sales.forEach(s=>{\n      const key = storeName(s.storeId);\n      map[key] = (map[key]||0) + s.sellingPrice*s.qty;\n    });\n    const arr = Object.entries(map).sort((a,b)=>b[1]-a[1]);\n    card.innerHTML = arr.length ? arr.map((c,i)=>`<div class=\"rank-item\"><span><span class=\"rank-badge\">${i+1}<\/span>${c[0]}<\/span><b>${fmt(c[1])}<\/b><\/div>`).join('') : '<div class=\"empty\">No data<\/div>';\n  } else if(anTab==='slow'){\n    const arr = DB.products.map(p=>{\n      const stock = productStock(p.id);\n      const sold = DB.sales.filter(s=>s.productId===p.id).reduce((a,x)=>a+x.qty,0);\n      return {name:p.name, stock, sold};\n    }).filter(x=>x.stock>0).sort((a,b)=>a.sold-b.sold).slice(0,10);\n    card.innerHTML = arr.length ? arr.map((c,i)=>`<div class=\"rank-item\"><span><span class=\"rank-badge\">${i+1}<\/span>${c.name}<\/span><b>Sold ${c.sold} · Stock ${c.stock}<\/b><\/div>`).join('') : '<div class=\"empty\">No data<\/div>';\n  }\n}\n\n/* ---------------- REPORTS / CSV ---------------- */\nfunction downloadCSV(filename, rows){\n  const csv = rows.map(r=>r.map(c=>`\"${String(c??'').replace(/\"/g,'\"\"')}\"`).join(',')).join('\\n');\n  const blob = new Blob([\"\\uFEFF\"+csv], {type:'text/csv;charset=utf-8;'});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();\n  document.body.removeChild(a); URL.revokeObjectURL(url);\n}\nfunction exportCSV(type){\n  if(type==='products'){\n    const rows=[['Name','Brand','Category','SKU','Barcode','Stock','TP Value','MRP Value']];\n    DB.products.forEach(p=>rows.push([p.name,p.brand,p.category,p.sku,p.barcode,productStock(p.id),productTPValue(p.id),productMRPValue(p.id)]));\n    downloadCSV('product_report.csv',rows);\n  } else if(type==='purchases'){\n    const rows=[['Date','Product','Supplier','Batch','Qty','TP','MRP','Expiry']];\n    DB.batches.filter(b=>inCurrentStore(b.storeId)).forEach(b=>rows.push([b.date,productName(b.productId),supplierName(b.supplierId),b.batchNo,b.qty,b.tp,b.mrp,b.expDate]));\n    downloadCSV('purchase_report.csv',rows);\n  } else if(type==='sales'){\n    const rows=[['Date','Product','Shop','Qty','MRP','Discount %','Discount Amt','Selling Price','TP','Transport','Profit','Paid','Note']];\n    DB.sales.filter(s=>inCurrentStore(s.storeId)).forEach(s=>rows.push([s.date,productName(s.productId),shopName(s.shopId),s.qty,s.mrp||0,s.discountPct||0,((s.mrp||0)*(s.discountPct||0)/100).toFixed(2),s.sellingPrice,s.tp,s.transport||0,s.profit,s.paid,s.note||'']));\n    downloadCSV('sales_report.csv',rows);\n  } else if(type==='stock'){\n    const rows=[['Product','Batch','Stock','Expiry','TP Value','MRP Value']];\n    DB.batches.filter(b=>inCurrentStore(b.storeId)).forEach(b=>rows.push([productName(b.productId),b.batchNo,batchStock(b),b.expDate,batchStock(b)*b.tp,batchStock(b)*b.mrp]));\n    downloadCSV('stock_report.csv',rows);\n  } else if(type==='shopdue'){\n    const rows=[['Shop','Total Sales','Paid','Due']];\n    DB.shops.filter(s=>!DB.settings.currentStoreId || DB.sales.some(x=>x.shopId===s.id && inCurrentStore(x.storeId)))\n      .forEach(s=>rows.push([s.name,shopTotalSales(s.id),shopPaidTotal(s.id),shopDue(s.id)]));\n    downloadCSV('shop_due_report.csv',rows);\n  } else if(type==='supplierdue'){\n    const rows=[['Supplier','Total Purchase','Paid','Payable']];\n    DB.suppliers.filter(s=>!DB.settings.currentStoreId || DB.batches.some(b=>b.supplierId===s.id && inCurrentStore(b.storeId)))\n      .forEach(s=>rows.push([s.name,supplierTotalPurchase(s.id),supplierPaid(s.id),supplierDue(s.id)]));\n    downloadCSV('supplier_due_report.csv',rows);\n  } else if(type==='expiry'){\n    const rows=[['Product','Batch','Stock','Expiry Date','Days Left']];\n    DB.batches.filter(b=>batchStock(b)>0 && inCurrentStore(b.storeId)).forEach(b=>rows.push([productName(b.productId),b.batchNo,batchStock(b),b.expDate,daysUntil(b.expDate)]));\n    downloadCSV('expiry_report.csv',rows);\n  } else if(type==='expenses'){\n    const rows=[['Date','Category','Amount','Branch','Note']];\n    DB.expenses.filter(e=>inCurrentStore(e.storeId)).forEach(e=>rows.push([e.date,e.category,e.amount,storeName(e.storeId),e.note]));\n    downloadCSV('expense_report.csv',rows);\n  } else if(type==='invoices'){\n    const rows=[['Number','Type','Customer','Date','Due Date','Status','Total','Paid','Due']];\n    DB.invoices.filter(inv=>inCurrentStore(inv.storeId)).forEach(inv=>{\n      rows.push([inv.number, inv.type, shopName(inv.customerId), inv.date||'', inv.dueDate||'',\n        statusMeta(invoiceComputedStatus(inv)).label, invoiceGrandTotal(inv).toFixed(2), invoicePaidTotal(inv.id).toFixed(2), invoiceBalanceDue(inv).toFixed(2)]);\n    });\n    downloadCSV('invoice_report.csv',rows);\n  } else if(type==='aging'){\n    const rows=[['Customer','0-7 Days','8-30 Days','31-60 Days','61-90 Days','90+ Days','Total Due']];\n    const map = computeAging();\n    Object.entries(map).forEach(([cid,buckets])=>{\n      rows.push([shopName(cid), ...buckets.map(v=>v.toFixed(2)), buckets.reduce((a,b)=>a+b,0).toFixed(2)]);\n    });\n    downloadCSV('customer_aging_report.csv',rows);\n  }\n  showToast('Downloading CSV...'+(DB.settings.currentStoreId?' ('+storeName(DB.settings.currentStoreId)+')':''));\n}\n\n/* ---------------- INVOICES & QUOTATIONS ---------------- */\nlet editingInvoiceId = null;\nlet invoiceFormType = 'invoice';\nlet invItems = [];\nlet invFilterStatus = 'all';\nlet currentInvDetailId = null;\nlet ivpTargetId = null;\nlet ivadjTargetId = null;\n\nfunction productLatestPrice(pid){\n  const batches = productBatches(pid).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));\n  return batches.length ? (batches[0].mrp||0) : 0;\n}\nfunction nextInvoiceNumber(storeId, type){\n  const store = DB.stores.find(s=>s.id===storeId);\n  if(!store){\n    if(!DB.settings.mainInvoiceCounter) DB.settings.mainInvoiceCounter = 1;\n    if(!DB.settings.mainQuoteCounter) DB.settings.mainQuoteCounter = 1;\n    if(type==='quotation'){ const n = DB.settings.mainQuoteCounter++; saveDB(); return 'QUO-'+String(n).padStart(4,'0'); }\n    const n = DB.settings.mainInvoiceCounter++; saveDB(); return 'INV-'+String(n).padStart(4,'0');\n  }\n  if(store.invoiceCounter===undefined) store.invoiceCounter = 1;\n  if(store.quoteCounter===undefined) store.quoteCounter = 1;\n  if(type==='quotation'){ const n = store.quoteCounter++; return 'QUO-'+String(n).padStart(4,'0'); }\n  const n = store.invoiceCounter++; return 'INV-'+String(n).padStart(4,'0');\n}\n\n/* stock sync (only for finalized, non-cancelled Invoices — not Quotations/Drafts) */\nfunction invoiceShouldHoldStock(inv){ return inv.type==='invoice' && inv.manualStatus!=='cancelled' && inv.manualStatus!=='draft'; }\nfunction releaseInvoiceStock(inv){\n  (inv.items||[]).forEach(it=>{\n    (it.consumed||[]).forEach(c=>{\n      const b = DB.batches.find(x=>x.id===c.batchId);\n      if(b) b.soldQty = Math.max(0, (b.soldQty||0) - c.qty);\n    });\n    it.consumed = [];\n  });\n}\nfunction consumeInvoiceStock(inv){\n  (inv.items||[]).forEach(it=>{\n    it.consumed = [];\n    if(!it.productId || !(it.qty>0)) return;\n    let remaining = it.qty;\n    const batches = DB.batches.filter(b=>b.productId===it.productId && storeMatches(b.storeId, inv.storeId)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));\n    for(const b of batches){\n      if(remaining<=0) break;\n      const avail = batchStock(b);\n      if(avail<=0) continue;\n      const use = Math.min(avail, remaining);\n      b.soldQty = (b.soldQty||0) + use;\n      it.consumed.push({batchId:b.id, qty:use});\n      remaining -= use;\n    }\n  });\n}\nfunction syncInvoiceStock(inv){\n  releaseInvoiceStock(inv);\n  if(invoiceShouldHoldStock(inv)) consumeInvoiceStock(inv);\n}\n/* Total stock currently available for a product in a given store, optionally\n   crediting back whatever an existing invoice already has consumed for that\n   product (used when re-validating an invoice being edited, since its old\n   consumption will be released as part of the save). */\nfunction invoiceAvailableStock(productId, storeId, excludeInvoiceId){\n  const batches = DB.batches.filter(b=>b.productId===productId && storeMatches(b.storeId, storeId));\n  let avail = batches.reduce((s,b)=>s+batchStock(b),0);\n  if(excludeInvoiceId){\n    const inv = DB.invoices.find(x=>x.id===excludeInvoiceId);\n    if(inv) (inv.items||[]).forEach(it=>{ if(it.productId===productId) (it.consumed||[]).forEach(c=>{ avail += c.qty; }); });\n  }\n  return avail;\n}\n/* Returns a list of \"Product (need X, have Y)\" strings for any item whose\n   required quantity exceeds what's actually available in stock. */\nfunction invoiceStockShortages(itemsData, storeId, excludeInvoiceId){\n  const need = {};\n  itemsData.forEach(it=>{ if(it.productId){ need[it.productId] = (need[it.productId]||0) + (Number(it.qty)||0); } });\n  const shortages = [];\n  Object.keys(need).forEach(pid=>{\n    const avail = invoiceAvailableStock(pid, storeId, excludeInvoiceId);\n    if(need[pid] > avail) shortages.push(productName(pid)+' (need '+need[pid]+', have '+avail+')');\n  });\n  return shortages;\n}\n\n/* item rows in the form */\nfunction updateInvTypeButtons(){\n  const b1 = document.getElementById('inv-btn-invoice'), b2 = document.getElementById('inv-btn-quotation');\n  if(b1) b1.classList.toggle('active', invoiceFormType==='invoice');\n  if(b2) b2.classList.toggle('active', invoiceFormType==='quotation');\n}\nfunction addInvoiceItemRow(prefill){\n  invItems.push(prefill || {rowId:uid(), productId:'', name:'', qty:1, price:0});\n  renderInvoiceItemRows();\n  calcInvoiceTotals();\n}\nfunction removeInvoiceItemRow(rowId){\n  invItems = invItems.filter(r=>r.rowId!==rowId);\n  renderInvoiceItemRows();\n  calcInvoiceTotals();\n}\nfunction onInvItemProductChange(rowId, productId){\n  const r = invItems.find(x=>x.rowId===rowId);\n  if(!r) return;\n  r.productId = productId;\n  if(productId){\n    const p = DB.products.find(x=>x.id===productId);\n    if(p){ r.name = p.name; r.price = productLatestPrice(productId) || r.price || 0; }\n  }\n  renderInvoiceItemRows();\n  calcInvoiceTotals();\n}\nfunction onInvItemFieldChange(rowId, field, value){\n  const r = invItems.find(x=>x.rowId===rowId);\n  if(!r) return;\n  if(field==='qty') r.qty = Number(value)||0;\n  else if(field==='price') r.price = Number(value)||0;\n  else if(field==='name') r.name = value;\n  calcInvoiceTotals();\n}\nfunction renderInvoiceItemRows(){\n  const box = document.getElementById('inv-items');\n  if(!box) return;\n  if(invItems.length===0){ box.innerHTML = '<div class=\"empty\">No Items added yet<\/div>'; return; }\n  box.innerHTML = invItems.map(r=>{\n    const opts = ['<option value=\"\">-- Custom Item --<\/option>'].concat(DB.products.map(p=>`<option value=\"${p.id}\" ${p.id===r.productId?'selected':''}>${p.name}<\/option>`)).join('');\n    return `<div class=\"inv-item-row\">\n      <div>\n        <select onchange=\"onInvItemProductChange('${r.rowId}', this.value)\">${opts}<\/select>\n        ${!r.productId ? `<input placeholder=\"Item name\" value=\"${(r.name||'').replace(/\"/g,'&quot;')}\" oninput=\"onInvItemFieldChange('${r.rowId}','name',this.value)\" style=\"margin-top:4px;\">` : `<div style=\"font-size:10.5px;color:var(--muted);margin-top:3px;\">${r.name}<\/div>`}\n      <\/div>\n      <input type=\"number\" value=\"${r.qty}\" min=\"0\" placeholder=\"Qty\" oninput=\"onInvItemFieldChange('${r.rowId}','qty',this.value)\">\n      <input type=\"number\" value=\"${r.price}\" min=\"0\" placeholder=\"Price\" oninput=\"onInvItemFieldChange('${r.rowId}','price',this.value)\">\n      <button class=\"rm\" onclick=\"removeInvoiceItemRow('${r.rowId}')\">✕<\/button>\n    <\/div>`;\n  }).join('');\n}\nfunction invoiceItemsSubtotal(items){ return (items||[]).reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.price)||0),0); }\nfunction calcInvoiceTotals(){\n  const box = document.getElementById('inv-totalsBox');\n  if(!box) return;\n  const subtotal = invoiceItemsSubtotal(invItems);\n  const discPct = Number(document.getElementById('inv-discpct').value)||0;\n  const vatPct = Number(document.getElementById('inv-vatpct').value)||0;\n  const shipping = Number(document.getElementById('inv-shipping').value)||0;\n  const discAmt = subtotal*discPct/100;\n  const afterDisc = subtotal-discAmt;\n  const vatAmt = afterDisc*vatPct/100;\n  const grand = afterDisc+vatAmt+shipping;\n  box.innerHTML = `\n    <div class=\"row\"><span>Subtotal<\/span><span>${fmt(subtotal)}<\/span><\/div>\n    <div class=\"row\"><span>Discount (${discPct}%)<\/span><span>-${fmt(discAmt)}<\/span><\/div>\n    <div class=\"row\"><span>VAT/Tax (${vatPct}%)<\/span><span>+${fmt(vatAmt)}<\/span><\/div>\n    <div class=\"row\"><span>Shipping<\/span><span>+${fmt(shipping)}<\/span><\/div>\n    <div class=\"row grand\"><span>Grand Total<\/span><span>${fmt(grand)}<\/span><\/div>`;\n}\n\n/* open/close/save form */\nfunction openAddInvoiceForm(type){\n  editingInvoiceId = null;\n  invoiceFormType = type;\n  updateInvTypeButtons();\n  document.getElementById('inv-form-title').textContent = type==='quotation' ? 'Create New Quotation' : 'Create New Invoice';\n  document.getElementById('inv-customer').value = '';\n  document.getElementById('inv-date').value = todayStr();\n  document.getElementById('inv-duedate').value = '';\n  document.getElementById('inv-discpct').value = '';\n  document.getElementById('inv-vatpct').value = '';\n  document.getElementById('inv-shipping').value = '';\n  document.getElementById('inv-notes').value = '';\n  document.getElementById('inv-terms').value = '';\n  document.getElementById('inv-manualstatus').value = '';\n  invItems = [];\n  addInvoiceItemRow();\n  const panel = document.getElementById('form-invoice');\n  if(!panel.classList.contains('open')) toggleForm('form-invoice');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\nfunction cancelInvoiceForm(){ editingInvoiceId = null; invItems = []; toggleForm('form-invoice'); }\nfunction editInvoice(id){\n  const inv = DB.invoices.find(x=>x.id===id);\n  if(!inv) return;\n  editingInvoiceId = id;\n  invoiceFormType = inv.type;\n  updateInvTypeButtons();\n  document.getElementById('inv-form-title').textContent = (inv.type==='quotation'?'Quotation':'Invoice')+' Update — '+inv.number;\n  document.getElementById('inv-customer').value = inv.customerId;\n  document.getElementById('inv-date').value = inv.date||'';\n  document.getElementById('inv-duedate').value = inv.dueDate||'';\n  document.getElementById('inv-discpct').value = inv.discountPct||'';\n  document.getElementById('inv-vatpct').value = inv.vatPct||'';\n  document.getElementById('inv-shipping').value = inv.shipping||'';\n  document.getElementById('inv-notes').value = inv.notes||'';\n  document.getElementById('inv-terms').value = inv.terms||'';\n  document.getElementById('inv-manualstatus').value = inv.manualStatus||'';\n  invItems = (inv.items||[]).map(it=>({rowId:uid(), productId:it.productId||'', name:it.name, qty:it.qty, price:it.price}));\n  renderInvoiceItemRows();\n  calcInvoiceTotals();\n  const panel = document.getElementById('form-invoice');\n  if(!panel.classList.contains('open')) toggleForm('form-invoice');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n}\nfunction saveInvoice(){\n  const customerId = document.getElementById('inv-customer').value;\n  if(!customerId){ showToast('Select a Customer'); return; }\n  if(invItems.length===0){ showToast('Add at least one Item'); return; }\n  for(const it of invItems){ if(!it.name || !(it.qty>0) || Number(it.price)<0){ showToast('Fix the name and Quantity(>0) for all Items'); return; } }\n  const storeId = DB.settings.currentStoreId || '';\n  const discountPct = Number(document.getElementById('inv-discpct').value)||0;\n  const vatPct = Number(document.getElementById('inv-vatpct').value)||0;\n  const shipping = Number(document.getElementById('inv-shipping').value)||0;\n  const notes = document.getElementById('inv-notes').value.trim();\n  const terms = document.getElementById('inv-terms').value.trim();\n  const manualStatus = document.getElementById('inv-manualstatus').value;\n  const date = document.getElementById('inv-date').value || todayStr();\n  const dueDate = document.getElementById('inv-duedate').value || '';\n  const itemsData = invItems.map(it=>({id:uid(), productId:it.productId||'', name:it.name, qty:Number(it.qty), price:Number(it.price), consumed:[]}));\n\n  const wouldHoldStock = invoiceFormType==='invoice' && manualStatus!=='cancelled' && manualStatus!=='draft';\n  if(wouldHoldStock){\n    const shortages = invoiceStockShortages(itemsData, storeId, editingInvoiceId);\n    if(shortages.length){ showToast('Not enough Stock: '+shortages.join(', ')); return; }\n  }\n\n  if(editingInvoiceId){\n    const inv = DB.invoices.find(x=>x.id===editingInvoiceId);\n    if(!inv) return;\n    inv.customerId=customerId; inv.items=itemsData; inv.discountPct=discountPct; inv.vatPct=vatPct;\n    inv.shipping=shipping; inv.notes=notes; inv.terms=terms; inv.manualStatus=manualStatus; inv.date=date; inv.dueDate=dueDate;\n    syncInvoiceStock(inv);\n    showToast((inv.type==='quotation'?'Quotation':'Invoice')+' Updated ✅');\n  } else {\n    const number = nextInvoiceNumber(storeId, invoiceFormType);\n    const inv = { id:uid(), type:invoiceFormType, number, storeId, customerId, date, dueDate,\n      items: itemsData, discountPct, vatPct, shipping, notes, terms, manualStatus,\n      createdAt: Date.now(), convertedToId:null, convertedFromId:null };\n    DB.invoices.push(inv);\n    syncInvoiceStock(inv);\n    showToast((invoiceFormType==='quotation'?'Quotation':'Invoice')+' '+number+' Saved ✅');\n  }\n  saveDB();\n  editingInvoiceId = null;\n  invItems = [];\n  toggleForm('form-invoice');\n  renderAll();\n}\nfunction deleteInvoice(id){\n  const inv = DB.invoices.find(x=>x.id===id);\n  if(!inv) return;\n  if(!confirm('Delete this '+(inv.type==='quotation'?'Quotation':'Invoice')+'?')) return;\n  releaseInvoiceStock(inv);\n  DB.invoices = DB.invoices.filter(x=>x.id!==id);\n  DB.invoicePayments = DB.invoicePayments.filter(p=>p.invoiceId!==id);\n  DB.invoiceAdjustments = DB.invoiceAdjustments.filter(a=>a.invoiceId!==id);\n  saveDB(); renderAll();\n}\nfunction duplicateInvoice(id){\n  const inv = DB.invoices.find(x=>x.id===id);\n  if(!inv) return;\n  closeInvDetail();\n  editingInvoiceId = null;\n  invoiceFormType = inv.type;\n  updateInvTypeButtons();\n  go('invoices');\n  document.getElementById('inv-form-title').textContent = (inv.type==='quotation'?'Quotation':'Invoice')+' Duplicate';\n  document.getElementById('inv-customer').value = inv.customerId;\n  document.getElementById('inv-date').value = todayStr();\n  document.getElementById('inv-duedate').value = '';\n  document.getElementById('inv-discpct').value = inv.discountPct||'';\n  document.getElementById('inv-vatpct').value = inv.vatPct||'';\n  document.getElementById('inv-shipping').value = inv.shipping||'';\n  document.getElementById('inv-notes').value = inv.notes||'';\n  document.getElementById('inv-terms').value = inv.terms||'';\n  document.getElementById('inv-manualstatus').value = '';\n  invItems = (inv.items||[]).map(it=>({rowId:uid(), productId:it.productId||'', name:it.name, qty:it.qty, price:it.price}));\n  renderInvoiceItemRows();\n  calcInvoiceTotals();\n  const panel = document.getElementById('form-invoice');\n  if(!panel.classList.contains('open')) toggleForm('form-invoice');\n  panel.scrollIntoView({behavior:'smooth', block:'start'});\n  showToast('Item copied — set the date and Save');\n}\nfunction convertQuotationToInvoice(id){\n  const q = DB.invoices.find(x=>x.id===id);\n  if(!q || q.type!=='quotation') return;\n  if(q.convertedToId){ showToast('This Quotation has already been Converted to Invoice'); return; }\n  const number = nextInvoiceNumber(q.storeId, 'invoice');\n  const inv = { id:uid(), type:'invoice', number, storeId:q.storeId, customerId:q.customerId,\n    date: todayStr(), dueDate:q.dueDate||'',\n    items: (q.items||[]).map(it=>({id:uid(), productId:it.productId||'', name:it.name, qty:it.qty, price:it.price, consumed:[]})),\n    discountPct:q.discountPct||0, vatPct:q.vatPct||0, shipping:q.shipping||0, notes:q.notes||'', terms:q.terms||'',\n    manualStatus:'', createdAt: Date.now(), convertedToId:null, convertedFromId:q.id };\n  DB.invoices.push(inv);\n  q.convertedToId = inv.id;\n  syncInvoiceStock(inv);\n  saveDB(); renderAll();\n  showToast('Invoice '+number+' created from Quotation ✅');\n}\n\n/* totals / status helpers (persisted invoices) */\nfunction invoiceSubtotalStored(inv){ return invoiceItemsSubtotal(inv.items); }\nfunction invoiceGrandTotal(inv){\n  const subtotal = invoiceSubtotalStored(inv);\n  const discAmt = subtotal*(inv.discountPct||0)/100;\n  const afterDisc = subtotal-discAmt;\n  const vatAmt = afterDisc*(inv.vatPct||0)/100;\n  return afterDisc+vatAmt+(inv.shipping||0);\n}\nfunction invoicePaidTotal(id){ return DB.invoicePayments.filter(p=>p.invoiceId===id).reduce((s,p)=>s+p.amount,0); }\nfunction invoiceAdjustmentNet(id){ return DB.invoiceAdjustments.filter(a=>a.invoiceId===id).reduce((s,a)=> s + (a.type==='debit'? a.amount : -a.amount), 0); }\nfunction invoiceBalanceDue(inv){ return invoiceGrandTotal(inv) + invoiceAdjustmentNet(inv.id) - invoicePaidTotal(inv.id); }\nfunction invoiceComputedStatus(inv){\n  if(inv.type==='quotation') return inv.convertedToId ? 'converted' : (inv.manualStatus==='cancelled' ? 'cancelled' : 'quotation');\n  if(inv.manualStatus==='draft') return 'draft';\n  if(inv.manualStatus==='cancelled') return 'cancelled';\n  const bal = invoiceBalanceDue(inv);\n  const paid = invoicePaidTotal(inv.id);\n  if(bal<=0.01) return 'paid';\n  if(paid>0) return 'partial';\n  if(inv.dueDate && inv.dueDate < todayStr()) return 'overdue';\n  return 'unpaid';\n}\nfunction statusMeta(status){\n  const map = {\n    draft:{label:'📝 Draft', cls:'status-draft'},\n    unpaid:{label:'🔶 Unpaid/Due', cls:'status-unpaid'},\n    partial:{label:'🔷 Partially Paid', cls:'status-partial'},\n    paid:{label:'✅ Paid', cls:'status-paid'},\n    overdue:{label:'⏰ Overdue', cls:'status-overdue'},\n    cancelled:{label:'❌ Cancelled', cls:'status-cancelled'},\n    quotation:{label:'📄 Quotation', cls:'status-quotation'},\n    converted:{label:'🔁 Converted to Invoice', cls:'status-quotation'}\n  };\n  return map[status] || {label:status, cls:''};\n}\n\n/* list rendering */\nfunction setInvStatusFilter(s){ invFilterStatus = s; renderInvoices(); }\nfunction renderInvoices(){\n  const chipsBox = document.getElementById('invStatusChips');\n  const statuses = ['all','draft','unpaid','partial','paid','overdue','cancelled','quotation'];\n  const labels = {all:'All', draft:'Draft', unpaid:'Unpaid/Due', partial:'Partial', paid:'Paid', overdue:'Overdue', cancelled:'Cancelled/Draft-off', quotation:'Quotation'};\n  if(chipsBox) chipsBox.innerHTML = statuses.map(s=>`<button class=\"chip ${invFilterStatus===s?'active':''}\" onclick=\"setInvStatusFilter('${s}')\">${labels[s]}<\/button>`).join('');\n  const box = document.getElementById('invoiceList');\n  if(!box) return;\n  const q = (document.getElementById('inv-search') && document.getElementById('inv-search').value || '').trim().toLowerCase();\n  let list = DB.invoices.filter(inv=>inCurrentStore(inv.storeId)).map(inv=>({inv, status:invoiceComputedStatus(inv)}));\n  if(invFilterStatus!=='all') list = list.filter(x=>x.status===invFilterStatus);\n  if(q){\n    list = list.filter(({inv})=>{\n      const cust = shopName(inv.customerId).toLowerCase();\n      return cust.includes(q) || (inv.number||'').toLowerCase().includes(q) || (inv.date||'').includes(q);\n    });\n  }\n  list.sort((a,b)=>(b.inv.createdAt||0)-(a.inv.createdAt||0));\n  if(list.length===0){ box.innerHTML = '<div class=\"empty\">No Invoice/Quotation found.<\/div>'; return; }\n  box.innerHTML = list.map(({inv,status})=>{\n    const meta = statusMeta(status);\n    const total = invoiceGrandTotal(inv);\n    const due = invoiceBalanceDue(inv);\n    return `<div class=\"list-item\">\n      <div class=\"li-top\">\n        <div><div class=\"li-title\">${inv.number} · ${shopName(inv.customerId)}<\/div>\n        <div class=\"li-sub\">${inv.date||''}${inv.dueDate?(' · Due: '+inv.dueDate):''}<\/div>\n        <div class=\"li-tags\"><span class=\"status-badge ${meta.cls}\">${meta.label}<\/span>${(due>0.01 && inv.type==='invoice')?`<span class=\"tag low\">Due ${fmt(due)}<\/span>`:''}<\/div><\/div>\n        <div class=\"li-right\"><div class=\"li-num\">${fmt(total)}<\/div><\/div>\n      <\/div>\n      <div class=\"li-actions\">\n        <button class=\"btn btn-outline btn-sm\" onclick=\"openInvDetail('${inv.id}')\">👁️ Details<\/button>\n        <button class=\"btn btn-outline btn-sm\" onclick=\"editInvoice('${inv.id}')\">✏️ Edit<\/button>\n        ${(inv.type==='quotation' && !inv.convertedToId) ? `<button class=\"btn btn-primary btn-sm\" onclick=\"convertQuotationToInvoice('${inv.id}')\">➡️ Convert<\/button>` : ''}\n        <button class=\"btn btn-danger btn-sm\" onclick=\"deleteInvoice('${inv.id}')\">🗑️<\/button>\n      <\/div>\n    <\/div>`;\n  }).join('');\n}\n\n/* detail modal */\nfunction openInvDetail(id){\n  const inv = DB.invoices.find(x=>x.id===id);\n  if(!inv) return;\n  currentInvDetailId = id;\n  const status = invoiceComputedStatus(inv);\n  const meta = statusMeta(status);\n  const total = invoiceGrandTotal(inv);\n  const paid = invoicePaidTotal(id);\n  const adj = invoiceAdjustmentNet(id);\n  const due = invoiceBalanceDue(inv);\n  document.getElementById('invd-name').textContent = inv.number+' · '+shopName(inv.customerId);\n  document.getElementById('invd-sub').innerHTML = `${inv.date||''}${inv.dueDate?(' · Due: '+inv.dueDate):''} · <span class=\"status-badge ${meta.cls}\">${meta.label}<\/span>`;\n  document.getElementById('invd-stats').innerHTML = `\n    <div class=\"dbst\"><div class=\"v\">${fmt(total)}<\/div><div class=\"l\">Total Bill<\/div><\/div>\n    <div class=\"dbst\"><div class=\"v\">${fmt(paid)}<\/div><div class=\"l\">Paid<\/div><\/div>\n    <div class=\"dbst\"><div class=\"v\">${fmt(adj)}<\/div><div class=\"l\">Adjustment<\/div><\/div>\n    <div class=\"dbst due\"><div class=\"v\">${fmt(due)}<\/div><div class=\"l\">Due<\/div><\/div>`;\n  const itemsHtml = (inv.items||[]).map(it=>`<div class=\"dbsale\"><div class=\"r1\"><span>${it.name} × ${it.qty}<\/span><span>${fmt(it.qty*it.price)}<\/span><\/div><\/div>`).join('');\n  const paymentsHtml = DB.invoicePayments.filter(p=>p.invoiceId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(p=>`<div class=\"dbsale\"><div class=\"r1\"><span>💰 ${p.date||''} · ${p.method||''}<\/span><span>${fmt(p.amount)}<\/span><\/div>${p.note?`<div class=\"r2\"><span>${p.note}<\/span><\/div>`:''}<div class=\"r3\"><button class=\"btn btn-danger btn-sm\" onclick=\"deleteInvPayment('${p.id}')\">🗑️ Delete<\/button><\/div><\/div>`).join('');\n  const adjHtml = DB.invoiceAdjustments.filter(a=>a.invoiceId===id).map(a=>`<div class=\"dbsale\"><div class=\"r1\"><span>${a.type==='debit'?'➕ Debit':'➖ Credit'} · ${a.note||''}<\/span><span>${fmt(a.amount)}<\/span><\/div><div class=\"r3\"><button class=\"btn btn-danger btn-sm\" onclick=\"deleteInvAdjustment('${a.id}')\">🗑️ Delete<\/button><\/div><\/div>`).join('');\n  document.getElementById('invd-list').innerHTML = `\n    <div style=\"font-size:11.5px;font-weight:700;color:var(--muted);margin:6px 0;\">Items<\/div>${itemsHtml||'<div class=\"empty\">No Items<\/div>'}\n    <div style=\"font-size:11.5px;font-weight:700;color:var(--muted);margin:10px 0 6px;\">Payment History<\/div>${paymentsHtml||'<div class=\"empty\">No Payments found<\/div>'}\n    <div style=\"font-size:11.5px;font-weight:700;color:var(--muted);margin:10px 0 6px;\">Credit/Debit Adjustment<\/div>${adjHtml||'<div class=\"empty\">No Adjustments found<\/div>'}`;\n  document.getElementById('invDetailModal').classList.add('open');\n}\nfunction closeInvDetail(){ document.getElementById('invDetailModal').classList.remove('open'); currentInvDetailId=null; }\n\n/* payment modal */\nfunction openInvPayModal(id){\n  ivpTargetId = id || currentInvDetailId;\n  if(!ivpTargetId) return;\n  document.getElementById('ivp-date').value = todayStr();\n  document.getElementById('ivp-amount').value = '';\n  document.getElementById('ivp-note').value = '';\n  document.getElementById('ivp-method').value = 'Cash';\n  document.getElementById('invPayModal').classList.add('open');\n}\nfunction closeInvPayModal(){ document.getElementById('invPayModal').classList.remove('open'); }\nfunction saveInvPayment(){\n  const amount = Number(document.getElementById('ivp-amount').value);\n  if(!amount || amount<=0){ showToast('Enter a valid Amount'); return; }\n  DB.invoicePayments.push({ id:uid(), invoiceId:ivpTargetId, amount, method:document.getElementById('ivp-method').value,\n    date:document.getElementById('ivp-date').value||todayStr(), note:document.getElementById('ivp-note').value.trim() });\n  saveDB();\n  closeInvPayModal();\n  showToast('Payment Saved ✅');\n  if(currentInvDetailId) openInvDetail(currentInvDetailId);\n  renderAll();\n}\nfunction deleteInvPayment(payId){\n  if(!confirm('Delete this Payment?')) return;\n  DB.invoicePayments = DB.invoicePayments.filter(p=>p.id!==payId);\n  saveDB();\n  if(currentInvDetailId) openInvDetail(currentInvDetailId);\n  renderAll();\n}\n\n/* adjustment modal */\nfunction openInvAdjModal(id){\n  ivadjTargetId = id || currentInvDetailId;\n  if(!ivadjTargetId) return;\n  document.getElementById('ivadj-type').value = 'debit';\n  document.getElementById('ivadj-amount').value = '';\n  document.getElementById('ivadj-note').value = '';\n  document.getElementById('invAdjModal').classList.add('open');\n}\nfunction closeInvAdjModal(){ document.getElementById('invAdjModal').classList.remove('open'); }\nfunction saveInvAdjustment(){\n  const amount = Number(document.getElementById('ivadj-amount').value);\n  if(!amount || amount<=0){ showToast('Enter a valid Amount'); return; }\n  DB.invoiceAdjustments.push({ id:uid(), invoiceId:ivadjTargetId, type:document.getElementById('ivadj-type').value,\n    amount, note:document.getElementById('ivadj-note').value.trim(), date:todayStr() });\n  saveDB();\n  closeInvAdjModal();\n  showToast('Adjustment Saved ✅');\n  if(currentInvDetailId) openInvDetail(currentInvDetailId);\n  renderAll();\n}\nfunction deleteInvAdjustment(adjId){\n  if(!confirm('Delete this Adjustment?')) return;\n  DB.invoiceAdjustments = DB.invoiceAdjustments.filter(a=>a.id!==adjId);\n  saveDB();\n  if(currentInvDetailId) openInvDetail(currentInvDetailId);\n  renderAll();\n}\n\n/* WhatsApp sharing */\nfunction whatsappInvoice(id){\n  const inv = DB.invoices.find(x=>x.id===id);\n  if(!inv) return;\n  const customer = DB.shops.find(x=>x.id===inv.customerId);\n  const biz = getBizProfile(inv.storeId);\n  const bizName = biz.name;\n  const subtotal = invoiceSubtotalStored(inv);\n  const total = invoiceGrandTotal(inv);\n  const due = invoiceBalanceDue(inv);\n  let text = `*${bizName}*\\n${inv.type==='quotation'?'Quotation':'Invoice'}: ${inv.number}\\nDate: ${inv.date||''}\\nCustomer: ${shopName(inv.customerId)}\\n\\n`;\n  (inv.items||[]).forEach(it=>{ text += `${it.name} x${it.qty} = Tk ${(it.qty*it.price).toFixed(0)}\\n`; });\n  text += `\\nSubtotal: Tk ${subtotal.toFixed(0)}`;\n  if(inv.discountPct) text += `\\nDiscount (${inv.discountPct}%): -Tk ${(subtotal*inv.discountPct/100).toFixed(0)}`;\n  if(inv.vatPct) text += `\\nVAT/Tax (${inv.vatPct}%): +Tk ${((subtotal-(subtotal*(inv.discountPct||0)/100))*inv.vatPct/100).toFixed(0)}`;\n  if(inv.shipping) text += `\\nShipping: +Tk ${inv.shipping}`;\n  text += `\\n*Total Bill: Tk ${total.toFixed(0)}*`;\n  if(due>0.01) text += `\\n*Due: Tk ${due.toFixed(0)}*`;\n  if(inv.notes) text += `\\n\\n${inv.notes}`;\n  const phone = (customer && customer.phone) ? customer.phone.replace(/[^0-9]/g,'') : '';\n  const url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(text);\n  window.open(url, '_blank');\n}\n\n/* Print: A4/Letter full invoice */\nfunction printInvoiceA4(id){\n  const inv = DB.invoices.find(x=>x.id===id);\n  if(!inv) return;\n  const biz = getBizProfile(inv.storeId);\n  const customer = DB.shops.find(x=>x.id===inv.customerId);\n  const subtotal = invoiceSubtotalStored(inv);\n  const discAmt = subtotal*(inv.discountPct||0)/100;\n  const afterDisc = subtotal-discAmt;\n  const vatAmt = afterDisc*(inv.vatPct||0)/100;\n  const grand = invoiceGrandTotal(inv);\n  const paid = invoicePaidTotal(id);\n  const due = invoiceBalanceDue(inv);\n  const rows = (inv.items||[]).map((it,i)=>`<tr><td>${i+1}<\/td><td>${it.name}<\/td><td style=\"text-align:center;\">${it.qty}<\/td><td style=\"text-align:right;\">${Number(it.price).toFixed(2)}<\/td><td style=\"text-align:right;\">${(it.qty*it.price).toFixed(2)}<\/td><\/tr>`).join('');\n  const html = `<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><title>${inv.number}<\/title>\n<style>\nbody{font-family:\"Noto Sans Bengali\",\"Segoe UI\",sans-serif;padding:30px;color:#1F2937;}\n.hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0E7C6B;padding-bottom:14px;margin-bottom:18px;}\n.hd h1{font-size:22px;color:#0A5C4F;}\n.hd .biz{font-size:12px;color:#555;margin-top:4px;}\n.doctype{font-size:20px;font-weight:800;color:#0A5C4F;text-align:right;}\n.doctype .num{font-size:13px;color:#555;font-weight:400;}\n.meta{display:flex;justify-content:space-between;margin-bottom:16px;font-size:12.5px;}\ntable{width:100%;border-collapse:collapse;margin-bottom:16px;}\nth{background:#E4F3EF;color:#0A5C4F;padding:8px;text-align:left;font-size:11.5px;}\ntd{padding:8px;border-bottom:1px solid #eee;font-size:12px;}\n.totals{width:280px;margin-left:auto;font-size:12.5px;}\n.totals div{display:flex;justify-content:space-between;padding:4px 0;}\n.totals .grand{font-weight:800;font-size:15px;border-top:2px solid #0A5C4F;padding-top:8px;color:#0A5C4F;}\n.totals .due{color:#D64545;font-weight:800;}\n.sign{display:flex;justify-content:space-between;margin-top:60px;font-size:12px;}\n.sign div{text-align:center;width:180px;border-top:1px solid #999;padding-top:6px;}\n.notes{margin-top:20px;font-size:11.5px;color:#555;}\nimg.logo{height:52px;margin-bottom:6px;}\n@media print{ body{padding:10mm;} }\n<\/style><\/head><body>\n<div class=\"hd\">\n  <div>${biz.logo?`<img class=\"logo\" src=\"${biz.logo}\">`:''}<h1>${biz.name}<\/h1>\n    <div class=\"biz\">${biz.address||''}${biz.phone?(' · 📞 '+biz.phone):''}${biz.email?(' · ✉️ '+biz.email):''}<\/div><\/div>\n  <div class=\"doctype\">${inv.type==='quotation'?'QUOTATION':'INVOICE'}<div class=\"num\">${inv.number}<\/div><\/div>\n<\/div>\n<div class=\"meta\">\n  <div><b>Bill To:<\/b><br>${customer?customer.name:'—'}${customer&&customer.phone?('<br>📞 '+customer.phone):''}${customer&&customer.address?('<br>'+customer.address):''}<\/div>\n  <div style=\"text-align:right;\"><b>Date:<\/b> ${inv.date||''}${inv.dueDate?('<br><b>Due Date:<\/b> '+inv.dueDate):''}<\/div>\n<\/div>\n<table><thead><tr><th>#<\/th><th>Item / Description<\/th><th style=\"text-align:center;\">Qty<\/th><th style=\"text-align:right;\">Price<\/th><th style=\"text-align:right;\">Total<\/th><\/tr><\/thead>\n<tbody>${rows}<\/tbody><\/table>\n<div class=\"totals\">\n  <div><span>Subtotal<\/span><span>Tk ${subtotal.toFixed(2)}<\/span><\/div>\n  <div><span>Discount (${inv.discountPct||0}%)<\/span><span>-Tk ${discAmt.toFixed(2)}<\/span><\/div>\n  <div><span>VAT/Tax (${inv.vatPct||0}%)<\/span><span>+Tk ${vatAmt.toFixed(2)}<\/span><\/div>\n  <div><span>Shipping<\/span><span>+Tk ${(inv.shipping||0).toFixed(2)}<\/span><\/div>\n  <div class=\"grand\"><span>Grand Total<\/span><span>Tk ${grand.toFixed(2)}<\/span><\/div>\n  <div><span>Paid<\/span><span>Tk ${paid.toFixed(2)}<\/span><\/div>\n  <div class=\"due\"><span>Due<\/span><span>Tk ${due.toFixed(2)}<\/span><\/div>\n<\/div>\n${inv.notes?`<div class=\"notes\"><b>Note:<\/b> ${inv.notes}<\/div>`:''}\n${inv.terms?`<div class=\"notes\"><b>Terms & Conditions:<\/b> ${inv.terms}<\/div>`:''}\n<div class=\"sign\"><div>Customer Signature<\/div><div>Authorized Signature<\/div><\/div>\n<\/body><\/html>`;\n  const w = window.open('', '_blank');\n  if(!w) { showToast('Popup is Blocked, please Allow Popups'); return; }\n  w.document.write(html); w.document.close();\n  setTimeout(()=>{ w.focus(); w.print(); }, 300);\n}\n\n/* Print: compact POS receipt */\nfunction printInvoicePOS(id){\n  const inv = DB.invoices.find(x=>x.id===id);\n  if(!inv) return;\n  const biz = getBizProfile(inv.storeId);\n  const customer = DB.shops.find(x=>x.id===inv.customerId);\n  const subtotal = invoiceSubtotalStored(inv);\n  const grand = invoiceGrandTotal(inv);\n  const paid = invoicePaidTotal(id);\n  const due = invoiceBalanceDue(inv);\n  const rows = (inv.items||[]).map(it=>`<div class=\"r\"><span>${it.name} x${it.qty}<\/span><span>${(it.qty*it.price).toFixed(2)}<\/span><\/div>`).join('');\n  const html = `<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><title>${inv.number}<\/title>\n<style>\nbody{font-family:\"Noto Sans Bengali\",monospace;width:280px;margin:0 auto;padding:10px;font-size:12px;color:#111;}\nh2{text-align:center;font-size:15px;margin-bottom:2px;}\n.c{text-align:center;font-size:10.5px;margin-bottom:6px;}\nhr{border:none;border-top:1px dashed #999;margin:6px 0;}\n.r{display:flex;justify-content:space-between;padding:2px 0;}\n.tot{font-weight:800;font-size:13px;}\n@media print{ body{width:auto;} }\n<\/style><\/head><body>\n<h2>${biz.name}<\/h2>\n<div class=\"c\">${biz.address||''}${biz.phone?(' · '+biz.phone):''}${biz.email?(' · '+biz.email):''}<\/div>\n<hr>\n<div class=\"r\"><span>${inv.number}<\/span><span>${inv.date||''}<\/span><\/div>\n<div class=\"r\"><span>Customer:<\/span><span>${customer?customer.name:'—'}<\/span><\/div>\n<hr>\n${rows}\n<hr>\n<div class=\"r\"><span>Subtotal<\/span><span>${subtotal.toFixed(2)}<\/span><\/div>\n<div class=\"r\"><span>Discount<\/span><span>-${(subtotal*(inv.discountPct||0)/100).toFixed(2)}<\/span><\/div>\n<div class=\"r\"><span>VAT<\/span><span>+${((subtotal-(subtotal*(inv.discountPct||0)/100))*(inv.vatPct||0)/100).toFixed(2)}<\/span><\/div>\n<div class=\"r\"><span>Shipping<\/span><span>+${(inv.shipping||0).toFixed(2)}<\/span><\/div>\n<div class=\"r tot\"><span>TOTAL<\/span><span>Tk ${grand.toFixed(2)}<\/span><\/div>\n<div class=\"r\"><span>Paid<\/span><span>${paid.toFixed(2)}<\/span><\/div>\n<div class=\"r\"><span>Due<\/span><span>${due.toFixed(2)}<\/span><\/div>\n<hr>\n<div class=\"c\">Thank you! Please visit again.<\/div>\n<\/body><\/html>`;\n  const w = window.open('', '_blank');\n  if(!w) { showToast('Popup is Blocked, please Allow Popups'); return; }\n  w.document.write(html); w.document.close();\n  setTimeout(()=>{ w.focus(); w.print(); }, 300);\n}\n\n/* Customer Aging Report */\nfunction invoiceAgingBucket(days){\n  if(days<=7) return 0;\n  if(days<=30) return 1;\n  if(days<=60) return 2;\n  if(days<=90) return 3;\n  return 4;\n}\nfunction computeAging(){\n  const map = {};\n  DB.invoices.filter(inv=>inv.type==='invoice' && inCurrentStore(inv.storeId)).forEach(inv=>{\n    const status = invoiceComputedStatus(inv);\n    if(status==='cancelled') return;\n    const due = invoiceBalanceDue(inv);\n    if(due<=0.01) return;\n    const refDate = inv.dueDate || inv.date || todayStr();\n    const days = Math.max(0, Math.round((new Date(todayStr()) - new Date(refDate))/86400000));\n    const bucket = invoiceAgingBucket(days);\n    if(!map[inv.customerId]) map[inv.customerId] = [0,0,0,0,0];\n    map[inv.customerId][bucket] += due;\n  });\n  return map;\n}\nfunction renderAgingReport(){\n  const map = computeAging();\n  const totals = [0,0,0,0,0];\n  const rows = Object.entries(map).map(([cid,buckets])=>{\n    buckets.forEach((v,i)=>totals[i]+=v);\n    const total = buckets.reduce((a,b)=>a+b,0);\n    return `<tr><td>${shopName(cid)}<\/td>${buckets.map(v=>`<td>${v?fmt(v):'-'}<\/td>`).join('')}<td><b>${fmt(total)}<\/b><\/td><\/tr>`;\n  });\n  const tbl = document.getElementById('agingTable');\n  if(tbl) tbl.innerHTML = rows.join('') || '<tr><td colspan=\"7\" class=\"empty\">No overdue Invoice found<\/td><\/tr>';\n  const bBox = document.getElementById('agingBuckets');\n  const labels = ['0-7 days','8-30 days','31-60 days','61-90 days','90+ days'];\n  if(bBox) bBox.innerHTML = totals.map((v,i)=>`<div class=\"ab ${i>=3?'hot':''}\"><div class=\"v\">${fmt(v)}<\/div><div class=\"l\">${labels[i]}<\/div><\/div>`).join('');\n}\n\n/* ---------------- MASTER RENDER ---------------- */\nfunction renderAll(){\n  populateSelects();\n  renderHeader();\n  renderDashboard();\n  renderProducts();\n  renderSuppliers();\n  renderPurchases();\n  renderInventory();\n  renderShops();\n  renderSales();\n  renderPnl();\n  renderDue();\n  renderAnalytics();\n  renderStores();\n  renderExpenses();\n  renderInvoices();\n  renderAgingReport();\n}\n\ndocument.getElementById('sl-date') && (document.getElementById('sl-date').value = todayStr());\ndocument.getElementById('pu-date') && (document.getElementById('pu-date').value = todayStr());\n\n// Auto-select content of number inputs on focus so user doesn't get leading zeros\ndocument.querySelectorAll('input[type=\"number\"]').forEach(function(el){\n  el.addEventListener('focus', function(){ this.select(); });\n});\n\nrenderAll();\n// a refresh returns to the page you were on\ntry{ const _lt=localStorage.getItem('stockmaster_last_tab'); if(_lt && document.getElementById('sec-'+_lt) && !document.getElementById('sec-'+_lt).classList.contains('active')) go(_lt, true); }catch(e){}\n\n<\/script>\n<\/body>\n<\/html>\n"</script>
